    import {

    import {

    // =====================================================

    // =====================================================

    const admin =

    // =====================================================

    document.getElementById("pageTitle").textContent =
        "لوحة التحكم";


    // =====================================================
    // Page Content
    // =====================================================

    document.getElementById("pageContent").innerHTML = `

        <div class="stats-grid">

            <div class="stat-card">

                <div class="icon">
                    👨‍🎓
                </div>

                <h3>
                    إجمالي المستخدمين
                </h3>

                <strong id="usersCount">
                    ...
                </strong>

            </div>


            <div class="stat-card">

                <div class="icon">
                    🎫
                </div>

                <h3>
                    إجمالي الاشتراكات
                </h3>

                <strong id="subscriptionsCount">
                    ...
                </strong>

            </div>


            <div class="stat-card">

                <div class="icon">
                    🟢
                </div>

                <h3>
                    الاشتراكات النشطة
                </h3>

                <strong id="activeSubscriptionsCount">
                    ...
                </strong>

            </div>


            <div class="stat-card">

                <div class="icon">
                    ⛔
                </div>

                <h3>
                    الاشتراكات الموقوفة
                </h3>

                <strong id="suspendedSubscriptionsCount">
                    ...
                </strong>

            </div>


            <!-- =================================================
                 إضافة فقط: إجمالي النتائج
            ================================================== -->

            <div class="stat-card">

                <div class="icon">
                    🏆
                </div>

                <h3>
                    إجمالي نتائج الاختبارات
                </h3>

                <strong id="examResultsCount">
                    ...
                </strong>

            </div>

        </div>


        <div class="panel">

            <div class="panel-header">

                <h2>
                    حالة اتصال Firestore
                </h2>

            </div>


            <div id="firestoreStatus"
                 class="empty-state">

                جاري قراءة البيانات...

            </div>

        </div>


        <div class="panel">

            <div class="panel-header">

                <h2>
                    آخر المستخدمين

            </div>


            <div id="usersPreview"
                 class="empty-state">

            </div>

        </div>


        <div class="panel">

            <div class="panel-header">

                <h2>
                    الاشتراكات
                </h2>

            </div>


            <div id="subscriptionsPreview"
                 class="empty-state">

                جاري تحميل الاشتراكات...

            </div>

        </div>


        <!-- =================================================
             إضافة فقط: آخر نتائج الطلاب
        ================================================== -->

        <div class="panel">

            <div class="panel-header">

                <h2>
                    آخر نتائج الاختبارات
                </h2>

            </div>


            <div id="examResultsPreview"
                 class="empty-state">

                جاري تحميل النتائج...

            </div>

        </div>

    `;


    // =====================================================
    // Elements
    // =====================================================

    const usersCount =
        document.getElementById(
            "usersCount"
        );


    const subscriptionsCount =
        document.getElementById(
            "subscriptionsCount"
        );


    const activeSubscriptionsCount =
        document.getElementById(
            "activeSubscriptionsCount"
        );


    const suspendedSubscriptionsCount =
        document.getElementById(
            "suspendedSubscriptionsCount"
        );


    const firestoreStatus =
        document.getElementById(
            "firestoreStatus"
        );


    const usersPreview =
        document.getElementById(
            "usersPreview"
        );


    const subscriptionsPreview =
        document.getElementById(
            "subscriptionsPreview"
        );


    // =====================================================
    // إضافة فقط: Results Element
    // =====================================================

    const examResultsCount =
        document.getElementById(
            "examResultsCount"
        );


    const examResultsPreview =
        document.getElementById(
            "examResultsPreview"
        );


    // =====================================================
    // Load Users
    // =====================================================

    async function loadUsers() {

        const usersSnapshot =
            await getDocs(
                collection(db, "users")
            );


        const users =
            usersSnapshot.docs.map(
                document => ({
                    id: document.id,
                    ...document.data()
                })
            );


        usersCount.textContent =
            users.length;


        if (users.length === 0) {

            usersPreview.innerHTML =
                "لا يوجد مستخدمون حاليًا.";

            return users;

        }


        const preview =
            users.slice(0, 10);


        usersPreview.innerHTML = `

            <div style="
                overflow-x:auto;
            ">

                <table style="
                    width:100%;
                    border-collapse:collapse;
                    text-align:right;
                ">

                    <thead>

                        <tr>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                الاسم
                            </th>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                Username
                            </th>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                الدور
                            </th>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                الحالة
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${preview.map(user => `

                            <tr>

                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                ">
                                    ${escapeHtml(
                                        user.name || "—"
                                    )}
                                </td>

                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                    direction:ltr;
                                    text-align:right;
                                ">
                                    ${escapeHtml(
                                        user.username || "—"
                                    )}
                                </td>

                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                ">
                                    ${escapeHtml(
                                        user.role || "—"
                                    )}
                                </td>

                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                ">
                                    ${
                                        user.isActive === true
                                        ? "🟢 نشط"
                                        : "🔴 متوقف"
                                    }
                                </td>

                            </tr>

                        `).join("")}

                    </tbody>

                </table>

            </div>

        `;


        return users;
    }


    // =====================================================
    // Load Subscriptions
    // =====================================================

    async function loadSubscriptions() {

        const subscriptionsSnapshot =
            await getDocs(
                collection(
                    db,
                    "subscriptions"
                )
            );


        const subscriptions =
            subscriptionsSnapshot.docs.map(
                document => ({
                    id: document.id,
                    ...document.data()
                })
            );


        subscriptionsCount.textContent =
            subscriptions.length;


        const active =
            subscriptions.filter(
                subscription =>
                    subscription.status === "active"
            ).length;


        const suspended =
            subscriptions.filter(
                subscription =>
                    subscription.status === "suspended"
            ).length;


        activeSubscriptionsCount.textContent =
            active;


        suspendedSubscriptionsCount.textContent =
            suspended;


        if (subscriptions.length === 0) {

            subscriptionsPreview.innerHTML =
                "لا توجد اشتراكات حاليًا.";

            return subscriptions;

        }


        const preview =
            subscriptions.slice(0, 10);


        subscriptionsPreview.innerHTML = `

            <div style="
                overflow-x:auto;
            ">

                <table style="
                    width:100%;
                    border-collapse:collapse;
                    text-align:right;
                ">

                    <thead>

                        <tr>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                كود الاشتراك
                            </th>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                User ID
                            </th>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                المرحلة
                            </th>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                الحالة
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${preview.map(subscription => `

                            <tr>

                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                    direction:ltr;
                                    text-align:right;
                                    font-weight:bold;
                                ">
                                    ${escapeHtml(
                                        subscription.id
                                    )}
                                </td>

                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                    direction:ltr;
                                    text-align:right;
                                ">
                                    ${escapeHtml(
                                        subscription.userId || "—"
                                    )}
                                </td>

                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                ">
                                    ${escapeHtml(
                                        subscription.stageId || "—"
                                    )}
                                </td>

                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                ">
                                    ${getStatusLabel(
                                        subscription.status
                                    )}
                                </td>

                            </tr>

                        `).join("")}

                    </tbody>

                </table>

            </div>

        `;


        return subscriptions;
    }


    // =====================================================
    // إضافة فقط: Load Exam Results
    // =====================================================

    async function loadExamResults() {

        const resultsSnapshot =
            await getDocs(
                collection(
                    db,
                    "examResults"
                )
            );


        const results =
            resultsSnapshot.docs.map(
                document => ({
                    id: document.id,
                    ...document.data()
                })
            );


        examResultsCount.textContent =
            results.length;


        if (results.length === 0) {

            examResultsPreview.innerHTML =
                "لا توجد نتائج اختبارات حاليًا.";

            return results;

        }


        /*
         * ترتيب النتائج:
         * الأحدث أولًا إذا كان submittedAt موجودًا.
         */

        results.sort(
            (a, b) => {

                const dateA =
                    getTimestampValue(
                        a.submittedAt
                    );

                const dateB =
                    getTimestampValue(
                        b.submittedAt
                    );

                return dateB - dateA;

            }
        );


        /*
         * نعرض آخر 10 نتائج فقط
         * في الصفحة الرئيسية.
         */

        const preview =
            results.slice(0, 10);


        examResultsPreview.innerHTML = `

            <div style="
                overflow-x:auto;
            ">

                <table style="
                    width:100%;
                    border-collapse:collapse;
                    text-align:right;
                ">

                    <thead>

                        <tr>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                الطالب
                            </th>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                الاختبار
                            </th>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                المرحلة
                            </th>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                الدرجة
                            </th>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                النسبة
                            </th>

                            <th style="
                                padding:12px;
                                border-bottom:1px solid #e5edf3;
                            ">
                                الحالة
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${preview.map(result => `

                            <tr>

                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                    font-weight:bold;
                                ">
                                    ${escapeHtml(
                                        result.studentName || "—"
                                    )}
                                </td>


                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                ">
                                    ${escapeHtml(
                                        result.examTitle || "اختبار"
                                    )}
                                </td>


                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                ">
                                    ${escapeHtml(
                                        result.stageId || "—"
                                    )}
                                </td>


                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                    font-weight:bold;
                                ">
                                    ${escapeHtml(
                                        result.score ?? "0"
                                    )}
                                    /
                                    ${escapeHtml(
                                        result.total ?? "0"
                                    )}
                                </td>


                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                    font-weight:bold;
                                    color:#087ea4;
                                ">
                                    ${escapeHtml(
                                        result.percentage ?? "0"
                                    )}%
                                </td>


                                <td style="
                                    padding:12px;
                                    border-bottom:1px solid #edf1f4;
                                ">
                                    ${getSubmitReasonLabel(
                                        result.submitReason
                                    )}
                                </td>

                            </tr>

                        `).join("")}

                    </tbody>

                </table>

            </div>

        `;


        return results;
    }


    // =====================================================
    // Helpers
    // =====================================================

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function getStatusLabel(status) {

        switch (status) {

            case "active":
                return "🟢 نشط";

            case "expired":
                return "🟠 منتهي";

            case "suspended":
                return "🔴 موقوف";

            default:
                return "⚪ غير معروف";

        }

    }


    // =====================================================
    // إضافة فقط: Result Helpers
    // =====================================================

    function getSubmitReasonLabel(reason) {

        switch (reason) {

            case "manual":
                return "📝 تسليم يدوي";

            case "timeout":
                return "⏱️ انتهاء الوقت";

            default:
                return "⚪ غير محدد";

        }

    }


    function getTimestampValue(value) {

        if (!value) {
            return 0;
        }


        /*
         * Firestore Timestamp
         */

        if (
            typeof value.toMillis ===
            "function"
        ) {

            return value.toMillis();

        }


        /*
         * Timestamp object
         */

        if (
            value.seconds !==
            undefined
        ) {

            return (
                Number(value.seconds) *
                1000
            );

        }


        /*
         * JavaScript Date
         */

        if (
            value instanceof Date
        ) {

            return value.getTime();

        }


        /*
         * String date
         */

        const parsed =
            new Date(value)
                .getTime();


        return Number.isNaN(parsed)
            ? 0
            : parsed;

    }


    // =====================================================
    // Run Firestore Test
    // =====================================================

    async function initializeDashboard() {

        try {

            const [
                users,
                subscriptions,
                examResults
            ] = await Promise.all([

                loadUsers(),

                loadSubscriptions(),

                // =================================================
                // إضافة فقط: قراءة examResults
                // =================================================

                loadExamResults()

            ]);


            firestoreStatus.innerHTML = `

                <div style="
                    color:#16794c;
                    font-weight:bold;
                    line-height:2;
                ">

                    🟢 Firestore Connected

                    <br>

                    تم قراءة Collection:
                    <strong>users</strong>

                    <br>

                    تم قراءة Collection:
                    <strong>subscriptions</strong>

                    <br>

                    تم قراءة Collection:
                    <strong>examResults</strong>

                    <br>

                    إجمالي المستخدمين:
                    ${users.length}

                    <br>

                    إجمالي الاشتراكات:
                    ${subscriptions.length}

                    <br>

                    إجمالي نتائج الاختبارات:
                    ${examResults.length}

                </div>

            `;

        } catch (error) {

            console.error(
                "Firestore Dashboard Error:",
                error
            );


            firestoreStatus.innerHTML = `

                <div style="
                    color:#b42318;
                    font-weight:bold;
                    line-height:2;
                ">

                    🔴 فشل اختبار Firestore

                    <br>

                    ${ 
                        escapeHtml(
                            error.message
                        )
                    }

                </div>

            `;

        }

    }


    initializeDashboard();

</script>

</body>

</html>
