<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>المحاضرات | مسار التمريض</title>

    <link
        rel="stylesheet"
        href="../src/admin/admin.css"
    >

    <style>

        .lectures-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .toolbar-search {
            flex: 1;
            min-width: 220px;
            height: 43px;
            border: 1px solid #d7e3eb;
            border-radius: 10px;
            padding: 0 13px;
            outline: none;
            font-size: 13px;
        }

        .toolbar-search:focus {
            border-color: #087ea4;
        }

        .primary-button {
            height: 43px;
            border: none;
            border-radius: 10px;
            background: #087ea4;
            color: #fff;
            padding: 0 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary-button:hover {
            background: #066985;
        }

        .lectures-table-wrapper {
            overflow-x: auto;
        }

        .lectures-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        .lectures-table th {
            background: #f6fafc;
            color: #526575;
            font-size: 12px;
            padding: 13px;
            text-align: right;
            border-bottom: 1px solid #e4edf2;
        }

        .lectures-table td {
            padding: 13px;
            font-size: 12px;
            border-bottom: 1px solid #edf1f4;
            vertical-align: middle;
        }

        .lectures-table tr:hover {
            background: #fbfdfe;
        }

        .lecture-name {
            font-weight: bold;
            color: #17324a;
        }

        .lecture-meta {
            color: #82919d;
            font-size: 10px;
            margin-top: 4px;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .badge-published {
            background: #eaf8f0;
            color: #16834f;
        }

        .badge-hidden {
            background: #f1f3f5;
            color: #687783;
        }

        .badge-scheduled {
            background: #eef8fb;
            color: #087ea4;
        }

        .badge-live {
            background: #eaf8f0;
            color: #16834f;
        }

        .badge-ended {
            background: #f1f3f5;
            color: #687783;
        }

        .badge-cancelled {
            background: #fff1f1;
            color: #b42318;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .small-button {
            border: none;
            border-radius: 8px;
            padding: 7px 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .edit-button {
            background: #eef8fb;
            color: #087ea4;
        }

        .delete-button {
            background: #fff1f1;
            color: #b42318;
        }

        .empty-state {
            padding: 45px 20px;
            text-align: center;
            color: #82919d;
            line-height: 2;
            font-size: 13px;
        }

        .loading-state {
            padding: 40px;
            text-align: center;
            color: #087ea4;
        }

        .error-state {
            padding: 30px;
            text-align: center;
            color: #b42318;
            background: #fff7f7;
            border-radius: 10px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 35, 50, .45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 19px;
        }

        .close-modal {
            border: none;
            background: #f1f4f6;
            width: 35px;
            height: 35px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            margin-bottom: 3px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #d7e3eb;
            border-radius: 9px;
            padding: 10px 11px;
            outline: none;
            font-family: inherit;
            font-size: 12px;
            background: #fff;
        }

        .form-group input,
        .form-group select {
            height: 43px;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #087ea4;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 25px;
        }

        .checkbox-group input {
            width: auto;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            height: 44px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .save-button {
            background: #087ea4;
            color: white;
        }

        .cancel-button {
            background: #edf1f4;
            color: #526575;
        }

        .form-message {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 9px;
            text-align: center;
            font-size: 12px;
        }

        .form-message.error {
            display: block;
            background: #fff1f1;
            color: #b42318;
        }

        .form-message.success {
            display: block;
            background: #effaf3;
            color: #147a3e;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

        }

    </style>

</head>

<body>

<div id="adminApp"></div>


<script type="module">

    import { protectAdminPage }
        from "../src/admin/auth-guard.js";

    import { createAdminLayout }
        from "../src/admin/layout.js";

    import { db }
        from "../src/firebase/init.js";

    import {
        collection,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        doc,
        serverTimestamp
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =====================================================
    // Admin Protection
    // =====================================================

    const admin = await protectAdminPage();

    createAdminLayout(admin.data);


    document.getElementById("pageTitle").textContent =
        "إدارة المحاضرات";


    const content =
        document.getElementById("pageContent");


    // =====================================================
    // Page
    // =====================================================

    content.innerHTML = `

        <div class="panel">

            <div class="panel-header">

                <h2>
                    إدارة المحاضرات
                </h2>

                <button
                    class="primary-button"
                    id="addLectureButton"
                >
                    + إضافة محاضرة
                </button>

            </div>


            <div class="lectures-toolbar">

                <input
                    type="search"
                    id="lectureSearch"
                    class="toolbar-search"
                    placeholder="ابحث باسم المحاضرة أو المادة أو المدرس..."
                >

            </div>


            <div id="lecturesArea">

                <div class="loading-state">
                    ⏳ جاري تحميل المحاضرات...
                </div>

            </div>

        </div>


        <!-- =================================================
             Modal
             ================================================= -->

        <div
            class="modal-overlay"
            id="lectureModal"
        >

            <div class="modal">

                <div class="modal-header">

                    <h2 id="modalTitle">
                        إضافة محاضرة
                    </h2>

                    <button
                        class="close-modal"
                        id="closeModal"
                    >
                        ×
                    </button>

                </div>


                <form id="lectureForm">

                    <input
                        type="hidden"
                        id="lectureId"
                    >


                    <div class="form-grid">


                        <div class="form-group full">

                            <label>
                                اسم المحاضرة *
                            </label>

                            <input
                                type="text"
                                id="title"
                                required
                                placeholder="مثال: محاضرة الالتهاب"
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                المادة *
                            </label>

                            <input
                                type="text"
                                id="subject"
                                required
                                placeholder="مثال: الجراحة"
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                اسم المدرس *
                            </label>

                            <input
                                type="text"
                                id="teacherName"
                                required
                                placeholder="اسم المدرس"
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                المرحلة *
                            </label>

                            <input
                                type="text"
                                id="stageId"
                                required
                                placeholder="مثال: nursing-1"
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                الحالة
                            </label>

                            <select id="status">

                                <option value="scheduled">
                                    قادمة
                                </option>

                                <option value="live">
                                    مباشر الآن
                                </option>

                                <option value="ended">
                                    انتهت
                                </option>

                                <option value="cancelled">
                                    ملغاة
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label>
                                تاريخ ووقت البداية *
                            </label>

                            <input
                                type="datetime-local"
                                id="scheduledAt"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                تاريخ ووقت النهاية
                            </label>

                            <input
                                type="datetime-local"
                                id="endAt"
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                رابط Live
                            </label>

                            <input
                                type="url"
                                id="liveUrl"
                                placeholder="https://..."
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                رابط التسجيل
                            </label>

                            <input
                                type="url"
                                id="recordingUrl"
                                placeholder="https://..."
                            >

                        </div>


                        <div class="form-group full">

                            <label>
                                وصف المحاضرة
                            </label>

                            <textarea
                                id="description"
                                placeholder="وصف مختصر للمحاضرة..."
                            ></textarea>

                        </div>


                        <div class="checkbox-group">

                            <input
                                type="checkbox"
                                id="isPublished"
                                checked
                            >

                            <label for="isPublished">
                                نشر المحاضرة للطلاب
                            </label>

                        </div>


                    </div>


                    <div
                        id="formMessage"
                        class="form-message"
                    ></div>


                    <div class="modal-actions">

                        <button
                            type="submit"
                            class="save-button"
                            id="saveButton"
                        >
                            حفظ المحاضرة
                        </button>

                        <button
                            type="button"
                            class="cancel-button"
                            id="cancelButton"
                        >
                            إلغاء
                        </button>

                    </div>

                </form>

            </div>

        </div>

    `;


    // =====================================================
    // Elements
    // =====================================================

    const modal =
        document.getElementById("lectureModal");

    const form =
        document.getElementById("lectureForm");

    const lecturesArea =
        document.getElementById("lecturesArea");

    const searchInput =
        document.getElementById("lectureSearch");

    let lectures = [];


    // =====================================================
    // Date Helpers
    // =====================================================

    function toDate(value) {

        if (!value) {
            return null;
        }

        if (
            typeof value.toDate ===
            "function"
        ) {
            return value.toDate();
        }

        const date =
            new Date(value);

        return isNaN(date.getTime())
            ? null
            : date;

    }


    function formatDate(value) {

        const date =
            toDate(value);

        if (!date) {
            return "غير محدد";
        }

        return date.toLocaleString(
            "ar-EG",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );

    }


    function toDateTimeLocal(value) {

        const date =
            toDate(value);

        if (!date) {
            return "";
        }

        const offset =
            date.getTimezoneOffset();

        const localDate =
            new Date(
                date.getTime() -
                offset * 60000
            );

        return localDate
            .toISOString()
            .slice(0, 16);

    }


    // =====================================================
    // Status
    // =====================================================

    function statusLabel(status) {

        const labels = {

            scheduled: "قادمة",

            live: "مباشر",

            ended: "انتهت",

            cancelled: "ملغاة"

        };

        return (
            labels[status] ||
            "قادمة"
        );

    }


    function statusClass(status) {

        const classes = {

            scheduled: "badge-scheduled",

            live: "badge-live",

            ended: "badge-ended",

            cancelled: "badge-cancelled"

        };

        return (
            classes[status] ||
            "badge-scheduled"
        );

    }


    // =====================================================
    // Load Lectures
    // =====================================================

    async function loadLectures() {

        lecturesArea.innerHTML = `

            <div class="loading-state">
                ⏳ جاري تحميل المحاضرات...
            </div>

        `;


        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "lectures"
                    )
                );


            lectures =
                snapshot.docs.map(
                    item => ({
                        id: item.id,
                        ...item.data()
                    })
                );


            renderLectures();

        } catch (error) {

            console.error(
                "Load lectures error:",
                error
            );


            lecturesArea.innerHTML = `

                <div class="error-state">

                    ❌ حدث خطأ أثناء تحميل المحاضرات.

                    <br><br>

                    ${escapeHtml(
                        error.message ||
                        "خطأ غير معروف"
                    )}

                </div>

            `;

        }

    }


    // =====================================================
    // Render
    // =====================================================

    function renderLectures() {

        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const filtered =
            lectures.filter(
                lecture => {

                    const text = [

                        lecture.title,

                        lecture.subject,

                        lecture.teacherName,

                        lecture.stageId

                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                    return (
                        !search ||
                        text.includes(search)
                    );

                }
            );


        if (!filtered.length) {

            lecturesArea.innerHTML = `

                <div class="empty-state">

                    🎥

                    <br>

                    لا توجد محاضرات حاليًا.

                    <br>

                    اضغط على
                    <strong>+ إضافة محاضرة</strong>
                    لإنشاء أول محاضرة.

                </div>

            `;

            return;

        }


        lecturesArea.innerHTML = `

            <div class="lectures-table-wrapper">

                <table class="lectures-table">

                    <thead>

                        <tr>

                            <th>
                                المحاضرة
                            </th>

                            <th>
                                المادة
                            </th>

                            <th>
                                المدرس
                            </th>

                            <th>
                                المرحلة
                            </th>

                            <th>
                                الموعد
                            </th>

                            <th>
                                الحالة
                            </th>

                            <th>
                                النشر
                            </th>

                            <th>
                                الإجراءات
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        ${filtered
                            .map(
                                lecture => `

                                    <tr>

                                        <td>

                                            <div class="lecture-name">
                                                ${escapeHtml(
                                                    lecture.title ||
                                                    "بدون اسم"
                                                )}
                                            </div>

                                            ${
                                                lecture.description
                                                    ? `
                                                        <div class="lecture-meta">
                                                            ${escapeHtml(
                                                                lecture.description
                                                            )}
                                                        </div>
                                                    `
                                                    : ""
                                            }

                                        </td>


                                        <td>
                                            ${escapeHtml(
                                                lecture.subject ||
                                                "—"
                                            )}
                                        </td>


                                        <td>
                                            ${escapeHtml(
                                                lecture.teacherName ||
                                                "—"
                                            )}
                                        </td>


                                        <td dir="ltr">
                                            ${escapeHtml(
                                                lecture.stageId ||
                                                "—"
                                            )}
                                        </td>


                                        <td>
                                            ${formatDate(
                                                lecture.scheduledAt ||
                                                lecture.startAt ||
                                                lecture.date
                                            )}
                                        </td>


                                        <td>

                                            <span
                                                class="
                                                    badge
                                                    ${statusClass(
                                                        lecture.status
                                                    )}
                                                "
                                            >
                                                ${statusLabel(
                                                    lecture.status
                                                )}
                                            </span>

                                        </td>


                                        <td>

                                            <span
                                                class="
                                                    badge
                                                    ${
                                                        lecture.isPublished !== false
                                                            ? "badge-published"
                                                            : "badge-hidden"
                                                    }
                                                "
                                            >
                                                ${
                                                    lecture.isPublished !== false
                                                        ? "منشورة"
                                                        : "مخفية"
                                                }
                                            </span>

                                        </td>


                                        <td>

                                            <div class="action-buttons">

                                                <button
                                                    class="
                                                        small-button
                                                        edit-button
                                                    "
                                                    data-action="edit"
                                                    data-id="${escapeHtml(
                                                        lecture.id
                                                    )}"
                                                >
                                                    تعديل
                                                </button>


                                                <button
                                                    class="
                                                        small-button
                                                        delete-button
                                                    "
                                                    data-action="delete"
                                                    data-id="${escapeHtml(
                                                        lecture.id
                                                    )}"
                                                >
                                                    حذف
                                                </button>

                                            </div>

                                        </td>

                                    </tr>

                                `
                            )
                            .join("")}

                    </tbody>

                </table>

            </div>

        `;

    }


    // =====================================================
    // Escape HTML
    // =====================================================

    function escapeHtml(value) {

        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    // =====================================================
    // Open Modal
    // =====================================================

    function openModal(lecture = null) {

        form.reset();


        document.getElementById(
            "lectureId"
        ).value =
            lecture?.id || "";


        document.getElementById(
            "modalTitle"
        ).textContent =
            lecture
                ? "تعديل المحاضرة"
                : "إضافة محاضرة";


        document.getElementById(
            "title"
        ).value =
            lecture?.title || "";


        document.getElementById(
            "subject"
        ).value =
            lecture?.subject || "";


        document.getElementById(
            "teacherName"
        ).value =
            lecture?.teacherName || "";


        document.getElementById(
            "stageId"
        ).value =
            lecture?.stageId || "";


        document.getElementById(
            "status"
        ).value =
            lecture?.status || "scheduled";


        document.getElementById(
            "scheduledAt"
        ).value =
            toDateTimeLocal(
                lecture?.scheduledAt ||
                lecture?.startAt ||
                lecture?.date
            );


        document.getElementById(
            "endAt"
        ).value =
            toDateTimeLocal(
                lecture?.endAt
            );


        document.getElementById(
            "liveUrl"
        ).value =
            lecture?.liveUrl || "";


        document.getElementById(
            "recordingUrl"
        ).value =
            lecture?.recordingUrl || "";


        document.getElementById(
            "description"
        ).value =
            lecture?.description || "";


        document.getElementById(
            "isPublished"
        ).checked =
            lecture
                ? lecture.isPublished !== false
                : true;


        clearMessage();


        modal.classList.add(
            "active"
        );

    }


    function closeModal() {

        modal.classList.remove(
            "active"
        );

        form.reset();

    }


    // =====================================================
    // Message
    // =====================================================

    function showMessage(
        message,
        type = "error"
    ) {

        const box =
            document.getElementById(
                "formMessage"
            );


        box.textContent =
            message;


        box.className =
            "form-message " +
            type;

    }


    function clearMessage() {

        const box =
            document.getElementById(
                "formMessage"
            );


        box.textContent = "";

        box.className =
            "form-message";

    }


    // =====================================================
    // Save Lecture
    // =====================================================

    form.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const saveButton =
                document.getElementById(
                    "saveButton"
                );


            const lectureId =
                document.getElementById(
                    "lectureId"
                ).value.trim();


            const title =
                document.getElementById(
                    "title"
                ).value.trim();


            const subject =
                document.getElementById(
                    "subject"
                ).value.trim();


            const teacherName =
                document.getElementById(
                    "teacherName"
                ).value.trim();


            const stageId =
                document.getElementById(
                    "stageId"
                ).value.trim();


            const status =
                document.getElementById(
                    "status"
                ).value;


            const scheduledValue =
                document.getElementById(
                    "scheduledAt"
                ).value;


            const endValue =
                document.getElementById(
                    "endAt"
                ).value;


            const liveUrl =
                document.getElementById(
                    "liveUrl"
                ).value.trim();


            const recordingUrl =
                document.getElementById(
                    "recordingUrl"
                ).value.trim();


            const description =
                document.getElementById(
                    "description"
                ).value.trim();


            const isPublished =
                document.getElementById(
                    "isPublished"
                ).checked;


            if (
                !title ||
                !subject ||
                !teacherName ||
                !stageId ||
                !scheduledValue
            ) {

                showMessage(
                    "من فضلك أكمل جميع الحقول المطلوبة."
                );

                return;

            }


            const scheduledAt =
                new Date(
                    scheduledValue
                );


            if (
                isNaN(
                    scheduledAt.getTime()
                )
            ) {

                showMessage(
                    "تاريخ المحاضرة غير صحيح."
                );

                return;

            }


            let endAt = null;


            if (endValue) {

                endAt =
                    new Date(
                        endValue
                    );


                if (
                    isNaN(
                        endAt.getTime()
                    )
                ) {

                    showMessage(
                        "وقت نهاية المحاضرة غير صحيح."
                    );

                    return;

                }

            }


            saveButton.disabled =
                true;


            saveButton.textContent =
                "جاري الحفظ...";


            try {

                const data = {

                    title,

                    subject,

                    teacherName,

                    stageId,

                    scheduledAt,

                    endAt,

                    status,

                    liveUrl,

                    recordingUrl,

                    description,

                    isPublished,

                    updatedAt:
                        serverTimestamp()

                };


                if (lectureId) {

                    await updateDoc(
                        doc(
                            db,
                            "lectures",
                            lectureId
                        ),
                        data
                    );

                } else {

                    await addDoc(
                        collection(
                            db,
                            "lectures"
                        ),
                        {

                            ...data,

                            createdAt:
                                serverTimestamp()

                        }
                    );

                }


                showMessage(
                    lectureId
                        ? "تم تعديل المحاضرة بنجاح."
                        : "تم إنشاء المحاضرة بنجاح.",
                    "success"
                );


                await loadLectures();


                setTimeout(
                    closeModal,
                    500
                );


            } catch (error) {

                console.error(
                    "Save lecture error:",
                    error
                );


                showMessage(
                    "حدث خطأ أثناء حفظ المحاضرة: " +
                    (
                        error.message ||
                        "خطأ غير معروف"
                    )
                );

            } finally {

                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "حفظ المحاضرة";

            }

        }
    );


    // =====================================================
    // Edit / Delete
    // =====================================================

    lecturesArea.addEventListener(
        "click",
        async event => {

            const button =
                event.target.closest(
                    "button[data-action]"
                );


            if (!button) {
                return;
            }


            const id =
                button.dataset.id;


            const action =
                button.dataset.action;


            const lecture =
                lectures.find(
                    item =>
                        item.id === id
                );


            if (!lecture) {
                return;
            }


            if (
                action ===
                "edit"
            ) {

                openModal(
                    lecture
                );

                return;

            }


            if (
                action ===
                "delete"
            ) {

                const confirmed =
                    confirm(
                        "هل أنت متأكد من حذف هذه المحاضرة؟"
                    );


                if (!confirmed) {
                    return;
                }


                try {

                    await deleteDoc(
                        doc(
                            db,
                            "lectures",
                            id
                        )
                    );


                    await loadLectures();


                } catch (error) {

                    console.error(
                        "Delete lecture error:",
                        error
                    );


                    alert(
                        "حدث خطأ أثناء حذف المحاضرة."
                    );

                }

            }

        }
    );


    // =====================================================
    // Events
    // =====================================================

    document
        .getElementById(
            "addLectureButton"
        )
        .addEventListener(
            "click",
            () => openModal()
        );


    document
        .getElementById(
            "closeModal"
        )
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById(
            "cancelButton"
        )
        .addEventListener(
            "click",
            closeModal
        );


    modal.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                modal
            ) {

                closeModal();

            }

        }
    );


    searchInput.addEventListener(
        "input",
        renderLectures
    );


    // =====================================================
    // Initial Load
    // =====================================================

    await loadLectures();

</script>

</body>

</html>
