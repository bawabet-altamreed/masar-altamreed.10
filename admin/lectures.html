<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        إدارة المحاضرات | مسار التمريض
    </title>

    <link
        rel="stylesheet"
        href="../src/admin/admin.css"
    >

    <style>

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
            height: 45px;
            border: 1px solid #d8e2e9;
            border-radius: 10px;
            padding: 0 14px;
            outline: none;
            font-size: 14px;
        }

        .search-box:focus {
            border-color: #087ea4;
        }

        .filter-select {
            height: 45px;
            min-width: 180px;
            border: 1px solid #d8e2e9;
            border-radius: 10px;
            padding: 0 12px;
            outline: none;
            font-size: 13px;
            background: white;
        }

        .table-container {
            overflow-x: auto;
        }

        .lectures-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1050px;
        }

        .lectures-table th,
        .lectures-table td {
            padding: 13px 12px;
            border-bottom: 1px solid #edf1f4;
            text-align: right;
            white-space: nowrap;
        }

        .lectures-table th {
            background: #f8fafc;
            font-size: 12px;
            color: #647586;
        }

        .lectures-table td {
            font-size: 13px;
        }

        .lecture-name {
            font-weight: bold;
        }

        .lecture-subject {
            color: #82919d;
            font-size: 11px;
            margin-top: 4px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }

        .status-published {
            background: #eaf8f0;
            color: #16834f;
        }

        .status-unpublished {
            background: #fff3e8;
            color: #a45b00;
        }

        .status-scheduled {
            background: #eef8fb;
            color: #087ea4;
        }

        .status-live {
            background: #eaf8f0;
            color: #16834f;
        }

        .status-ended {
            background: #f1f3f5;
            color: #687783;
        }

        .status-cancelled {
            background: #fff1f1;
            color: #b42318;
        }

        .action-button {
            border: none;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            margin-left: 4px;
            margin-bottom: 4px;
        }

        .edit-button {
            background: #eef8fb;
            color: #087ea4;
        }

        .delete-button {
            background: #fff1f1;
            color: #b42318;
        }

        .publish-button {
            background: #effaf3;
            color: #16794c;
        }

        .unpublish-button {
            background: #fff7e6;
            color: #a15c00;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 650px;
            max-height: 92vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 18px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-header h2 {
            font-size: 19px;
        }

        .close-button {
            border: none;
            background: #f1f4f6;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
            font-weight: bold;
            color: #445566;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #d8e2e9;
            border-radius: 9px;
            padding: 10px 11px;
            outline: none;
            font-size: 13px;
            background: #fff;
        }

        .form-group input,
        .form-group select {
            height: 44px;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #087ea4;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 9px;
            background: #f7fafc;
            padding: 12px;
            border-radius: 9px;
        }

        .checkbox-row input {
            width: 18px;
            height: 18px;
        }

        .checkbox-row label {
            margin: 0;
            cursor: pointer;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-actions button {
            flex: 1;
            height: 45px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .save-button {
            background: #087ea4;
            color: white;
        }

        .cancel-button {
            background: #edf1f4;
            color: #445566;
        }

        .form-message {
            display: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 15px;
            line-height: 1.7;
        }

        .form-message.show {
            display: block;
        }

        .form-message.error {
            background: #fff1f1;
            color: #b42318;
        }

        .form-message.success {
            background: #effaf3;
            color: #16794c;
        }

        .empty-state {
            text-align: center;
            padding: 45px 20px;
            color: #8795a0;
            font-size: 13px;
            line-height: 2;
        }

        @media (max-width: 600px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .modal {
                padding: 18px;
            }

        }

    </style>

</head>


<body>

<div id="adminApp"></div>


<!-- =====================================================
     Lecture Modal
     ===================================================== -->

<div
    class="modal-overlay"
    id="lectureModal"
>

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                إضافة محاضرة
            </h2>

            <button
                class="close-button"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <div
            class="form-message"
            id="formMessage"
        ></div>


        <form id="lectureForm">

            <div class="form-grid">


                <!-- Title -->

                <div class="form-group full">

                    <label>
                        اسم المحاضرة
                    </label>

                    <input
                        type="text"
                        id="lectureTitle"
                        placeholder="مثال: المحاضرة الأولى - الالتهاب"
                        required
                    >

                </div>


                <!-- Subject -->

                <div class="form-group">

                    <label>
                        المادة
                    </label>

                    <input
                        type="text"
                        id="lectureSubject"
                        placeholder="مثال: طب الجراحة"
                        required
                    >

                </div>


                <!-- Stage -->

                <div class="form-group">

                    <label>
                        المرحلة
                    </label>

                    <select
                        id="lectureStage"
                        required
                    >

                        <option value="">
                            اختر المرحلة
                        </option>

                        <option value="stage-1">
                            الصف الأول الثانوي التمريض
                        </option>

                        <option value="stage-2">
                            الصف الثاني الثانوي التمريض
                        </option>

                        <option value="stage-3">
                            الصف الثالث الثانوي التمريض
                        </option>

                        <option value="stage-4">
                            الصف الأول المعهد
                        </option>

                        <option value="stage-5">
                            الصف الثاني المعهد
                        </option>

                    </select>

                </div>


                <!-- Teacher -->

                <div class="form-group">

                    <label>
                        المدرس
                    </label>

                    <select
                        id="lectureTeacher"
                        required
                    >

                        <option value="">
                            اختر المدرس
                        </option>

                        <option value="Dr.Nurhan">
                            Dr.Nurhan
                        </option>

                        <option value="Dr.Sara">
                            Dr.Sara
                        </option>

                    </select>

                </div>


                <!-- Status -->

                <div class="form-group">

                    <label>
                        حالة المحاضرة
                    </label>

                    <select
                        id="lectureStatus"
                        required
                    >

                        <option value="scheduled">
                            قادمة
                        </option>

                        <option value="live">
                            مباشر الآن
                        </option>

                        <option value="ended">
                            انتهت
                        </option>

                        <option value="cancelled">
                            ملغاة
                        </option>

                    </select>

                </div>


                <!-- Date -->

                <div class="form-group">

                    <label>
                        موعد المحاضرة
                    </label>

                    <input
                        type="datetime-local"
                        id="lectureDate"
                        required
                    >

                </div>


                <!-- End -->

                <div class="form-group">

                    <label>
                        نهاية المحاضرة
                    </label>

                    <input
                        type="datetime-local"
                        id="lectureEnd"
                    >

                </div>


                <!-- Live -->

                <div class="form-group full">

                    <label>
                        رابط المحاضرة Live
                    </label>

                    <input
                        type="url"
                        id="liveUrl"
                        placeholder="https://..."
                        dir="ltr"
                    >

                </div>


                <!-- Recording -->

                <div class="form-group full">

                    <label>
                        رابط التسجيل
                    </label>

                    <input
                        type="url"
                        id="recordingUrl"
                        placeholder="https://..."
                        dir="ltr"
                    >

                </div>


                <!-- Description -->

                <div class="form-group full">

                    <label>
                        وصف المحاضرة
                    </label>

                    <textarea
                        id="lectureDescription"
                        placeholder="اكتب وصفًا مختصرًا للمحاضرة..."
                    ></textarea>

                </div>


                <!-- Publish -->

                <div class="form-group full">

                    <div class="checkbox-row">

                        <input
                            type="checkbox"
                            id="isPublished"
                        >

                        <label for="isPublished">
                            نشر المحاضرة للطلاب
                        </label>

                    </div>

                </div>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-button"
                    id="cancelButton"
                >
                    إلغاء
                </button>

                <button
                    type="submit"
                    class="save-button"
                    id="saveButton"
                >
                    حفظ المحاضرة
                </button>

            </div>

        </form>

    </div>

</div>


<script type="module">

    // =====================================================
    // Firebase
    // =====================================================

    import {
        db
    } from "../src/firebase/init.js";

    import {
        collection,
        getDocs,
        doc,
        addDoc,
        updateDoc,
        deleteDoc,
        Timestamp
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =====================================================
    // Admin
    // =====================================================

    import {
        protectAdminPage
    } from "../src/admin/auth-guard.js";

    import {
        createAdminLayout
    } from "../src/admin/layout.js";


    // =====================================================
    // Protect
    // =====================================================

    const admin =
        await protectAdminPage();


    createAdminLayout(
        admin.data
    );


    document.getElementById(
        "pageTitle"
    ).textContent =
        "إدارة المحاضرات";


    // =====================================================
    // Page
    // =====================================================

    document.getElementById(
        "pageContent"
    ).innerHTML = `

        <div class="toolbar">

            <input
                type="search"
                id="searchInput"
                class="search-box"
                placeholder="ابحث باسم المحاضرة أو المادة أو المدرس..."
            >


            <select
                id="stageFilter"
                class="filter-select"
            >

                <option value="all">
                    كل المراحل
                </option>

                <option value="stage-1">
                    الصف الأول الثانوي
                </option>

                <option value="stage-2">
                    الصف الثاني الثانوي
                </option>

                <option value="stage-3">
                    الصف الثالث الثانوي
                </option>

                <option value="stage-4">
                    الصف الأول المعهد
                </option>

                <option value="stage-5">
                    الصف الثاني المعهد
                </option>

            </select>


            <button
                class="primary-button"
                id="addLectureButton"
            >
                + إضافة محاضرة
            </button>

        </div>


        <div class="panel">

            <div class="panel-header">

                <h2>
                    المحاضرات
                </h2>

                <span id="lecturesCount">
                    جاري التحميل...
                </span>

            </div>


            <div
                id="lecturesContainer"
                class="table-container"
            >

                جاري تحميل المحاضرات...

            </div>

        </div>

    `;


    // =====================================================
    // Elements
    // =====================================================

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const stageFilter =
        document.getElementById(
            "stageFilter"
        );

    const lecturesContainer =
        document.getElementById(
            "lecturesContainer"
        );

    const lecturesCount =
        document.getElementById(
            "lecturesCount"
        );

    const modal =
        document.getElementById(
            "lectureModal"
        );

    const form =
        document.getElementById(
            "lectureForm"
        );

    const formMessage =
        document.getElementById(
            "formMessage"
        );

    const saveButton =
        document.getElementById(
            "saveButton"
        );


    // =====================================================
    // Variables
    // =====================================================

    let lectures = [];

    let filteredLectures = [];

    let editingLecture = null;


    // =====================================================
    // Helpers
    // =====================================================

    function escapeHtml(value) {

        return String(
            value ?? ""
        )
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function getStageName(stageId) {

        const stages = {

            "stage-1":
                "الصف الأول الثانوي التمريض",

            "stage-2":
                "الصف الثاني الثانوي التمريض",

            "stage-3":
                "الصف الثالث الثانوي التمريض",

            "stage-4":
                "الصف الأول المعهد",

            "stage-5":
                "الصف الثاني المعهد"

        };

        return stages[
            stageId
        ] || stageId || "—";

    }


    function formatDateTime(value) {

        if (!value) {
            return "—";
        }

        try {

            const date =
                typeof value.toDate === "function"
                    ? value.toDate()
                    : new Date(value);

            if (
                isNaN(
                    date.getTime()
                )
            ) {
                return "—";
            }

            return date.toLocaleString(
                "ar-EG",
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );

        } catch {

            return "—";

        }

    }


    function timestampToInput(value) {

        if (!value) {
            return "";
        }

        try {

            const date =
                typeof value.toDate === "function"
                    ? value.toDate()
                    : new Date(value);

            if (
                isNaN(
                    date.getTime()
                )
            ) {
                return "";
            }

            const year =
                date.getFullYear();

            const month =
                String(
                    date.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );

            const day =
                String(
                    date.getDate()
                ).padStart(
                    2,
                    "0"
                );

            const hours =
                String(
                    date.getHours()
                ).padStart(
                    2,
                    "0"
                );

            const minutes =
                String(
                    date.getMinutes()
                ).padStart(
                    2,
                    "0"
                );

            return `${year}-${month}-${day}T${hours}:${minutes}`;

        } catch {

            return "";

        }

    }


    function dateInputToTimestamp(
        value
    ) {

        if (!value) {
            return null;
        }

        const date =
            new Date(value);

        if (
            isNaN(
                date.getTime()
            )
        ) {
            return null;
        }

        return Timestamp.fromDate(
            date
        );

    }


    function getStatusInfo(
        status
    ) {

        const data = {

            scheduled: {
                label: "قادمة",
                className:
                    "status-scheduled"
            },

            live: {
                label: "مباشر الآن",
                className:
                    "status-live"
            },

            ended: {
                label: "انتهت",
                className:
                    "status-ended"
            },

            cancelled: {
                label: "ملغاة",
                className:
                    "status-cancelled"
            }

        };

        return (
            data[status] ||
            data.scheduled
        );

    }


    // =====================================================
    // Load Lectures
    // =====================================================

    async function loadLectures() {

        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "lectures"
                    )
                );


            lectures =
                snapshot.docs
                    .map(
                        item => ({
                            id: item.id,
                            ...item.data()
                        })
                    )
                    .sort(
                        (a, b) => {

                            const aDate =
                                a.scheduledAt?.toDate
                                    ? a.scheduledAt.toDate()
                                    : new Date(
                                        a.scheduledAt ||
                                        0
                                    );

                            const bDate =
                                b.scheduledAt?.toDate
                                    ? b.scheduledAt.toDate()
                                    : new Date(
                                        b.scheduledAt ||
                                        0
                                    );

                            return (
                                aDate - bDate
                            );

                        }
                    );


            filteredLectures =
                [...lectures];


            renderLectures();

        } catch (error) {

            console.error(
                "Load lectures error:",
                error
            );


            lecturesContainer.innerHTML = `

                <div class="empty-state">

                    🔴 حدث خطأ أثناء تحميل المحاضرات.

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            `;

        }

    }


    // =====================================================
    // Render
    // =====================================================

    function renderLectures() {

        lecturesCount.textContent =
            `${filteredLectures.length} محاضرة`;


        if (
            !filteredLectures.length
        ) {

            lecturesContainer.innerHTML = `

                <div class="empty-state">

                    🎥

                    <br>

                    لا توجد محاضرات حاليًا.

                    <br>

                    اضغط على
                    <strong>
                        + إضافة محاضرة
                    </strong>
                    لإنشاء أول محاضرة.

                </div>

            `;

            return;

        }


        lecturesContainer.innerHTML = `

            <table class="lectures-table">

                <thead>

                    <tr>

                        <th>
                            المحاضرة
                        </th>

                        <th>
                            المرحلة
                        </th>

                        <th>
                            المدرس
                        </th>

                        <th>
                            الموعد
                        </th>

                        <th>
                            الحالة
                        </th>

                        <th>
                            النشر
                        </th>

                        <th>
                            الإجراءات
                        </th>

                    </tr>

                </thead>


                <tbody>

                    ${filteredLectures
                        .map(
                            lecture =>
                                lectureRow(
                                    lecture
                                )
                        )
                        .join("")}

                </tbody>

            </table>

        `;


        document
            .querySelectorAll(
                "[data-action]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        handleAction
                    );

                }
            );

    }


    // =====================================================
    // Lecture Row
    // =====================================================

    function lectureRow(
        lecture
    ) {

        const statusInfo =
            getStatusInfo(
                lecture.status
            );


        const published =
            lecture.isPublished === true;


        return `

            <tr>

                <td>

                    <div class="lecture-name">

                        ${escapeHtml(
                            lecture.title ||
                            "بدون عنوان"
                        )}

                    </div>

                    <div class="lecture-subject">

                        ${escapeHtml(
                            lecture.subject ||
                            "بدون مادة"
                        )}

                    </div>

                </td>


                <td>

                    ${escapeHtml(
                        getStageName(
                            lecture.stageId
                        )
                    )}

                </td>


                <td>

                    ${escapeHtml(
                        lecture.teacherName ||
                        lecture.teacherId ||
                        "—"
                    )}

                </td>


                <td>

                    ${formatDateTime(
                        lecture.scheduledAt
                    )}

                </td>


                <td>

                    <span
                        class="status
                            ${statusInfo.className}"
                    >

                        ${statusInfo.label}

                    </span>

                </td>


                <td>

                    ${
                        published

                            ? `
                                <span
                                    class="status status-published"
                                >
                                    منشورة
                                </span>
                              `

                            : `
                                <span
                                    class="status status-unpublished"
                                >
                                    غير منشورة
                                </span>
                              `
                    }

                </td>


                <td>

                    <button
                        class="action-button edit-button"
                        data-action="edit"
                        data-id="${lecture.id}"
                    >
                        تعديل
                    </button>


                    <button
                        class="action-button
                            ${
                                published
                                    ? "unpublish-button"
                                    : "publish-button"
                            }"
                        data-action="publish"
                        data-id="${lecture.id}"
                    >
                        ${
                            published
                                ? "إلغاء النشر"
                                : "نشر"
                        }
                    </button>


                    <button
                        class="action-button delete-button"
                        data-action="delete"
                        data-id="${lecture.id}"
                    >
                        حذف
                    </button>

                </td>

            </tr>

        `;

    }


    // =====================================================
    // Search / Filter
    // =====================================================

    function applyFilters() {

        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const selectedStage =
            stageFilter.value;


        filteredLectures =
            lectures.filter(
                lecture => {

                    const title =
                        String(
                            lecture.title ||
                            ""
                        ).toLowerCase();


                    const subject =
                        String(
                            lecture.subject ||
                            ""
                        ).toLowerCase();


                    const teacher =
                        String(
                            lecture.teacherName ||
                            lecture.teacherId ||
                            ""
                        ).toLowerCase();


                    const matchesSearch =
                        !search ||
                        title.includes(search) ||
                        subject.includes(search) ||
                        teacher.includes(search);


                    const matchesStage =
                        selectedStage === "all" ||
                        lecture.stageId ===
                            selectedStage;


                    return (
                        matchesSearch &&
                        matchesStage
                    );

                }
            );


        renderLectures();

    }


    searchInput.addEventListener(
        "input",
        applyFilters
    );


    stageFilter.addEventListener(
        "change",
        applyFilters
    );


    // =====================================================
    // Add
    // =====================================================

    document
        .getElementById(
            "addLectureButton"
        )
        .addEventListener(
            "click",
            openAddModal
        );


    function openAddModal() {

        editingLecture =
            null;


        form.reset();


        document.getElementById(
            "modalTitle"
        ).textContent =
            "إضافة محاضرة";


        document.getElementById(
            "lectureStatus"
        ).value =
            "scheduled";


        document.getElementById(
            "isPublished"
        ).checked =
            true;


        formMessage.className =
            "form-message";


        formMessage.textContent =
            "";


        saveButton.textContent =
            "حفظ المحاضرة";


        modal.classList.add(
            "show"
        );

    }


    // =====================================================
    // Edit
    // =====================================================

    function openEditModal(
        lecture
    ) {

        editingLecture =
            lecture;


        document.getElementById(
            "modalTitle"
        ).textContent =
            "تعديل المحاضرة";


        document.getElementById(
            "lectureTitle"
        ).value =
            lecture.title || "";


        document.getElementById(
            "lectureSubject"
        ).value =
            lecture.subject || "";


        document.getElementById(
            "lectureStage"
        ).value =
            lecture.stageId || "";


        document.getElementById(
            "lectureTeacher"
        ).value =
            lecture.teacherName ||
            lecture.teacherId ||
            "";


        document.getElementById(
            "lectureStatus"
        ).value =
            lecture.status ||
            "scheduled";


        document.getElementById(
            "lectureDate"
        ).value =
            timestampToInput(
                lecture.scheduledAt
            );


        document.getElementById(
            "lectureEnd"
        ).value =
            timestampToInput(
                lecture.endAt
            );


        document.getElementById(
            "liveUrl"
        ).value =
            lecture.liveUrl || "";


        document.getElementById(
            "recordingUrl"
        ).value =
            lecture.recordingUrl || "";


        document.getElementById(
            "lectureDescription"
        ).value =
            lecture.description || "";


        document.getElementById(
            "isPublished"
        ).checked =
            lecture.isPublished === true;


        formMessage.className =
            "form-message";


        formMessage.textContent =
            "";


        saveButton.textContent =
            "حفظ التعديلات";


        modal.classList.add(
            "show"
        );

    }


    // =====================================================
    // Close
    // =====================================================

    function closeModal() {

        modal.classList.remove(
            "show"
        );

        editingLecture =
            null;

        form.reset();

    }


    document
        .getElementById(
            "closeModal"
        )
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById(
            "cancelButton"
        )
        .addEventListener(
            "click",
            closeModal
        );


    // =====================================================
    // Save
    // =====================================================

    form.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const title =
                document.getElementById(
                    "lectureTitle"
                ).value.trim();


            const subject =
                document.getElementById(
                    "lectureSubject"
                ).value.trim();


            const stageId =
                document.getElementById(
                    "lectureStage"
                ).value;


            const teacherName =
                document.getElementById(
                    "lectureTeacher"
                ).value;


            const status =
                document.getElementById(
                    "lectureStatus"
                ).value;


            const scheduledAt =
                document.getElementById(
                    "lectureDate"
                ).value;


            const endAt =
                document.getElementById(
                    "lectureEnd"
                ).value;


            const liveUrl =
                document.getElementById(
                    "liveUrl"
                ).value.trim();


            const recordingUrl =
                document.getElementById(
                    "recordingUrl"
                ).value.trim();


            const description =
                document.getElementById(
                    "lectureDescription"
                ).value.trim();


            const isPublished =
                document.getElementById(
                    "isPublished"
                ).checked;


            // =================================================
            // Validation
            // =================================================

            if (!title) {

                showFormMessage(
                    "اكتب اسم المحاضرة.",
                    "error"
                );

                return;

            }


            if (!subject) {

                showFormMessage(
                    "اكتب اسم المادة.",
                    "error"
                );

                return;

            }


            if (!stageId) {

                showFormMessage(
                    "اختر المرحلة.",
                    "error"
                );

                return;

            }


            if (!teacherName) {

                showFormMessage(
                    "اختر المدرس.",
                    "error"
                );

                return;

            }


            if (!scheduledAt) {

                showFormMessage(
                    "حدد موعد المحاضرة.",
                    "error"
                );

                return;

            }


            const scheduledTimestamp =
                dateInputToTimestamp(
                    scheduledAt
                );


            const endTimestamp =
                dateInputToTimestamp(
                    endAt
                );


            if (!scheduledTimestamp) {

                showFormMessage(
                    "موعد المحاضرة غير صحيح.",
                    "error"
                );

                return;

            }


            if (
                endTimestamp &&
                endTimestamp.toDate() <=
                    scheduledTimestamp.toDate()
            ) {

                showFormMessage(
                    "وقت نهاية المحاضرة يجب أن يكون بعد وقت البداية.",
                    "error"
                );

                return;

            }


            // =================================================
            // Save
            // =================================================

            saveButton.disabled =
                true;


            saveButton.textContent =
                "جاري الحفظ...";


            try {

                const now =
                    Timestamp.now();


                const lectureData = {

                    title:
                        title,

                    subject:
                        subject,

                    stageId:
                        stageId,

                    teacherId:
                        teacherName,

                    teacherName:
                        teacherName,

                    scheduledAt:
                        scheduledTimestamp,

                    endAt:
                        endTimestamp,

                    liveUrl:
                        liveUrl,

                    recordingUrl:
                        recordingUrl,

                    description:
                        description,

                    status:
                        status,

                    isPublished:
                        isPublished,

                    updatedAt:
                        now

                };


                // =================================================
                // Edit
                // =================================================

                if (
                    editingLecture
                ) {

                    await updateDoc(
                        doc(
                            db,
                            "lectures",
                            editingLecture.id
                        ),
                        lectureData
                    );


                    showFormMessage(
                        "تم تعديل المحاضرة بنجاح.",
                        "success"
                    );

                }


                // =================================================
                // Create
                // =================================================

                else {

                    await addDoc(
                        collection(
                            db,
                            "lectures"
                        ),
                        {
                            ...lectureData,
                            createdAt:
                                now
                        }
                    );


                    showFormMessage(
                        "تم إنشاء المحاضرة بنجاح.",
                        "success"
                    );

                }


                setTimeout(
                    async () => {

                        closeModal();

                        await loadLectures();

                    },
                    600
                );


            } catch (error) {

                console.error(
                    "Save lecture error:",
                    error
                );


                showFormMessage(
                    getFirebaseErrorMessage(
                        error
                    ),
                    "error"
                );

            } finally {

                saveButton.disabled =
                    false;


                saveButton.textContent =
                    editingLecture
                        ? "حفظ التعديلات"
                        : "حفظ المحاضرة";

            }

        }
    );


    // =====================================================
    // Actions
    // =====================================================

    async function handleAction(
        event
    ) {

        const button =
            event.currentTarget;


        const action =
            button.dataset.action;


        const id =
            button.dataset.id;


        const lecture =
            lectures.find(
                item =>
                    item.id === id
            );


        if (!lecture) {
            return;
        }


        if (
            action === "edit"
        ) {

            openEditModal(
                lecture
            );

            return;

        }


        if (
            action === "publish"
        ) {

            await togglePublish(
                lecture
            );

            return;

        }


        if (
            action === "delete"
        ) {

            await deleteLecture(
                lecture
            );

            return;

        }

    }


    // =====================================================
    // Publish
    // =====================================================

    async function togglePublish(
        lecture
    ) {

        const newValue =
            lecture.isPublished !== true;


        const message =
            newValue
                ? "هل تريد نشر المحاضرة للطلاب؟"
                : "هل تريد إلغاء نشر المحاضرة؟";


        if (
            !confirm(
                message
            )
        ) {

            return;

        }


        try {

            await updateDoc(
                doc(
                    db,
                    "lectures",
                    lecture.id
                ),
                {
                    isPublished:
                        newValue,

                    updatedAt:
                        Timestamp.now()
                }
            );


            await loadLectures();

        } catch (error) {

            console.error(
                "Publish lecture error:",
                error
            );


            alert(
                getFirebaseErrorMessage(
                    error
                )
            );

        }

    }


    // =====================================================
    // Delete
    // =====================================================

    async function deleteLecture(
        lecture
    ) {

        const confirmation =
            confirm(
                `هل أنت متأكد من حذف المحاضرة:\n\n${lecture.title || "بدون عنوان"}\n\nلا يمكن التراجع عن الحذف.`
            );


        if (!confirmation) {
            return;
        }


        try {

            await deleteDoc(
                doc(
                    db,
                    "lectures",
                    lecture.id
                )
            );


            await loadLectures();


        } catch (error) {

            console.error(
                "Delete lecture error:",
                error
            );


            alert(
                getFirebaseErrorMessage(
                    error
                )
            );

        }

    }


    // =====================================================
    // Firebase Error
    // =====================================================

    function getFirebaseErrorMessage(
        error
    ) {

        if (
            error?.code ===
            "permission-denied"
        ) {

            return (
                "تم رفض العملية بواسطة Firestore Security Rules."
            );

        }


        if (
            error?.code ===
            "failed-precondition"
        ) {

            return (
                "تعذر تنفيذ العملية بسبب حالة غير متوافقة في Firestore."
            );

        }


        return (
            "حدث خطأ أثناء حفظ بيانات المحاضرة: " +
            (
                error?.message ||
                "خطأ غير معروف"
            )
        );

    }


    // =====================================================
    // Form Message
    // =====================================================

    function showFormMessage(
        text,
        type
    ) {

        formMessage.textContent =
            text;


        formMessage.className =
            `form-message show ${type}`;

    }


    // =====================================================
    // Initial Load
    // =====================================================

    loadLectures();

</script>

</body>

</html>
