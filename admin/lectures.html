<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>المحاضرات | مسار التمريض</title>

    <link
        rel="stylesheet"
        href="../src/admin/admin.css"
    >

    <style>

        .lecture-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #34495e;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #d7e3eb;
            border-radius: 9px;
            padding: 11px;
            font-family: inherit;
            outline: none;
            background: #fff;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #087ea4;
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .secondary-button {
            border: none;
            border-radius: 9px;
            padding: 11px 20px;
            cursor: pointer;
            background: #edf1f4;
            color: #526575;
            font-weight: 700;
        }

        .lecture-table-wrapper {
            overflow-x: auto;
        }

        .lecture-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        .lecture-table th,
        .lecture-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #edf1f4;
            text-align: right;
            font-size: 12px;
        }

        .lecture-table th {
            color: #60717f;
            background: #f7fafc;
        }

        .lecture-table td {
            color: #34495e;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }

        .status-published {
            background: #eaf8f0;
            color: #16834f;
        }

        .status-hidden {
            background: #f1f3f5;
            color: #687783;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .action-button {
            border: none;
            border-radius: 7px;
            padding: 7px 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .edit-button {
            background: #eef8fb;
            color: #087ea4;
        }

        .delete-button {
            background: #fff1f1;
            color: #b42318;
        }

        .message-box {
            display: none;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            text-align: center;
        }

        .message-box.success {
            display: block;
            background: #effaf3;
            color: #147a3e;
            border: 1px solid #ccebd8;
        }

        .message-box.error {
            display: block;
            background: #fff1f1;
            color: #b42318;
            border: 1px solid #ffd5d5;
        }

        .form-title {
            margin-bottom: 18px;
        }

        .form-title h3 {
            font-size: 17px;
            margin-bottom: 5px;
        }

        .form-title p {
            color: #82919d;
            font-size: 12px;
        }

        .publish-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 5px;
        }

        .publish-row input {
            width: auto;
        }

        @media (max-width: 700px) {

            .lecture-form {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .form-actions {
                grid-column: auto;
            }

        }

    </style>

</head>

<body>

<div id="adminApp"></div>


<script type="module">

    import { protectAdminPage }
        from "../src/admin/auth-guard.js";

    import { createAdminLayout }
        from "../src/admin/layout.js";

    import {
        db
    } from "../src/firebase/init.js";

    import {
        collection,
        getDocs,
        doc,
        addDoc,
        updateDoc,
        deleteDoc,
        serverTimestamp
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =====================================================
    // Protect
    // =====================================================

    const admin =
        await protectAdminPage();


    createAdminLayout(
        admin.data
    );


    document.getElementById(
        "pageTitle"
    ).textContent =
        "إدارة المحاضرات";


    const content =
        document.getElementById(
            "pageContent"
        );


    // =====================================================
    // Page
    // =====================================================

    content.innerHTML = `

        <div
            id="messageBox"
            class="message-box"
        ></div>


        <div class="panel">

            <div class="form-title">

                <h3 id="formTitle">
                    ➕ إضافة محاضرة جديدة
                </h3>

                <p>
                    أضف المحاضرة ليتم حفظها تلقائيًا
                    في Firestore وعرضها للطلاب.
                </p>

            </div>


            <form
                id="lectureForm"
                class="lecture-form"
            >

                <div class="form-group">

                    <label>
                        اسم المحاضرة
                    </label>

                    <input
                        id="title"
                        type="text"
                        placeholder="مثال: المحاضرة الأولى في الباطنة"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        المرحلة
                    </label>

                    <select
                        id="stageId"
                        required
                    >
                        <option value="">
                            جاري تحميل المراحل...
                        </option>
                    </select>

                </div>


                <div class="form-group">

                    <label>
                        المادة
                    </label>

                    <select
                        id="subjectId"
                        required
                    >
                        <option value="">
                            جاري تحميل المواد...
                        </option>
                    </select>

                </div>


                <div class="form-group">

                    <label>
                        المدرس
                    </label>

                    <select
                        id="teacherId"
                        required
                    >
                        <option value="">
                            جاري تحميل المدرسين...
                        </option>
                    </select>

                </div>


                <div class="form-group">

                    <label>
                        تاريخ ووقت البداية
                    </label>

                    <input
                        id="scheduledAt"
                        type="datetime-local"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        تاريخ ووقت النهاية
                    </label>

                    <input
                        id="endAt"
                        type="datetime-local"
                    >

                </div>


                <div class="form-group">

                    <label>
                        رابط Live
                    </label>

                    <input
                        id="liveUrl"
                        type="url"
                        dir="ltr"
                        placeholder="https://..."
                    >

                </div>


                <div class="form-group">

                    <label>
                        رابط التسجيل
                    </label>

                    <input
                        id="recordingUrl"
                        type="url"
                        dir="ltr"
                        placeholder="https://..."
                    >

                </div>


                <div class="form-group full">

                    <label>
                        الوصف
                    </label>

                    <textarea
                        id="description"
                        placeholder="وصف مختصر للمحاضرة..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        الحالة
                    </label>

                    <select id="status">

                        <option value="scheduled">
                            قادمة
                        </option>

                        <option value="live">
                            مباشر الآن
                        </option>

                        <option value="ended">
                            انتهت
                        </option>

                        <option value="cancelled">
                            ملغاة
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        النشر
                    </label>

                    <div class="publish-row">

                        <input
                            id="isPublished"
                            type="checkbox"
                            checked
                        >

                        <span>
                            نشر المحاضرة للطلاب
                        </span>

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary-button"
                        id="saveButton"
                    >
                        حفظ المحاضرة
                    </button>

                    <button
                        type="button"
                        class="secondary-button"
                        id="cancelButton"
                        style="display:none"
                    >
                        إلغاء التعديل
                    </button>

                </div>

            </form>

        </div>


        <br>


        <div class="panel">

            <div class="panel-header">

                <h2>
                    📚 المحاضرات
                </h2>

                <button
                    id="refreshButton"
                    class="secondary-button"
                >
                    🔄 تحديث
                </button>

            </div>


            <div
                id="lecturesTable"
                class="lecture-table-wrapper"
            >
                جاري تحميل المحاضرات...
            </div>

        </div>

    `;


    // =====================================================
    // Elements
    // =====================================================

    const form =
        document.getElementById(
            "lectureForm"
        );

    const titleInput =
        document.getElementById(
            "title"
        );

    const stageSelect =
        document.getElementById(
            "stageId"
        );

    const subjectSelect =
        document.getElementById(
            "subjectId"
        );

    const teacherSelect =
        document.getElementById(
            "teacherId"
        );

    const scheduledInput =
        document.getElementById(
            "scheduledAt"
        );

    const endInput =
        document.getElementById(
            "endAt"
        );

    const liveUrlInput =
        document.getElementById(
            "liveUrl"
        );

    const recordingUrlInput =
        document.getElementById(
            "recordingUrl"
        );

    const descriptionInput =
        document.getElementById(
            "description"
        );

    const statusSelect =
        document.getElementById(
            "status"
        );

    const publishedInput =
        document.getElementById(
            "isPublished"
        );

    const saveButton =
        document.getElementById(
            "saveButton"
        );

    const cancelButton =
        document.getElementById(
            "cancelButton"
        );

    const formTitle =
        document.getElementById(
            "formTitle"
        );

    const table =
        document.getElementById(
            "lecturesTable"
        );

    const messageBox =
        document.getElementById(
            "messageBox"
        );


    let editingLectureId = null;

    let stages = [];

    let subjects = [];

    let teachers = [];


    // =====================================================
    // Helpers
    // =====================================================

    function escapeHtml(value) {

        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    function getDate(value) {

        if (!value) {
            return null;
        }

        if (
            typeof value.toDate ===
            "function"
        ) {
            return value.toDate();
        }

        const date =
            new Date(value);

        return isNaN(date.getTime())
            ? null
            : date;
    }


    function formatDate(value) {

        const date =
            getDate(value);

        if (!date) {
            return "—";
        }

        return date.toLocaleString(
            "ar-EG"
        );
    }


    function toInputDate(value) {

        const date =
            getDate(value);

        if (!date) {
            return "";
        }

        const pad =
            number =>
                String(number)
                    .padStart(2, "0");

        return (
            date.getFullYear() +
            "-" +
            pad(date.getMonth() + 1) +
            "-" +
            pad(date.getDate()) +
            "T" +
            pad(date.getHours()) +
            ":" +
            pad(date.getMinutes())
        );
    }


    function showMessage(
        message,
        type = "success"
    ) {

        messageBox.textContent =
            message;

        messageBox.className =
            "message-box " + type;

        setTimeout(() => {

            messageBox.className =
                "message-box";

        }, 4000);

    }


    function getStageName(
        stageId
    ) {

        const stage =
            stages.find(
                item =>
                    item.id === stageId
            );

        return stage
            ? (
                stage.name ||
                stage.title ||
                stageId
            )
            : stageId || "—";
    }


    function getSubjectName(
        subjectId
    ) {

        const subject =
            subjects.find(
                item =>
                    item.id === subjectId
            );

        return subject
            ? (
                subject.name ||
                subject.title ||
                subjectId
            )
            : subjectId || "—";
    }


    function getTeacherName(
        teacherId
    ) {

        const teacher =
            teachers.find(
                item =>
                    item.id === teacherId
            );

        return teacher
            ? (
                teacher.name ||
                teacher.displayName ||
                teacherId
            )
            : teacherId || "—";
    }


    // =====================================================
    // Load Base Data
    // =====================================================

    async function loadBaseData() {

        const [
            stagesSnapshot,
            subjectsSnapshot,
            usersSnapshot
        ] = await Promise.all([

            getDocs(
                collection(
                    db,
                    "stages"
                )
            ),

            getDocs(
                collection(
                    db,
                    "subjects"
                )
            ),

            getDocs(
                collection(
                    db,
                    "users"
                )
            )

        ]);


        stages =
            stagesSnapshot.docs.map(
                item => ({
                    id: item.id,
                    ...item.data()
                })
            );


        subjects =
            subjectsSnapshot.docs.map(
                item => ({
                    id: item.id,
                    ...item.data()
                })
            );


        teachers =
            usersSnapshot.docs
                .map(
                    item => ({
                        id: item.id,
                        ...item.data()
                    })
                )
                .filter(
                    user =>
                        user.role ===
                        "teacher"
                );


        stageSelect.innerHTML = `

            <option value="">
                اختر المرحلة
            </option>

            ${
                stages.map(
                    stage => `
                        <option value="${escapeHtml(stage.id)}">
                            ${escapeHtml(
                                stage.name ||
                                stage.title ||
                                stage.id
                            )}
                        </option>
                    `
                ).join("")
            }

        `;


        subjectSelect.innerHTML = `

            <option value="">
                اختر المادة
            </option>

            ${
                subjects.map(
                    subject => `
                        <option value="${escapeHtml(subject.id)}">
                            ${escapeHtml(
                                subject.name ||
                                subject.title ||
                                subject.id
                            )}
                        </option>
                    `
                ).join("")
            }

        `;


        teacherSelect.innerHTML = `

            <option value="">
                اختر المدرس
            </option>

            ${
                teachers.map(
                    teacher => `
                        <option value="${escapeHtml(teacher.id)}">
                            ${escapeHtml(
                                teacher.name ||
                                teacher.displayName ||
                                teacher.id
                            )}
                        </option>
                    `
                ).join("")
            }

        `;

    }


    // =====================================================
    // Load Lectures
    // =====================================================

    async function loadLectures() {

        try {

            table.innerHTML =
                "⏳ جاري تحميل المحاضرات...";


            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "lectures"
                    )
                );


            const lectures =
                snapshot.docs
                    .map(
                        item => ({
                            id: item.id,
                            ...item.data()
                        })
                    )
                    .sort(
                        (a, b) => {

                            const da =
                                getDate(
                                    a.scheduledAt
                                );

                            const dbDate =
                                getDate(
                                    b.scheduledAt
                                );

                            if (!da) return 1;
                            if (!dbDate) return -1;

                            return (
                                da.getTime() -
                                dbDate.getTime()
                            );

                        }
                    );


            if (!lectures.length) {

                table.innerHTML = `

                    <div class="empty-state">
                        لا توجد محاضرات حتى الآن.
                    </div>

                `;

                return;

            }


            table.innerHTML = `

                <table class="lecture-table">

                    <thead>

                        <tr>

                            <th>
                                المحاضرة
                            </th>

                            <th>
                                المرحلة
                            </th>

                            <th>
                                المادة
                            </th>

                            <th>
                                المدرس
                            </th>

                            <th>
                                الموعد
                            </th>

                            <th>
                                الحالة
                            </th>

                            <th>
                                النشر
                            </th>

                            <th>
                                الإجراءات
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${
                            lectures.map(
                                lecture => `

                                    <tr>

                                        <td>
                                            <strong>
                                                ${escapeHtml(
                                                    lecture.title ||
                                                    "محاضرة"
                                                )}
                                            </strong>
                                        </td>

                                        <td>
                                            ${escapeHtml(
                                                getStageName(
                                                    lecture.stageId
                                                )
                                            )}
                                        </td>

                                        <td>
                                            ${escapeHtml(
                                                getSubjectName(
                                                    lecture.subjectId
                                                )
                                            )}
                                        </td>

                                        <td>
                                            ${escapeHtml(
                                                lecture.teacherName ||
                                                getTeacherName(
                                                    lecture.teacherId
                                                )
                                            )}
                                        </td>

                                        <td>
                                            ${escapeHtml(
                                                formatDate(
                                                    lecture.scheduledAt
                                                )
                                            )}
                                        </td>

                                        <td>
                                            ${escapeHtml(
                                                lecture.status ||
                                                "scheduled"
                                            )}
                                        </td>

                                        <td>

                                            <span
                                                class="
                                                    status-badge
                                                    ${
                                                        lecture.isPublished === true
                                                            ? "status-published"
                                                            : "status-hidden"
                                                    }
                                                "
                                            >
                                                ${
                                                    lecture.isPublished === true
                                                        ? "منشورة"
                                                        : "مخفية"
                                                }
                                            </span>

                                        </td>

                                        <td>

                                            <div class="action-buttons">

                                                <button
                                                    class="
                                                        action-button
                                                        edit-button
                                                    "
                                                    data-edit="${escapeHtml(
                                                        lecture.id
                                                    )}"
                                                >
                                                    ✏️ تعديل
                                                </button>

                                                <button
                                                    class="
                                                        action-button
                                                        delete-button
                                                    "
                                                    data-delete="${escapeHtml(
                                                        lecture.id
                                                    )}"
                                                >
                                                    🗑️ حذف
                                                </button>

                                            </div>

                                        </td>

                                    </tr>

                                `
                            ).join("")
                        }

                    </tbody>

                </table>

            `;


            document
                .querySelectorAll(
                    "[data-edit]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                const lecture =
                                    lectures.find(
                                        item =>
                                            item.id ===
                                            button.dataset.edit
                                    );

                                if (lecture) {
                                    editLecture(
                                        lecture
                                    );
                                }

                            }
                        );

                    }
                );


            document
                .querySelectorAll(
                    "[data-delete]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                deleteLecture(
                                    button.dataset.delete
                                );

                            }
                        );

                    }
                );

        } catch (error) {

            console.error(
                "Load lectures error:",
                error
            );

            table.innerHTML = `

                <div class="empty-state">
                    حدث خطأ أثناء تحميل المحاضرات.
                </div>

            `;

        }

    }


    // =====================================================
    // Add / Update
    // =====================================================

    form.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            saveButton.disabled =
                true;


            try {

                const stageId =
                    stageSelect.value;

                const subjectId =
                    subjectSelect.value;

                const teacherId =
                    teacherSelect.value;


                const subjectName =
                    getSubjectName(
                        subjectId
                    );

                const teacherName =
                    getTeacherName(
                        teacherId
                    );


                const scheduledDate =
                    new Date(
                        scheduledInput.value
                    );


                let endDate = null;

                if (
                    endInput.value
                ) {

                    endDate =
                        new Date(
                            endInput.value
                        );

                }


                const data = {

                    title:
                        titleInput.value.trim(),

                    stageId:
                        stageId,

                    subjectId:
                        subjectId,

                    subject:
                        subjectName,

                    teacherId:
                        teacherId,

                    teacherName:
                        teacherName,

                    description:
                        descriptionInput.value.trim(),

                    liveUrl:
                        liveUrlInput.value.trim(),

                    recordingUrl:
                        recordingUrlInput.value.trim(),

                    status:
                        statusSelect.value,

                    isPublished:
                        publishedInput.checked,

                    scheduledAt:
                        scheduledDate,

                    endAt:
                        endDate

                };


                if (
                    editingLectureId
                ) {

                    data.updatedAt =
                        serverTimestamp();


                    await updateDoc(

                        doc(
                            db,
                            "lectures",
                            editingLectureId
                        ),

                        data

                    );


                    showMessage(
                        "تم تعديل المحاضرة بنجاح."
                    );

                } else {

                    data.createdAt =
                        serverTimestamp();

                    data.updatedAt =
                        serverTimestamp();


                    await addDoc(

                        collection(
                            db,
                            "lectures"
                        ),

                        data

                    );


                    showMessage(
                        "تمت إضافة المحاضرة بنجاح."
                    );

                }


                resetForm();

                await loadLectures();

            } catch (error) {

                console.error(
                    "Save lecture error:",
                    error
                );

                showMessage(
                    "حدث خطأ أثناء حفظ المحاضرة.",
                    "error"
                );

            } finally {

                saveButton.disabled =
                    false;

            }

        }
    );


    // =====================================================
    // Edit
    // =====================================================

    function editLecture(
        lecture
    ) {

        editingLectureId =
            lecture.id;


        titleInput.value =
            lecture.title || "";


        stageSelect.value =
            lecture.stageId || "";


        subjectSelect.value =
            lecture.subjectId || "";


        teacherSelect.value =
            lecture.teacherId || "";


        scheduledInput.value =
            toInputDate(
                lecture.scheduledAt
            );


        endInput.value =
            toInputDate(
                lecture.endAt
            );


        liveUrlInput.value =
            lecture.liveUrl || "";


        recordingUrlInput.value =
            lecture.recordingUrl || "";


        descriptionInput.value =
            lecture.description || "";


        statusSelect.value =
            lecture.status ||
            "scheduled";


        publishedInput.checked =
            lecture.isPublished === true;


        formTitle.textContent =
            "✏️ تعديل المحاضرة";


        saveButton.textContent =
            "حفظ التعديلات";


        cancelButton.style.display =
            "inline-block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // =====================================================
    // Delete
    // =====================================================

    async function deleteLecture(
        lectureId
    ) {

        const confirmed =
            confirm(
                "هل أنت متأكد من حذف هذه المحاضرة؟"
            );


        if (!confirmed) {
            return;
        }


        try {

            await deleteDoc(
                doc(
                    db,
                    "lectures",
                    lectureId
                )
            );


            showMessage(
                "تم حذف المحاضرة بنجاح."
            );


            await loadLectures();

        } catch (error) {

            console.error(
                "Delete lecture error:",
                error
            );

            showMessage(
                "حدث خطأ أثناء حذف المحاضرة.",
                "error"
            );

        }

    }


    // =====================================================
    // Reset
    // =====================================================

    function resetForm() {

        editingLectureId =
            null;


        form.reset();


        publishedInput.checked =
            true;


        statusSelect.value =
            "scheduled";


        formTitle.textContent =
            "➕ إضافة محاضرة جديدة";


        saveButton.textContent =
            "حفظ المحاضرة";


        cancelButton.style.display =
            "none";

    }


    cancelButton.addEventListener(
        "click",
        resetForm
    );


    document
        .getElementById(
            "refreshButton"
        )
        .addEventListener(
            "click",
            loadLectures
        );


    // =====================================================
    // Start
    // =====================================================

    try {

        await loadBaseData();

        await loadLectures();

    } catch (error) {

        console.error(
            "Admin lectures initialization error:",
            error
        );

        showMessage(
            "حدث خطأ أثناء تحميل بيانات إدارة المحاضرات.",
            "error"
        );

    }

</script>

</body>
</html>
