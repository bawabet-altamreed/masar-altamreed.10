<style>

* {
    box-sizing: border-box;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.search-box,
.filter-select {
    height: 45px;
    border: 1px solid #d8e2e9;
    border-radius: 10px;
    padding: 0 14px;
    outline: none;
    font-family: inherit;
    background: white;
}

.search-box {
    flex: 1;
    min-width: 220px;
}

.filter-select {
    min-width: 180px;
}

.search-box:focus,
.filter-select:focus {
    border-color: #087ea4;
}

.table-container {
    overflow-x: auto;
}

.lectures-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
}

.lectures-table th,
.lectures-table td {
    padding: 13px 12px;
    border-bottom: 1px solid #edf1f4;
    text-align: right;
    white-space: nowrap;
}

.lectures-table th {
    background: #f8fafc;
    color: #647586;
    font-size: 12px;
}

.lectures-table td {
    font-size: 13px;
}

.lecture-name {
    font-weight: bold;
}

.lecture-subject {
    color: #82919d;
    font-size: 11px;
    margin-top: 4px;
}

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
}

.status-published {
    background: #eaf8f0;

}

.status-unpublished {

    color: #a45b00;
}

.status-live {
    background: #fff1f1;
    color: #b42318;
}

.status-ended {
    background: #f1f3f5;
    color: #687783;
}

.status-ready {
    background: #eef8fb;
    color: #087ea4;
}

.action-button {
    border: none;
    padding: 7px 10px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
    margin-left: 4px;
    margin-bottom: 4px;
}

.edit-button {

}

.delete-button {

}

.publish-button {

}

.unpublish-button {

}

.room-button {

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
}

.modal-overlay.show {

}

.modal {
    width: 100%;
    max-width: 650px;
    max-height: 92vh;
    overflow-y: auto;
    background: white;
    border-radius: 18px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

}

.modal-header h2 {
    font-size: 19px;
}

.close-button {
    border: none;
    background: #f1f4f6;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.form-group {

}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 12px;
    font-weight: bold;
    color: #44525d;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    border: 1px solid #d8e2e9;
    border-radius: 9px;
    padding: 11px 12px;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    background: white;
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}

.form-message {
    display: none;
    padding: 10px 12px;
    border-radius: 9px;
    margin-bottom: 15px;
    font-size: 12px;
    font-weight: bold;
}

.form-message.show {
    display: block;
}

.form-message.success {
    background: #eaf8f0;
    color: #16834f;
}

.form-message.error {
    background: #fff1f1;
    color: #b42318;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.primary-button,
.secondary-button {
    border: none;
    border-radius: 9px;
    padding: 11px 18px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
}

.primary-button {
    background: #087ea4;

}

.secondary-button {

}

.stats-grid {
    display: grid;

}

.stat-card {
    background: white;
    border: 1px solid #edf1f4;
    border-radius: 14px;

}

.stat-label {

    font-size: 11px;

.stat-value {

.empty-state,

@media (max-width: 800px) {

}

@media (max-width: 500px) {

    }

    .modal {

    }

}

</style>

<script type="module">

import {

    collection,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {

    db

} from "../src/firebase/init.js";


const adminLayout =

        </nav>

`;


/* =====================================================
   Elements
===================================================== */

const addLectureButton =
    document.getElementById(
        "addLectureButton"
    );

const lectureModal =
    document.getElementById(
        "lectureModal"
    );

const closeModalButton =
    document.getElementById(
        "closeModalButton"
    );

const cancelButton =
    document.getElementById(
        "cancelButton"
    );

const lectureForm =
    document.getElementById(
        "lectureForm"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const formMessage =

const publishedLectures =

    );

const lectureStage =
    document.getElementById(
        "lectureStage"
    );

const lectureTeacher =
    document.getElementById(
        "lectureTeacher"
    );

const lectureDate =
    document.getElementById(
        "lectureDate"
    );

const lecturePublished =
    document.getElementById(
        "lecturePublished"
    );

const lectureDescription =
    document.getElementById(
        "lectureDescription"
    );


let lectures = [];

let subjects = [];

let teachers = [];

let editingLectureId = null;


/* =====================================================
   Helpers
===================================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function getStageName(stageId) {

    const stages = {

        "stage-1":
            "الصف الأول الثانوي التمريض",

        "stage-2":
            "الصف الثاني الثانوي التمريض",

        "stage-3":
            "الصف الثالث الثانوي التمريض",

        "stage-4":
            "الصف الأول المعهد",

        "stage-5":
            "الصف الثاني المعهد"

    };

    return (
        stages[stageId] ||
        stageId ||
        "—"
    );

}


function getSubjectName(subjectId) {

    const subject =
        subjects.find(
            item =>
                item.id === subjectId
        );

    return (
        subject?.name ||
        subjectId ||
        "—"
    );

}


function formatDate(value) {

    if (!value) {
        return "—";
    }

    let date;

    try {

        if (
            typeof value.toDate ===
            "function"
        ) {

            date =
                value.toDate();

        } else {

            date =
                new Date(value);

        }

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "—";

        }

        return new Intl.DateTimeFormat(
            "ar-EG",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        ).format(date);

    } catch {

        return "—";

    }

}


function toDateTimeLocal(value) {

    if (!value) {
        return "";
    }

    const date =
        typeof value.toDate ===
        "function"
            ? value.toDate()
            : new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }

    const pad =
        number =>
            String(number)
                .padStart(2, "0");

    return `${date.getFullYear()}-${pad(
        date.getMonth() + 1
    )}-${pad(
        date.getDate()
    )}T${pad(
        date.getHours()
    )}:${pad(
        date.getMinutes()
    )}`;

}


function showMessage(
    message,
    type = "error"
) {

    formMessage.textContent =
        message;

    formMessage.className =
        `form-message show ${type}`;

}


function hideMessage() {

    formMessage.textContent = "";

    formMessage.className =
        "form-message";

}


function resetForm() {

    lectureForm.reset();

    lectureId.value = "";

    editingLectureId = null;

    modalTitle.textContent =
        "إضافة محاضرة";

    saveLectureButton.textContent =
        "حفظ المحاضرة";

    hideMessage();

}


function openModal() {

    lectureModal.classList.add(
        "show"
    );

    document.body.style.overflow =
        "hidden";

}


function closeModal() {

    lectureModal.classList.remove(
        "show"
    );

    document.body.style.overflow =
        "";

    resetForm();

}


/* =====================================================
   Load Subjects
===================================================== */

async function loadSubjects() {

    const snapshot =
        await getDocs(
            collection(
                db,
                "subjects"
            )
        );

    subjects =
        snapshot.docs.map(
            item => ({
                id: item.id,
                ...item.data()
            })
        );


    lectureSubject.innerHTML = `

        <option value="">
            اختر المادة
        </option>

        ${
            subjects.map(
                subject => `
                    <option
                        value="${escapeHtml(
                            subject.id
                        )}"
                    >
                        ${escapeHtml(
                            subject.name ||
                            subject.title ||
                            subject.id
                        )}
                    </option>
                `
            ).join("")
        }

    `;

}


/* =====================================================
   Load Teachers
===================================================== */

async function loadTeachers() {

    const snapshot =
        await getDocs(
            collection(
                db,
                "users"
            )
        );


    teachers =
        snapshot.docs
            .map(
                item => ({
                    id: item.id,
                    ...item.data()
                })
            )
            .filter(
                user =>
                    user.role ===
                    "teacher"
                    &&
                    user.isActive ===
                    true
            );


    lectureTeacher.innerHTML = `

        <option value="">
            اختر المدرس
        </option>

        ${
            teachers.map(
                teacher => `
                    <option
                        value="${escapeHtml(
                            teacher.id
                        )}"
                    >
                        ${escapeHtml(
                            teacher.name ||
                            teacher.fullName ||
                            teacher.email ||
                            teacher.id
                        )}
                    </option>
                `
            ).join("")
        }

    `;

}


/* =====================================================
   Load
===================================================== */

await Promise.all([
    loadSubjects(),
    loadTeachers()
]);


/* =====================================================
   Firestore
===================================================== */

const lecturesCollection =
    collection(
        db,
        "lectures"
    );


const lecturesQuery =
    query(
        lecturesCollection,
        orderBy(
            "date",
            "desc"
        )
    );


onSnapshot(
    lecturesQuery,
    snapshot => {

        lectures =
            snapshot.docs.map(
                item => ({
                    id: item.id,
                    ...item.data()
                })
            );


        loadingState.style.display =
            "none";

        renderLectures();

        updateStats();

    },
    error => {

        console.error(
            error
        );

        loadingState.style.display =
            "none";

        emptyState.style.display =
            "block";

        emptyState.innerHTML = `
            <div class="empty-state-icon">
                ⚠️
            </div>

            حدث خطأ أثناء تحميل المحاضرات.
        `;

    }
);


/* =====================================================
   Filter
===================================================== */

function getFilteredLectures() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();

    const stage =
        stageFilter.value;


    return lectures.filter(
        lecture => {

            const teacher =
                teachers.find(
                    item =>
                        item.id ===
                        lecture.teacherId
                );


            const teacherName =
                lecture.teacherName ||
                teacher?.name ||
                "";


            const subjectName =
                getSubjectName(
                    lecture.subjectId
                );


            const text = [

                lecture.title,

                teacherName,

                subjectName,

                lecture.description

            ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


            return (

                (
                    !search ||
                    text.includes(search)
                )

                &&

                (
                    stage === "all" ||
                    lecture.stageId === stage
                )

            );

        }
    );

}


/* =====================================================
   Render
===================================================== */

function renderLectures() {

    const filtered =
        getFilteredLectures();


    if (!filtered.length) {

        tableContainer.style.display =
            "none";

        emptyState.style.display =
            "block";

        return;

    }


    emptyState.style.display =
        "none";

    tableContainer.style.display =
        "block";


    lecturesTableBody.innerHTML =
        filtered.map(
            lecture => {

                const teacher =
                    teachers.find(
                        item =>
                            item.id ===
                            lecture.teacherId
                    );


                const teacherName =
                    lecture.teacherName ||
                    teacher?.name ||
                    "—";


                let statusText =
                    "متاحة";

                let statusClass =
                    "status-ready";


                if (
                    lecture.isLive ===
                    true
                ) {

                    statusText =
                        "🔴 مباشر الآن";

                    statusClass =
                        "status-live";

                } else if (
                    lecture.isPublished ===
                    true
                ) {

                    statusText =
                        "منشورة";

                    statusClass =
                        "status-published";

                } else {

                    statusText =
                        "غير منشورة";

                    statusClass =
                        "status-unpublished";

                }


                return `

                    <tr>

                        <td>

                            <div class="lecture-name">

                                ${escapeHtml(
                                    lecture.title ||
                                    "بدون اسم"
                                )}

                            </div>

                            <div class="lecture-subject">

                                ${escapeHtml(
                                    getSubjectName(
                                        lecture.subjectId
                                    )
                                )}

                            </div>

                        </td>


                        <td>

                            ${escapeHtml(
                                getStageName(
                                    lecture.stageId
                                )
                            )}

                        </td>


                        <td>

                            ${escapeHtml(
                                teacherName
                            )}

                        </td>


                        <td>

                            ${formatDate(
                                lecture.date
                            )}

                        </td>


                        <td>

                            <span
                                class="
                                    status
                                    ${statusClass}
                                "
                            >
                                ${statusText}
                            </span>

                        </td>


                        <td>

                            ${
                                lecture.roomName
                                    ? `
                                        <span
                                            class="
                                                status
                                                status-ready
                                            "
                                        >
                                            جاهزة
                                        </span>
                                    `
                                    : `
                                        <span
                                            class="
                                                status
                                                status-unpublished
                                            "
                                        >
                                            غير مجهزة
                                        </span>
                                    `
                            }

                        </td>


                        <td>

                            <button
                                type="button"
                                class="action-button edit-button"
                                data-action="edit"
                                data-id="${lecture.id}"
                            >
                                تعديل
                            </button>


                            ${
                                lecture.isPublished
                                    ? `
                                        <button
                                            type="button"
                                            class="action-button unpublish-button"
                                            data-action="unpublish"
                                            data-id="${lecture.id}"
                                        >
                                            إلغاء النشر
                                        </button>
                                    `
                                    : `
                                        <button
                                            type="button"
                                            class="action-button publish-button"
                                            data-action="publish"
                                            data-id="${lecture.id}"
                                        >
                                            نشر
                                        </button>
                                    `
                            }


                            <button
                                type="button"
                                class="action-button delete-button"
                                data-action="delete"
                                data-id="${lecture.id}"
                            >
                                حذف
                            </button>

                        </td>

                    </tr>

                `;

            }
        ).join("");

}


/* =====================================================
   Stats
===================================================== */

function updateStats() {

    totalLectures.textContent =
        lectures.length;


    publishedLectures.textContent =
        lectures.filter(
            lecture =>
                lecture.isPublished ===
                true
        ).length;


    liveLectures.textContent =
        lectures.filter(
            lecture =>
                lecture.isLive ===
                true
        ).length;


    roomLectures.textContent =
        lectures.filter(
            lecture =>
                Boolean(
                    lecture.roomName
                )
        ).length;

}


/* =====================================================
   Add
===================================================== */

addLectureButton.addEventListener(
    "click",
    () => {

        resetForm();

        openModal();

        setTimeout(
            () =>
                lectureTitle.focus(),
            100
        );

    }
);


closeModalButton.addEventListener(
    "click",
    closeModal
);


cancelButton.addEventListener(
    "click",
    closeModal
);


lectureModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            lectureModal
        ) {

            closeModal();

        }

    }
);


/* =====================================================
   Edit
===================================================== */

function editLecture(id) {

    const lecture =
        lectures.find(
            item =>
                item.id === id
        );


    if (!lecture) {
        return;
    }


    editingLectureId =
        id;


    lectureId.value =
        id;


    lectureTitle.value =
        lecture.title || "";


    lectureSubject.value =
        lecture.subjectId || "";


    lectureStage.value =
        lecture.stageId || "";


    lectureTeacher.value =
        lecture.teacherId || "";


    lectureDate.value =
        toDateTimeLocal(
            lecture.date
        );


    lecturePublished.value =
        lecture.isPublished ===
        true
            ? "true"
            : "false";


    lectureDescription.value =
        lecture.description || "";


    modalTitle.textContent =
        "تعديل المحاضرة";


    saveLectureButton.textContent =
        "حفظ التعديلات";


    hideMessage();

    openModal();

}


/* =====================================================
   Save
===================================================== */

lectureForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        hideMessage();


        const title =
            lectureTitle.value.trim();

        const subjectId =
            lectureSubject.value;

        const stageId =
            lectureStage.value;

        const teacherId =
            lectureTeacher.value;

        const date =
            new Date(
                lectureDate.value
            );


        const description =
            lectureDescription.value.trim();


        const isPublished =
            lecturePublished.value ===
            "true";


        if (!title) {

            showMessage(
                "من فضلك اكتب اسم المحاضرة."
            );

            return;

        }


        if (!subjectId) {

            showMessage(
                "من فضلك اختر المادة."
            );

            return;

        }


        if (!stageId) {

            showMessage(
                "من فضلك اختر المرحلة."
            );

            return;

        }


        if (!teacherId) {

            showMessage(
                "من فضلك اختر المدرس."
            );

            return;

        }


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            showMessage(
                "من فضلك اختر موعد المحاضرة."
            );

            return;

        }


        const teacher =
            teachers.find(
                item =>
                    item.id ===
                    teacherId
            );


        saveLectureButton.disabled =
            true;

        saveLectureButton.textContent =
            "جاري الحفظ...";


        try {

            if (
                editingLectureId
            ) {

                const oldLecture =
                    lectures.find(
                        item =>
                            item.id ===
                            editingLectureId
                    );


                await updateDoc(
                    doc(
                        db,
                        "lectures",
                        editingLectureId
                    ),
                    {

                        title,

                        teacherId,

                        teacherName:
                            teacher?.name ||
                            teacher?.fullName ||
                            "",

                        stageId,

                        subjectId,

                        description,

                        date,

                        isPublished,

                        updatedAt:
                            serverTimestamp()

                    }
                );


            } else {

                const lectureRef =
                    await addDoc(
                        lecturesCollection,
                        {

                            title,

                            teacherId,

                            teacherName:
                                teacher?.name ||
                                teacher?.fullName ||
                                "",

                            stageId,

                            subjectId,

                            description,

                            date,

                            isPublished,

                            isLive:
                                false,

                            roomName:
                                "",

                            recordingUrl:
                                "",

                            recordingStatus:
                                "pending",

                            createdAt:
                                serverTimestamp(),

                            updatedAt:
                                serverTimestamp()

                        }
                    );


                await updateDoc(
                    lectureRef,
                    {

                        roomName:
                            `masar-lecture-${lectureRef.id}`,

                        updatedAt:
                            serverTimestamp()

                    }
                );

            }


            showMessage(
                "تم حفظ المحاضرة بنجاح.",
                "success"
            );


            setTimeout(
                closeModal,
                700
            );


        } catch (error) {

            console.error(
                "Save lecture error:",
                error
            );


            showMessage(
                "حدث خطأ أثناء حفظ المحاضرة."
            );

        } finally {

            saveLectureButton.disabled =
                false;

            saveLectureButton.textContent =
                editingLectureId
                    ? "حفظ التعديلات"
                    : "حفظ المحاضرة";

        }

    }
);


/* =====================================================
   Table Actions
===================================================== */

lecturesTableBody.addEventListener(
    "click",
    async event => {

        const button =
            event.target.closest(
                "[data-action]"
            );


        if (!button) {
            return;
        }


        const action =
            button.dataset.action;

        const id =
            button.dataset.id;


        if (
            action ===
            "edit"
        ) {

            editLecture(id);

            return;

        }


        if (
            action ===
            "publish"
        ) {

            await changePublish(
                id,
                true
            );

            return;

        }


        if (
            action ===
            "unpublish"
        ) {

            await changePublish(
                id,
                false
            );

            return;

        }


        if (
            action ===
            "delete"
        ) {

            await deleteLecture(
                id
            );

        }

    }
);


/* =====================================================
   Publish
===================================================== */

async function changePublish(
    id,
    value
) {

    const lecture =
        lectures.find(
            item =>
                item.id === id
        );


    if (!lecture) {
        return;
    }


    const actionText =
        value
            ? "نشر"
            : "إلغاء نشر";


    if (
        !confirm(
            `هل أنت متأكد من ${actionText} المحاضرة "${lecture.title || ""}"؟`
        )
    ) {
        return;
    }


    try {

        await updateDoc(
            doc(
                db,
                "lectures",
                id
            ),
            {

                isPublished:
                    value,

                updatedAt:
                    serverTimestamp()

            }
        );

    } catch (error) {

        console.error(
            error
        );

        alert(
            "حدث خطأ أثناء تحديث النشر."
        );

    }

}


/* =====================================================
   Delete
===================================================== */

async function deleteLecture(
    id
) {

    const lecture =
        lectures.find(
            item =>
                item.id === id
        );


    if (!lecture) {
        return;
    }


    if (
        !confirm(
            `هل أنت متأكد من حذف المحاضرة "${lecture.title || ""}"؟`
        )
    ) {
        return;
    }


    try {

        await deleteDoc(
            doc(
                db,
                "lectures",
                id
            )
        );

    } catch (error) {

        console.error(
            error
        );

        alert(
            "حدث خطأ أثناء حذف المحاضرة."
        );

    }

}


/* =====================================================
   Filters
===================================================== */

searchInput.addEventListener(
    "input",
    renderLectures
);


stageFilter.addEventListener(
    "change",
    renderLectures
);


</script>
