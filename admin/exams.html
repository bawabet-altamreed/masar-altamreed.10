<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        إدارة الاختبارات | مسار التمريض
    </title>

    <link
        rel="stylesheet"
        href="../src/admin/admin.css"
    >

    <style>

        /* =====================================================
           Exams Page
        ===================================================== */

        .exam-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .exam-toolbar-info h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .exam-toolbar-info p {
            color: #82909c;
            font-size: 12px;
        }


        /* =====================================================
           Exam Cards
        ===================================================== */

        .exams-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }

        .exam-card {
            background: #fff;
            border: 1px solid #e3ebf1;
            border-radius: 16px;
            padding: 20px;
        }

        .exam-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
        }

        .exam-card h3 {
            font-size: 16px;
            line-height: 1.6;
        }

        .status-badge {
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-published {
            background: #eaf8f0;
            color: #16834f;
        }

        .status-hidden {
            background: #fff1f1;
            color: #b42318;
        }

        .exam-description {
            color: #71808d;
            font-size: 12px;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .exam-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 18px;
        }

        .exam-meta span {
            background: #f4f8fa;
            color: #60717e;
            border-radius: 8px;
            padding: 7px 9px;
            font-size: 10px;
        }

        .exam-actions {
            display: flex;
            gap: 8px;
            border-top: 1px solid #edf1f4;
            padding-top: 15px;
        }

        .exam-actions button {
            border: none;
            border-radius: 8px;
            padding: 9px 13px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .edit-button {
            background: #eef8fb;
            color: #087ea4;
        }

        .delete-button {
            background: #fff1f1;
            color: #b42318;
        }


        /* =====================================================
           Modal
        ===================================================== */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 35, 50, .45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .exam-modal {
            background: white;
            width: min(950px, 100%);
            max-height: 92vh;
            overflow-y: auto;
            border-radius: 18px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            gap: 10px;
        }

        .modal-header h2 {
            font-size: 19px;
        }

        .close-modal {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 9px;
            background: #f3f6f8;
            cursor: pointer;
            font-size: 18px;
        }


        /* =====================================================
           Form
        ===================================================== */

        .form-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #445765;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            border: 1px solid #dce6eb;
            border-radius: 9px;
            padding: 11px 12px;
            font-family: inherit;
            font-size: 12px;
            outline: none;
            background: white;
        }

        .form-group textarea {
            min-height: 85px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #087ea4;
        }


        /* =====================================================
           Publish
        ===================================================== */

        .publish-box {
            background: #f7fafb;
            border: 1px solid #e4edf2;
            border-radius: 11px;
            padding: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .publish-box input {
            width: 18px;
            height: 18px;
        }

        .publish-box label {
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }


        /* =====================================================
           Questions
        ===================================================== */

        .questions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 15px;
        }

        .questions-header h3 {
            font-size: 16px;
        }

        .add-question-button {
            border: none;
            background: #087ea4;
            color: white;
            border-radius: 8px;
            padding: 9px 13px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .question-editor {
            border: 1px solid #e1eaf0;
            border-radius: 14px;
            padding: 17px;
            margin-bottom: 13px;
            background: #fbfdfe;
        }

        .question-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 13px;
        }

        .question-editor-header strong {
            font-size: 13px;
        }

        .remove-question {
            border: none;
            background: #fff1f1;
            color: #b42318;
            border-radius: 7px;
            padding: 6px 9px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }

        .question-text-input {
            margin-bottom: 13px;
        }

        .question-text-input input {
            width: 100%;
            border: 1px solid #dce6eb;
            border-radius: 9px;
            padding: 11px;
            font-family: inherit;
            font-size: 12px;
        }

        .options-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 9px;
        }

        .option-editor {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .option-editor input[type="radio"] {
            accent-color: #087ea4;
            flex-shrink: 0;
        }

        .option-editor input[type="text"] {
            width: 100%;
            border: 1px solid #dce6eb;
            border-radius: 8px;
            padding: 10px;
            font-family: inherit;
            font-size: 11px;
        }

        .correct-label {
            font-size: 9px;
            color: #71808d;
            white-space: nowrap;
        }


        /* =====================================================
           Modal Footer
        ===================================================== */

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #edf1f4;
        }

        .modal-footer button {
            border: none;
            border-radius: 9px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .cancel-button {
            background: #edf2f5;
            color: #53636f;
        }

        .save-button {
            background: #087ea4;
            color: white;
        }

        .save-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }


        /* =====================================================
           Empty
        ===================================================== */

        .empty-state {
            background: #fff;
            border: 1px solid #e5edf3;
            border-radius: 15px;
        }


        /* =====================================================
           Toast
        ===================================================== */

        .toast {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 2000;
            padding: 12px 17px;
            border-radius: 10px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: none;
            box-shadow: 0 8px 25px rgba(0,0,0,.15);
        }

        .toast.success {
            background: #16834f;
        }

        .toast.error {
            background: #b42318;
        }


        /* =====================================================
           Responsive
        ===================================================== */

        @media (max-width: 800px) {

            .exams-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .exam-toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .exam-toolbar .primary-button {
                width: 100%;
            }

            .exam-modal {
                padding: 17px;
            }

            .question-navigation {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

<div id="adminApp"></div>


<!-- =========================================================
     Modal
========================================================= -->

<div
    id="examModal"
    class="modal-overlay"
>

    <div class="exam-modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                إضافة اختبار
            </h2>

            <button
                type="button"
                class="close-modal"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <form id="examForm">

            <input
                type="hidden"
                id="examId"
            >


            <!-- =================================================
                 Basic Data
            ================================================== -->

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        عنوان الاختبار *
                    </label>

                    <input
                        id="examTitle"
                        type="text"
                        placeholder="مثال: اختبار طب الباطنة - الفصل الأول"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        المادة
                    </label>

                    <input
                        id="examSubject"
                        type="text"
                        placeholder="مثال: طب الباطنة"
                    >

                </div>


                <div class="form-group">

                    <label>
                        المرحلة الدراسية
                    </label>

                    <input
                        id="examStage"
                        type="text"
                        placeholder="مثال: first-year أو المرحلة الأولى"
                    >

                </div>


                <div class="form-group">

                    <label>
                        مدة الاختبار بالدقائق
                    </label>

                    <input
                        id="examDuration"
                        type="number"
                        min="0"
                        placeholder="مثال: 30"
                    >

                </div>


                <div class="form-group full">

                    <label>
                        وصف الاختبار
                    </label>

                    <textarea
                        id="examDescription"
                        placeholder="اكتب وصفًا مختصرًا للاختبار..."
                    ></textarea>

                </div>

            </div>


            <!-- =================================================
                 Publish
            ================================================== -->

            <div class="publish-box">

                <input
                    type="checkbox"
                    id="examPublished"
                    checked
                >

                <label for="examPublished">
                    نشر الاختبار للطلاب
                </label>

            </div>


            <!-- =================================================
                 Questions
            ================================================== -->

            <div class="questions-header">

                <h3>
                    أسئلة الاختبار
                </h3>

                <button
                    type="button"
                    id="addQuestionButton"
                    class="add-question-button"
                >
                    + إضافة سؤال
                </button>

            </div>


            <div id="questionsContainer"></div>


            <!-- =================================================
                 Footer
            ================================================== -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="cancel-button"
                    id="cancelButton"
                >
                    إلغاء
                </button>

                <button
                    type="submit"
                    class="save-button"
                    id="saveButton"
                >
                    حفظ الاختبار
                </button>

            </div>

        </form>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script type="module">

    /* =========================================================
       Imports
    ========================================================= */

    import {
        protectAdminPage
    } from "../src/admin/auth-guard.js";

    import {
        createAdminLayout
    } from "../src/admin/layout.js";

    import {
        db
    } from "../src/firebase/init.js";

    import {
        collection,
        getDocs,
        doc,
        getDoc,
        addDoc,
        updateDoc,
        deleteDoc,
        serverTimestamp
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================================================
       State
    ========================================================= */

    let admin = null;

    let editingExamId = null;

    let questionCounter = 0;


    /* =========================================================
       Start
    ========================================================= */

    try {

        const result =
            await protectAdminPage();

        admin =
            result;

        createAdminLayout(
            admin.data
        );

        document.getElementById(
            "pageTitle"
        ).textContent =
            "إدارة الاختبارات";


        document.getElementById(
            "pageContent"
        ).innerHTML = `

            <div class="exam-toolbar">

                <div class="exam-toolbar-info">

                    <h2>
                        الاختبارات
                    </h2>

                    <p>
                        إنشاء وإدارة الاختبارات والأسئلة الخاصة بالطلاب.
                    </p>

                </div>

                <button
                    id="newExamButton"
                    class="primary-button"
                >
                    + إضافة اختبار
                </button>

            </div>


            <div
                id="examsContainer"
                class="exams-grid"
            >

                <div class="empty-state">

                    ⏳ جاري تحميل الاختبارات...

                </div>

            </div>

        `;


        bindPageEvents();

        await loadExams();

    } catch (error) {

        console.error(
            "Admin exams error:",
            error
        );

        const content =
            document.getElementById(
                "pageContent"
            );

        if (content) {

            content.innerHTML = `

                <div class="empty-state">

                    ⚠️ حدث خطأ أثناء تحميل صفحة الاختبارات.

                </div>

            `;

        }

    }


    /* =========================================================
       Page Events
    ========================================================= */

    function bindPageEvents() {

        document
            .getElementById(
                "newExamButton"
            )
            .addEventListener(
                "click",
                () => openCreateModal()
            );


        document
            .getElementById(
                "closeModal"
            )
            .addEventListener(
                "click",
                closeModal
            );


        document
            .getElementById(
                "cancelButton"
            )
            .addEventListener(
                "click",
                closeModal
            );


        document
            .getElementById(
                "addQuestionButton"
            )
            .addEventListener(
                "click",
                () => addQuestion()
            );


        document
            .getElementById(
                "examForm"
            )
            .addEventListener(
                "submit",
                saveExam
            );


        document
            .getElementById(
                "examModal"
            )
            .addEventListener(
                "click",
                event => {

                    if (
                        event.target.id ===
                        "examModal"
                    ) {

                        closeModal();

                    }

                }
            );

    }


    /* =========================================================
       Load Exams
    ========================================================= */

    async function loadExams() {

        const container =
            document.getElementById(
                "examsContainer"
            );

        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "exams"
                    )
                );


            const exams =
                snapshot.docs.map(
                    item => ({

                        id:
                            item.id,

                        ...item.data()

                    })
                );


            if (!exams.length) {

                container.innerHTML = `

                    <div class="empty-state">

                        لا توجد اختبارات حتى الآن.

                        <br><br>

                        اضغط على
                        <strong>
                            + إضافة اختبار
                        </strong>
                        لإنشاء أول اختبار.

                    </div>

                `;

                return;

            }


            container.innerHTML =
                exams
                    .map(
                        exam =>
                            renderExamCard(
                                exam
                            )
                    )
                    .join("");


            bindExamCardEvents();

        } catch (error) {

            console.error(
                error
            );

            container.innerHTML = `

                <div class="empty-state">

                    ⚠️ تعذر تحميل الاختبارات.

                </div>

            `;

        }

    }


    /* =========================================================
       Render Exam Card
    ========================================================= */

    function renderExamCard(
        exam
    ) {

        const title =
            escapeHtml(
                exam.title ||
                exam.name ||
                "اختبار بدون عنوان"
            );


        const description =
            escapeHtml(
                exam.description ||
                "لا يوجد وصف للاختبار."
            );


        const subject =
            escapeHtml(
                exam.subject ||
                exam.subjectId ||
                "غير محدد"
            );


        const stage =
            escapeHtml(
                exam.stageId ||
                "كل المراحل"
            );


        const duration =
            exam.duration ||
            exam.durationMinutes ||
            0;


        const questions =
            Array.isArray(
                exam.questions
            )
                ? exam.questions.length
                : 0;


        const published =
            exam.isPublished !== false;


        return `

            <div class="exam-card">

                <div class="exam-card-header">

                    <h3>
                        ${title}
                    </h3>

                    <span
                        class="
                            status-badge
                            ${
                                published
                                    ? "status-published"
                                    : "status-hidden"
                            }
                        "
                    >

                        ${
                            published
                                ? "منشور"
                                : "غير منشور"
                        }

                    </span>

                </div>


                <div class="exam-description">

                    ${description}

                </div>


                <div class="exam-meta">

                    <span>
                        📚 ${subject}
                    </span>

                    <span>
                        🎓 ${stage}
                    </span>

                    <span>
                        📋 ${questions} سؤال
                    </span>

                    ${
                        duration
                            ? `
                                <span>
                                    ⏱️ ${escapeHtml(
                                        String(
                                            duration
                                        )
                                    )} دقيقة
                                </span>
                            `
                            : ""
                    }

                </div>


                <div class="exam-actions">

                    <button
                        class="edit-button"
                        data-edit-exam="${escapeHtml(
                            exam.id
                        )}"
                    >
                        ✏️ تعديل
                    </button>


                    <button
                        class="delete-button"
                        data-delete-exam="${escapeHtml(
                            exam.id
                        )}"
                    >
                        🗑️ حذف
                    </button>

                </div>

            </div>

        `;

    }


    /* =========================================================
       Card Events
    ========================================================= */

    function bindExamCardEvents() {

        document
            .querySelectorAll(
                "[data-edit-exam]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            editExam(
                                button.dataset.editExam
                            );

                        }
                    );

                }
            );


        document
            .querySelectorAll(
                "[data-delete-exam]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            deleteExam(
                                button.dataset.deleteExam
                            );

                        }
                    );

                }
            );

    }


    /* =========================================================
       Open Create Modal
    ========================================================= */

    function openCreateModal() {

        editingExamId = null;

        document.getElementById(
            "modalTitle"
        ).textContent =
            "إضافة اختبار";


        document.getElementById(
            "examForm"
        ).reset();


        document.getElementById(
            "examPublished"
        ).checked =
            true;


        document.getElementById(
            "examId"
        ).value =
            "";


        document.getElementById(
            "questionsContainer"
        ).innerHTML =
            "";


        questionCounter = 0;


        addQuestion();


        document
            .getElementById(
                "examModal"
            )
            .classList
            .add(
                "active"
            );

    }


    /* =========================================================
       Edit Exam
    ========================================================= */

    async function editExam(
        examId
    ) {

        try {

            const snapshot =
                await getDoc(
                    doc(
                        db,
                        "exams",
                        examId
                    )
                );


            if (!snapshot.exists()) {

                showToast(
                    "الاختبار غير موجود.",
                    "error"
                );

                return;

            }


            const exam = {

                id:
                    snapshot.id,

                ...snapshot.data()

            };


            editingExamId =
                exam.id;


            document.getElementById(
                "modalTitle"
            ).textContent =
                "تعديل الاختبار";


            document.getElementById(
                "examId"
            ).value =
                exam.id;


            document.getElementById(
                "examTitle"
            ).value =
                exam.title ||
                exam.name ||
                "";


            document.getElementById(
                "examSubject"
            ).value =
                exam.subject ||
                exam.subjectId ||
                "";


            document.getElementById(
                "examStage"
            ).value =
                exam.stageId ||
                "";


            document.getElementById(
                "examDuration"
            ).value =
                exam.duration ||
                exam.durationMinutes ||
                "";


            document.getElementById(
                "examDescription"
            ).value =
                exam.description ||
                "";


            document.getElementById(
                "examPublished"
            ).checked =
                exam.isPublished !== false;


            const container =
                document.getElementById(
                    "questionsContainer"
                );


            container.innerHTML =
                "";


            questionCounter =
                0;


            const questions =
                Array.isArray(
                    exam.questions
                )
                    ? exam.questions
                    : [];


            if (!questions.length) {

                addQuestion();

            } else {

                questions.forEach(
                    question =>
                        addQuestion(
                            question
                        )
                );

            }


            document
                .getElementById(
                    "examModal"
                )
                .classList
                .add(
                    "active"
                );

        } catch (error) {

            console.error(
                error
            );

            showToast(
                "تعذر فتح الاختبار.",
                "error"
            );

        }

    }


    /* =========================================================
       Add Question
    ========================================================= */

    function addQuestion(
        question = null
    ) {

        questionCounter++;


        const questionId =
            String(
                question?.id ||
                `q${questionCounter}`
            );


        const text =
            question?.text ||
            question?.question ||
            "";


        const options =
            normalizeOptions(
                question?.options
            );


        const correct =
            String(
                question?.correctAnswer ??
                question?.answer ??
                question?.correct ??
                question?.correctOption ??
                question?.correctOptionId ??
                ""
            );


        const container =
            document.getElementById(
                "questionsContainer"
            );


        const editor =
            document.createElement(
                "div"
            );


        editor.className =
            "question-editor";


        editor.dataset.questionId =
            questionId;


        editor.innerHTML = `

            <div class="question-editor-header">

                <strong>
                    السؤال
                    ${questionCounter}
                </strong>

                <button
                    type="button"
                    class="remove-question"
                >
                    🗑️ حذف السؤال
                </button>

            </div>


            <div class="question-text-input">

                <input
                    type="text"
                    class="question-text"
                    placeholder="اكتب نص السؤال..."
                    value="${escapeAttribute(
                        text
                    )}"
                >

            </div>


            <div class="options-grid">

                ${renderOptionEditor(
                    questionId,
                    "0",
                    options[0]?.text || "",
                    correct
                )}

                ${renderOptionEditor(
                    questionId,
                    "1",
                    options[1]?.text || "",
                    correct
                )}

                ${renderOptionEditor(
                    questionId,
                    "2",
                    options[2]?.text || "",
                    correct
                )}

                ${renderOptionEditor(
                    questionId,
                    "3",
                    options[3]?.text || "",
                    correct
                )}

            </div>

        `;


        editor
            .querySelector(
                ".remove-question"
            )
            .addEventListener(
                "click",
                () => {

                    editor.remove();

                    refreshQuestionNumbers();

                }
            );


        container.appendChild(
            editor
        );


        refreshQuestionNumbers();

    }


    /* =========================================================
       Option Editor
    ========================================================= */

    function renderOptionEditor(
        questionId,
        optionId,
        text,
        correct
    ) {

        return `

            <div class="option-editor">

                <input
                    type="radio"
                    name="correct-${escapeAttribute(
                        questionId
                    )}"
                    value="${optionId}"
                    ${
                        String(
                            correct
                        ) ===
                        String(
                            optionId
                        )
                            ? "checked"
                            : ""
                    }
                >

                <span class="correct-label">
                    ${
                        String.fromCharCode(
                            65 +
                            Number(
                                optionId
                            )
                        )
                    }
                </span>

                <input
                    type="text"
                    class="option-text"
                    placeholder="نص الاختيار"
                    value="${escapeAttribute(
                        text
                    )}"
                >

            </div>

        `;

    }


    /* =========================================================
       Refresh Question Numbers
    ========================================================= */

    function refreshQuestionNumbers() {

        document
            .querySelectorAll(
                "#questionsContainer .question-editor"
            )
            .forEach(
                (
                    editor,
                    index
                ) => {

                    const title =
                        editor.querySelector(
                            ".question-editor-header strong"
                        );

                    if (title) {

                        title.textContent =
                            `السؤال ${index + 1}`;

                    }

                }
            );

    }


    /* =========================================================
       Save Exam
    ========================================================= */

    async function saveExam(
        event
    ) {

        event.preventDefault();


        const saveButton =
            document.getElementById(
                "saveButton"
            );


        saveButton.disabled =
            true;


        try {

            const title =
                document.getElementById(
                    "examTitle"
                ).value.trim();


            const subject =
                document.getElementById(
                    "examSubject"
                ).value.trim();


            const stageId =
                document.getElementById(
                    "examStage"
                ).value.trim();


            const duration =
                Number(
                    document.getElementById(
                        "examDuration"
                    ).value
                ) || 0;


            const description =
                document.getElementById(
                    "examDescription"
                ).value.trim();


            const isPublished =
                document.getElementById(
                    "examPublished"
                ).checked;


            if (!title) {

                throw new Error(
                    "يجب كتابة عنوان الاختبار."
                );

            }


            const questions =
                collectQuestions();


            if (!questions.length) {

                throw new Error(
                    "يجب إضافة سؤال واحد على الأقل."
                );

            }


            /* ================================================
               نفس الـSchema الذي يقرأه student/exam.html
            ================================================= */

            const examData = {

                title:

                    title,


                description:

                    description,


                subject:

                    subject,


                stageId:

                    stageId,


                duration:

                    duration,


                durationMinutes:

                    duration,


                isPublished:

                    isPublished,


                questions:

                    questions,


                updatedAt:

                    serverTimestamp()

            };


            if (editingExamId) {

                await updateDoc(

                    doc(
                        db,
                        "exams",
                        editingExamId
                    ),

                    examData

                );


                showToast(
                    "تم تحديث الاختبار بنجاح.",
                    "success"
                );

            } else {

                examData.createdAt =
                    serverTimestamp();


                examData.createdBy =
                    admin?.data?.uid ||
                    admin?.uid ||
                    "";


                await addDoc(

                    collection(
                        db,
                        "exams"
                    ),

                    examData

                );


                showToast(
                    "تم إنشاء الاختبار بنجاح.",
                    "success"
                );

            }


            closeModal();

            await loadExams();

        } catch (error) {

            console.error(
                "Save exam error:",
                error
            );


            showToast(
                error.message ||
                "حدث خطأ أثناء حفظ الاختبار.",
                "error"
            );

        } finally {

            saveButton.disabled =
                false;

        }

    }


    /* =========================================================
       Collect Questions
    ========================================================= */

    function collectQuestions() {

        const editors =
            document.querySelectorAll(
                "#questionsContainer .question-editor"
            );


        const questions = [];


        editors.forEach(
            (
                editor,
                index
            ) => {

                const questionText =
                    editor
                        .querySelector(
                            ".question-text"
                        )
                        .value
                        .trim();


                if (!questionText) {

                    return;

                }


                const optionInputs =
                    editor.querySelectorAll(
                        ".option-text"
                    );


                const radio =
                    editor.querySelector(
                        'input[type="radio"]:checked'
                    );


                const options = [];


                optionInputs.forEach(
                    (
                        input,
                        optionIndex
                    ) => {

                        const text =
                            input.value.trim();


                        if (text) {

                            options.push({

                                id:
                                    String(
                                        optionIndex
                                    ),

                                text:
                                    text

                            });

                        }

                    }
                );


                if (options.length < 2) {

                    throw new Error(
                        `السؤال ${index + 1} يجب أن يحتوي على اختيارين على الأقل.`
                    );

                }


                if (!radio) {

                    throw new Error(
                        `يجب تحديد الإجابة الصحيحة للسؤال ${index + 1}.`
                    );

                }


                const correctOption =
                    radio.value;


                questions.push({

                    id:
                        String(
                            editor.dataset.questionId ||
                            `q${index + 1}`
                        ),

                    text:
                        questionText,

                    options:
                        options,

                    correctAnswer:
                        correctOption

                });

            }
        );


        return questions;

    }


    /* =========================================================
       Delete Exam
    ========================================================= */

    async function deleteExam(
        examId
    ) {

        const confirmed =
            window.confirm(
                "هل أنت متأكد من حذف هذا الاختبار؟\n\nسيتم حذف Document الاختبار نفسه."
            );


        if (!confirmed) {

            return;

        }


        try {

            await deleteDoc(
                doc(
                    db,
                    "exams",
                    examId
                )
            );


            showToast(
                "تم حذف الاختبار.",
                "success"
            );


            await loadExams();

        } catch (error) {

            console.error(
                error
            );

            showToast(
                "تعذر حذف الاختبار.",
                "error"
            );

        }

    }


    /* =========================================================
       Close Modal
    ========================================================= */

    function closeModal() {

        document
            .getElementById(
                "examModal"
            )
            .classList
            .remove(
                "active"
            );

        editingExamId =
            null;

    }


    /* =========================================================
       Normalize Options
    ========================================================= */

    function normalizeOptions(
        options
    ) {

        if (
            !Array.isArray(
                options
            )
        ) {

            return [];

        }


        return options.map(
            (
                option,
                index
            ) => {

                if (
                    typeof option ===
                    "object"
                ) {

                    return {

                        id:
                            String(
                                option.id ??
                                option.value ??
                                option.key ??
                                index
                            ),

                        text:
                            String(
                                option.text ??
                                option.label ??
                                option.value ??
                                ""
                            )

                    };

                }


                return {

                    id:
                        String(
                            index
                        ),

                    text:
                        String(
                            option
                        )

                };

            }
        );

    }


    /* =========================================================
       Escape Helpers
    ========================================================= */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    function escapeAttribute(
        value
    ) {

        return escapeHtml(
            value
        );

    }


    /* =========================================================
       Toast
    ========================================================= */

    let toastTimer = null;


    function showToast(
        message,
        type = "success"
    ) {

        const toast =
            document.getElementById(
                "toast"
            );


        toast.textContent =
            message;


        toast.className =
            `toast ${type}`;


        toast.style.display =
            "block";


        clearTimeout(
            toastTimer
        );


        toastTimer =
            setTimeout(
                () => {

                    toast.style.display =
                        "none";

                },
                3000
            );

    }

</script>
