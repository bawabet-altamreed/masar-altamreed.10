<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        جدول المحاضرات | مسار التمريض
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f3f8fb;
            color: #17324a;
        }

        .student-app {
            min-height: 100vh;
            display: flex;
        }

        /* =========================
           Sidebar
        ========================= */

        .student-sidebar {
            width: 250px;
            background: #fff;
            border-left: 1px solid #e3edf2;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
        }

        .student-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .student-brand-icon {
            width: 45px;
            height: 45px;
            border-radius: 13px;
            background: #087ea4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .student-brand strong {
            display: block;
            font-size: 15px;
        }

        .student-brand small {
            display: block;
            color: #82919d;
            margin-top: 3px;
            font-size: 10px;
            direction: ltr;
        }

        .student-user {
            background: #f4f9fb;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .student-avatar,
        .header-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #087ea4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .student-user strong {
            display: block;
            font-size: 12px;
        }

        .student-user small {
            display: block;
            color: #82919d;
            margin-top: 4px;
            font-size: 10px;
        }

        .student-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .student-nav a {
            text-decoration: none;
            color: #60717f;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        .student-nav a:hover,
        .student-nav a.active {
            background: #eaf7fb;
            color: #087ea4;
        }

        .student-logout {
            margin-top: auto;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #fff1f1;
            color: #b42318;
            cursor: pointer;
            font-weight: bold;
        }

        /* =========================
           Main
        ========================= */

        .student-main {
            flex: 1;
            margin-right: 250px;
        }

        .student-header {
            min-height: 82px;
            background: #fff;
            border-bottom: 1px solid #e3edf2;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .student-header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .student-header p {
            color: #81909c;
            font-size: 12px;
        }

        .student-header-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 12px;
        }

        .student-content {
            padding: 25px;
        }

        /* =========================
           Intro
        ========================= */

        .page-intro {
            background: linear-gradient(
                135deg,
                #087ea4,
                #075f7c
            );

            color: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .page-intro h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .page-intro p {
            font-size: 13px;
            opacity: .9;
            line-height: 1.8;
        }

        /* =========================
           Filters
        ========================= */

        .filters {
            background: white;
            border: 1px solid #e4edf2;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;

            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-input,
        .filter-select {
            height: 43px;
            border: 1px solid #d7e3eb;
            border-radius: 9px;
            padding: 0 12px;
            outline: none;
            font-size: 13px;
            background: white;
        }

        .filter-input {
            flex: 1;
            min-width: 220px;
        }

        .filter-select {
            min-width: 170px;
        }

        .filter-input:focus,
        .filter-select:focus {
            border-color: #087ea4;
        }

        /* =========================
           Grid
        ========================= */

        .lectures-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }

        /* =========================
           Lecture Card
        ========================= */

        .lecture-card {
            background: white;
            border: 1px solid #e4edf2;
            border-radius: 16px;
            padding: 20px;
            transition: .2s;
        }

        .lecture-card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 25px
                rgba(20, 60, 80, .06);
        }

        .lecture-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
        }

        .lecture-icon {
            width: 43px;
            height: 43px;
            border-radius: 12px;
            background: #eaf7fb;
            color: #087ea4;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
            flex-shrink: 0;
        }

        .lecture-title {
            flex: 1;
        }

        .lecture-title h3 {
            font-size: 15px;
            margin-bottom: 5px;
            line-height: 1.6;
        }

        .lecture-title p {
            color: #82919d;
            font-size: 11px;
        }

        /* =========================
           Status
        ========================= */

        .lecture-status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-scheduled {
            background: #eef8fb;
            color: #087ea4;
        }

        .status-live {
            background: #eaf8f0;
            color: #16834f;
        }

        .status-ended {
            background: #f1f3f5;
            color: #687783;
        }

        .status-cancelled {
            background: #fff1f1;
            color: #b42318;
        }

        /* =========================
           Details
        ========================= */

        .lecture-details {
            border-top: 1px solid #edf1f4;
            padding-top: 14px;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 10px;
            color: #617381;
            font-size: 12px;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .detail-icon {
            width: 24px;
            text-align: center;
        }

        .detail-row strong {
            color: #34495e;
        }

        /* =========================
           Description
        ========================= */

        .lecture-description {
            margin-top: 14px;
            padding: 11px;
            background: #f7fafc;
            border-radius: 9px;
            color: #687783;
            font-size: 11px;
            line-height: 1.8;
        }

        /* =========================
           Actions
        ========================= */

        .lecture-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .lecture-button {
            flex: 1;
            height: 40px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .live-button {
            background: #087ea4;
            color: white;
        }

        .live-button:hover {
            background: #066985;
        }

        .recording-button {
            background: #eef8fb;
            color: #087ea4;
        }

        .disabled-button {
            background: #edf1f4;
            color: #8795a0;
            cursor: not-allowed;
        }

        /* =========================
           Messages
        ========================= */

        .empty,
        .loading,
        .error-box {
            background: white;
            border: 1px solid #e4edf2;
            border-radius: 15px;
            padding: 45px 20px;
            text-align: center;
            font-size: 13px;
            line-height: 2;
            grid-column: 1 / -1;
        }

        .empty {
            color: #8795a0;
        }

        .loading {
            color: #087ea4;
        }

        .error-box {
            background: #fff1f1;
            border-color: #ffd5d5;
            color: #b42318;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 900px) {

            .student-sidebar {
                width: 210px;
            }

            .student-main {
                margin-right: 210px;
            }

            .lectures-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 650px) {

            .student-sidebar {
                position: static;
                width: 100%;
                min-height: auto;
            }

            .student-app {
                display: block;
            }

            .student-main {
                margin-right: 0;
            }

            .student-nav {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }

            .student-logout {
                margin-top: 15px;
            }

            .student-header {
                padding: 15px;
            }

            .student-content {
                padding: 15px;
            }

            .filters {
                flex-direction: column;
            }

            .filter-input,
            .filter-select {
                width: 100%;
                min-width: 0;
            }

        }

    </style>

</head>

<body>

<div
    id="studentApp"
    class="student-app"
>
    جاري تحميل المنصة...
</div>


<script type="module">

    import {
        protectStudentPage,
        createStudentLayout,
        getCollection,
        escapeHtml,
        formatDateTime,
        studentErrorMessage
    } from "../src/student/student.js";


    // =====================================================
    // Main
    // =====================================================

    async function startSchedule() {

        try {

            // -------------------------------------------------
            // حماية الطالب
            // -------------------------------------------------

            const {
                student
            } = await protectStudentPage();


            // -------------------------------------------------
            // إنشاء Layout
            // -------------------------------------------------

            createStudentLayout(
                student,
                "schedule"
            );


            document.getElementById(
                "studentPageTitle"
            ).textContent =
                "جدول المحاضرات";


            const content =
                document.getElementById(
                    "studentPageContent"
                );


            content.innerHTML = `

                <div class="page-intro">

                    <h2>
                        📅 جدول المحاضرات
                    </h2>

                    <p>
                        تابع محاضراتك ومواعيدها،
                        ويمكنك الدخول إلى البث المباشر
                        عند توفره.
                    </p>

                </div>


                <div class="filters">

                    <input
                        type="search"
                        id="lectureSearch"
                        class="filter-input"
                        placeholder="ابحث عن محاضرة أو مادة أو مدرس..."
                    >


                    <select
                        id="statusFilter"
                        class="filter-select"
                    >

                        <option value="all">
                            كل المحاضرات
                        </option>

                        <option value="scheduled">
                            المحاضرات القادمة
                        </option>

                        <option value="live">
                            مباشر الآن
                        </option>

                        <option value="ended">
                            المحاضرات المنتهية
                        </option>

                        <option value="cancelled">
                            المحاضرات الملغاة
                        </option>

                    </select>

                </div>


                <div
                    id="lecturesContainer"
                    class="lectures-grid"
                >

                    <div class="loading">
                        ⏳ جاري تحميل المحاضرات...
                    </div>

                </div>

            `;


            const container =
                document.getElementById(
                    "lecturesContainer"
                );


            const searchInput =
                document.getElementById(
                    "lectureSearch"
                );


            const statusFilter =
                document.getElementById(
                    "statusFilter"
                );


            // -------------------------------------------------
            // قراءة lectures
            // -------------------------------------------------

            let lectures = [];


            try {

                lectures =
                    await getCollection(
                        "lectures"
                    );

            } catch (error) {

                console.error(
                    "Firestore lectures error:",
                    error
                );


                container.innerHTML = `

                    <div class="error-box">

                        ⚠️ حدث خطأ أثناء تحميل
                        جدول المحاضرات.

                        <br><br>

                        ${escapeHtml(
                            studentErrorMessage(error)
                        )}

                    </div>

                `;

                return;

            }


            // -------------------------------------------------
            // فلترة محاضرات الطالب
            // -------------------------------------------------

            const studentLectures =
                lectures

                    .filter(lecture => {

                        // المرحلة
                        if (
                            lecture.stageId &&
                            String(
                                lecture.stageId
                            ) !==
                            String(
                                student.stageId
                            )
                        ) {

                            return false;

                        }


                        // غير منشورة
                        if (
                            lecture.isPublished ===
                            false
                        ) {

                            return false;

                        }


                        // محاضرة خاصة لطالب آخر
                        if (
                            lecture.userId &&
                            lecture.userId !==
                            student.id
                        ) {

                            return false;

                        }


                        return true;

                    })

                    .map(lecture => {

                        return {
                            ...lecture,

                            _date:
                                lecture.scheduledAt ||
                                lecture.startAt ||
                                lecture.date ||
                                null

                        };

                    })

                    .sort((a, b) => {

                        return (
                            getTimestamp(a._date) -
                            getTimestamp(b._date)
                        );

                    });


            // -------------------------------------------------
            // Render
            // -------------------------------------------------

            renderLectures();


            searchInput.addEventListener(
                "input",
                renderLectures
            );


            statusFilter.addEventListener(
                "change",
                renderLectures
            );


            // =================================================
            // Render Lectures
            // =================================================

            function renderLectures() {

                const search =
                    searchInput.value
                        .trim()
                        .toLowerCase();


                const selectedStatus =
                    statusFilter.value;


                const filtered =
                    studentLectures.filter(
                        lecture => {

                            const title =
                                String(
                                    lecture.title ||
                                    lecture.name ||
                                    ""
                                ).toLowerCase();


                            const subject =
                                String(
                                    lecture.subjectName ||
                                    lecture.subject ||
                                    lecture.subjectId ||
                                    ""
                                ).toLowerCase();


                            const teacher =
                                String(
                                    lecture.teacherName ||
                                    lecture.teacher ||
                                    lecture.teacherId ||
                                    ""
                                ).toLowerCase();


                            const matchesSearch =
                                !search ||
                                title.includes(search) ||
                                subject.includes(search) ||
                                teacher.includes(search);


                            const status =
                                getLectureStatus(
                                    lecture
                                );


                            const matchesStatus =
                                selectedStatus === "all" ||
                                status === selectedStatus;


                            return (
                                matchesSearch &&
                                matchesStatus
                            );

                        }
                    );


                if (!filtered.length) {

                    container.innerHTML = `

                        <div class="empty">

                            📅

                            <br>

                            لا توجد محاضرات
                            مطابقة حاليًا.

                        </div>

                    `;

                    return;

                }


                container.innerHTML =
                    filtered
                        .map(
                            lecture =>
                                createLectureCard(
                                    lecture
                                )
                        )
                        .join("");

            }


            // =================================================
            // Lecture Card
            // =================================================

            function createLectureCard(
                lecture
            ) {

                const status =
                    getLectureStatus(
                        lecture
                    );


                const statusInfo =
                    getStatusInfo(
                        status
                    );


                const title =
                    lecture.title ||
                    lecture.name ||
                    "محاضرة";


                const subject =
                    lecture.subjectName ||
                    lecture.subject ||
                    lecture.subjectId ||
                    "غير محدد";


                const teacher =
                    lecture.teacherName ||
                    lecture.teacher ||
                    lecture.teacherId ||
                    "غير محدد";


                const date =
                    lecture._date;


                const description =
                    lecture.description ||
                    "";


                const liveUrl =
                    lecture.liveUrl ||
                    lecture.meetingUrl ||
                    "";


                const recordingUrl =
                    lecture.recordingUrl ||
                    "";


                let action = "";


                if (
                    status === "live" &&
                    liveUrl
                ) {

                    action = `

                        <a
                            class="lecture-button live-button"
                            href="${escapeHtml(liveUrl)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            🔴 دخول المحاضرة
                        </a>

                    `;

                } else if (
                    status === "live"
                ) {

                    action = `

                        <button
                            class="lecture-button disabled-button"
                            disabled
                        >
                            🔴 البث غير متاح
                        </button>

                    `;

                } else if (
                    status === "ended" &&
                    recordingUrl
                ) {

                    action = `

                        <a
                            class="lecture-button recording-button"
                            href="${escapeHtml(recordingUrl)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ▶️ مشاهدة التسجيل
                        </a>

                    `;

                } else if (
                    status === "cancelled"
                ) {

                    action = `

                        <button
                            class="lecture-button disabled-button"
                            disabled
                        >
                            المحاضرة ملغاة
                        </button>

                    `;

                } else {

                    action = `

                        <button
                            class="lecture-button disabled-button"
                            disabled
                        >
                            ⏳ لم يبدأ البث بعد
                        </button>

                    `;

                }


                return `

                    <article class="lecture-card">

                        <div class="lecture-top">

                            <div class="lecture-icon">
                                🎥
                            </div>


                            <div class="lecture-title">

                                <h3>
                                    ${escapeHtml(title)}
                                </h3>

                                <p>
                                    ${escapeHtml(subject)}
                                </p>

                            </div>


                            <span
                                class="lecture-status ${statusInfo.className}"
                            >
                                ${statusInfo.label}
                            </span>

                        </div>


                        <div class="lecture-details">

                            <div class="detail-row">

                                <span class="detail-icon">
                                    📚
                                </span>

                                <span>
                                    المادة:
                                    <strong>
                                        ${escapeHtml(subject)}
                                    </strong>
                                </span>

                            </div>


                            <div class="detail-row">

                                <span class="detail-icon">
                                    👨‍🏫
                                </span>

                                <span>
                                    المدرس:
                                    <strong>
                                        ${escapeHtml(teacher)}
                                    </strong>
                                </span>

                            </div>


                            <div class="detail-row">

                                <span class="detail-icon">
                                    🕒
                                </span>

                                <span>
                                    الموعد:
                                    <strong>
                                        ${escapeHtml(
                                            formatLectureDate(
                                                date
                                            )
                                        )}
                                    </strong>
                                </span>

                            </div>

                        </div>


                        ${
                            description
                                ? `

                                    <div class="lecture-description">

                                        ${escapeHtml(
                                            description
                                        )}

                                    </div>

                                `
                                : ""
                        }


                        <div class="lecture-actions">

                            ${action}

                        </div>

                    </article>

                `;

            }


            // =================================================
            // Timestamp
            // =================================================

            function getTimestamp(
                value
            ) {

                if (!value) {
                    return Number.MAX_SAFE_INTEGER;
                }


                try {

                    if (
                        typeof value.toDate ===
                        "function"
                    ) {

                        return value
                            .toDate()
                            .getTime();

                    }


                    if (
                        value instanceof Date
                    ) {

                        return value.getTime();

                    }


                    if (
                        typeof value ===
                        "number"
                    ) {

                        return value;

                    }


                    const date =
                        new Date(value);


                    const time =
                        date.getTime();


                    return isNaN(time)
                        ? Number.MAX_SAFE_INTEGER
                        : time;

                } catch {

                    return Number.MAX_SAFE_INTEGER;

                }

            }


            // =================================================
            // Format Date
            // =================================================

            function formatLectureDate(
                value
            ) {

                if (!value) {
                    return "غير محدد";
                }


                const result =
                    formatDateTime(value);


                return result === "—"
                    ? "غير محدد"
                    : result;

            }


            // =================================================
            // Status
            // =================================================

            function getLectureStatus(
                lecture
            ) {

                // الإدارة تستطيع تحديد الحالة
                if (
                    lecture.status
                ) {

                    const manualStatus =
                        String(
                            lecture.status
                        )
                        .trim()
                        .toLowerCase();


                    if (
                        [
                            "scheduled",
                            "live",
                            "ended",
                            "cancelled"
                        ].includes(
                            manualStatus
                        )
                    ) {

                        return manualStatus;

                    }

                }


                const start =
                    getTimestamp(
                        lecture._date
                    );


                if (
                    start ===
                    Number.MAX_SAFE_INTEGER
                ) {

                    return "scheduled";

                }


                const now =
                    Date.now();


                // نهاية محددة
                if (
                    lecture.endAt
                ) {

                    const end =
                        getTimestamp(
                            lecture.endAt
                        );


                    if (
                        now < start
                    ) {

                        return "scheduled";

                    }


                    if (
                        now >= start &&
                        now <= end
                    ) {

                        return "live";

                    }


                    if (
                        now > end
                    ) {

                        return "ended";

                    }

                }


                // مدة المحاضرة الافتراضية
                // ساعتان
                const defaultEnd =
                    start +
                    (
                        2 *
                        60 *
                        60 *
                        1000
                    );


                if (
                    now < start
                ) {

                    return "scheduled";

                }


                if (
                    now <= defaultEnd
                ) {

                    return "live";

                }


                return "ended";

            }


            // =================================================
            // Status Info
            // =================================================

            function getStatusInfo(
                status
            ) {

                switch (status) {

                    case "live":

                        return {
                            label:
                                "مباشر الآن",

                            className:
                                "status-live"
                        };


                    case "ended":

                        return {
                            label:
                                "انتهت",

                            className:
                                "status-ended"
                        };


                    case "cancelled":

                        return {
                            label:
                                "ملغاة",

                            className:
                                "status-cancelled"
                        };


                    default:

                        return {
                            label:
                                "قادمة",

                            className:
                                "status-scheduled"
                        };

                }

            }

        } catch (error) {

            console.error(
                "Student schedule error:",
                error
            );


            const app =
                document.getElementById(
                    "studentApp"
                );


            if (app) {

                app.innerHTML = `

                    <div
                        style="
                            width:100%;
                            min-height:100vh;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            padding:20px;
                            text-align:center;
                            font-family:Arial,Tahoma,sans-serif;
                            color:#b42318;
                        "
                    >

                        حدث خطأ أثناء تحميل
                        جدول المحاضرات.

                        <br><br>

                        ${escapeHtml(
                            studentErrorMessage(
                                error
                            )
                        )}

                    </div>

                `;

            }

        }

    }


    startSchedule();

</script>

</body>

</html>
