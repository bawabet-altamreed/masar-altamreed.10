<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        جدول المحاضرات | مسار التمريض
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Tahoma,
                sans-serif;

            background: #f3f8fb;
            color: #17324a;
        }

        .student-app {
            min-height: 100vh;
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .student-sidebar {
            width: 250px;
            background: #ffffff;
            border-left: 1px solid #e3edf2;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
        }

        .student-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .student-brand-icon {
            width: 45px;
            height: 45px;
            border-radius: 13px;
            background: #087ea4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .student-brand strong {
            display: block;
            font-size: 15px;
        }

        .student-brand small {
            display: block;
            color: #82919d;
            margin-top: 3px;
            font-size: 10px;
            direction: ltr;
        }

        .student-user {
            background: #f4f9fb;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .student-avatar,
        .header-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #087ea4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .student-user strong {
            display: block;
            font-size: 12px;
        }

        .student-user small {
            display: block;
            color: #82919d;
            margin-top: 4px;
            font-size: 10px;
        }

        .student-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .student-nav a {
            text-decoration: none;
            color: #60717f;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        .student-nav a:hover,
        .student-nav a.active {
            background: #eaf7fb;
            color: #087ea4;
        }

        .student-logout {
            margin-top: auto;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #fff1f1;
            color: #b42318;
            cursor: pointer;
            font-weight: bold;
        }

        /* =========================
           MAIN
        ========================= */

        .student-main {
            flex: 1;
            margin-right: 250px;
        }

        .student-header {
            min-height: 82px;
            background: #ffffff;
            border-bottom: 1px solid #e3edf2;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .student-header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .student-header p {
            color: #81909c;
            font-size: 12px;
        }

        .student-header-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 12px;
        }

        .student-content {
            padding: 25px;
        }

        /* =========================
           INTRO
        ========================= */

        .page-intro {
            background: linear-gradient(
                135deg,
                #087ea4,
                #075f7c
            );

            color: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .page-intro h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .page-intro p {
            font-size: 13px;
            opacity: .9;
            line-height: 1.8;
        }

        /* =========================
           FILTERS
        ========================= */

        .filters {
            background: #ffffff;
            border: 1px solid #e4edf2;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-input,
        .filter-select {
            height: 43px;
            border: 1px solid #d7e3eb;
            border-radius: 9px;
            padding: 0 12px;
            outline: none;
            font-size: 13px;
            background: #ffffff;
        }

        .filter-input {
            flex: 1;
            min-width: 220px;
        }

        .filter-select {
            min-width: 170px;
        }

        /* =========================
           LECTURES GRID
        ========================= */

        .lectures-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }

        .lecture-card {
            background: #ffffff;
            border: 1px solid #e4edf2;
            border-radius: 16px;
            padding: 20px;
        }

        .lecture-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
        }

        .lecture-icon {
            width: 43px;
            height: 43px;
            border-radius: 12px;
            background: #eaf7fb;
            color: #087ea4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            flex-shrink: 0;
        }

        .lecture-title {
            flex: 1;
        }

        .lecture-title h3 {
            font-size: 15px;
            margin-bottom: 5px;
            line-height: 1.6;
        }

        .lecture-title p {
            color: #82919d;
            font-size: 11px;
        }

        /* =========================
           STATUS
        ========================= */

        .lecture-status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-upcoming {
            background: #eef8fb;
            color: #087ea4;
        }

        .status-live {
            background: #eaf8f0;
            color: #16834f;
        }

        .status-ended {
            background: #f1f3f5;
            color: #687783;
        }

        /* =========================
           DETAILS
        ========================= */

        .lecture-details {
            border-top: 1px solid #edf1f4;
            padding-top: 14px;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 10px;
            color: #617381;
            font-size: 12px;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .detail-icon {
            width: 24px;
            text-align: center;
        }

        .detail-row strong {
            color: #34495e;
        }

        /* =========================
           ACTIONS
        ========================= */

        .lecture-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .lecture-button {
            flex: 1;
            min-height: 40px;
            border: none;
            border-radius: 9px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .live-button {
            background: #087ea4;
            color: #ffffff;
        }

        .recording-button {
            background: #eef8fb;
            color: #087ea4;
        }

        .disabled-button {
            background: #edf1f4;
            color: #8795a0;
        }

        /* =========================
           EMPTY / LOADING / ERROR
        ========================= */

        .empty,
        .loading,
        .error-box {
            background: #ffffff;
            border: 1px solid #e4edf2;
            border-radius: 15px;
            padding: 45px 20px;
            text-align: center;
            font-size: 13px;
            line-height: 2;
            grid-column: 1 / -1;
        }

        .empty {
            color: #8795a0;
        }

        .loading {
            color: #087ea4;
        }

        .error-box {
            background: #fff1f1;
            border-color: #ffd5d5;
            color: #b42318;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .student-sidebar {
                width: 210px;
            }

            .student-main {
                margin-right: 210px;
            }

            .lectures-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 650px) {

            .student-app {
                display: block;
            }

            .student-sidebar {
                position: static;
                width: 100%;
                min-height: auto;
            }

            .student-main {
                margin-right: 0;
            }

            .student-nav {
                display: grid;
                grid-template-columns:
                    repeat(3, 1fr);
            }

            .student-logout {
                margin-top: 15px;
            }

            .student-header {
                padding: 15px;
            }

            .student-content {
                padding: 15px;
            }

            .filters {
                flex-direction: column;
            }

            .filter-input,
            .filter-select {
                width: 100%;
                min-width: 0;
            }

            .lecture-top {
                flex-wrap: wrap;
            }

        }

    </style>

</head>

<body>

<div
    id="studentApp"
    class="student-app"
>
    جاري تحميل المنصة...
</div>


<script type="module">

    import {
        protectStudentPage,
        createStudentLayout,
        escapeHtml,
        formatDateTime,
        studentErrorMessage
    } from "../src/student/student.js";


    import {
        db
    } from "../src/firebase/init.js";


    import {
        collection,
        query,
        where,
        getDocs,
        doc,
        getDoc
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =====================================================
       STATE
    ===================================================== */

    let student = null;

    let lectures = [];

    const subjectsCache =
        new Map();


    /* =====================================================
       FIREBASE DATE
    ===================================================== */

    function getDateValue(value) {

        if (!value) {
            return null;
        }


        if (
            typeof value.toDate ===
            "function"
        ) {

            return value.toDate();

        }


        if (
            value instanceof Date
        ) {

            return value;

        }


        const date =
            new Date(value);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return null;

        }


        return date;

    }


    function getTime(value) {

        const date =
            getDateValue(value);


        return date
            ? date.getTime()
            : 0;

    }


    /* =====================================================
       SUBJECT
    ===================================================== */

    async function getSubjectName(
        subjectId
    ) {

        if (!subjectId) {

            return "غير محدد";

        }


        if (
            subjectsCache.has(
                subjectId
            )
        ) {

            return subjectsCache.get(
                subjectId
            );

        }


        try {

            const subjectRef =
                doc(
                    db,
                    "subjects",
                    subjectId
                );


            const subjectSnap =
                await getDoc(
                    subjectRef
                );


            if (
                subjectSnap.exists()
            ) {

                const data =
                    subjectSnap.data();


                const name =
                    data.name ||
                    data.title ||
                    "غير محدد";


                subjectsCache.set(
                    subjectId,
                    name
                );


                return name;

            }

        } catch (error) {

            console.warn(
                "Subject loading error:",
                error
            );

        }


        return "غير محدد";

    }


    /* =====================================================
       LECTURE STATUS
       يعتمد فقط على date + isLive
    ===================================================== */

    function getLectureStatus(
        lecture
    ) {

        if (
            lecture.isLive === true
        ) {

            return "live";

        }


        const date =
            getDateValue(
                lecture.date
            );


        if (!date) {

            return "upcoming";

        }


        if (
            date.getTime() <=
            Date.now()
        ) {

            return "ended";

        }


        return "upcoming";

    }


    function getStatusInfo(
        status
    ) {

        if (
            status === "live"
        ) {

            return {

                label: "مباشر الآن",

                className:
                    "status-live"

            };

        }


        if (
            status === "ended"
        ) {

            return {

                label: "انتهت",

                className:
                    "status-ended"

            };

        }


        return {

            label: "قادمة",

            className:
                "status-upcoming"

        };

    }


    /* =====================================================
       LOAD LECTURES
    ===================================================== */

    async function loadLectures() {

        const lecturesQuery =
            query(

                collection(
                    db,
                    "lectures"
                ),

                where(
                    "stageId",
                    "==",
                    student.stageId
                ),

                where(
                    "isPublished",
                    "==",
                    true
                )

            );


        const snapshot =
            await getDocs(
                lecturesQuery
            );


        lectures =
            snapshot.docs
                .map(
                    lectureDoc => ({

                        id:
                            lectureDoc.id,

                        ...lectureDoc.data()

                    })
                );


        lectures.sort(
            (a, b) =>
                getTime(a.date) -
                getTime(b.date)
        );


        /*
         * تحميل أسماء المواد
         * من subjects/{subjectId}
         */

        const subjectIds =
            [
                ...new Set(
                    lectures
                        .map(
                            lecture =>
                                lecture.subjectId
                        )
                        .filter(Boolean)
                )
            ];


        await Promise.all(
            subjectIds.map(
                subjectId =>
                    getSubjectName(
                        subjectId
                    )
            )
        );

    }


    /* =====================================================
       FILTER
    ===================================================== */

    function matchesSearch(
        lecture,
        search
    ) {

        if (!search) {

            return true;

        }


        const title =
            String(
                lecture.title ||
                ""
            ).toLowerCase();


        const teacher =
            String(
                lecture.teacherName ||
                ""
            ).toLowerCase();


        const subject =
            String(
                subjectsCache.get(
                    lecture.subjectId
                ) ||
                ""
            ).toLowerCase();


        return (
            title.includes(search) ||
            teacher.includes(search) ||
            subject.includes(search)
        );

    }


    /* =====================================================
       CARD
    ===================================================== */

    function createLectureCard(
        lecture
    ) {

        const status =
            getLectureStatus(
                lecture
            );


        const statusInfo =
            getStatusInfo(
                status
            );


        const title =
            lecture.title ||
            "محاضرة";


        const subject =
            subjectsCache.get(
                lecture.subjectId
            ) ||
            "غير محدد";


        const teacher =
            lecture.teacherName ||
            "غير محدد";


        const date =
            getDateValue(
                lecture.date
            );


        const dateText =
            date
                ? formatDateTime(date)
                : "الموعد غير محدد";


        const recordingUrl =
            lecture.recordingUrl ||
            "";


        const recordingStatus =
            lecture.recordingStatus ||
            "pending";


        const roomName =
            lecture.roomName ||
            "";


        let actionHtml = "";


        /* =========================
           LIVE
        ========================= */

        if (
            status === "live" &&
            roomName
        ) {

            /*
             * roomName موجود في الـSchema.
             *
             * الدخول الفعلي لـLiveKit يحتاج
             * صفحة/واجهة LiveKit في المشروع.
             *
             * لا نستخدم liveUrl لأنه غير موجود
             * في الـSchema الجديدة.
             */

            actionHtml = `

                <div
                    class="
                        lecture-button
                        live-button
                    "
                    title="غرفة المحاضرة: ${escapeHtml(roomName)}"
                >
                    🔴 مباشر الآن
                </div>

            `;

        }

        /* =========================
           LIVE WITHOUT ROOM
        ========================= */

        else if (
            status === "live"
        ) {

            actionHtml = `

                <div
                    class="
                        lecture-button
                        disabled-button
                    "
                >
                    🔴 البث غير متاح
                </div>

            `;

        }

        /* =========================
           RECORDING
        ========================= */

        else if (
            recordingUrl &&
            recordingStatus === "ready"
        ) {

            actionHtml = `

                <a
                    class="
                        lecture-button
                        recording-button
                    "
                    href="${escapeHtml(recordingUrl)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ▶️ مشاهدة التسجيل
                </a>

            `;

        }

        /* =========================
           UPCOMING
        ========================= */

        else if (
            status === "upcoming"
        ) {

            actionHtml = `

                <div
                    class="
                        lecture-button
                        disabled-button
                    "
                >
                    🕒 لم تبدأ بعد
                </div>

            `;

        }

        /* =========================
           ENDED WITHOUT RECORDING
        ========================= */

        else {

            actionHtml = `

                <div
                    class="
                        lecture-button
                        disabled-button
                    "
                >
                    لا يوجد تسجيل حاليًا
                </div>

            `;

        }


        return `

            <article
                class="lecture-card"
            >

                <div
                    class="lecture-top"
                >

                    <div
                        class="lecture-icon"
                    >
                        📚
                    </div>


                    <div
                        class="lecture-title"
                    >

                        <h3>
                            ${escapeHtml(title)}
                        </h3>

                        <p>
                            ${escapeHtml(subject)}
                        </p>

                    </div>


                    <span
                        class="
                            lecture-status
                            ${statusInfo.className}
                        "
                    >
                        ${statusInfo.label}
                    </span>

                </div>


                <div
                    class="lecture-details"
                >

                    <div
                        class="detail-row"
                    >

                        <span
                            class="detail-icon"
                        >
                            📚
                        </span>

                        <span>
                            المادة:
                            <strong>
                                ${escapeHtml(subject)}
                            </strong>
                        </span>

                    </div>


                    <div
                        class="detail-row"
                    >

                        <span
                            class="detail-icon"
                        >
                            👨‍🏫
                        </span>

                        <span>
                            المدرس:
                            <strong>
                                ${escapeHtml(teacher)}
                            </strong>
                        </span>

                    </div>


                    <div
                        class="detail-row"
                    >

                        <span
                            class="detail-icon"
                        >
                            🕒
                        </span>

                        <span>
                            الموعد:
                            <strong>
                                ${escapeHtml(dateText)}
                            </strong>
                        </span>

                    </div>


                    ${
                        roomName
                            ? `

                                <div
                                    class="detail-row"
                                >

                                    <span
                                        class="detail-icon"
                                    >
                                        🎥
                                    </span>

                                    <span>
                                        غرفة البث:
                                        <strong>
                                            ${escapeHtml(roomName)}
                                        </strong>
                                    </span>

                                </div>

                            `
                            : ""
                    }

                </div>


                <div
                    class="lecture-actions"
                >

                    ${actionHtml}

                </div>

            </article>

        `;

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderLectures() {

        const container =
            document.getElementById(
                "lecturesContainer"
            );


        const searchInput =
            document.getElementById(
                "lectureSearch"
            );


        const statusFilter =
            document.getElementById(
                "statusFilter"
            );


        const search =
            searchInput
                .value
                .trim()
                .toLowerCase();


        const selectedStatus =
            statusFilter.value;


        const filtered =
            lectures.filter(
                lecture => {

                    const status =
                        getLectureStatus(
                            lecture
                        );


                    const searchMatch =
                        matchesSearch(
                            lecture,
                            search
                        );


                    const statusMatch =
                        selectedStatus ===
                            "all" ||
                        selectedStatus ===
                            status;


                    return (
                        searchMatch &&
                        statusMatch
                    );

                }
            );


        if (
            filtered.length === 0
        ) {

            container.innerHTML = `

                <div
                    class="empty"
                >

                    📅

                    <br>

                    لا توجد محاضرات مطابقة حاليًا.

                </div>

            `;

            return;

        }


        container.innerHTML =
            filtered
                .map(
                    lecture =>
                        createLectureCard(
                            lecture
                        )
                )
                .join("");

    }


    /* =====================================================
       INIT
    ===================================================== */

    try {

        const result =
            await protectStudentPage();


        student =
            result.student;


        createStudentLayout(
            student,
            "schedule"
        );


        document.getElementById(
            "studentPageTitle"
        ).textContent =
            "جدول المحاضرات";


        const content =
            document.getElementById(
                "studentPageContent"
            );


        content.innerHTML = `

            <div
                class="page-intro"
            >

                <h2>
                    📅 جدول المحاضرات
                </h2>

                <p>
                    تابع مواعيد محاضراتك
                    والمحاضرات المباشرة
                    والتسجيلات المتاحة.
                </p>

            </div>


            <div
                class="filters"
            >

                <input
                    type="search"
                    id="lectureSearch"
                    class="filter-input"
                    placeholder="ابحث عن محاضرة أو مادة أو مدرس..."
                >


                <select
                    id="statusFilter"
                    class="filter-select"
                >

                    <option value="all">
                        كل المحاضرات
                    </option>

                    <option value="upcoming">
                        القادمة
                    </option>

                    <option value="live">
                        مباشر الآن
                    </option>

                    <option value="ended">
                        انتهت
                    </option>

                </select>

            </div>


            <div
                id="lecturesContainer"
                class="lectures-grid"
            >

                <div
                    class="loading"
                >
                    ⏳ جاري تحميل المحاضرات...
                </div>

            </div>

        `;


        const searchInput =
            document.getElementById(
                "lectureSearch"
            );


        const statusFilter =
            document.getElementById(
                "statusFilter"
            );


        searchInput.addEventListener(
            "input",
            renderLectures
        );


        statusFilter.addEventListener(
            "change",
            renderLectures
        );


        await loadLectures();


        renderLectures();


    } catch (error) {

        console.error(
            "Student schedule error:",
            error
        );


        const app =
            document.getElementById(
                "studentApp"
            );


        if (app) {

            app.innerHTML = `

                <div
                    style="
                        width:100%;
                        min-height:100vh;
                        display:flex;
                        align-items:center;
                        justify-content:center;
