<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        جدول المحاضرات | مسار التمريض
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f3f8fb;
            color: #17324a;
        }

        .student-app {
            min-height: 100vh;
            display: flex;
        }

        .student-sidebar {
            width: 250px;
            background: #ffffff;
            border-left: 1px solid #e3edf2;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
        }

        .student-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .student-brand-icon {
            width: 45px;
            height: 45px;
            border-radius: 13px;
            background: #087ea4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .student-brand strong {
            display: block;
            font-size: 15px;
        }

        .student-brand small {
            display: block;
            color: #82919d;
            margin-top: 3px;
            font-size: 10px;
            direction: ltr;
        }

        .student-user {
            background: #f4f9fb;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .student-avatar,
        .header-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #087ea4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .student-user strong {
            display: block;
            font-size: 12px;
        }

        .student-user small {
            display: block;
            color: #82919d;
            margin-top: 4px;
            font-size: 10px;
        }

        .student-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .student-nav a {
            text-decoration: none;
            color: #60717f;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        .student-nav a:hover,
        .student-nav a.active {
            background: #eaf7fb;
            color: #087ea4;
        }

        .student-logout {
            margin-top: auto;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #fff1f1;
            color: #b42318;
            cursor: pointer;
            font-weight: bold;
        }

        .student-main {
            flex: 1;
            margin-right: 250px;
        }

        .student-header {
            min-height: 82px;
            background: #ffffff;
            border-bottom: 1px solid #e3edf2;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .student-header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .student-header p {
            color: #81909c;
            font-size: 12px;
        }

        .student-header-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 12px;
        }

        .student-content {
            padding: 25px;
        }

        .page-intro {
            background: linear-gradient(
                135deg,
                #087ea4,
                #075f7c
            );
            color: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .page-intro h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .page-intro p {
            font-size: 13px;
            opacity: .9;
            line-height: 1.8;
        }

        .filters {
            background: #ffffff;
            border: 1px solid #e4edf2;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-input,
        .filter-select {
            height: 43px;
            border: 1px solid #d7e3eb;
            border-radius: 9px;
            padding: 0 12px;
            outline: none;
            font-size: 13px;
            background: #ffffff;
        }

        .filter-input {
            flex: 1;
            min-width: 220px;
        }

        .filter-select {
            min-width: 170px;
        }

        .lectures-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .lecture-card {
            background: #ffffff;
            border: 1px solid #e4edf2;
            border-radius: 16px;
            padding: 20px;
        }

        .lecture-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
        }

        .lecture-icon {
            width: 43px;
            height: 43px;
            border-radius: 12px;
            background: #eaf7fb;
            color: #087ea4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            flex-shrink: 0;
        }

        .lecture-title {
            flex: 1;
        }

        .lecture-title h3 {
            font-size: 15px;
            margin-bottom: 5px;
            line-height: 1.6;
        }

        .lecture-title p {
            color: #82919d;
            font-size: 11px;
        }

        .lecture-status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-scheduled {
            background: #eef8fb;
            color: #087ea4;
        }

        .status-live {
            background: #eaf8f0;
            color: #16834f;
        }

        .status-ended {
            background: #f1f3f5;
            color: #687783;
        }

        .status-cancelled {
            background: #fff1f1;
            color: #b42318;
        }

        .lecture-details {
            border-top: 1px solid #edf1f4;
            padding-top: 14px;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 10px;
            color: #617381;
            font-size: 12px;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .detail-icon {
            width: 24px;
            text-align: center;
        }

        .detail-row strong {
            color: #34495e;
        }

        .lecture-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .lecture-button {
            flex: 1;
            height: 40px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .live-button {
            background: #087ea4;
            color: #ffffff;
        }

        .disabled-button {
            background: #edf1f4;
            color: #8795a0;
            cursor: not-allowed;
        }

        .recording-button {
            background: #eef8fb;
            color: #087ea4;
        }

        .empty,
        .loading,
        .error-box {
            background: #ffffff;
            border: 1px solid #e4edf2;
            border-radius: 15px;
            padding: 45px 20px;
            text-align: center;
            font-size: 13px;
            line-height: 2;
            grid-column: 1 / -1;
        }

        .empty {
            color: #8795a0;
        }

        .loading {
            color: #087ea4;
        }

        .error-box {
            background: #fff1f1;
            border-color: #ffd5d5;
            color: #b42318;
        }

        @media (max-width: 900px) {

            .student-sidebar {
                width: 210px;
            }

            .student-main {
                margin-right: 210px;
            }

            .lectures-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 650px) {

            .student-sidebar {
                position: static;
                width: 100%;
                min-height: auto;
            }

            .student-app {
                display: block;
            }

            .student-main {
                margin-right: 0;
            }

            .student-nav {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }

            .student-logout {
                margin-top: 15px;
            }

            .student-header {
                padding: 15px;
            }

            .student-content {
                padding: 15px;
            }

            .filters {
                flex-direction: column;
            }

            .filter-input,
            .filter-select {
                width: 100%;
                min-width: 0;
            }

        }

    </style>

</head>

<body>

<div
    id="studentApp"
    class="student-app"
>
    جاري تحميل المنصة...
</div>


<script type="module">

    import {
        protectStudentPage,
        createStudentLayout,
        escapeHtml,
        formatDateTime,
        studentErrorMessage
    } from "../src/student/student.js";


    import {
        db
    } from "../src/firebase/init.js";


    import {
        collection,
        query,
        where,
        getDocs
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    try {

        const {
            student
        } =
            await protectStudentPage();


        createStudentLayout(
            student,
            "schedule"
        );


        document.getElementById(
            "studentPageTitle"
        ).textContent =
            "جدول المحاضرات";


        const content =
            document.getElementById(
                "studentPageContent"
            );


        content.innerHTML = `

            <div class="page-intro">

                <h2>
                    📅 جدول المحاضرات
                </h2>

                <p>
                    تابع مواعيد محاضراتك القادمة
                    وادخل إلى المحاضرة المباشرة
                    عند توفر البث.
                </p>

            </div>


            <div class="filters">

                <input
                    type="search"
                    id="lectureSearch"
                    class="filter-input"
                    placeholder="ابحث عن محاضرة أو مادة أو مدرس..."
                >


                <select
                    id="statusFilter"
                    class="filter-select"
                >

                    <option value="all">
                        كل المحاضرات
                    </option>

                    <option value="scheduled">
                        القادمة
                    </option>

                    <option value="live">
                        مباشر الآن
                    </option>

                    <option value="ended">
                        انتهت
                    </option>

                    <option value="cancelled">
                        ملغاة
                    </option>

                </select>

            </div>


            <div
                id="lecturesContainer"
                class="lectures-grid"
            >

                <div class="loading">
                    ⏳ جاري تحميل المحاضرات...
                </div>

            </div>

        `;


        const container =
            document.getElementById(
                "lecturesContainer"
            );


        const searchInput =
            document.getElementById(
                "lectureSearch"
            );


        const statusFilter =
            document.getElementById(
                "statusFilter"
            );


        // =================================================
        // IMPORTANT
        // Query مطابق تمامًا للـFirestore Rules
        // =================================================

        const lecturesQuery =
            query(

                collection(
                    db,
                    "lectures"
                ),

                where(
                    "stageId",
                    "==",
                    student.stageId
                ),

                where(
                    "isPublished",
                    "==",
                    true
                )

            );


        const snapshot =
            await getDocs(
                lecturesQuery
            );


        const lectures =
            snapshot.docs
                .map(
                    item => ({
                        id: item.id,
                        ...item.data()
                    })
                )
                .sort(
                    (a, b) =>
                        getTime(
                            a.scheduledAt
                        ) -
                        getTime(
                            b.scheduledAt
                        )
                );


        render();


        searchInput.addEventListener(
            "input",
            render
        );


        statusFilter.addEventListener(
            "change",
            render
        );


        function render() {

            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();


            const selectedStatus =
                statusFilter.value;


            const filtered =
                lectures.filter(
                    lecture => {

                        const title =
                            String(
                                lecture.title ||
                                ""
                            ).toLowerCase();


                        const subject =
                            String(
                                lecture.subject ||
                                lecture.subjectId ||
                                ""
                            ).toLowerCase();


                        const teacher =
                            String(
                                lecture.teacherName ||
                                lecture.teacher ||
                                ""
                            ).toLowerCase();


                        const matchesSearch =
                            !search ||
                            title.includes(search) ||
                            subject.includes(search) ||
                            teacher.includes(search);


                        const status =
                            getStatus(
                                lecture
                            );


                        const matchesStatus =
                            selectedStatus ===
                                "all" ||
                            selectedStatus ===
                                status;


                        return (
                            matchesSearch &&
                            matchesStatus
                        );

                    }
                );


            if (!filtered.length) {

                container.innerHTML = `

                    <div class="empty">

                        📅

                        <br>

                        لا توجد محاضرات مطابقة حاليًا.

                    </div>

                `;

                return;

            }


            container.innerHTML =
                filtered
                    .map(
                        lecture =>
                            lectureCard(
                                lecture
                            )
                    )
                    .join("");

        }


        function lectureCard(
            lecture
        ) {

            const status =
                getStatus(
                    lecture
                );


            const statusInfo =
                getStatusInfo(
                    status
                );


            const title =
                lecture.title ||
                "محاضرة";


            const subject =
                lecture.subject ||
                lecture.subjectId ||
                "غير محدد";


            const teacher =
                lecture.teacherName ||
                lecture.teacher ||
                lecture.teacherId ||
                "غير محدد";


            const liveUrl =
                lecture.liveUrl ||
                "";


            const recordingUrl =
                lecture.recordingUrl ||
                "";


            return `

                <div class="lecture-card">

                    <div class="lecture-top">

                        <div class="lecture-icon">
                            🎥
                        </div>


                        <div class="lecture-title">

                            <h3>
                                ${escapeHtml(title)}
                            </h3>

                            <p>
                                ${escapeHtml(subject)}
                            </p>

                        </div>


                        <span
                            class="
                                lecture-status
                                ${statusInfo.className}
                            "
                        >
                            ${statusInfo.label}
                        </span>

                    </div>


                    <div class="lecture-details">

                        <div class="detail-row">

                            <span class="detail-icon">
                                📚
                            </span>

                            <span>
                                المادة:
                                <strong>
                                    ${escapeHtml(subject)}
                                </strong>
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-icon">
                                👨‍🏫
                            </span>

                            <span>
                                المدرس:
                                <strong>
                                    ${escapeHtml(teacher)}
                                </strong>
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-icon">
                                🕒
                            </span>

                            <span>
                                الموعد:
                                <strong>
                                    ${escapeHtml(
                                        formatDateTime(
                                            lecture.scheduledAt
                                        )
                                    )}
                                </strong>
                            </span>

                        </div>

                    </div>


                    <div class="lecture-actions">

                        ${
                            status === "live" &&
                            liveUrl

                            ? `

                                <a
                                    class="lecture-button live-button"
                                    href="${escapeHtml(liveUrl)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    🔴 دخول Live
                                </a>

                            `

                            : status === "ended" &&
                              recordingUrl

                            ? `

                                <a
                                    class="lecture-button recording-button"
                                    href="${escapeHtml(recordingUrl)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    ▶️ مشاهدة التسجيل
                                </a>

                            `

                            : `

                                <button
                                    class="lecture-button disabled-button"
                                    disabled
                                >
                                    ${
                                        status === "cancelled"
                                            ? "المحاضرة ملغاة"
                                            : status === "live"
                                                ? "البث غير متاح"
                                                : "لم يبدأ البث بعد"
                                    }
                                </button>

                            `
                        }

                    </div>

                </div>

            `;

        }


        function getStatus(
            lecture
        ) {

            if (
                lecture.status ===
                "cancelled"
            ) {
                return "cancelled";
            }


            if (
                lecture.status ===
                "live"
            ) {
                return "live";
            }


            if (
                lecture.status ===
                "ended"
            ) {
                return "ended";
            }


            const start =
                getTime(
                    lecture.scheduledAt
                );


            const end =
                getTime(
                    lecture.endAt
                );


            const now =
                Date.now();


            if (
                end &&
                now > end
            ) {
                return "ended";
            }


            if (
                start &&
                now >= start &&
                (
                    !end ||
                    now <= end
                )
            ) {
                return "live";
            }


            return "scheduled";

        }


        function getStatusInfo(
            status
        ) {

            const data = {

                scheduled: {
                    label: "قادمة",
                    className:
                        "status-scheduled"
                },

                live: {
                    label: "مباشر الآن",
                    className:
                        "status-live"
                },

                ended: {
                    label: "انتهت",
                    className:
                        "status-ended"
                },

                cancelled: {
                    label: "ملغاة",
                    className:
                        "status-cancelled"
                }

            };


            return (
                data[status] ||
                data.scheduled
            );

        }


        function getTime(
            value
        ) {

            if (!value) {
                return 0;
            }


            if (
                typeof value.toDate ===
                "function"
            ) {
                return value.toDate()
                    .getTime();
            }


            const date =
                new Date(value);


            return isNaN(
                date.getTime()
            )
                ? 0
                : date.getTime();

        }


    } catch (error) {

        console.error(
            "Student schedule error:",
            error
        );


        const app =
            document.getElementById(
                "studentApp"
            );


        if (app) {

            app.innerHTML = `

                <div
                    style="
                        width:100%;
                        min-height:100vh;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        padding:20px;
                        text-align:center;
                        font-family:Arial,Tahoma,sans-serif;
                        color:#b42318;
                    "
                >

                    ⚠️ حدث خطأ أثناء تحميل جدول المحاضرات.

                    <br><br>

                    ${escapeHtml(
                        studentErrorMessage(
                            error
                        )
                    )}

                </div>

            `;

        }

    }

</script>

</body>
</html>
