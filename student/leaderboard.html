<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>نتائجي | مسار التمريض</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                "Tajawal",
                "Cairo",
                Arial,
                sans-serif;

            background: #f5f7fb;
            color: #1f2937;
        }

        button,
        a {
            font-family: inherit;
        }

        .app {
            min-height: 100vh;
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 270px;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            padding: 24px 16px;
            overflow-y: auto;
            z-index: 100;
        }

        .brand {
            text-align: center;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,.1);
            margin-bottom: 20px;
        }

        .brand h2 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .brand span {
            color: #94a3b8;
            font-size: 13px;
        }

        .student-box {
            background: rgba(255,255,255,.06);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .student-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .student-stage {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.6;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .nav a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 10px;
            transition: .2s;
            font-size: 14px;
        }

        .nav a:hover {
            background: rgba(255,255,255,.07);
            color: white;
        }

        .nav a.active {
            background: #2563eb;
            color: white;
        }

        .logout-btn {
            width: 100%;
            border: 0;
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            background: #dc2626;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            margin-right: 270px;
            padding: 30px;
            min-width: 0;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 7px;
            color: #0f172a;
        }

        .page-header p {
            color: #64748b;
            font-size: 14px;
        }

        /* =========================
           SUMMARY
        ========================= */

        .summary-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 16px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 15px rgba(15,23,42,.04);
        }

        .summary-label {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .summary-value {
            color: #0f172a;
            font-size: 28px;
            font-weight: 800;
        }

        /* =========================
           RESULTS
        ========================= */

        .results-section {
            background: white;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(15,23,42,.04);
        }

        .section-title {
            font-size: 19px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 18px;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .result-card {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            transition: .2s;
        }

        .result-card:hover {
            border-color: #bfdbfe;
            box-shadow: 0 5px 18px rgba(37,99,235,.07);
        }

        .result-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 14px;
        }

        .exam-title {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .exam-meta {
            color: #64748b;
            font-size: 12px;
            line-height: 1.8;
        }

        .percentage {
            min-width: 72px;
            text-align: center;
            padding: 9px 10px;
            border-radius: 10px;
            background: #eff6ff;
            color: #2563eb;
            font-weight: 800;
            font-size: 16px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 12px;
        }

        .score-text {
            color: #334155;
            font-size: 14px;
            font-weight: 700;
        }

        .date-text {
            color: #94a3b8;
            font-size: 12px;
        }

        .progress {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-bar {
            height: 100%;
            border-radius: 99px;
            background: #2563eb;
            transition: width .4s ease;
        }

        /* =========================
           STATES
        ========================= */

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 45px 20px;
            color: #64748b;
        }

        .empty-icon,
        .error-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .empty h3,
        .error h3 {
            color: #334155;
            margin-bottom: 8px;
        }

        .error {
            color: #b91c1c;
        }

        .error h3 {
            color: #991b1b;
        }

        .retry-btn {
            margin-top: 15px;
            border: 0;
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 9px;
            cursor: pointer;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .sidebar {
                width: 230px;
            }

            .main {
                margin-right: 230px;
                padding: 22px;
            }

            .summary-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 650px) {

            .app {
                display: block;
            }

            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
                padding: 15px;
            }

            .brand {
                padding-bottom: 15px;
                margin-bottom: 15px;
            }

            .student-box {
                margin-bottom: 15px;
            }

            .nav {
                display: grid;
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .logout-btn {
                margin-top: 15px;
            }

            .main {
                margin-right: 0;
                padding: 18px;
            }

            .page-header h1 {
                font-size: 23px;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .result-top {
                flex-direction: column;
            }

            .percentage {
                min-width: auto;
            }

            .score-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="brand">
            <h2>مسار التمريض</h2>
            <span>بوابة الطالب</span>
        </div>

        <div class="student-box">
            <div
                class="student-name"
                id="sidebarStudentName"
            >
                جاري التحميل...
            </div>

            <div
                class="student-stage"
                id="sidebarStudentStage"
            >
                ...
            </div>
        </div>

        <nav class="nav">

            <a href="dashboard.html">
                🏠 الرئيسية
            </a>

            <a href="schedule.html">
                📅 الجدول
            </a>

            <a href="lectures.html">
                📚 المحاضرات
            </a>

            <a href="exams.html">
                📝 الاختبارات
            </a>

            <a
                href="leaderboard.html"
                class="active"
            >
                🏆 نتائجي
            </a>

            <a href="profile.html">
                👤 الملف الشخصي
            </a>

        </nav>

        <button
            class="logout-btn"
            id="logoutBtn"
        >
            تسجيل الخروج
        </button>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

        <header class="page-header">

            <h1>
                نتائجي
            </h1>

            <p>
                تابع نتائج اختباراتك ونسبة تقدمك في الدراسة
            </p>

        </header>


        <!-- =========================
             SUMMARY
        ========================= -->

        <section class="summary-grid">

            <div class="summary-card">

                <div class="summary-label">
                    عدد الاختبارات
                </div>

                <div
                    class="summary-value"
                    id="examCount"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    متوسط النسبة
                </div>

                <div
                    class="summary-value"
                    id="averagePercentage"
                >
                    0%
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    أفضل نتيجة
                </div>

                <div
                    class="summary-value"
                    id="bestPercentage"
                >
                    0%
                </div>

            </div>

        </section>


        <!-- =========================
             RESULTS
        ========================= -->

        <section class="results-section">

            <h2 class="section-title">
                سجل الاختبارات
            </h2>

            <div
                id="resultsContainer"
                class="results-list"
            >

                <div class="loading">
                    <div class="empty-icon">
                        ⏳
                    </div>

                    جاري تحميل النتائج...
                </div>

            </div>

        </section>

    </main>

</div>


<script type="module">

    import {
        db,
        protectStudentPage,
        logoutStudent,
        escapeHtml,
        formatDateTime,
        studentErrorMessage
    } from "../src/student/student.js";

    import {
        collection,
        getDocs,
        query,
        where,
        doc,
        getDoc
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       DOM
    ========================= */

    const sidebarStudentName =
        document.getElementById(
            "sidebarStudentName"
        );

    const sidebarStudentStage =
        document.getElementById(
            "sidebarStudentStage"
        );

    const examCount =
        document.getElementById(
            "examCount"
        );

    const averagePercentage =
        document.getElementById(
            "averagePercentage"
        );

    const bestPercentage =
        document.getElementById(
            "bestPercentage"
        );

    const resultsContainer =
        document.getElementById(
            "resultsContainer"
        );

    const logoutBtn =
        document.getElementById(
            "logoutBtn"
        );


    /* =========================
       LOGOUT
    ========================= */

    logoutBtn.addEventListener(
        "click",
        async () => {

            await logoutStudent();

        }
    );


    /* =========================
       HELPERS
    ========================= */

    function getResultPercentage(result) {

        const percentage =
            Number(result.percentage);

        if (
            Number.isFinite(percentage)
        ) {
            return Math.max(
                0,
                Math.min(100, percentage)
            );
        }

        const score =
            Number(result.score);

        const totalScore =
            Number(result.totalScore);

        if (
            Number.isFinite(score) &&
            Number.isFinite(totalScore) &&
            totalScore > 0
        ) {
            return Math.max(
                0,
                Math.min(
                    100,
                    (score / totalScore) * 100
                )
            );
        }

        return 0;
    }


    function getScore(result) {

        const score =
            Number(result.score);

        return Number.isFinite(score)
            ? score
            : 0;
    }


    function getTotalScore(result) {

        const totalScore =
            Number(result.totalScore);

        return Number.isFinite(totalScore)
            ? totalScore
            : 0;
    }


    function getDate(result) {

        if (!result.submittedAt) {
            return null;
        }

        try {

            if (
                typeof result.submittedAt.toDate ===
                "function"
            ) {
                return result.submittedAt.toDate();
            }

            if (
                result.submittedAt instanceof Date
            ) {
                return result.submittedAt;
            }

            const date =
                new Date(result.submittedAt);

            if (!Number.isNaN(date.getTime())) {
                return date;
            }

        } catch (error) {
            console.warn(
                "Invalid result date",
                error
            );
        }

        return null;
    }


    function getPercentageClass(percentage) {

        if (percentage >= 85) {
            return "excellent";
        }

        if (percentage >= 70) {
            return "good";
        }

        if (percentage >= 50) {
            return "average";
        }

        return "low";
    }


    async function getExamTitle(
        result,
        examCache
    ) {

        if (
            result.examTitle &&
            typeof result.examTitle === "string"
        ) {
            return result.examTitle;
        }

        if (!result.examId) {
            return "اختبار";
        }

        if (
            examCache.has(result.examId)
        ) {
            return examCache.get(
                result.examId
            );
        }

        try {

            const examRef =
                doc(
                    db,
                    "exams",
                    result.examId
                );

            const examSnap =
                await getDoc(examRef);

            if (examSnap.exists()) {

                const exam =
                    examSnap.data();

                const title =
                    exam.title ||
                    "اختبار";

                examCache.set(
                    result.examId,
                    title
                );

                return title;
            }

        } catch (error) {

            console.warn(
                "Could not load exam",
                error
            );

        }

        return "اختبار";
    }


    async function getSubjectName(
        subjectId,
        subjectCache
    ) {

        if (!subjectId) {
            return "";
        }

        if (
            subjectCache.has(subjectId)
        ) {
            return subjectCache.get(
                subjectId
            );
        }

        try {

            const subjectRef =
                doc(
                    db,
                    "subjects",
                    subjectId
                );

            const subjectSnap =
                await getDoc(subjectRef);

            if (subjectSnap.exists()) {

                const subject =
                    subjectSnap.data();

                const name =
                    subject.name ||
                    subject.title ||
                    "";

                subjectCache.set(
                    subjectId,
                    name
                );

                return name;
            }

        } catch (error) {

            console.warn(
                "Could not load subject",
                error
            );

        }

        return "";
    }


    /* =========================
       RENDER RESULT
    ========================= */

    async function renderResult(
        result,
        examCache,
        subjectCache
    ) {

        const percentage =
            getResultPercentage(result);

        const score =
            getScore(result);

        const totalScore =
            getTotalScore(result);

        const examTitle =
            await getExamTitle(
                result,
                examCache
            );

        const subjectName =
            await getSubjectName(
                result.subjectId,
                subjectCache
            );

        const date =
            getDate(result);

        let dateText =
            "تاريخ غير متاح";

        if (date) {

            try {

                dateText =
                    formatDateTime(date);

            } catch {

                dateText =
                    date.toLocaleString(
                        "ar-EG"
                    );

            }
        }


        const card =
            document.createElement(
                "article"
            );

        card.className =
            "result-card";


        const percentageText =
            `${percentage.toFixed(1)}%`;


        card.innerHTML = `

            <div class="result-top">

                <div>

                    <div class="exam-title">
                        ${escapeHtml(examTitle)}
                    </div>

                    <div class="exam-meta">

                        ${
                            subjectName
                                ? `المادة: ${escapeHtml(subjectName)}`
                                : "اختبار"
                        }

                        ${
                            result.lectureId
                                ? " • اختبار مرتبط بمحاضرة"
                                : ""
                        }

                    </div>

                </div>

                <div class="percentage">
                    ${percentageText}
                </div>

            </div>


            <div class="score-row">

                <div class="score-text">

                    الدرجة:
                    ${score}
                    /
                    ${totalScore}

                </div>

                <div class="date-text">
                    ${escapeHtml(dateText)}
                </div>

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:${percentage}%"
                ></div>

            </div>

        `;

        return card;
    }


    /* =========================
       LOAD RESULTS
    ========================= */

    async function loadResults(
        student
    ) {

        resultsContainer.innerHTML = `
            <div class="loading">
                <div class="empty-icon">
                    ⏳
                </div>
                جاري تحميل النتائج...
            </div>
        `;


        try {

            /*
             * مهم:
             * نقرأ فقط نتائج الطالب الحالي.
             * هذا متوافق مع Firestore Rules.
             */

            const resultsQuery =
                query(
                    collection(
                        db,
                        "examResults"
                    ),
                    where(
                        "studentId",
                        "==",
                        student.id
                    )
                );


            const snapshot =
                await getDocs(
                    resultsQuery
                );


            const results =
                snapshot.docs.map(
                    resultDoc => ({
                        id: resultDoc.id,
                        ...resultDoc.data()
                    })
                );


            /* =========================
               SORT BY DATE
            ========================= */

            results.sort(
                (a, b) => {

                    const dateA =
                        getDate(a);

                    const dateB =
                        getDate(b);

                    if (!dateA && !dateB) {
                        return 0;
                    }

                    if (!dateA) {
                        return 1;
                    }

                    if (!dateB) {
                        return -1;
                    }

                    return (
                        dateB.getTime() -
                        dateA.getTime()
                    );

                }
            );


            /* =========================
               EMPTY
            ========================= */

            if (results.length === 0) {

                examCount.textContent =
                    "0";

                averagePercentage.textContent =
                    "0%";

                bestPercentage.textContent =
                    "0%";


                resultsContainer.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            📝
                        </div>

                        <h3>
                            لا توجد نتائج حتى الآن
                        </h3>

                        <p>
                            عند إتمام أي اختبار ستظهر نتيجتك هنا.
                        </p>

                    </div>

                `;

                return;
            }


            /* =========================
               STATISTICS
            ========================= */

            const percentages =
                results.map(
                    getResultPercentage
                );


            const average =
                percentages.reduce(
                    (sum, value) =>
                        sum + value,
                    0
                ) / percentages.length;


            const best =
                Math.max(
                    ...percentages
                );


            examCount.textContent =
                results.length;


            averagePercentage.textContent =
                `${average.toFixed(1)}%`;


            bestPercentage.textContent =
                `${best.toFixed(1)}%`;


            /* =========================
               RENDER
            ========================= */

            resultsContainer.innerHTML =
                "";


            const examCache =
                new Map();

            const subjectCache =
                new Map();


            for (const result of results) {

                const card =
                    await renderResult(
                        result,
                        examCache,
                        subjectCache
                    );

                resultsContainer.appendChild(
                    card
                );

            }

        } catch (error) {

            console.error(
                "Load student results error:",
                error
            );


            resultsContainer.innerHTML = `

                <div class="error">

                    <div class="error-icon">
                        ⚠️
                    </div>

                    <h3>
                        تعذر تحميل النتائج
                    </h3>

                    <p>
                        ${
                            escapeHtml(
                                studentErrorMessage(
                                    error
                                )
                            )
                        }
                    </p>

                    <button
                        class="retry-btn"
                        id="retryBtn"
                    >
                        إعادة المحاولة
                    </button>

                </div>

            `;


            document
                .getElementById("retryBtn")
                ?.addEventListener(
                    "click",
                    () => loadResults(student)
                );

        }

    }


    /* =========================
       INIT
    ========================= */

    protectStudentPage(
        async ({
            student,
            subscription
        }) => {

            /*
             * student.id هو Firebase Auth UID
             * لأن users/{uid} هو ملف الطالب.
             */

            sidebarStudentName.textContent =
                student.name ||
                student.fullName ||
                student.email ||
                "الطالب";


            sidebarStudentStage.textContent =
                student.stageId
                    ? `المرحلة: ${student.stageId}`
                    : "المرحلة غير محددة";


            await loadResults(
                student
            );

        }
    );

</script>

</body>
</html>
