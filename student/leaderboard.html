<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    نتائجي | مسار التمريض
</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    background: #f3f8fb;
    color: #17324a;
}

.results-page {
    padding: 25px;
    max-width: 1100px;
    margin: auto;
}

.results-header-main {
    background: linear-gradient(
        135deg,
        #087ea4,
        #075f7c
    );

    color: white;
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 18px;
}

.results-header-main h2 {
    font-size: 23px;
    margin-bottom: 8px;
}

.results-header-main p {
    font-size: 13px;
    line-height: 1.9;
}

.summary-grid {
    display: grid;
    grid-template-columns:
        repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 18px;
}

.summary-card {
    background: white;
    border: 1px solid #e4edf2;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
}

.summary-icon {
    font-size: 22px;
    margin-bottom: 8px;
}

.summary-label {
    color: #82919d;
    font-size: 11px;
    margin-bottom: 7px;
}

.summary-value {
    color: #087ea4;
    font-size: 22px;
    font-weight: bold;
}

.results-section {
    background: white;
    border: 1px solid #e4edf2;
    border-radius: 17px;
    overflow: hidden;
}

.results-section-header {
    padding: 18px 20px;
    border-bottom: 1px solid #edf1f4;
}

.results-section-header h3 {
    font-size: 16px;
}

.result-item {
    padding: 18px 20px;
    border-bottom: 1px solid #edf1f4;
}

.result-item:last-child {
    border-bottom: none;
}

.result-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 13px;
}

.result-title {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 6px;
}

.result-subject {
    color: #82919d;
    font-size: 10px;
}

.percentage-badge {
    min-width: 75px;
    padding: 9px;
    border-radius: 9px;
    background: #eaf7fb;
    color: #087ea4;
    text-align: center;
    font-weight: bold;
}

.result-details {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 9px;
}

.result-detail {
    background: #f7fafc;
    border-radius: 9px;
    padding: 10px;
    text-align: center;
}

.result-detail span {
    display: block;
    color: #82919d;
    font-size: 9px;
    margin-bottom: 5px;
}

.result-detail strong {
    font-size: 12px;
}

.state-box {
    background: white;
    border: 1px solid #e4edf2;
    border-radius: 15px;
    padding: 45px 20px;
    text-align: center;
    color: #8795a0;
    line-height: 2;
}

.error-box {
    background: #fff1f1;
    border-color: #ffd5d5;
    color: #b42318;
}

@media (max-width: 750px) {

    .results-page {
        padding: 15px;
    }

    .summary-grid {
        grid-template-columns: 1fr;
    }

    .result-details {
        grid-template-columns:
            repeat(2, 1fr);
    }

}

@media (max-width: 450px) {

    .result-top {
        flex-direction: column;
    }

    .result-details {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div id="studentApp">
    جاري تحميل المنصة...
</div>


<script type="module">

import {
    protectStudentPage,
    createStudentLayout,
    getStudentResults,
    escapeHtml,
    formatDateTime,
    studentErrorMessage
} from "../src/student/student.js";


let student = null;
let results = [];


try {

    const result =
        await protectStudentPage();


    student =
        result.student;


    createStudentLayout(
        student,
        "leaderboard"
    );


    document.getElementById(
        "studentPageTitle"
    ).textContent =
        "نتائجي";


    document.getElementById(
        "studentPageSubtitle"
    ).textContent =
        "نتائج الاختبارات الخاصة بك";


    const content =
        document.getElementById(
            "studentPageContent"
        );


    content.innerHTML = `

        <div class="results-page">

            <div class="results-header-main">

                <h2>
                    🏆 نتائجي
                </h2>

                <p>
                    هنا تظهر نتائج الاختبارات
                    التي قمت بحلها فقط.
                </p>

            </div>


            <div id="summaryContainer">

            </div>


            <div class="results-section">

                <div class="results-section-header">

                    <h3>
                        📝 سجل الاختبارات
                    </h3>

                </div>


                <div id="resultsContainer">

                    <div class="state-box">

                        ⏳

                        <br>

                        جاري تحميل النتائج...

                    </div>

                </div>

            </div>

        </div>

    `;


    results =
        await getStudentResults(
            student.id
        );


    results.sort(
        (
            a,
            b
        ) =>
            getTimestamp(
                b.submittedAt
            ) -
            getTimestamp(
                a.submittedAt
            )
    );


    renderSummary();

    renderResults();


} catch (error) {

    console.error(
        "Student results error:",
        error
    );


    const app =
        document.getElementById(
            "studentApp"
        );


    app.innerHTML = `

        <div class="state-box error-box">

            ⚠️

            <br>

            ${escapeHtml(
                studentErrorMessage(
                    error
                )
            )}

        </div>

    `;

}


// =====================================================
// Summary
// =====================================================

function renderSummary() {

    const container =
        document.getElementById(
            "summaryContainer"
        );


    if (!container) {
        return;
    }


    if (!results.length) {

        container.innerHTML = "";

        return;

    }


    const count =
        results.length;


    const average =
        results.reduce(
            (
                total,
                result
            ) =>
                total +
                getPercentage(
                    result
                ),
            0
        ) / count;


    const best =
        Math.max(
            ...results.map(
                result =>
                    getPercentage(
                        result
                    )
            )
        );


    container.innerHTML = `

        <div class="summary-grid">

            <div class="summary-card">

                <div class="summary-icon">
                    📝
                </div>

                <div class="summary-label">
                    عدد الاختبارات
                </div>

                <div class="summary-value">
                    ${count}
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-icon">
                    📊
                </div>

                <div class="summary-label">
                    متوسط النسبة
                </div>

                <div class="summary-value">
                    ${average.toFixed(1)}%
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-icon">
                    🏆
                </div>

                <div class="summary-label">
                    أعلى نسبة
                </div>

                <div class="summary-value">
                    ${best.toFixed(1)}%
                </div>

            </div>

        </div>

    `;

}


// =====================================================
// Results
// =====================================================

function renderResults() {

    const container =
        document.getElementById(
            "resultsContainer"
        );


    if (!container) {
        return;
    }


    if (!results.length) {

        container.innerHTML = `

            <div class="state-box">

                📝

                <br>

                لم تقم بحل أي اختبار
                حتى الآن.

            </div>

        `;

        return;

    }


    container.innerHTML =
        results
            .map(
                result =>
                    createResult(
                        result
                    )
            )
            .join("");

}


// =====================================================
// Result
// =====================================================

function createResult(
    result
) {

    const score =
        Number(
            result.score || 0
        );


    const totalScore =
        Number(
            result.totalScore || 0
        );


    const percentage =
        getPercentage(
            result
        );


    return `

        <article class="result-item">

            <div class="result-top">

                <div>

                    <div class="result-title">

                        📝

                        ${escapeHtml(
                            result.examTitle ||
                            result.examName ||
                            "اختبار"
                        )}

                    </div>


                    <div class="result-subject">

                        📚

                        ${escapeHtml(
                            result.subjectId ||
                            "غير محدد"
                        )}

                    </div>

                </div>


                <div class="percentage-badge">

                    ${percentage}%

                </div>

            </div>


            <div class="result-details">

                <div class="result-detail">

                    <span>
                        الدرجة
                    </span>

                    <strong>
                        ${score}/${totalScore}
                    </strong>

                </div>


                <div class="result-detail">

                    <span>
                        المرحلة
                    </span>

                    <strong>
                        ${escapeHtml(
                            String(
                                result.stageId ||
                                student.stageId ||
                                "—"
                            )
                        )}
                    </strong>

                </div>


                <div class="result-detail">

                    <span>
                        الأسئلة
                    </span>

                    <strong>
                        ${
                            Array.isArray(
                                result.answers
                            )
                                ? result.answers.length
                                : "—"
                        }
                    </strong>

                </div>


                <div class="result-detail">

                    <span>
                        تاريخ التسليم
                    </span>

                    <strong>
                        ${escapeHtml(
                            formatDateTime(
                                result.submittedAt
                            )
                        )}
                    </strong>

                </div>

            </div>

        </article>

    `;

}


// =====================================================
// Percentage
// =====================================================

function getPercentage(
    result
) {

    const percentage =
        Number(
            result.percentage
        );


    if (
        Number.isFinite(
            percentage
        )
    ) {

        return percentage;

    }


    const score =
        Number(
            result.score || 0
        );


    const total =
        Number(
            result.totalScore || 0
        );


    if (
        total > 0
    ) {

        return Number(
            (
                score /
                total *
                100
            ).toFixed(2)
        );

    }


    return 0;

}


// =====================================================
// Timestamp
// =====================================================

function getTimestamp(
    value
) {

    if (!value) {
        return 0;
    }


    if (
        typeof value.toMillis ===
        "function"
    ) {

        return value.toMillis();

    }


    if (
        typeof value.toDate ===
        "function"
    ) {

        return value
            .toDate()
            .getTime();

    }


    if (
        value.seconds !==
        undefined
    ) {

        return Number(
            value.seconds
        ) * 1000;

    }


    const date =
        new Date(value);


    return Number.isNaN(
        date.getTime()
    )
        ? 0
        : date.getTime();

}

</script>

</body>
</html>
