<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    الترتيب | مسار التمريض
</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family:
            Arial,
            Tahoma,
            sans-serif;

        background: #f3f8fb;

        color: #17324a;
    }


    /* ================================
       Page
    ================================= */

    .leaderboard-page {
        padding: 25px;
        max-width: 1100px;
        margin: 0 auto;
    }


    /* ================================
       Header
    ================================= */

    .leaderboard-header {
        background:
            linear-gradient(
                135deg,
                #087ea4,
                #075f7c
            );

        color: white;

        border-radius: 18px;

        padding: 28px;

        margin-bottom: 20px;

        box-shadow:
            0 8px 25px
            rgba(8, 126, 164, .12);
    }

    .leaderboard-header h2 {
        font-size: 23px;

        margin-bottom: 8px;

        line-height: 1.6;
    }

    .leaderboard-header p {
        font-size: 13px;

        opacity: .92;

        line-height: 1.9;
    }


    /* ================================
       Privacy Notice
    ================================= */

    .privacy-box {
        background: #eef8fb;

        border:
            1px solid
            #d8edf3;

        color: #087ea4;

        border-radius: 13px;

        padding: 13px 15px;

        margin-bottom: 18px;

        font-size: 11px;

        line-height: 1.9;
    }


    /* ================================
       Student Result
    ================================= */

    .my-rank-card {
        background: white;

        border:
            1px solid
            #e4edf2;

        border-radius: 17px;

        padding: 22px;

        margin-bottom: 18px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 20px;

        flex-wrap: wrap;

        box-shadow:
            0 5px 18px
            rgba(23, 50, 74, .04);
    }

    .my-rank-info {
        display: flex;

        align-items: center;

        gap: 13px;

        min-width: 200px;
    }

    .my-rank-avatar {
        width: 52px;

        height: 52px;

        border-radius: 50%;

        background: #eaf7fb;

        color: #087ea4;

        display: flex;

        align-items: center;

        justify-content: center;

        font-weight: bold;

        font-size: 20px;

        flex-shrink: 0;
    }

    .my-rank-name {
        font-weight: bold;

        font-size: 15px;

        margin-bottom: 5px;
    }

    .my-rank-id {
        color: #8a98a3;

        font-size: 10px;
    }

    .my-rank-result {
        text-align: center;

        min-width: 100px;
    }

    .my-rank-number {
        font-size: 27px;

        font-weight: bold;

        color: #087ea4;
    }

    .my-rank-label {
        display: block;

        color: #71808d;

        font-size: 10px;

        margin-top: 4px;
    }


    /* ================================
       Result Grid
    ================================= */

    .result-grid {
        display: grid;

        grid-template-columns:
            repeat(
                3,
                minmax(0, 1fr)
            );

        gap: 14px;

        margin-bottom: 18px;
    }

    .result-card {
        background: white;

        border:
            1px solid
            #e4edf2;

        border-radius: 15px;

        padding: 20px;

        text-align: center;

        box-shadow:
            0 4px 15px
            rgba(23, 50, 74, .035);
    }

    .result-icon {
        width: 42px;

        height: 42px;

        border-radius: 11px;

        background: #eef8fb;

        color: #087ea4;

        display: flex;

        align-items: center;

        justify-content: center;

        margin: 0 auto 10px;

        font-size: 18px;
    }

    .result-label {
        color: #82919d;

        font-size: 11px;

        margin-bottom: 7px;
    }

    .result-value {
        color: #17324a;

        font-size: 20px;

        font-weight: bold;
    }

    .result-value.green {
        color: #16834f;
    }


    /* ================================
       Exam Cards
    ================================= */

    .results-section {
        background: white;

        border:
            1px solid
            #e4edf2;

        border-radius: 17px;

        overflow: hidden;

        box-shadow:
            0 5px 18px
            rgba(23, 50, 74, .04);
    }

    .results-header {
        padding: 18px 20px;

        border-bottom:
            1px solid
            #edf1f4;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 10px;
    }

    .results-header h3 {
        font-size: 16px;
    }

    .results-header span {
        color: #82919d;

        font-size: 10px;
    }

    .exam-result {
        padding: 18px 20px;

        border-bottom:
            1px solid
            #edf1f4;
    }

    .exam-result:last-child {
        border-bottom: none;
    }

    .exam-result-top {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 15px;

        margin-bottom: 13px;
    }

    .exam-title {
        font-size: 14px;

        font-weight: bold;

        color: #17324a;

        margin-bottom: 5px;
    }

    .exam-subject {
        color: #82919d;

        font-size: 10px;
    }

    .rank-badge {
        min-width: 70px;

        padding: 8px 12px;

        border-radius: 9px;

        background: #eaf7fb;

        color: #087ea4;

        text-align: center;

        font-weight: bold;

        font-size: 13px;

        white-space: nowrap;
    }

    .rank-badge.gold {
        background: #fff7d6;

        color: #a47700;
    }

    .rank-badge.silver {
        background: #f0f2f4;

        color: #68737d;
    }

    .rank-badge.bronze {
        background: #fff0e5;

        color: #a55a22;
    }

    .exam-details {
        display: grid;

        grid-template-columns:
            repeat(
                3,
                minmax(0, 1fr)
            );

        gap: 10px;
    }

    .exam-detail {
        background: #f7fafc;

        border-radius: 9px;

        padding: 10px;

        text-align: center;
    }

    .exam-detail span {
        display: block;

        color: #82919d;

        font-size: 9px;

        margin-bottom: 5px;
    }

    .exam-detail strong {
        display: block;

        color: #17324a;

        font-size: 13px;
    }


    /* ================================
       States
    ================================= */

    .state-box {
        background: white;

        border:
            1px solid
            #e4edf2;

        border-radius: 15px;

        padding: 45px 20px;

        text-align: center;

        color: #8795a0;

        font-size: 13px;

        line-height: 2;
    }

    .error-box {
        background: #fff1f1;

        border-color: #ffd5d5;

        color: #b42318;
    }


    /* ================================
       Empty Result
    ================================= */

    .empty-results {
        padding: 35px 20px;

        text-align: center;

        color: #8795a0;

        font-size: 13px;

        line-height: 2;
    }


    /* ================================
       Responsive
    ================================= */

    @media (max-width: 800px) {

        .result-grid {
            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );
        }

    }


    @media (max-width: 650px) {

        .leaderboard-page {
            padding: 15px;
        }

        .leaderboard-header {
            padding: 21px;
        }

        .leaderboard-header h2 {
            font-size: 19px;
        }

        .my-rank-card {
            align-items: flex-start;
        }

        .my-rank-result {
            min-width: 80px;
        }

        .result-grid {
            grid-template-columns: 1fr;
        }

        .exam-result-top {
            align-items: flex-start;

            flex-direction: column;
        }

        .exam-details {
            grid-template-columns:
                1fr 1fr 1fr;
        }

    }


    @media (max-width: 430px) {

        .exam-details {
            grid-template-columns: 1fr;
        }

        .my-rank-info {
            width: 100%;
        }

        .my-rank-result {
            flex: 1;
        }

    }
    /* =====================================================
   STUDENT LAYOUT
   Sidebar + Header + Main Content
===================================================== */

    min-height: 100vh;
    display: flex;
    background: #f3f8fb;
}

.student-brand {

}

.student-avatar,
.header-avatar {

    border-radius: 50%;

    display: flex;

.student-user strong {

.student-nav {

}

/* =====================================================

@media (max-width: 900px) {

</head><body><div id="studentApp">جاري تحميل المنصة...

</div><script type="module">

    import {
        protectStudentPage,
        createStudentLayout,
        escapeHtml,
        studentErrorMessage
    } from "../src/student/student.js";


    import {
        db
    } from "../src/firebase/init.js";


    import {
        collection,
        query,
        where,
        getDocs
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =====================================================
    // State
    // =====================================================

    let student = null;

    let myResults = [];


    // =====================================================
    // Start
    // =====================================================

    try {

        const result =
            await protectStudentPage();


        student =
            result.student;


        createStudentLayout(
            student,
            "leaderboard"
        );


        const title =
            document.getElementById(
                "studentPageTitle"
            );


        if (title) {

            title.textContent =
                "الترتيب";

        }


        const content =
            document.getElementById(
                "studentPageContent"
            );


        if (!content) {

            throw new Error(
                "لم يتم العثور على مساحة محتوى الطالب."
            );

        }


        content.innerHTML = `

            <div class="leaderboard-page">

                <div class="leaderboard-header">

                    <h2>
                        🏆 ترتيبي
                    </h2>

                    <p>
                        تابع نتائجك ومركزك في الاختبارات
                        التي شاركت فيها.
                    </p>

                </div>


                <div class="privacy-box">

                    🔒
                    هذه الصفحة تعرض نتائجك وترتيبك أنت فقط،
                    ولا تعرض درجات أو بيانات الطلاب الآخرين.

                </div>


                <div id="myRankContainer">

                    <div class="state-box">

                        ⏳

                        <br>

                        جاري تحميل نتائجك...

                    </div>

                </div>


                <div id="resultGrid">

                </div>


                <div
                    id="resultsContainer"
                    class="results-section"
                >

                    <div class="results-header">

                        <h3>
                            📝 نتائج اختباراتك
                        </h3>

                        <span>
                            نتائجك الشخصية فقط
                        </span>

                    </div>

                    <div
                        id="resultsList"
                    >

                        <div class="empty-results">

                            ⏳

                            <br>

                            جاري تحميل النتائج...

                        </div>

                    </div>

                </div>

            </div>

        `;


        await loadMyResults();


    } catch (error) {

        console.error(
            "Student leaderboard error:",
            error
        );


        const app =
            document.getElementById(
                "studentApp"
            );


        if (app) {

            app.innerHTML = `

                <div
                    class="state-box error-box"
                    style="
                        min-height:100vh;
                        border:none;
                        border-radius:0;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        flex-direction:column;
                    "
                >

                    ⚠️

                    <br>

                    حدث خطأ أثناء تحميل صفحة الترتيب.

                    <br><br>

                    ${escapeHtml(
                        studentErrorMessage(
                            error
                        )
                    )}

                </div>

            `;

        }

    }


    // =====================================================
    // Load Current Student Results
    // =====================================================

    async function loadMyResults() {

        try {

            /*
             * مهم جدًا:
             *
             * لا نستخدم:
             *
             * getDocs(collection(db, "examResults"))
             *
             * لأن هذا يحاول قراءة جميع النتائج.
             *
             * الطالب مسموح له فقط بقراءة
             * النتائج التي studentId فيها يساوي UID الخاص به.
             *
             * لذلك نستخدم Query على studentId.
             */

            const resultsQuery =
                query(

                    collection(
                        db,
                        "examResults"
                    ),

                    where(
                        "studentId",
                        "==",
                        student.id
                    )

                );


            const snapshot =
                await getDocs(
                    resultsQuery
                );


            myResults =
                snapshot.docs
                    .map(
                        item => ({

                            id:
                                item.id,

                            ...item.data()

                        })
                    );


            /*
             * ترتيب النتائج من الأحدث إلى الأقدم.
             */

            myResults.sort(
                (
                    a,
                    b
                ) =>
                    getTimestamp(
                        b.submittedAt
                    ) -
                    getTimestamp(
                        a.submittedAt
                    )
            );


            renderMyRank();

            renderSummary();

            renderResults();


        } catch (error) {

            console.error(
                "Load my leaderboard results error:",
                error
            );


            const rankContainer =
                document.getElementById(
                    "myRankContainer"
                );


            const resultsContainer =
                document.getElementById(
                    "resultsList"
                );


            if (rankContainer) {

                rankContainer.innerHTML = `

                    <div
                        class="
                            state-box
                            error-box
                        "
                    >

                        ⚠️

                        <br>

                        حدث خطأ أثناء تحميل ترتيبك.

                        <br><br>

                        ${escapeHtml(
                            studentErrorMessage(
                                error
                            )
                        )}

                    </div>

                `;

            }


            if (resultsContainer) {

                resultsContainer.innerHTML = "";

            }

        }

    }


    // =====================================================
    // Current Rank
    // =====================================================

    function renderMyRank() {

        const container =
            document.getElementById(
                "myRankContainer"
            );


        if (!container) {

            return;

        }


        if (!myResults.length) {

            container.innerHTML = `

                <div class="state-box">

                    🏆

                    <br>

                    لا توجد نتائج اختبارات مسجلة لك حاليًا.

                    <br>

                    عند دخولك أحد الاختبارات
                    ستظهر نتيجتك وترتيبك هنا.

                </div>

            `;

            return;

        }


        /*
         * نعرض أحدث نتيجة.
         */

        const result =
            myResults[0];


        const rank =
            getRank(
                result
            );


        const percentage =
            getPercentage(
                result
            );


        const score =
            Number(
                result.score || 0
            );


        const total =
            Number(
                result.total || 0
            );


        const name =
            student.name ||
            result.studentName ||
            "الطالب";


        const initial =
            String(
                name
            ).trim()
                .charAt(0) ||
            "ط";


        const rankClass =
            getRankClass(
                rank
            );


        container.innerHTML = `

            <div class="my-rank-card">

                <div class="my-rank-info">

                    <div class="my-rank-avatar">

                        ${escapeHtml(
                            initial
                        )}

                    </div>


                    <div>

                        <div class="my-rank-name">

                            ${escapeHtml(
                                name
                            )}

                        </div>

                        <div class="my-rank-id">

                            ${escapeHtml(
                                String(
                                    student.id ||
                                    "—"
                                )
                            )}

                        </div>

                    </div>

                </div>


                <div class="my-rank-result">

                    <div
                        class="
                            my-rank-number
                            ${rankClass}
                        "
                    >

                        ${rank
                            ? "#" +
                              escapeHtml(
                                  String(rank)
                              )
                            : "—"
                        }

                    </div>

                    <span class="my-rank-label">

                        مركزك

                    </span>

                </div>


                <div class="my-rank-result">

                    <div class="my-rank-number">

                        ${percentage}%

                    </div>

                    <span class="my-rank-label">

                        النسبة

                    </span>

                </div>


                <div class="my-rank-result">

                    <div class="my-rank-number">

                        ${score}/${total}

                    </div>

                    <span class="my-rank-label">

                        الدرجة

                    </span>

                </div>

            </div>

        `;

    }


    // =====================================================
    // Summary
    // =====================================================

    function renderSummary() {

        const container =
            document.getElementById(
                "resultGrid"
            );


        if (!container) {

            return;

        }


        if (!myResults.length) {

            container.innerHTML = "";

            return;

        }


        const count =
            myResults.length;


        const average =
            myResults.reduce(
                (
                    total,
                    result
                ) =>
                    total +
                    getPercentage(
                        result
                    ),
                0
            ) / count;


        const best =
            Math.max(
                ...myResults.map(
                    result =>
                        getPercentage(
                            result
                        )
                )
            );


        container.innerHTML = `

            <div class="result-grid">

                <div class="result-card">

                    <div class="result-icon">
                        📝
                    </div>

                    <div class="result-label">
                        عدد الاختبارات
                    </div>

                    <div class="result-value">
                        ${count}
                    </div>

                </div>


                <div class="result-card">

                    <div class="result-icon">
                        📊
                    </div>

                    <div class="result-label">
                        متوسط النسبة
                    </div>

                    <div class="result-value green">
                        ${average.toFixed(1)}%
                    </div>

                </div>


                <div class="result-card">

                    <div class="result-icon">
                        🏆
                    </div>

                    <div class="result-label">
                        أعلى نسبة
                    </div>

                    <div class="result-value green">
                        ${best.toFixed(1)}%
                    </div>

                </div>

            </div>

        `;

    }


    // =====================================================
    // Results
    // =====================================================

    function renderResults() {

        const container =
            document.getElementById(
                "resultsList"
            );


        if (!container) {

            return;

        }


        if (!myResults.length) {

            container.innerHTML = `

                <div class="empty-results">

                    📝

                    <br>

                    لا توجد نتائج اختبارات مسجلة لك حاليًا.

                </div>

            `;

            return;

        }


        container.innerHTML =
            myResults
                .map(
                    result =>
                        createResultCard(
                            result
                        )
                )
                .join("");

    }


    // =====================================================
    // Result Card
    // =====================================================

    function createResultCard(
        result
    ) {

        const examTitle =
            result.examTitle ||
            result.examName ||
            "اختبار";


        const subject =
            result.subject ||
            result.subjectId ||
            "غير محدد";


        const score =
            Number(
                result.score || 0
            );


        const total =
            Number(
                result.total || 0
            );


        const percentage =
            getPercentage(
                result
            );


        const rank =
            getRank(
                result
            );


        const rankClass =
            getRankClass(
                rank
            );


        const rankText =
            rank
                ? "#" +
                  escapeHtml(
                      String(rank)
                  )
                : "غير مسجل";


        return `

            <div class="exam-result">

                <div class="exam-result-top">

                    <div>

                        <div class="exam-title">

                            ${escapeHtml(
                                examTitle
                            )}

                        </div>

                        <div class="exam-subject">

                            📚
                            ${escapeHtml(
                                subject
                            )}

                        </div>

                    </div>


                    <div
                        class="
                            rank-badge
                            ${rankClass}
                        "
                    >

                        ${rankText}

                    </div>

                </div>


                <div class="exam-details">

                    <div class="exam-detail">

                        <span>
                            الدرجة
                        </span>

                        <strong>
                            ${score}/${total}
                        </strong>

                    </div>


                    <div class="exam-detail">

                        <span>
                            النسبة
                        </span>

                        <strong>
                            ${percentage}%
                        </strong>

                    </div>


                    <div class="exam-detail">

                        <span>
                            المرحلة
                        </span>

                        <strong>
                            ${escapeHtml(
                                String(
                                    result.stageId ||
                                    student.stageId ||
                                    "—"
                                )
                            )}
                        </strong>

                    </div>

                </div>

            </div>

        `;

    }


    // =====================================================
    // Percentage
    // =====================================================

    function getPercentage(
        result
    ) {

        if (
            result.percentage !==
            undefined &&
            result.percentage !==
            null
        ) {

            const percentage =
                Number(
                    result.percentage
                );


            if (
                Number.isFinite(
                    percentage
                )
            ) {

                return percentage;

            }

        }


        const score =
            Number(
                result.score || 0
            );


        const total =
            Number(
                result.total || 0
            );


        if (
            total > 0
        ) {

            return (
                score /
                total
            ) * 100;

        }


        return 0;

    }


    // =====================================================
    // Rank
    // =====================================================

    function getRank(
        result
    ) {

        if (
            result.rank ===
            undefined ||
            result.rank ===
            null
        ) {

            return null;

        }


        const rank =
            Number(
                result.rank
            );


        if (
            !Number.isFinite(
                rank
            ) ||
            rank <= 0
        ) {

            return null;

        }


        return rank;

    }


    // =====================================================
    // Rank Class
    // =====================================================

    function getRankClass(
        rank
    ) {

        if (
            rank === 1
        ) {

            return "gold";

        }


        if (
            rank === 2
        ) {

            return "silver";

        }


        if (
            rank === 3
        ) {

            return "bronze";

        }


        return "";

    }


    // =====================================================
    // Timestamp
    // =====================================================

    function getTimestamp(
        value
    ) {

        if (!value) {

            return 0;

        }


        if (
            typeof value.toMillis ===
            "function"
        ) {

            return value.toMillis();

        }


        if (
            typeof value.toDate ===
            "function"
        ) {

            return value
                .toDate()
                .getTime();

        }


        if (
            value.seconds !==
            undefined
        ) {

            return (
                Number(
                    value.seconds
                ) * 1000
            );

        }


        const date =
            new Date(
                value
            );


        const time =
            date.getTime();


        return Number.isNaN(
            time
        )
            ? 0
            : time;

    }

</script></body></html>
