<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الترتيب | مسار التمريض</title>

<style>

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f3f8fb;
}

.page {
    padding: 25px;
}

.panel {
    background: white;
    border-radius: 15px;
    border: 1px solid #e3edf2;
    padding: 20px;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 14px 5px;
    border-bottom: 1px solid #edf1f4;
}

.empty {
    text-align: center;
    color: #71808d;
    padding: 30px;
}

</style>

</head>

<body>

<div id="studentApp"></div>

<script type="module">

import {
    protectStudentPage,
    createStudentLayout,
    getCollection,
    escapeHtml,
    studentErrorMessage
} from "../src/student/student.js";


const {
    student
} = await protectStudentPage();


createStudentLayout(
    student,
    "leaderboard"
);


document.getElementById(
    "studentPageTitle"
).textContent =
    "الترتيب";


const content =
    document.getElementById(
        "studentPageContent"
    );


content.innerHTML = `

<div class="page">

    <div class="panel">

        <h2>
            🏆 ترتيب الطلاب
        </h2>

        <div id="leaderboard">
            جاري تحميل الترتيب...
        </div>

    </div>

</div>

`;


/*
 * لا نعرض بيانات الطلاب الآخرين
 * إلا طبقًا لما تسمح به Firestore Rules.
 *
 * عند تثبيت شكل نتائج الاختبارات النهائي،
 * يتم احتساب الـLeaderboard منها.
 */

document.getElementById(
    "leaderboard"
).innerHTML = `

<div class="empty">

    سيتم عرض ترتيبك هنا
    بعد تفعيل بيانات نتائج الاختبارات.

    <br><br>

    حسابك الحالي:
    <strong>
        ${escapeHtml(
            student.name ||
            "الطالب"
        )}
    </strong>

</div>

`;

</script>

</body>
</html>
