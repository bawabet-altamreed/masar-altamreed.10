<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    الترتيب | مسار التمريض
</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family:
            Arial,
            Tahoma,
            sans-serif;

        background: #f3f8fb;

        color: #17324a;
    }


    /* ================================
       Page
    ================================= */

    .ranking-page {
        padding: 25px;
    }


    /* ================================
       Header
    ================================= */

    .ranking-header {
        background:
            linear-gradient(
                135deg,
                #087ea4,
                #075f7c
            );

        color: white;

        border-radius: 18px;

        padding: 25px;

        margin-bottom: 20px;
    }

    .ranking-header h2 {
        font-size: 22px;

        margin-bottom: 8px;

        line-height: 1.6;
    }

    .ranking-header p {
        font-size: 13px;

        opacity: .9;

        line-height: 1.8;
    }


    /* ================================
       Filters
    ================================= */

    .filters {
        background: white;

        border:
            1px solid
            #e4edf2;

        border-radius: 15px;

        padding: 18px;

        margin-bottom: 18px;

        display: grid;

        grid-template-columns:
            repeat(
                2,
                minmax(0, 1fr)
            );

        gap: 12px;
    }

    .filter-group {
        display: flex;

        flex-direction: column;

        gap: 7px;
    }

    .filter-group label {
        font-size: 11px;

        color: #71808d;

        font-weight: bold;
    }

    .filter-group select {
        width: 100%;

        height: 42px;

        border:
            1px solid
            #dce7ed;

        border-radius: 9px;

        padding: 0 12px;

        background: white;

        color: #17324a;

        outline: none;
    }

    .filter-group select:focus {
        border-color: #087ea4;
    }


    /* ================================
       Stats
    ================================= */

    .ranking-stats {
        display: grid;

        grid-template-columns:
            repeat(
                3,
                minmax(0, 1fr)
            );

        gap: 12px;

        margin-bottom: 18px;
    }

    .stat {
        background: white;

        border:
            1px solid
            #e4edf2;

        border-radius: 14px;

        padding: 18px;

        text-align: center;
    }

    .stat span {
        display: block;

        color: #71808d;

        font-size: 11px;

        margin-bottom: 7px;
    }

    .stat strong {
        display: block;

        color: #087ea4;

        font-size: 24px;
    }


    /* ================================
       Ranking Table
    ================================= */

    .ranking-card {
        background: white;

        border:
            1px solid
            #e4edf2;

        border-radius: 17px;

        overflow: hidden;
    }

    .ranking-card-header {
        padding: 18px;

        border-bottom:
            1px solid
            #edf1f4;

        display: flex;

        justify-content:
            space-between;

        align-items: center;

        gap: 10px;
    }

    .ranking-card-header h3 {
        font-size: 16px;
    }

    .ranking-card-header span {
        color: #71808d;

        font-size: 11px;
    }


    /* ================================
       Table
    ================================= */

    .table-wrapper {
        width: 100%;

        overflow-x: auto;
    }

    table {
        width: 100%;

        border-collapse: collapse;

        min-width: 650px;
    }

    th {
        background: #f7fafc;

        color: #71808d;

        font-size: 11px;

        font-weight: bold;

        padding: 13px 12px;

        text-align: right;

        white-space: nowrap;
    }

    td {
        padding: 14px 12px;

        border-top:
            1px solid
            #edf1f4;

        font-size: 12px;

        vertical-align: middle;
    }

    tbody tr:hover {
        background: #f9fcfd;
    }


    /* ================================
       Rank
    ================================= */

    .rank {
        width: 40px;

        height: 40px;

        border-radius: 10px;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        font-weight: bold;

        background: #eef8fb;

        color: #087ea4;
    }

    .rank.first {
        background: #fff7d6;

        color: #a47700;
    }

    .rank.second {
        background: #f0f2f4;

        color: #68737d;
    }

    .rank.third {
        background: #fff0e5;

        color: #a55a22;
    }


    /* ================================
       Student
    ================================= */

    .student-name {
        font-weight: bold;

        color: #17324a;

        margin-bottom: 4px;
    }

    .student-id {
        color: #8a98a3;

        font-size: 10px;
    }


    /* ================================
       Score
    ================================= */

    .score {
        font-weight: bold;

        color: #087ea4;

        font-size: 14px;
    }

    .percentage {
        font-weight: bold;

        color: #16834f;
    }


    /* ================================
       Exam / Stage
    ================================= */

    .exam-title {
        font-weight: bold;

        margin-bottom: 4px;
    }

    .subject {
        color: #8795a0;

        font-size: 10px;
    }

    .stage {
        display: inline-block;

        background: #eef8fb;

        color: #087ea4;

        padding: 5px 8px;

        border-radius: 7px;

        font-size: 10px;
    }


    /* ================================
       Empty / Loading / Error
    ================================= */

    .state-box {
        background: white;

        border:
            1px solid
            #e4edf2;

        border-radius: 15px;

        padding: 45px 20px;

        text-align: center;

        color: #8795a0;

        font-size: 13px;

        line-height: 2;
    }

    .error-box {
        background: #fff1f1;

        border-color: #ffd5d5;

        color: #b42318;
    }


    /* ================================
       Buttons
    ================================= */

    .button {
        display: inline-flex;

        align-items: center;

        justify-content: center;

        min-height: 40px;

        padding:
            0 16px;

        border: none;

        border-radius: 9px;

        background: #087ea4;

        color: white;

        text-decoration: none;

        font-size: 11px;

        font-weight: bold;

        cursor: pointer;
    }

    .button:hover {
        background: #075f7c;
    }


    /* ================================
       Responsive
    ================================= */

    @media (max-width: 700px) {

        .ranking-page {
            padding: 15px;
        }

        .filters {
            grid-template-columns: 1fr;
        }

        .ranking-stats {
            grid-template-columns: 1fr;
        }

        .ranking-header {
            padding: 20px;
        }

        .ranking-header h2 {
            font-size: 19px;
        }

    }

</style>

</head><body><div id="studentApp"></div><script type="module">

    import {
        protectStudentPage,
        createStudentLayout,
        escapeHtml,
        studentErrorMessage
    } from "../src/student/student.js";


    import {
        db
    } from "../src/firebase/init.js";


    import {
        collection,
        getDocs
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =====================================================
       Global State
    ===================================================== */

    let student = null;

    let allResults = [];

    let filteredResults = [];

    let selectedExamId = "";

    let selectedStageId = "";


    /* =====================================================
       Start
    ===================================================== */

    try {

        const result =
            await protectStudentPage();


        student =
            result.student;


        createStudentLayout(
            student,
            "ranking"
        );


        document.getElementById(
            "studentPageTitle"
        ).textContent =
            "الترتيب";


        const content =
            document.getElementById(
                "studentPageContent"
            );


        content.innerHTML = `

            <div class="ranking-page">

                <div
                    id="rankingHeader"
                    class="ranking-header"
                >

                    <h2>
                        🏆 ترتيب الطلاب
                    </h2>

                    <p>
                        تابع ترتيبك في الاختبارات
                        بناءً على النسبة المئوية
                        ثم الدرجة.
                    </p>

                </div>


                <div
                    id="filters"
                    class="filters"
                >

                    <div class="filter-group">

                        <label>
                            الاختبار
                        </label>

                        <select
                            id="examFilter"
                        >

                            <option value="">
                                كل الاختبارات
                            </option>

                        </select>

                    </div>


                    <div class="filter-group">

                        <label>
                            المرحلة الدراسية
                        </label>

                        <select
                            id="stageFilter"
                        >

                            <option value="">
                                كل المراحل
                            </option>

                        </select>

                    </div>

                </div>


                <div
                    id="rankingStats"
                    class="ranking-stats"
                ></div>


                <div
                    id="rankingContainer"
                >

                    <div class="state-box">

                        ⏳

                        <br>

                        جاري تحميل الترتيب...

                    </div>

                </div>

            </div>

        `;


        bindFilters();


        await loadResults();


    } catch (error) {

        console.error(
            "Student ranking error:",
            error
        );

    }


    /* =====================================================
       Load Results
    ===================================================== */

    async function loadResults() {

        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "examResults"
                    )
                );


            allResults =
                snapshot.docs
                    .map(
                        docSnapshot => ({

                            id:
                                docSnapshot.id,

                            ...docSnapshot.data()

                        })
                    )
                    .filter(
                        result =>
                            result.examId
                    );


            buildFilters();


            applyFilters();


        } catch (error) {

            console.error(
                "Load ranking error:",
                error
            );


            document.getElementById(
                "rankingContainer"
            ).innerHTML = `

                <div
                    class="
                        state-box
                        error-box
                    "
                >

                    ⚠️

                    <br>

                    حدث خطأ أثناء تحميل الترتيب.

                    <br><br>

                    ${escapeHtml(
                        studentErrorMessage(
                            error
                        )
                    )}

                </div>

            `;

        }

    }


    /* =====================================================
       Build Filters
    ===================================================== */

    function buildFilters() {

        const examSelect =
            document.getElementById(
                "examFilter"
            );


        const stageSelect =
            document.getElementById(
                "stageFilter"
            );


        const examMap =
            new Map();


        const stageMap =
            new Map();


        allResults.forEach(
            result => {

                if (
                    result.examId
                ) {

                    examMap.set(
                        result.examId,
                        result.examTitle ||
                        "اختبار"
                    );

                }


                if (
                    result.stageId
                ) {

                    stageMap.set(
                        result.stageId,
                        result.stageId
                    );

                }

            }
        );


        examMap.forEach(
            (title, id) => {

                examSelect.insertAdjacentHTML(
                    "beforeend",

                    `

                    <option
                        value="${escapeHtml(id)}"
                    >

                        ${escapeHtml(title)}

                    </option>

                    `

                );

            }
        );


        stageMap.forEach(
            (stage, id) => {

                stageSelect.insertAdjacentHTML(
                    "beforeend",

                    `

                    <option
                        value="${escapeHtml(id)}"
                    >

                        ${escapeHtml(stage)}

                    </option>

                    `

                );

            }
        );


        /*
         * لو دخلنا الصفحة بهذا الشكل:
         *
         * ranking.html?examId=XXXX
         *
         * يتم اختيار الاختبار تلقائيًا.
         */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const examId =
            params.get(
                "examId"
            );


        const stageId =
            params.get(
                "stageId"
            );


        if (
            examId &&
            examMap.has(examId)
        ) {

            examSelect.value =
                examId;

            selectedExamId =
                examId;

        }


        if (
            stageId &&
            stageMap.has(stageId)
        ) {

            stageSelect.value =
                stageId;

            selectedStageId =
                stageId;

        }

    }


    /* =====================================================
       Filters Events
    ===================================================== */

    function bindFilters() {

        const examFilter =
            document.getElementById(
                "examFilter"
            );


        const stageFilter =
            document.getElementById(
                "stageFilter"
            );


        examFilter.addEventListener(
            "change",
            () => {

                selectedExamId =
                    examFilter.value;

                applyFilters();

            }
        );


        stageFilter.addEventListener(
            "change",
            () => {

                selectedStageId =
                    stageFilter.value;

                applyFilters();

            }
        );

    }


    /* =====================================================
       Apply Filters
    ===================================================== */

    function applyFilters() {

        filteredResults =
            allResults.filter(
                result => {

                    const examMatch =
                        !selectedExamId ||
                        result.examId ===
                        selectedExamId;


                    const stageMatch =
                        !selectedStageId ||
                        result.stageId ===
                        selectedStageId;


                    return (
                        examMatch &&
                        stageMatch
                    );

                }
            );


        /*
         * مهم:
         *
         * الترتيب:
         *
         * 1- percentage تنازلي
         * 2- score تنازلي
         *
         * وفي حالة التعادل:
         * submittedAt الأقدم أولًا.
         */

        filteredResults.sort(
            (a, b) => {

                const percentageA =
                    Number(
                        a.percentage || 0
                    );


                const percentageB =
                    Number(
                        b.percentage || 0
                    );


                if (
                    percentageB !==
                    percentageA
                ) {

                    return (
                        percentageB -
                        percentageA
                    );

                }


                const scoreA =
                    Number(
                        a.score || 0
                    );


                const scoreB =
                    Number(
                        b.score || 0
                    );


                if (
                    scoreB !==
                    scoreA
                ) {

                    return (
                        scoreB -
                        scoreA
                    );

                }


                return (
                    getTimestamp(
                        a.submittedAt
                    ) -
                    getTimestamp(
                        b.submittedAt
                    )
                );

            }
        );


        /*
         * منع تكرار الطالب في نفس
         * الاختبار والمرحلة.
         */

        filteredResults =
            removeDuplicateStudents(
                filteredResults
            );


        renderStats();

        renderRanking();

    }


    /* =====================================================
       Remove Duplicate Students
    ===================================================== */

    function removeDuplicateStudents(
        results
    ) {

        const unique =
            new Map();


        results.forEach(
            result => {

                const key =
                    [
                        result.examId || "",
                        result.stageId || "",
                        result.studentId || ""
                    ].join("_");


                if (
                    !unique.has(key)
                ) {

                    unique.set(
                        key,
                        result
                    );

                }

            }
        );


        return Array.from(
            unique.values()
        );

    }


    /* =====================================================
       Render Stats
    ===================================================== */

    function renderStats() {

        const container =
            document.getElementById(
                "rankingStats"
            );


        if (!container) {
            return;
        }


        const count =
            filteredResults.length;


        const average =
            count
                ? (
                    filteredResults.reduce(
                        (
                            total,
                            result
                        ) =>
                            total +
                            Number(
                                result.percentage ||
                                0
                            ),
                        0
                    ) / count
                ).toFixed(1)
                : 0;


        const highest =
            count
                ? Number(
                    filteredResults[0]
                        .percentage || 0
                ).toFixed(2)
                : 0;


        container.innerHTML = `

            <div class="stat">

                <span>
                    عدد الطلاب
                </span>

                <strong>
                    ${count}
                </strong>

            </div>


            <div class="stat">

                <span>
                    أعلى نسبة
                </span>

                <strong>
                    ${highest}%
                </strong>

            </div>


            <div class="stat">

                <span>
                    متوسط النتائج
                </span>

                <strong>
                    ${average}%
                </strong>

            </div>

        `;

    }


    /* =====================================================
       Render Ranking
    ===================================================== */

    function renderRanking() {

        const container =
            document.getElementById(
                "rankingContainer"
            );


        if (!container) {
            return;
        }


        if (
            !filteredResults.length
        ) {

            container.innerHTML = `

                <div class="state-box">

                    🏆

                    <br>

                    لا توجد نتائج متاحة
                    للترتيب حاليًا.

                </div>

            `;

            return;

        }


        const first =
            filteredResults[0];


        const examTitle =
            first.examTitle ||
            "الاختبارات";


        container.innerHTML = `

            <div class="ranking-card">

                <div
                    class="ranking-card-header"
                >

                    <h3>
                        🏆 ترتيب الطلاب
                    </h3>

                    <span>
                        ${escapeHtml(
                            examTitle
                        )}
                    </span>

                </div>


                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    المركز
                                </th>

                                <th>
                                    الطالب
                                </th>

                                <th>
                                    المرحلة
                                </th>

                                <th>
                                    الاختبار
                                </th>

                                <th>
                                    الدرجة
                                </th>

                                <th>
                                    النسبة
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            ${

                                filteredResults
                                    .map(
                                        (
                                            result,
                                            index
                                        ) =>
                                            renderRow(
                                                result,
                                                index
                                            )
                                    )
                                    .join("")

                            }

                        </tbody>

                    </table>

                </div>

            </div>

        `;

    }


    /* =====================================================
       Render Row
    ===================================================== */

    function renderRow(
        result,
        index
    ) {

        const rank =
            index + 1;


        let rankClass = "";


        if (rank === 1) {
            rankClass = "first";
        }

        if (rank === 2) {
            rankClass = "second";
        }

        if (rank === 3) {
            rankClass = "third";
        }


        const studentName =
            result.studentName ||
            "طالب";


        const studentId =
            result.studentId ||
            "—";


        const stage =
            result.stageId ||
            "—";


        const examTitle =
            result.examTitle ||
            "اختبار";


        const subject =
            result.subject ||
            "";


        const score =
            Number(
                result.score || 0
            );


        const total =
            Number(
                result.total || 0
            );


        const percentage =
            Number(
                result.percentage || 0
            );


        const isCurrentStudent =
            studentId ===
            student.id;


        return `

            <tr
                ${
                    isCurrentStudent
                        ? 'style="background:#f0fbfd;"'
                        : ""
                }
            >

                <td>

                    <span
                        class="
                            rank
                            ${rankClass}
                        "
                    >

                        ${rank}

                    </span>

                </td>


                <td>

                    <div
                        class="student-name"
                    >

                        ${escapeHtml(
                            studentName
                        )}

                        ${
                            isCurrentStudent
                                ? " ⭐"
                                : ""
                        }

                    </div>

                    <div
                        class="student-id"
                    >

                        ${escapeHtml(
                            String(
                                studentId
                            )
                        )}

                    </div>

                </td>


                <td>

                    <span
                        class="stage"
                    >

                        ${escapeHtml(
                            String(
                                stage
                            )
                        )}

                    </span>

                </td>


                <td>

                    <div
                        class="exam-title"
                    >

                        ${escapeHtml(
                            examTitle
                        )}

                    </div>

                    ${
                        subject
                            ? `
                                <div
                                    class="subject"
                                >
                                    ${escapeHtml(
                                        subject
                                    )}
                                </div>
                            `
                            : ""
                    }

                </td>


                <td>

                    <span
                        class="score"
                    >

                        ${score}

                        /

                        ${total}

                    </span>

                </td>


                <td>

                    <span
                        class="percentage"
                    >

                        ${percentage}%

                    </span>

                </td>

            </tr>

        `;

    }


    /* =====================================================
       Timestamp Helper
    ===================================================== */

    function getTimestamp(
        value
    ) {

        if (!value) {
            return 0;
        }


        if (
            typeof value.toMillis ===
            "function"
        ) {

            return value.toMillis();

        }


        if (
            value.seconds !==
            undefined
        ) {

            return (
                Number(
                    value.seconds
                ) * 1000
            );

        }


        const date =
            new Date(
                value
            );


        const time =
            date.getTime();


        return Number.isNaN(
            time
        )
            ? 0
            : time;

    }

</script></body></html>
