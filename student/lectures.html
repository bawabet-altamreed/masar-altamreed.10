<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    المحاضرات | مسار التمريض
</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    background: #f3f8fb;
    color: #17324a;
}

.lectures-page {
    padding: 25px;
    max-width: 1100px;
    margin: auto;
}

.lectures-header {
    background: linear-gradient(
        135deg,
        #087ea4,
        #075f7c
    );

    color: white;
    border-radius: 18px;
    padding: 27px;
    margin-bottom: 18px;
}

.lectures-header h2 {
    font-size: 23px;
    margin-bottom: 8px;
}

.lectures-header p {
    font-size: 13px;
    line-height: 1.8;
}

.search-box {
    background: white;
    border: 1px solid #e4edf2;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 16px;
}

.search-box input {
    width: 100%;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 13px;
}

.lectures-grid {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.lecture-card {
    background: white;
    border: 1px solid #e4edf2;
    border-radius: 17px;
    padding: 20px;
    box-shadow:
        0 5px 18px
        rgba(23, 50, 74, .04);
}

.lecture-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
}

.lecture-info {
    color: #82919d;
    font-size: 10px;
    line-height: 1.9;
    margin-bottom: 13px;
}

.lecture-description {
    color: #536674;
    font-size: 11px;
    line-height: 1.9;
    margin-bottom: 15px;
}

.lecture-meta {
    display: grid;
    grid-template-columns:
        repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.lecture-meta div {
    background: #f7fafc;
    border-radius: 9px;
    padding: 10px;
    text-align: center;
}

.lecture-meta span {
    display: block;
    color: #82919d;
    font-size: 9px;
    margin-bottom: 4px;
}

.lecture-meta strong {
    font-size: 11px;
}

.badge {
    display: inline-block;
    padding: 6px 9px;
    border-radius: 8px;
    font-size: 9px;
    font-weight: bold;
    margin-bottom: 12px;
}

.badge.live {
    background: #fff1f1;
    color: #b42318;
}

.badge.upcoming {
    background: #eef8fb;
    color: #087ea4;
}

.badge.finished {
    background: #eef8f1;
    color: #16834f;
}

.actions {
    display: grid;
    gap: 8px;
}

.action-button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 11px;
    background: #087ea4;
    color: white;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
}

.action-button.secondary {
    background: #eaf7fb;
    color: #087ea4;
}

.state-box {
    background: white;
    border: 1px solid #e4edf2;
    border-radius: 15px;
    padding: 45px 20px;
    text-align: center;
    color: #8795a0;
    line-height: 2;
}

.error-box {
    color: #b42318;
    background: #fff1f1;
    border-color: #ffd5d5;
}

@media (max-width: 700px) {

    .lectures-page {
        padding: 15px;
    }

    .lectures-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div id="studentApp">
    جاري تحميل المنصة...
</div>


<script type="module">

import {
    protectStudentPage,
    createStudentLayout,
    getStudentLectures,
    getLectureExams,
    escapeHtml,
    formatDateTime,
    studentErrorMessage,
    getTimestamp
} from "../src/student/student.js";


let student = null;
let lectures = [];
let allExams = [];
let searchTerm = "";


try {

    const result =
        await protectStudentPage();


    student =
        result.student;


    createStudentLayout(
        student,
        "lectures"
    );


    document.getElementById(
        "studentPageTitle"
    ).textContent =
        "المحاضرات";


    document.getElementById(
        "studentPageSubtitle"
    ).textContent =
        "المحاضرات المنشورة لمرحلتك";


    const content =
        document.getElementById(
            "studentPageContent"
        );


    content.innerHTML = `

        <div class="lectures-page">

            <div class="lectures-header">

                <h2>
                    🎓 المحاضرات
                </h2>

                <p>
                    جميع المحاضرات المنشورة
                    الخاصة بمرحلتك الدراسية.
                </p>

            </div>


            <div class="search-box">

                <input
                    id="searchInput"
                    type="search"
                    placeholder="ابحث عن محاضرة أو مدرس أو مادة..."
                >

            </div>


            <div id="lecturesContainer">

                <div class="state-box">

                    ⏳

                    <br>

                    جاري تحميل المحاضرات...

                </div>

            </div>

        </div>

    `;


    lectures =
        await getStudentLectures(
            student.stageId
        );


    await loadExams();


    renderLectures();


    document.getElementById(
        "searchInput"
    ).addEventListener(
        "input",
        event => {

            searchTerm =
                event.target.value
                    .trim()
                    .toLowerCase();

            renderLectures();

        }
    );


} catch (error) {

    console.error(
        "Student lectures error:",
        error
    );


    document.getElementById(
        "studentApp"
    ).innerHTML = `

        <div class="state-box error-box">

            ⚠️

            <br>

            ${escapeHtml(
                studentErrorMessage(
                    error
                )
            )}

        </div>

    `;

}


// =====================================================
// Load Exams
// =====================================================

async function loadExams() {

    const examArrays =
        await Promise.all(
            lectures.map(
                lecture =>
                    getLectureExams(
                        lecture.id
                    )
            )
        );


    allExams =
        examArrays.flat();

}


// =====================================================
// Render
// =====================================================

function renderLectures() {

    const container =
        document.getElementById(
            "lecturesContainer"
        );


    if (!container) {
        return;
    }


    const filtered =
        lectures
            .filter(
                lecture => {

                    if (!searchTerm) {
                        return true;
                    }


                    const text = [

                        lecture.title,

                        lecture.teacherName,

                        lecture.teacherId,

                        lecture.subjectId,

                        lecture.description

                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    return text.includes(
                        searchTerm
                    );

                }
            )
            .sort(
                (
                    a,
                    b
                ) =>
                    getTimestamp(
                        a.date
                    ) -
                    getTimestamp(
                        b.date
                    )
            );


    if (!filtered.length) {

        container.innerHTML = `

            <div class="state-box">

                🔎

                <br>

                لا توجد محاضرات مطابقة للبحث.

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <div class="lectures-grid">

            ${filtered.map(
                lecture =>
                    createLectureCard(
                        lecture
                    )
            ).join("")}

        </div>

    `;

}


// =====================================================
// Lecture Card
// =====================================================

function createLectureCard(
    lecture
) {

    const date =
        getLectureStatus(
            lecture
        );


    const exams =
        allExams.filter(
            exam =>
                exam.lectureId ===
                lecture.id
        );


    const hasExam =
        exams.length > 0;


    return `

        <article class="lecture-card">

            <div class="lecture-title">

                🎓

                ${escapeHtml(
                    lecture.title ||
                    "محاضرة"
                )}

            </div>


            <div class="lecture-info">

                📚 المادة:
                ${escapeHtml(
                    lecture.subjectId ||
                    "غير محدد"
                )}

                <br>

                👨‍🏫 المدرس:
                ${escapeHtml(
                    lecture.teacherName ||
                    lecture.teacherId ||
                    "غير محدد"
                )}

                <br>

                📅 الموعد:
                ${escapeHtml(
                    formatDateTime(
                        lecture.date
                    )
                )}

            </div>


            <span class="badge ${date.className}">

                ${date.text}

            </span>


            ${
                lecture.description
                    ? `
                        <div class="lecture-description">

                            ${escapeHtml(
                                lecture.description
                            )}

                        </div>
                    `
                    : ""
            }


            <div class="lecture-meta">

                <div>

                    <span>
                        البث
                    </span>

                    <strong>
                        ${
                            lecture.isLive
                                ? "🔴 مباشر"
                                : "غير مباشر"
                        }
                    </strong>

                </div>


                <div>

                    <span>
                        التسجيل
                    </span>

                    <strong>
                        ${
                            lecture.recordingUrl
                                ? "🎥 متاح"
                                : "غير متاح"
                        }
                    </strong>

                </div>

            </div>


            <div class="actions">

                ${
                    lecture.isLive &&
                    lecture.roomName
                        ? `
                            <button
                                class="action-button"
                                onclick="joinLecture('${lecture.id}')"
                            >
                                🔴 دخول المحاضرة
                            </button>
                        `
                        : ""
                }


                ${
                    lecture.recordingUrl
                        ? `
                            <button
                                class="action-button secondary"
                                onclick="openRecording('${escapeHtml(
                                    lecture.recordingUrl
                                )}')"
                            >
                                🎥 مشاهدة التسجيل
                            </button>
                        `
                        : ""
                }


                ${
                    hasExam
                        ? `
                            <button
                                class="action-button secondary"
                                onclick="openLectureExam('${exams[0].id}')"
                            >
                                📝 اختبار المحاضرة
                            </button>
                        `
                        : ""
                }

            </div>

        </article>

    `;

}


// =====================================================
// Status
// =====================================================

function getLectureStatus(
    lecture
) {

    if (
        lecture.isLive === true
    ) {

        return {

            text:
                "🔴 المحاضرة مباشرة الآن",

            className:
                "live"

        };

    }


    const time =
        getTimestamp(
            lecture.date
        );


    if (
        time &&
        time > Date.now()
    ) {

        return {

            text:
                "📅 محاضرة قادمة",

            className:
                "upcoming"

        };

    }


    return {

        text:
            "✓ المحاضرة متاحة",

        className:
            "finished"

    };

}


// =====================================================
// Actions
// =====================================================

window.joinLecture =
    function(lectureId) {

        /*
         * LiveKit سيتم ربطه هنا
         * بعد تجهيز الـBackend.
         */

        window.location.href =
            `live.html?lectureId=${encodeURIComponent(
                lectureId
            )}`;

    };


window.openRecording =
    function(url) {

        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );

    };


window.openLectureExam =
    function(examId) {

        window.location.href =
            `exam.html?id=${encodeURIComponent(
                examId
            )}`;

    };

</script>

</body>
</html>
