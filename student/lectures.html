<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        المحاضرات | مسار التمريض
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f3f8fb;
            color: #17324a;
        }

        .student-app {
            min-height: 100vh;
            display: flex;
        }

        .student-sidebar {
            width: 250px;
            background: #ffffff;
            border-left: 1px solid #e3edf2;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
        }

        .student-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .student-brand-icon {
            width: 45px;
            height: 45px;
            border-radius: 13px;
            background: #087ea4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .student-brand strong {
            display: block;
            font-size: 15px;
        }

        .student-brand small {
            display: block;
            color: #82919d;
            margin-top: 3px;
            font-size: 10px;
            direction: ltr;
        }

        .student-user {
            background: #f4f9fb;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .student-avatar,
        .header-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #087ea4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .student-user strong {
            display: block;
            font-size: 12px;
        }

        .student-user small {
            display: block;
            color: #82919d;
            margin-top: 4px;
            font-size: 10px;
        }

        .student-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .student-nav a {
            text-decoration: none;
            color: #60717f;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        .student-nav a:hover,
        .student-nav a.active {
            background: #eaf7fb;
            color: #087ea4;
        }

        .student-logout {
            margin-top: auto;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #fff1f1;
            color: #b42318;
            cursor: pointer;
            font-weight: bold;
        }

        .student-main {
            flex: 1;
            margin-right: 250px;
        }

        .student-header {
            min-height: 82px;
            background: #ffffff;
            border-bottom: 1px solid #e3edf2;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .student-header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .student-header p {
            color: #81909c;
            font-size: 12px;
        }

        .student-header-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 12px;
        }

        .student-content {
            padding: 25px;
        }

        .page-intro {
            background: linear-gradient(
                135deg,
                #087ea4,
                #075f7c
            );
            color: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .page-intro h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .page-intro p {
            font-size: 13px;
            opacity: .9;
            line-height: 1.8;
        }

        .filters {
            background: #ffffff;
            border: 1px solid #e4edf2;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search {
            width: 100%;
            height: 44px;
            border: 1px solid #d7e3eb;
            border-radius: 9px;
            padding: 0 13px;
            font-size: 13px;
            outline: none;
        }

        .search:focus {
            border-color: #087ea4;
        }

        .lectures-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .lecture-card {
            background: #ffffff;
            border: 1px solid #e4edf2;
            border-radius: 16px;
            padding: 20px;
        }

        .lecture-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: #eaf7fb;
            color: #087ea4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 14px;
        }

        .lecture-card h3 {
            font-size: 16px;
            margin-bottom: 7px;
            line-height: 1.6;
        }

        .subject {
            color: #087ea4;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .details {
            border-top: 1px solid #edf1f4;
            padding-top: 13px;
        }

        .detail {
            display: flex;
            gap: 8px;
            color: #617381;
            font-size: 12px;
            margin-bottom: 9px;
        }

        .description {
            margin-top: 13px;
            padding: 11px;
            background: #f7fafc;
            border-radius: 9px;
            color: #687783;
            font-size: 11px;
            line-height: 1.8;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            margin-top: 10px;
        }

        .live {
            background: #eaf8f0;
            color: #16834f;
        }

        .upcoming {
            background: #eef8fb;
            color: #087ea4;
        }

        .ended {
            background: #f1f3f5;
            color: #687783;
        }

        .cancelled {
            background: #fff1f1;
            color: #b42318;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .button {
            flex: 1;
            height: 40px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: none;
            font-size: 12px;
            font-weight: bold;
        }

        .live-button {
            background: #087ea4;
            color: white;
        }

        .recording-button {
            background: #eef8fb;
            color: #087ea4;
        }

        .disabled {
            background: #edf1f4;
            color: #8795a0;
        }

        .empty,
        .loading,
        .error {
            grid-column: 1 / -1;
            background: white;
            border: 1px solid #e4edf2;
            border-radius: 15px;
            padding: 45px 20px;
            text-align: center;
            color: #8795a0;
            font-size: 13px;
            line-height: 2;
        }

        .error {
            background: #fff1f1;
            color: #b42318;
            border-color: #ffd5d5;
        }

        @media (max-width: 900px) {

            .student-sidebar {
                width: 210px;
            }

            .student-main {
                margin-right: 210px;
            }

            .lectures-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 650px) {

            .student-sidebar {
                position: static;
                width: 100%;
            }

            .student-app {
                display: block;
            }

            .student-main {
                margin-right: 0;
            }

            .student-nav {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }

            .student-header {
                padding: 15px;
            }

            .student-content {
                padding: 15px;
            }

        }

    </style>

</head>

<body>

<div
    id="studentApp"
    class="student-app"
>
    جاري تحميل المنصة...
</div>


<script type="module">

    import {
        protectStudentPage,
        createStudentLayout,
        escapeHtml,
        formatDateTime,
        studentErrorMessage
    } from "../src/student/student.js";


    import {
        db
    } from "../src/firebase/init.js";


    import {
        collection,
        query,
        where,
        getDocs
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    try {

        const {
            student
        } =
            await protectStudentPage();


        createStudentLayout(
            student,
            "lectures"
        );


        document.getElementById(
            "studentPageTitle"
        ).textContent =
            "المحاضرات";


        const content =
            document.getElementById(
                "studentPageContent"
            );


        content.innerHTML = `

            <div class="page-intro">

                <h2>
                    🎥 المحاضرات
                </h2>

                <p>
                    جميع المحاضرات التعليمية المتاحة
                    لمرحلتك الدراسية.
                </p>

            </div>


            <div class="filters">

                <input
                    id="search"
                    class="search"
                    type="search"
                    placeholder="ابحث عن محاضرة أو مادة أو مدرس..."
                >

            </div>


            <div
                id="container"
                class="lectures-grid"
            >

                <div class="loading">
                    ⏳ جاري تحميل المحاضرات...
                </div>

            </div>

        `;


        const container =
            document.getElementById(
                "container"
            );


        const search =
            document.getElementById(
                "search"
            );


        // =================================================
        // Secure Student Query
        // =================================================

        const lecturesQuery =
            query(

                collection(
                    db,
                    "lectures"
                ),

                where(
                    "stageId",
                    "==",
                    student.stageId
                ),

                where(
                    "isPublished",
                    "==",
                    true
                )

            );


        const snapshot =
            await getDocs(
                lecturesQuery
            );


        const lectures =
            snapshot.docs
                .map(
                    item => ({
                        id: item.id,
                        ...item.data()
                    })
                )
                .sort(
                    (a, b) =>
                        getTime(
                            b.scheduledAt
                        ) -
                        getTime(
                            a.scheduledAt
                        )
                );


        render();


        search.addEventListener(
            "input",
            render
        );


        function render() {

            const value =
                search.value
                    .trim()
                    .toLowerCase();


            const filtered =
                lectures.filter(
                    lecture => {

                        const title =
                            String(
                                lecture.title ||
                                ""
                            ).toLowerCase();


                        const subject =
                            String(
                                lecture.subject ||
                                lecture.subjectId ||
                                ""
                            ).toLowerCase();


                        const teacher =
                            String(
                                lecture.teacherId ||
                                ""
                            ).toLowerCase();


                        return (
                            !value ||
                            title.includes(value) ||
                            subject.includes(value) ||
                            teacher.includes(value)
                        );

                    }
                );


            if (!filtered.length) {

                container.innerHTML = `

                    <div class="empty">

                        🎥

                        <br>

                        لا توجد محاضرات متاحة حاليًا.

                    </div>

                `;

                return;

            }


            container.innerHTML =
                filtered
                    .map(
                        lecture =>
                            createCard(
                                lecture
                            )
                    )
                    .join("");

        }


        function createCard(
            lecture
        ) {

            const status =
                getStatus(
                    lecture
                );


            const title =
                lecture.title ||
                "محاضرة";


            const subject =
                lecture.subject ||
                lecture.subjectId ||
                "غير محدد";


            const teacher =
                lecture.teacherId ||
                "غير محدد";


            return `

                <div class="lecture-card">

                    <div class="lecture-icon">
                        🎥
                    </div>


                    <h3>
                        ${escapeHtml(title)}
                    </h3>


                    <div class="subject">
                        📚
                        ${escapeHtml(subject)}
                    </div>


                    <div class="details">

                        <div class="detail">
                            👨‍🏫
                            <span>
                                المدرس:
                                ${escapeHtml(teacher)}
                            </span>
                        </div>


                        <div class="detail">
                            🕒
                            <span>
                                ${escapeHtml(
                                    formatDateTime(
                                        lecture.scheduledAt
                                    )
                                )}
                            </span>
                        </div>

                    </div>


                    ${
                        lecture.description
                            ? `

                                <div class="description">
                                    ${escapeHtml(
                                        lecture.description
                                    )}
                                </div>

                            `
                            : ""
                    }


                    <span
                        class="
                            status
                            ${status.className}
                        "
                    >
                        ${status.label}
                    </span>


                    <div class="actions">

                        ${
                            status.key === "live" &&
                            lecture.liveUrl

                                ? `

                                    <a
                                        class="button live-button"
                                        href="${escapeHtml(
                                            lecture.liveUrl
                                        )}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >
                                        🔴 دخول Live
                                    </a>

                                `

                                : status.key === "ended" &&
                                  lecture.recordingUrl

                                ? `

                                    <a
                                        class="button recording-button"
                                        href="${escapeHtml(
                                            lecture.recordingUrl
                                        )}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >
                                        ▶️ مشاهدة التسجيل
                                    </a>

                                `

                                : `

                                    <button
                                        class="button disabled"
                                        disabled
                                    >
                                        ${
                                            status.key ===
                                            "cancelled"

                                                ? "المحاضرة ملغاة"

                                                : status.key ===
                                                  "live"

                                                ? "البث غير متاح"

                                                : "لم يبدأ البث بعد"
                                        }
                                    </button>

                                `
                        }

                    </div>

                </div>

            `;

        }


        function getStatus(
            lecture
        ) {

            if (
                lecture.status ===
                "cancelled"
            ) {

                return {
                    key: "cancelled",
                    label: "ملغاة",
                    className: "cancelled"
                };

            }


            if (
                lecture.status ===
                "live"
            ) {

                return {
                    key: "live",
                    label: "مباشر الآن",
                    className: "live"
                };

            }


            if (
                lecture.status ===
                "ended"
            ) {

                return {
                    key: "ended",
                    label: "انتهت",
                    className: "ended"
                };

            }


            const start =
                getTime(
                    lecture.scheduledAt
                );


            const end =
                getTime(
                    lecture.endAt
                );


            const now =
                Date.now();


            if (
                end &&
                now > end
            ) {

                return {
                    key: "ended",
                    label: "انتهت",
                    className: "ended"
                };

            }


            if (
                start &&
                now >= start &&
                (
                    !end ||
                    now <= end
                )
            ) {

                return {
                    key: "live",
                    label: "مباشر الآن",
                    className: "live"
                };

            }


            return {
                key: "scheduled",
                label: "قادمة",
                className: "upcoming"
            };

        }


        function getTime(
            value
        ) {

            if (!value) {
                return 0;
            }


            if (
                typeof value.toDate ===
                "function"
            ) {

                return value.toDate()
                    .getTime();

            }


            const date =
                new Date(value);


            return isNaN(
                date.getTime()
            )
                ? 0
                : date.getTime();

        }


    } catch (error) {

        console.error(
            "Student lectures error:",
            error
        );


        const app =
            document.getElementById(
                "studentApp"
            );


        if (app) {

            app.innerHTML = `

                <div
                    style="
                        width:100%;
                        min-height:100vh;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        padding:20px;
                        text-align:center;
                        font-family:Arial,Tahoma,sans-serif;
                        color:#b42318;
                    "
                >

                    ⚠️ حدث خطأ أثناء تحميل المحاضرات.

                    <br><br>

                    ${escapeHtml(
                        studentErrorMessage(
                            error
                        )
                    )}

                </div>

            `;

        }

    }

</script>

</body>
</html>
