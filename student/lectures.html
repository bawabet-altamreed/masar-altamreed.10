
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>المحاضرات | مسار التمريض</title>

<style>

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f3f8fb;
    color: #17324a;
}

.page {
    padding: 25px;
}

.lecture {
    background: white;
    border: 1px solid #e3edf2;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
}

.lecture h3 {
    margin-bottom: 10px;
}

.meta {
    color: #71808d;
    font-size: 12px;
    line-height: 1.9;
}

.button {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 15px;
    border-radius: 9px;
    background: #087ea4;
    color: white;
    text-decoration: none;
    border: 0;
    cursor: pointer;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    color: #71808d;
}

</style>

</head>

<body>

<div id="studentApp"></div>

<script type="module">

import {
    protectStudentPage,
    createStudentLayout,
    getCollection,
    escapeHtml,
    formatDateTime,
    studentErrorMessage
} from "../src/student/student.js";


const {
    student
} = await protectStudentPage();


createStudentLayout(
    student,
    "lectures"
);


document.getElementById(
    "studentPageTitle"
).textContent =
    "المحاضرات";


const content =
    document.getElementById(
        "studentPageContent"
    );


content.innerHTML = `
<div class="page">
    <div id="lectures">
        جاري تحميل المحاضرات...
    </div>
</div>
`;


try {

    const lectures =
        await getCollection(
            "lectures"
        );


    const filtered =
        lectures.filter(
            lecture =>
                !lecture.stageId ||
                lecture.stageId ===
                student.stageId
        );


    const box =
        document.getElementById(
            "lectures"
        );


    if (!filtered.length) {

        box.innerHTML =
            `<div class="empty">
                لا توجد محاضرات متاحة حاليًا.
            </div>`;

    } else {

        box.innerHTML =
            filtered
                .map(
                    lecture => {

                        const recording =
                            lecture.recordingUrl ||
                            lecture.videoUrl ||
                            lecture.recording;


                        const live =
                            lecture.liveUrl ||
                            lecture.meetingUrl;


                        return `

                        <div class="lecture">

                            <h3>
                                ${escapeHtml(
                                    lecture.title ||
                                    lecture.name ||
                                    "محاضرة"
                                )}
                            </h3>

                            <div class="meta">

                                المادة:
                                ${escapeHtml(
                                    lecture.subjectId ||
                                    lecture.subject ||
                                    "—"
                                )}

                                <br>

                                ${lecture.startAt
                                    ? "الموعد: " +
                                      formatDateTime(
                                          lecture.startAt
                                      )
                                    : ""
                                }

                            </div>


                            ${
                                live
                                    ? `
                                    <a
                                        class="button"
                                        href="${escapeHtml(
                                            live
                                        )}"
                                        target="_blank"
                                        rel="noopener"
                                    >
                                        🔴 دخول المحاضرة
                                    </a>
                                    `
                                    : ""
                            }


                            ${
                                recording
                                    ? `
                                    <a
                                        class="button"
                                        href="${escapeHtml(
                                            recording
                                        )}"
                                        target="_blank"
                                        rel="noopener"
                                    >
                                        ▶️ مشاهدة التسجيل
                                    </a>
                                    `
                                    : ""
                            }

                        </div>

                        `;

                    }
                )
                .join("");

    }

} catch (error) {

    document.getElementById(
        "lectures"
    ).innerHTML =
        `<div class="empty">
            ${escapeHtml(
                studentErrorMessage(error)
            )}
        </div>`;

}

</script>

</body>
</html>
