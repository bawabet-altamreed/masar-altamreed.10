<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    الاختبار | مسار التمريض
</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f3f8fb;
    color: #17324a;
}

.exam-page {
    max-width: 950px;
    margin: auto;
    padding: 25px;
}

.exam-header {
    background: linear-gradient(
        135deg,
        #087ea4,
        #075f7c
    );

    color: white;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 18px;
}

.exam-header h2 {
    margin: 0 0 8px;
    font-size: 22px;
}

.exam-header p {
    margin: 5px 0;
    font-size: 12px;
    line-height: 1.8;
}

.timer-box {
    position: sticky;
    top: 10px;
    z-index: 10;

    background: white;
    border: 1px solid #e4edf2;
    border-radius: 13px;

    padding: 14px 18px;
    margin-bottom: 18px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    box-shadow:
        0 5px 18px
        rgba(23, 50, 74, .05);
}

.timer {
    color: #087ea4;
    font-size: 20px;
    font-weight: bold;
}

.timer.warning {
    color: #b42318;
}

.question-card {
    background: white;
    border: 1px solid #e4edf2;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 15px;
}

.question-number {
    color: #087ea4;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 8px;
}

.question-text {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.9;
    margin-bottom: 15px;
}

.options {
    display: grid;
    gap: 9px;
}

.option {
    border: 1px solid #dfe9ee;
    background: #f8fbfc;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    transition: .2s;
}

.option:hover {
    border-color: #087ea4;
    background: #eef8fb;
}

.option.selected {
    border-color: #087ea4;
    background: #eaf7fb;
    color: #087ea4;
    font-weight: bold;
}

.submit-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    background: #087ea4;
    color: white;
    padding: 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.submit-button:hover {
    background: #075f7c;
}

.submit-button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.result-box {
    background: white;
    border: 1px solid #e4edf2;
    border-radius: 18px;
    padding: 30px;
    text-align: center;
}

.result-percentage {
    font-size: 42px;
    font-weight: bold;
    color: #087ea4;
    margin: 15px 0;
}

.result-score {
    font-size: 18px;
    margin-bottom: 20px;
}

.back-button {
    display: inline-block;
    padding: 11px 18px;
    border-radius: 10px;
    background: #087ea4;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.state-box {
    background: white;
    border: 1px solid #e4edf2;
    border-radius: 15px;
    padding: 45px 20px;
    text-align: center;
    line-height: 2;
    color: #8795a0;
}

.error-box {
    color: #b42318;
    background: #fff1f1;
    border-color: #ffd5d5;
}

@media (max-width: 600px) {

    .exam-page {
        padding: 15px;
    }

    .exam-header {
        padding: 20px;
    }

    .exam-header h2 {
        font-size: 19px;
    }

}

</style>

</head>

<body>

<div id="examApp">

    <div class="state-box">

        ⏳
        <br>
        جاري تحميل الاختبار...

    </div>

</div>


<script type="module">

import {
    protectStudentPage,
    escapeHtml,
    studentErrorMessage,
    getTimestamp
} from "../src/student/student.js";


import {
    db
} from "../src/firebase/init.js";


import {
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs,
    setDoc,
    serverTimestamp
} from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


let student = null;
let exam = null;
let lecture = null;

let questions = [];

let answers = {};

let timerInterval = null;

let remainingSeconds = 0;

let submitted = false;


const params =
    new URLSearchParams(
        window.location.search
    );


const examId =
    params.get("id");


if (!examId) {

    showError(
        "لم يتم تحديد الاختبار."
    );

} else {

    start();

}


// =====================================================
// Start
// =====================================================

async function start() {

    try {

        const result =
            await protectStudentPage();


        student =
            result.student;


        await loadExam();


        await loadPreviousResult();


        renderExam();


    } catch (error) {

        console.error(
            "Exam page error:",
            error
        );


        showError(
            studentErrorMessage(
                error
            )
        );

    }

}


// =====================================================
// Load Exam
// =====================================================

async function loadExam() {

    const examRef =
        doc(
            db,
            "exams",
            examId
        );


    const snapshot =
        await getDoc(
            examRef
        );


    if (!snapshot.exists()) {

        throw new Error(
            "الاختبار غير موجود."
        );

    }


    exam = {

        id: snapshot.id,

        ...snapshot.data()

    };


    if (
        exam.isPublished !==
        true
    ) {

        throw new Error(
            "هذا الاختبار غير منشور."
        );

    }


    if (
        exam.stageId !==
        student.stageId
    ) {

        throw new Error(
            "هذا الاختبار غير متاح لمرحلتك الدراسية."
        );

    }


    if (
        !Array.isArray(
            exam.questions
        ) ||
        !exam.questions.length
    ) {

        throw new Error(
            "لا توجد أسئلة داخل هذا الاختبار."
        );

    }


    questions =
        exam.questions;


    // -------------------------------------------------
    // Lecture relationship
    // -------------------------------------------------

    if (exam.lectureId) {

        const lectureRef =
            doc(
                db,
                "lectures",
                exam.lectureId
            );


        const lectureSnapshot =
            await getDoc(
                lectureRef
            );


        if (
            !lectureSnapshot.exists()
        ) {

            throw new Error(
                "المحاضرة المرتبطة بالاختبار غير موجودة."
            );

        }


        lecture = {

            id:
                lectureSnapshot.id,

            ...lectureSnapshot.data()

        };


        if (
            lecture.stageId !==
            student.stageId
        ) {

            throw new Error(
                "المحاضرة المرتبطة بالاختبار ليست ضمن مرحلتك."
            );

        }


        if (
            lecture.isPublished !==
            true
        ) {

            throw new Error(
                "المحاضرة المرتبطة بالاختبار غير منشورة."
            );

        }

    }

}


// =====================================================
// Previous Result
// =====================================================

async function loadPreviousResult() {

    const resultId =
        `${student.id}_${examId}`;


    const resultRef =
        doc(
            db,
            "examResults",
            resultId
        );


    const snapshot =
        await getDoc(
            resultRef
        );


    if (
        snapshot.exists()
    ) {

        const result =
            snapshot.data();


        renderResult(
            result
        );


        submitted = true;

        throw {
            alreadySubmitted: true
        };

    }

}


// =====================================================
// Render Exam
// =====================================================

function renderExam() {

    if (submitted) {
        return;
    }


    const app =
        document.getElementById(
            "examApp"
        );


    const title =
        exam.title ||
        "اختبار";


    const subject =
        exam.subjectId ||
        "غير محدد";


    const totalScore =
        getTotalScore();


    const duration =
        Number(
            exam.duration || 0
        );


    app.innerHTML = `

        <div class="exam-page">

            <div class="exam-header">

                <h2>
                    📝
                    ${escapeHtml(title)}
                </h2>

                <p>
                    📚 المادة:
                    ${escapeHtml(subject)}
                </p>

                ${
                    lecture
                        ? `
                            <p>
                                🎓 المحاضرة:
                                ${escapeHtml(
                                    lecture.title ||
                                    "محاضرة"
                                )}
                            </p>
                        `
                        : ""
                }

                <p>
                    🎯 الدرجة النهائية:
                    ${totalScore}
                </p>

            </div>


            <div class="timer-box">

                <strong>
                    ⏱️ الوقت المتبقي
                </strong>

                <span
                    id="timer"
                    class="timer"
                >
                    ${
                        duration > 0
                            ? formatTimer(
                                duration * 60
                            )
                            : "مفتوح"
                    }
                </span>

            </div>


            <div id="questionsContainer">

                ${questions.map(
                    (
                        question,
                        index
                    ) =>
                        renderQuestion(
                            question,
                            index
                        )
                ).join("")}

            </div>


            <button
                id="submitExamButton"
                class="submit-button"
                type="button"
            >
                ✅ تسليم الاختبار
            </button>

        </div>

    `;


    document.getElementById(
        "submitExamButton"
    ).addEventListener(
        "click",
        () => submitExam("manual")
    );


    if (duration > 0) {

        remainingSeconds =
            duration * 60;


        startTimer();

    }

}


// =====================================================
// Render Question
// =====================================================

function renderQuestion(
    question,
    index
) {

    const questionId =
        String(
            question.id ||
            `question-${index + 1}`
        );


    const text =
        question.question ||
        question.text ||
        question.title ||
        "سؤال";


    const options =
        Array.isArray(
            question.options
        )
            ? question.options
            : [];


    return `

        <div
            class="question-card"
            data-question-id="${escapeHtml(questionId)}"
        >

            <div class="question-number">

                السؤال ${index + 1}

                •
                ${getQuestionPoints(question)}
                درجة

            </div>


            <div class="question-text">

                ${escapeHtml(text)}

            </div>


            <div class="options">

                ${options.map(
                    (
                        option,
                        optionIndex
                    ) => {

                        const text =
                            typeof option === "object"
                                ? (
                                    option.text ||
                                    option.label ||
                                    option.value ||
                                    ""
                                )
                                : option;

                        return `

                            <div
                                class="option"
                                data-question="${escapeHtml(questionId)}"
                                data-option="${optionIndex}"
                            >

                                ${escapeHtml(
                                    text
                                )}

                            </div>

                        `;

                    }
                ).join("")}

            </div>

        </div>

    `;

}


// =====================================================
// Option Selection
// =====================================================

document.addEventListener(
    "click",
    event => {

        const option =
            event.target.closest(
                ".option"
            );


        if (!option) {
            return;
        }


        if (submitted) {
            return;
        }


        const questionId =
            option.dataset.question;


        const optionIndex =
            Number(
                option.dataset.option
            );


        answers[
            questionId
        ] =
            optionIndex;


        const parent =
            option.parentElement;


        parent
            .querySelectorAll(
                ".option"
            )
            .forEach(
                item =>
                    item.classList.remove(
                        "selected"
                    )
            );


        option.classList.add(
            "selected"
        );

    }
);


// =====================================================
// Timer
// =====================================================

function startTimer() {

    updateTimer();


    timerInterval =
        setInterval(
            () => {

                remainingSeconds--;


                updateTimer();


                if (
                    remainingSeconds <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );


                    submitExam(
                        "time"
                    );

                }

            },
            1000
        );

}


function updateTimer() {

    const timer =
        document.getElementById(
            "timer"
        );


    if (!timer) {
        return;
    }


    timer.textContent =
        formatTimer(
            remainingSeconds
        );


    if (
        remainingSeconds <=
        60
    ) {

        timer.classList.add(
            "warning"
        );

    }

}


function formatTimer(
    seconds
) {

    seconds =
        Math.max(
            0,
            Number(seconds)
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    return (
        String(minutes).padStart(
            2,
            "0"
        ) +
        ":" +
        String(secs).padStart(
            2,
            "0"
        )
    );

}


// =====================================================
// Submit
// =====================================================

async function submitExam(
    reason = "manual"
) {

    if (submitted) {
        return;
    }


    if (
        reason === "manual"
    ) {

        const confirmed =
            confirm(
                "هل أنت متأكد من تسليم الاختبار؟"
            );


        if (!confirmed) {
            return;
        }

    }


    submitted = true;


    if (timerInterval) {

        clearInterval(
            timerInterval
        );

    }


    const button =
        document.getElementById(
            "submitExamButton"
        );


    if (button) {

        button.disabled =
            true;

        button.textContent =
            "⏳ جاري التصحيح...";

    }


    try {

        const result =
            calculateResult();


        const resultId =
            `${student.id}_${examId}`;


        const resultData = {

            studentId:
                student.id,

            examId:
                examId,

            lectureId:
                exam.lectureId ||
                "",

            stageId:
                exam.stageId,

            subjectId:
                exam.subjectId ||
                "",

            score:
                result.score,

            totalScore:
                result.totalScore,

            percentage:
                result.percentage,

            answers:
                result.answers,

            submittedAt:
                serverTimestamp()

        };


        const resultRef =
            doc(
                db,
                "examResults",
                resultId
            );


        await setDoc(
            resultRef,
            resultData
        );


        renderResult({
            ...resultData,
            submittedAt:
                new Date()
        });


    } catch (error) {

        console.error(
            "Submit exam error:",
            error
        );


        submitted = false;


        if (button) {

            button.disabled =
                false;

            button.textContent =
                "✅ تسليم الاختبار";

        }


        showError(
            studentErrorMessage(
                error
            )
        );

    }

}


// =====================================================
// Calculate Result
// =====================================================

function calculateResult() {

    let score = 0;

    let totalScore = 0;

    const resultAnswers = [];


    questions.forEach(
        (
            question,
            index
        ) => {

            const questionId =
                String(
                    question.id ||
                    `question-${index + 1}`
                );


            const points =
                getQuestionPoints(
                    question
                );


            totalScore +=
                points;


            const selectedAnswer =
                answers[
                    questionId
                ];


            const correctAnswer =
                getCorrectAnswerIndex(
                    question
                );


            const isCorrect =
                selectedAnswer !== undefined &&
                Number(
                    selectedAnswer
                ) ===
                Number(
                    correctAnswer
                );


            if (isCorrect) {

                score += points;

            }


            resultAnswers.push({

                questionId,

                selectedAnswer:
                    selectedAnswer !== undefined
                        ? Number(selectedAnswer)
                        : null

            });

        }
    );


    const percentage =
        totalScore > 0
            ? Number(
                (
                    score /
                    totalScore *
                    100
                ).toFixed(2)
            )
            : 0;


    return {

        score,

        totalScore,

        percentage,

        answers:
            resultAnswers

    };

}


// =====================================================
// Points
// =====================================================

function getQuestionPoints(
    question
) {

    const points =
        Number(
            question?.points
        );


    if (
        Number.isFinite(points) &&
        points > 0
    ) {

        return points;

    }


    return 1;

}


function getTotalScore() {

    return questions.reduce(
        (
            total,
            question
        ) =>
            total +
            getQuestionPoints(
                question
            ),
        0
    );

}


// =====================================================
// Correct Answer
// =====================================================

function getCorrectAnswerIndex(
    question
) {

    if (
        question.correctAnswer !==
        undefined &&
        question.correctAnswer !==
        null
    ) {

        if (
            typeof question.correctAnswer ===
            "number"
        ) {

            return question.correctAnswer;

        }


        const numeric =
            Number(
                question.correctAnswer
            );


        if (
            Number.isFinite(
                numeric
            )
        ) {

            return numeric;

        }


        return findOptionIndex(
            question,
            question.correctAnswer
        );

    }


    if (
        question.correctIndex !==
        undefined
    ) {

        return Number(
            question.correctIndex
        );

    }


    return 0;

}


function findOptionIndex(
    question,
    value
) {

    if (
        !Array.isArray(
            question.options
        )
    ) {

        return -1;

    }


    const wanted =
        String(
            value
        ).trim();


    return question.options.findIndex(
        option => {

            const text =
                typeof option === "object"
                    ? (
                        option.text ||
                        option.label ||
                        option.value ||
                        ""
                    )
                    : option;

            return String(
                text
            ).trim() === wanted;

        }
    );

}


// =====================================================
// Render Result
// =====================================================

function renderResult(
    result
) {

    if (timerInterval) {

        clearInterval(
            timerInterval
        );

    }


    const app =
        document.getElementById(
            "examApp"
        );


    const score =
        Number(
            result.score || 0
        );


    const totalScore =
        Number(
            result.totalScore || 0
        );


    const percentage =
        Number(
            result.percentage || 0
        );


    app.innerHTML = `

        <div class="exam-page">

            <div class="result-box">

                <div style="font-size:45px;">
                    🎉
                </div>

                <h2>
                    تم تصحيح الاختبار
                </h2>

                <div class="result-percentage">

                    ${percentage}%

                </div>

                <div class="result-score">

                    درجتك:

                    <strong>
                        ${score}
                    </strong>

                    /

                    <strong>
                        ${totalScore}
                    </strong>

                </div>


                <a
                    href="leaderboard.html"
                    class="back-button"
                >
                    🏆 عرض نتائجي

                </a>

            </div>

        </div>

    `;

}


// =====================================================
// Error
// =====================================================

function showError(
    message
) {

    const app =
        document.getElementById(
            "examApp"
        );


    if (!app) {
        return;
    }


    app.innerHTML = `

        <div
            class="exam-page"
        >

            <div
                class="state-box error-box"
            >

                ⚠️

                <br>

                ${escapeHtml(
                    message
                )}

                <br><br>

                <a
                    href="exams.html"
                    class="back-button"
                >
                    العودة للاختبارات
                </a>

            </div>

        </div>

    `;

}

</script>

</body>
</html>
