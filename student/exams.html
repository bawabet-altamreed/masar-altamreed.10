<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    الاختبارات | مسار التمريض
</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    background: #f3f8fb;
    color: #17324a;
}

.exams-page {
    padding: 25px;
    max-width: 1100px;
    margin: auto;
}

.page-banner {
    background: linear-gradient(
        135deg,
        #087ea4,
        #075f7c
    );

    color: white;
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 20px;
}

.page-banner h2 {
    font-size: 23px;
    margin-bottom: 8px;
}

.page-banner p {
    font-size: 13px;
    line-height: 1.8;
    opacity: .92;
}

.exams-grid {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.exam-card {
    background: white;
    border: 1px solid #e4edf2;
    border-radius: 17px;
    padding: 20px;
    box-shadow:
        0 5px 18px
        rgba(23, 50, 74, .04);
}

.exam-card h3 {
    font-size: 16px;
    margin-bottom: 8px;
}

.exam-card p {
    color: #82919d;
    font-size: 11px;
    line-height: 1.8;
    margin-bottom: 15px;
}

.exam-meta {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.exam-meta div {
    background: #f7fafc;
    border-radius: 9px;
    padding: 9px;
    text-align: center;
}

.exam-meta span {
    display: block;
    color: #82919d;
    font-size: 9px;
    margin-bottom: 5px;
}

.exam-meta strong {
    font-size: 12px;
}

.exam-button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 12px;
    background: #087ea4;
    color: white;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
}

.exam-button:hover {
    background: #075f7c;
}

.exam-button.done {
    background: #16834f;
}

.state-box {
    background: white;
    border: 1px solid #e4edf2;
    border-radius: 15px;
    padding: 40px 20px;
    text-align: center;
    color: #8795a0;
    line-height: 2;
}

.error-box {
    background: #fff1f1;
    border-color: #ffd5d5;
    color: #b42318;
}

@media (max-width: 700px) {

    .exams-page {
        padding: 15px;
    }

    .exams-grid {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 430px) {

    .exam-meta {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div id="studentApp">
    جاري تحميل المنصة...
</div>


<script type="module">

import {
    protectStudentPage,
    createStudentLayout,
    getStudentExams,
    getStudentResults,
    escapeHtml,
    studentErrorMessage
} from "../src/student/student.js";


let student = null;
let exams = [];
let results = [];


try {

    const result =
        await protectStudentPage();

    student =
        result.student;


    createStudentLayout(
        student,
        "exams"
    );


    document.getElementById(
        "studentPageTitle"
    ).textContent =
        "الاختبارات";


    document.getElementById(
        "studentPageSubtitle"
    ).textContent =
        "اختبارات المرحلة الخاصة بك";


    const content =
        document.getElementById(
            "studentPageContent"
        );


    content.innerHTML = `

        <div class="exams-page">

            <div class="page-banner">

                <h2>
                    📝 الاختبارات
                </h2>

                <p>
                    جميع الاختبارات المنشورة
                    الخاصة بمرحلتك الدراسية.
                </p>

            </div>


            <div id="examsContainer">

                <div class="state-box">

                    ⏳
                    <br>
                    جاري تحميل الاختبارات...

                </div>

            </div>

        </div>

    `;


    exams =
        await getStudentExams(
            student.stageId
        );


    results =
        await getStudentResults(
            student.id
        );


    renderExams();


} catch (error) {

    console.error(
        "Student exams error:",
        error
    );


    const app =
        document.getElementById(
            "studentApp"
        );


    app.innerHTML = `

        <div class="state-box error-box">

            ⚠️

            <br>

            ${escapeHtml(
                studentErrorMessage(
                    error
                )
            )}

        </div>

    `;

}


// =====================================================
// Render
// =====================================================

function renderExams() {

    const container =
        document.getElementById(
            "examsContainer"
        );


    if (!container) {
        return;
    }


    exams.sort(
        (a, b) => {

            const aTime =
                getTime(
                    a.createdAt
                );

            const bTime =
                getTime(
                    b.createdAt
                );

            return bTime - aTime;

        }
    );


    if (!exams.length) {

        container.innerHTML = `

            <div class="state-box">

                📝

                <br>

                لا توجد اختبارات منشورة
                لمرحلتك حاليًا.

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <div class="exams-grid">

            ${exams.map(
                exam =>
                    createExamCard(
                        exam
                    )
            ).join("")}

        </div>

    `;

}


// =====================================================
// Card
// =====================================================

function createExamCard(
    exam
) {

    const result =
        results.find(
            item =>
                item.examId ===
                exam.id
        );


    const completed =
        Boolean(result);


    const title =
        exam.title ||
        "اختبار";


    const subject =
        exam.subjectId ||
        "غير محدد";


    const questionCount =
        Array.isArray(
            exam.questions
        )
            ? exam.questions.length
            : 0;


    const duration =
        Number(
            exam.duration || 0
        );


    return `

        <article class="exam-card">

            <h3>

                📝
                ${escapeHtml(title)}

            </h3>


            <p>

                📚 المادة:
                ${escapeHtml(subject)}

                <br>

                ${exam.lectureId
                    ? "🎓 اختبار مرتبط بمحاضرة"
                    : "🎓 اختبار عام"
                }

            </p>


            <div class="exam-meta">

                <div>

                    <span>
                        الأسئلة
                    </span>

                    <strong>
                        ${questionCount}
                    </strong>

                </div>


                <div>

                    <span>
                        الدرجة
                    </span>

                    <strong>
                        ${getTotalScore(exam)}
                    </strong>

                </div>


                <div>

                    <span>
                        المدة
                    </span>

                    <strong>
                        ${duration > 0
                            ? duration + " دقيقة"
                            : "مفتوح"
                        }
                    </strong>

                </div>

            </div>


            <button
                class="exam-button ${completed ? "done" : ""}"
                type="button"
                onclick="openExam('${exam.id}')"
            >

                ${completed
                    ? "✅ تمت الإجابة"
                    : "🚀 بدء الاختبار"
                }

            </button>

        </article>

    `;

}


// =====================================================
// Total Score
// =====================================================

function getTotalScore(
    exam
) {

    if (
        !Array.isArray(
            exam.questions
        )
    ) {
        return 0;
    }


    return exam.questions.reduce(
        (
            total,
            question
        ) =>
            total +
            getQuestionPoints(
                question
            ),
        0
    );

}


function getQuestionPoints(
    question
) {

    const points =
        Number(
            question?.points
        );


    if (
        Number.isFinite(points) &&
        points > 0
    ) {

        return points;

    }


    return 1;

}


// =====================================================
// Open Exam
// =====================================================

window.openExam =
    function(examId) {

        window.location.href =
            `exam.html?id=${encodeURIComponent(examId)}`;

    };


// =====================================================
// Time
// =====================================================

function getTime(value) {

    if (!value) {
        return 0;
    }

    if (
        typeof value.toMillis ===
        "function"
    ) {
        return value.toMillis();
    }

    if (
        typeof value.toDate ===
        "function"
    ) {
        return value.toDate().getTime();
    }

    if (
        value.seconds !== undefined
    ) {
        return Number(
            value.seconds
        ) * 1000;
    }

    const date =
        new Date(value);

    return Number.isNaN(
        date.getTime()
    )
        ? 0
        : date.getTime();

}

</script>

</body>
</html>
