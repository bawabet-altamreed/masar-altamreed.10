<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>اختباراتي | بوابة التمريض</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Tahoma, sans-serif;
        background: #f4f8fa;
        color: #243746;
        min-height: 100vh;
    }

    .header {
        background: #087ea4;
        color: white;
        padding: 22px 18px;
        box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .header-inner {
        width: min(1100px, 100%);
        margin: auto;
    }

    .header h1 {
        font-size: 23px;
        margin-bottom: 6px;
    }

    .header p {
        font-size: 13px;
        opacity: .9;
    }

    .container {
        width: min(1100px, 100%);
        margin: 25px auto;
        padding: 0 15px;
    }

    .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
    }

    .toolbar h2 {
        font-size: 19px;
    }

    .toolbar p {
        color: #71808d;
        font-size: 12px;
        margin-top: 5px;
    }

    .student-info {
        background: white;
        border: 1px solid #e2ebf0;
        border-radius: 13px;
        padding: 13px 15px;
        font-size: 12px;
        color: #60717e;
    }

    .exams-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 17px;
    }

    .exam-card {
        background: white;
        border: 1px solid #e2ebf0;
        border-radius: 16px;
        padding: 20px;
        transition: .2s;
    }

    .exam-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(20,70,90,.08);
    }

    .exam-card h3 {
        font-size: 17px;
        line-height: 1.6;
        margin-bottom: 9px;
    }

    .exam-description {
        color: #71808d;
        font-size: 12px;
        line-height: 1.8;
        min-height: 43px;
        margin-bottom: 15px;
    }

    .exam-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 17px;
    }

    .exam-meta span {
        background: #f3f7f9;
        color: #60717e;
        border-radius: 8px;
        padding: 7px 9px;
        font-size: 10px;
    }

    .start-button {
        width: 100%;
        border: none;
        border-radius: 9px;
        padding: 11px;
        background: #087ea4;
        color: white;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        font-weight: bold;
    }

    .start-button:hover {
        background: #076d8e;
    }

    .empty-state {
        grid-column: 1 / -1;
        background: white;
        border: 1px solid #e2ebf0;
        border-radius: 15px;
        padding: 40px 20px;
        text-align: center;
        color: #71808d;
        line-height: 2;
        font-size: 13px;
    }

    .loading {
        text-align: center;
        padding: 40px;
        color: #71808d;
    }

    .error-box {
        background: #fff1f1;
        border: 1px solid #ffd7d7;
        color: #b42318;
        border-radius: 12px;
        padding: 17px;
        text-align: center;
        font-size: 12px;
    }

    @media (max-width: 700px) {

        .exams-grid {
            grid-template-columns: 1fr;
        }

        .toolbar {
            flex-direction: column;
            align-items: stretch;
        }

        .student-info {
            width: 100%;
        }

    }

</style>

</head><body><header class="header">

    <div class="header-inner">

        <h1>بوابة التمريض</h1>

        <p>
            الاختبارات الإلكترونية
        </p>

    </div>

</header>


<main class="container">

    <div class="toolbar">

        <div>

            <h2>
                الاختبارات المتاحة
            </h2>

            <p>
                اختر الاختبار الذي تريد البدء فيه.
            </p>

        </div>

        <div
            id="studentInfo"
            class="student-info"
        >
            جاري تحميل بيانات الطالب...
        </div>

    </div>


    <div
        id="examsContainer"
        class="exams-grid"
    >

        <div class="loading">
            ⏳ جاري تحميل الاختبارات...
        </div>

    </div>

</main>

<script type="module">

    import {
        auth,
        db
    } from "../src/firebase/init.js";

    import {
        onAuthStateChanged
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        doc,
        getDoc,
        collection,
        query,
        where,
        getDocs
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const examsContainer =
        document.getElementById(
            "examsContainer"
        );

    const studentInfo =
        document.getElementById(
            "studentInfo"
        );


    onAuthStateChanged(
        auth,
        async user => {

            if (!user) {

                window.location.href =
                    "../login.html";

                return;

            }


            try {

                const userSnapshot =
                    await getDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        )
                    );


                if (!userSnapshot.exists()) {

                    throw new Error(
                        "بيانات الطالب غير موجودة."
                    );

                }


                const userData =
                    userSnapshot.data();


                if (
                    userData.role !== "student" ||
                    userData.isActive !== true
                ) {

                    throw new Error(
                        "هذا الحساب غير مسموح له بالدخول إلى صفحة الطلاب."
                    );

                }


                const stageId =
                    userData.stageId;


                studentInfo.textContent =
                    userData.name ||
                    userData.displayName ||
                    user.email ||
                    "الطالب";


                await loadExams(
                    stageId
                );


            } catch (error) {

                console.error(
                    "Student exams error:",
                    error
                );

                examsContainer.innerHTML = `
                    <div class="error-box">
                        ⚠️ ${escapeHtml(
                            error.message ||
                            "تعذر تحميل الاختبارات."
                        )}
                    </div>
                `;

            }

        }
    );


    async function loadExams(
        stageId
    ) {

        if (!stageId) {

            examsContainer.innerHTML = `
                <div class="empty-state">
                    ⚠️ لم يتم تحديد المرحلة الدراسية لهذا الحساب.
                </div>
            `;

            return;

        }


        /*
         * مهم جدًا:
         * الاستعلام متوافق مع Firestore Rules:
         *
         * isPublished == true
         * stageId == student.stageId
         */

        const examsQuery =
            query(
                collection(
                    db,
                    "exams"
                ),

                where(
                    "isPublished",
                    "==",
                    true
                ),

                where(
                    "stageId",
                    "==",
                    stageId
                )
            );


        const snapshot =
            await getDocs(
                examsQuery
            );


        const exams =
            snapshot.docs.map(
                item => ({
                    id: item.id,
                    ...item.data()
                })
            );


        if (!exams.length) {

            examsContainer.innerHTML = `
                <div class="empty-state">

                    📋 لا توجد اختبارات متاحة حاليًا.

                    <br>

                    سيتم ظهور الاختبارات هنا
                    عند نشرها للمرحلة الخاصة بك.

                </div>
            `;

            return;

        }


        examsContainer.innerHTML =
            exams
                .map(
                    exam =>
                        renderExamCard(
                            exam
                        )
                )
                .join("");


        document
            .querySelectorAll(
                "[data-start-exam]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            const id =
                                button.dataset.startExam;

                            window.location.href =
                                `exam.html?id=${encodeURIComponent(id)}`;

                        }
                    );

                }
            );

    }


    function renderExamCard(
        exam
    ) {

        const title =
            escapeHtml(
                exam.title ||
                exam.name ||
                "اختبار بدون عنوان"
            );


        const description =
            escapeHtml(
                exam.description ||
                "لا يوجد وصف للاختبار."
            );


        const subject =
            escapeHtml(
                exam.subject ||
                exam.subjectId ||
                "غير محدد"
            );


        const duration =
            Number(
                exam.duration ||
                exam.durationMinutes ||
                0
            );


        const questions =
            Array.isArray(
                exam.questions
            )
                ? exam.questions.length
                : 0;


        return `

            <div class="exam-card">

                <h3>
                    ${title}
                </h3>

                <div class="exam-description">
                    ${description}
                </div>

                <div class="exam-meta">

                    <span>
                        📚 ${subject}
                    </span>

                    <span>
                        📋 ${questions} سؤال
                    </span>

                    ${
                        duration
                            ? `
                                <span>
                                    ⏱️ ${duration} دقيقة
                                </span>
                            `
                            : ""
                    }

                </div>

                <button
                    class="start-button"
                    data-start-exam="${escapeAttribute(
                        exam.id
                    )}"
                >
                    🚀 بدء الاختبار
                </button>

            </div>

        `;

    }


    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    function escapeAttribute(
        value
    ) {

        return escapeHtml(
            value
        );

    }

</script></body></html>
