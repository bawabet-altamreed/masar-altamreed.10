<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        الاختبارات | بوابة التمريض
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f8fa;
            font-family:
                Tahoma,
                Arial,
                sans-serif;
            color: #20313d;
        }

        button,
        input {
            font-family: inherit;
        }


        /* =====================================================
           Header
        ===================================================== */

        .page-header {
            background: #087ea4;
            color: white;
            padding: 25px 20px;
            box-shadow:
                0 5px 20px rgba(0, 0, 0, .08);
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
        }

        .page-header h1 {
            margin: 0 0 7px;
            font-size: 24px;
        }

        .page-header p {
            margin: 0;
            font-size: 13px;
            opacity: .9;
            line-height: 1.8;
        }


        /* =====================================================
           Container
        ===================================================== */

        .container {
            width: min(1100px, calc(100% - 30px));
            margin: 25px auto 40px;
        }


        /* =====================================================
           User Info
        ===================================================== */

        .student-info {
            background: white;
            border: 1px solid #e2ebf0;
            border-radius: 15px;
            padding: 16px 18px;
            margin-bottom: 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .student-info strong {
            font-size: 14px;
        }

        .student-stage {
            color: #71808d;
            font-size: 11px;
            margin-top: 5px;
        }


        /* =====================================================
           Section
        ===================================================== */

        .section-title {
            margin-bottom: 15px;
        }

        .section-title h2 {
            margin: 0 0 5px;
            font-size: 18px;
        }

        .section-title p {
            margin: 0;
            color: #7b8993;
            font-size: 12px;
        }


        /* =====================================================
           Exams Grid
        ===================================================== */

        .exams-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .exam-card {
            background: white;
            border: 1px solid #e0e9ee;
            border-radius: 17px;
            padding: 20px;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .exam-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, .07);
        }

        .exam-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;

            margin-bottom: 12px;
        }

        .exam-card h3 {
            margin: 0;
            font-size: 16px;
            line-height: 1.7;
        }

        .published-badge {
            flex-shrink: 0;

            background: #eaf8f0;
            color: #16834f;

            padding: 5px 9px;
            border-radius: 20px;

            font-size: 10px;
            font-weight: bold;
        }


        /* =====================================================
           Description
        ===================================================== */

        .exam-description {
            color: #71808d;
            font-size: 12px;
            line-height: 1.9;

            min-height: 45px;
            margin-bottom: 15px;
        }


        /* =====================================================
           Meta
        ===================================================== */

        .exam-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;

            margin-bottom: 17px;
        }

        .exam-meta span {
            background: #f4f8fa;
            color: #60717e;

            padding: 7px 9px;
            border-radius: 8px;

            font-size: 10px;
        }


        /* =====================================================
           Start Button
        ===================================================== */

        .start-button {
            width: 100%;

            border: none;
            border-radius: 9px;

            padding: 11px;

            background: #087ea4;
            color: white;

            cursor: pointer;

            font-size: 12px;
            font-weight: bold;

            transition:
                background .2s ease;
        }

        .start-button:hover {
            background: #066b8c;
        }


        /* =====================================================
           Empty State
        ===================================================== */

        .empty-state {
            background: white;

            border:
                1px solid #e1eaf0;

            border-radius: 15px;

            padding: 35px 20px;

            text-align: center;

            color: #71808d;

            font-size: 13px;

            line-height: 2;
        }


        /* =====================================================
           Loading
        ===================================================== */

        .loading {
            text-align: center;
            padding: 40px;
            color: #71808d;
            font-size: 13px;
        }


        /* =====================================================
           Error
        ===================================================== */

        .error-box {
            background: #fff5f5;
            border: 1px solid #f1cccc;
            color: #b42318;

            border-radius: 14px;

            padding: 20px;

            text-align: center;

            font-size: 13px;

            line-height: 1.8;
        }


        /* =====================================================
           Responsive
        ===================================================== */

        @media (max-width: 750px) {

            .exams-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 550px) {

            .page-header {
                padding: 20px 15px;
            }

            .page-header h1 {
                font-size: 20px;
            }

            .container {
                width:
                    calc(100% - 20px);
                margin-top: 15px;
            }

            .student-info {
                align-items: flex-start;
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<header class="page-header">

    <div class="header-inner">

        <h1>
            📝 الاختبارات
        </h1>

        <p>
            اختبر معلوماتك وراجع مستواك في المواد الدراسية.
        </p>

    </div>

</header>


<main class="container">


    <div
        id="studentInfo"
        class="student-info"
    >

        <div>

            <strong id="studentName">
                جاري تحميل بيانات الطالب...
            </strong>

            <div
                id="studentStage"
                class="student-stage"
            >
                ...
            </div>

        </div>

    </div>


    <div class="section-title">

        <h2>
            الاختبارات المتاحة
        </h2>

        <p>
            الاختبارات المنشورة الخاصة بمرحلتك الدراسية.
        </p>

    </div>


    <div
        id="examsContainer"
        class="exams-grid"
    >

        <div class="loading">
            ⏳ جاري تحميل الاختبارات...
        </div>

    </div>


</main>


<script type="module">

    /* =========================================================
       Imports
    ========================================================= */

    import {
        db
    } from "../src/firebase/init.js";

    import {
        getAuth,
        onAuthStateChanged
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        collection,
        query,
        where,
        getDocs,
        doc,
        getDoc
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================================================
       Firebase Auth
    ========================================================= */

    const auth = getAuth();


    /* =========================================================
       Start
    ========================================================= */

    onAuthStateChanged(
        auth,
        async user => {

            if (!user) {

                showError(
                    "يجب تسجيل الدخول أولًا للوصول إلى الاختبارات."
                );

                return;

            }


            try {

                await loadStudentAndExams(
                    user
                );

            } catch (error) {

                console.error(
                    "Student exams error:",
                    error
                );

                showError(
                    getFriendlyError(
                        error
                    )
                );

            }

        }
    );


    /* =========================================================
       Load Student + Exams
    ========================================================= */

    async function loadStudentAndExams(
        user
    ) {

        const userRef =
            doc(
                db,
                "users",
                user.uid
            );


        const userSnapshot =
            await getDoc(
                userRef
            );


        if (!userSnapshot.exists()) {

            throw new Error(
                "بيانات الطالب غير موجودة."
            );

        }


        const student =
            userSnapshot.data();


        /* =====================================================
           Check Student
        ===================================================== */

        if (
            student.role !==
            "student"
        ) {

            throw new Error(
                "هذا الحساب ليس حساب طالب."
            );

        }


        if (
            student.isActive !==
            true
        ) {

            throw new Error(
                "حساب الطالب غير نشط."
            );

        }


        /* =====================================================
           Render Student
        ===================================================== */

        document.getElementById(
            "studentName"
        ).textContent =
            student.name ||
            student.displayName ||
            user.displayName ||
            "الطالب";


        document.getElementById(
            "studentStage"
        ).textContent =
            student.stageId
                ? `المرحلة الدراسية: ${student.stageId}`
                : "المرحلة الدراسية غير محددة";


        /* =====================================================
           Stage Required
        ===================================================== */

        if (
            !student.stageId
        ) {

            throw new Error(
                "لم يتم تحديد المرحلة الدراسية لحسابك."
            );

        }


        /* =====================================================
           Firestore Query
           
           مهم جدًا:
           الاستعلام مطابق لشروط Firestore Rules:
           
           isPublished == true
           stageId == student's stageId
        ===================================================== */

        const examsQuery =
            query(
                collection(
                    db,
                    "exams"
                ),

                where(
                    "isPublished",
                    "==",
                    true
                ),

                where(
                    "stageId",
                    "==",
                    student.stageId
                )
            );


        const snapshot =
            await getDocs(
                examsQuery
            );


        const exams =
            snapshot.docs.map(
                item => ({

                    id:
                        item.id,

                    ...item.data()

                })
            );


        renderExams(
            exams
        );

    }


    /* =========================================================
       Render Exams
    ========================================================= */

    function renderExams(
        exams
    ) {

        const container =
            document.getElementById(
                "examsContainer"
            );


        if (!exams.length) {

            container.innerHTML = `

                <div class="empty-state">

                    📭 لا توجد اختبارات متاحة حاليًا.

                    <br>

                    سيتم ظهور الاختبارات هنا
                    عند نشرها لمرحلتك الدراسية.

                </div>

            `;

            return;

        }


        container.innerHTML =
            exams
                .map(
                    exam =>
                        renderExamCard(
                            exam
                        )
                )
                .join("");

    }


    /* =========================================================
       Render Exam Card
    ========================================================= */

    function renderExamCard(
        exam
    ) {

        const title =
            escapeHtml(
                exam.title ||
                exam.name ||
                "اختبار بدون عنوان"
            );


        const description =
            escapeHtml(
                exam.description ||
                "لا يوجد وصف للاختبار."
            );


        const subject =
            escapeHtml(
                exam.subject ||
                exam.subjectId ||
                "غير محدد"
            );


        const duration =
            Number(
                exam.duration ||
                exam.durationMinutes ||
                0
            );


        const questions =
            Array.isArray(
                exam.questions
            )
                ? exam.questions.length
                : 0;


        return `

            <div class="exam-card">

                <div class="exam-card-header">

                    <h3>
                        ${title}
                    </h3>

                    <span
                        class="published-badge"
                    >
                        منشور
                    </span>

                </div>


                <div class="exam-description">

                    ${description}

                </div>


                <div class="exam-meta">

                    <span>
                        📚 ${subject}
                    </span>

                    <span>
                        📋 ${questions} سؤال
                    </span>

                    ${
                        duration
                            ? `
                                <span>
                                    ⏱️ ${duration} دقيقة
                                </span>
                            `
                            : ""
                    }

                </div>


                <button
                    class="start-button"
                    data-exam-id="${escapeAttribute(
                        exam.id
                    )}"
                >

                    🚀 بدء الاختبار

                </button>

            </div>

        `;

    }


    /* =========================================================
       Button Events
    ========================================================= */

    document.addEventListener(
        "click",
        event => {

            const button =
                event.target.closest(
                    "[data-exam-id]"
                );


            if (!button) {
                return;
            }


            const examId =
                button.dataset.examId;


            if (!examId) {
                return;
            }


            window.location.href =
                `exam.html?id=${encodeURIComponent(
                    examId
                )}`;

        }
    );


    /* =========================================================
       Error
    ========================================================= */

    function showError(
        message
    ) {

        const container =
            document.getElementById(
                "examsContainer"
            );


        container.innerHTML = `

            <div class="error-box">

                🔴 ${escapeHtml(
                    message
                )}

            </div>

        `;

    }


    /* =========================================================
       Friendly Firebase Errors
    ========================================================= */

    function getFriendlyError(
        error
    ) {

        if (
            error?.code ===
            "permission-denied"
        ) {

            return (
                "ليس لديك صلاحية للوصول إلى الاختبارات. " +
                "تأكد من أن الاشتراك فعال وأن المرحلة الدراسية صحيحة."
            );

        }


        return (
            error?.message ||
            "حدث خطأ أثناء تحميل الاختبارات."
        );

    }


    /* =========================================================
       Escape
    ========================================================= */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    function escapeAttribute(
        value
    ) {

        return escapeHtml(
            value
        );

    }

</script>


</body>

</html>
