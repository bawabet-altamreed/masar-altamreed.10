<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        لوحة الطالب | مسار التمريض
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f3f8fb;
            color: #17324a;
        }

        .student-app {
            min-height: 100vh;
            display: flex;
        }

        .student-sidebar {
            width: 250px;
            background: #ffffff;
            border-left: 1px solid #e3edf2;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
        }

        .student-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .student-brand-icon {
            width: 45px;
            height: 45px;
            border-radius: 13px;
            background: #087ea4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .student-brand strong {
            display: block;
            font-size: 15px;
        }

        .student-brand small {
            display: block;
            color: #82919d;
            margin-top: 3px;
            font-size: 10px;
            direction: ltr;
        }

        .student-user {
            background: #f4f9fb;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .student-avatar,
        .header-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #087ea4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .student-user strong {
            display: block;
            font-size: 12px;
        }

        .student-user small {
            display: block;
            color: #82919d;
            margin-top: 4px;
            font-size: 10px;
        }

        .student-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .student-nav a {
            text-decoration: none;
            color: #60717f;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        .student-nav a:hover,
        .student-nav a.active {
            background: #eaf7fb;
            color: #087ea4;
        }

        .student-logout {
            margin-top: auto;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #fff1f1;
            color: #b42318;
            cursor: pointer;
            font-weight: bold;
        }

        .student-main {
            flex: 1;
            margin-right: 250px;
        }

        .student-header {
            min-height: 82px;
            background: #ffffff;
            border-bottom: 1px solid #e3edf2;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .student-header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .student-header p {
            color: #81909c;
            font-size: 12px;
        }

        .student-header-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 12px;
        }

        .student-content {
            padding: 25px;
        }

        .welcome {
            background: linear-gradient(
                135deg,
                #087ea4,
                #075f7c
            );
            color: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .welcome h2 {
            margin-bottom: 8px;
        }

        .welcome p {
            opacity: .9;
            font-size: 13px;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e4edf2;
            border-radius: 15px;
            padding: 18px;
        }

        .card-title {
            color: #82919d;
            font-size: 11px;
            margin-bottom: 9px;
        }

        .card-value {
            font-size: 19px;
            font-weight: bold;
        }

        .status-active {
            color: #16834f;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            gap: 18px;
        }

        .panel {
            background: white;
            border: 1px solid #e4edf2;
            border-radius: 15px;
            padding: 20px;
        }

        .panel h3 {
            margin-bottom: 15px;
            font-size: 16px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .panel-header h3 {
            margin-bottom: 0;
        }

        .panel-link {
            color: #087ea4;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
        }

        .panel-link:hover {
            text-decoration: underline;
        }

        .empty {
            padding: 25px;
            text-align: center;
            color: #8795a0;
            font-size: 13px;
            line-height: 2;
        }

        .lecture-item,
        .exam-item,
        .notification-item {
            border-bottom: 1px solid #edf1f4;
            padding: 12px 0;
        }

        .lecture-item:last-child,
        .exam-item:last-child,
        .notification-item:last-child {
            border-bottom: none;
        }

        .item-title {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .item-meta {
            color: #82919d;
            font-size: 11px;
            line-height: 1.8;
        }

        .lecture-item-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .lecture-item-content {
            flex: 1;
            min-width: 0;
        }

        .lecture-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-scheduled {
            background: #eef8fb;
            color: #087ea4;
        }

        .status-live {
            background: #eaf8f0;
            color: #16834f;
        }

        .status-ended {
            background: #f1f3f5;
            color: #687783;
        }

        .status-cancelled {
            background: #fff1f1;
            color: #b42318;
        }

        .item-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            padding: 0 11px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            margin-top: 8px;
        }

        .live-button {
            background: #087ea4;
            color: white;
        }

        .recording-button {
            background: #eef8fb;
            color: #087ea4;
        }

        .exam-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .exam-icon {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: #eef8fb;
            color: #087ea4;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
        }

        .exam-content {
            flex: 1;
            min-width: 0;
        }

        .notification-item {
            position: relative;
        }

        .notification-item::before {
            content: "";
            position: absolute;
            right: -1px;
            top: 17px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #087ea4;
        }

        @media (max-width: 900px) {

            .student-sidebar {
                width: 210px;
            }

            .student-main {
                margin-right: 210px;
            }

            .cards {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 650px) {

            .student-sidebar {
                position: static;
                width: 100%;
                min-height: auto;
            }

            .student-app {
                display: block;
            }

            .student-main {
                margin-right: 0;
            }

            .student-nav {
                display: grid;
                grid-template-columns:
                    repeat(3, 1fr);
            }

            .student-logout {
                margin-top: 15px;
            }

            .student-header {
                padding: 15px;
            }

            .student-content {
                padding: 15px;
            }

            .cards,
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .lecture-item-top {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

<div
    id="studentApp"
    class="student-app"
>
    جاري تحميل المنصة...
</div>


<script type="module">

    import {
        protectStudentPage,
        createStudentLayout,
        getCollection,
        escapeHtml,
        formatDate,
        formatDateTime,
        studentErrorMessage
    } from "../src/student/student.js";


    import {
        db
    } from "../src/firebase/init.js";


    import {
        collection,
        query,
        where,
        getDocs
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    try {

        // =================================================
        // Student Protection
        // =================================================

        const {
            student,
            subscription
        } =
            await protectStudentPage();


        // =================================================
        // Student Layout
        // =================================================

        createStudentLayout(
            student,
            "dashboard"
        );


        document.getElementById(
            "studentPageTitle"
        ).textContent =
            "لوحة الطالب";


        const content =
            document.getElementById(
                "studentPageContent"
            );


        // =================================================
        // Dashboard HTML
        // =================================================

        content.innerHTML = `

            <div class="welcome">

                <h2>
                    أهلًا بك،
                    ${escapeHtml(
                        student.name ||
                        "طالب مسار التمريض"
                    )}
                    👋
                </h2>

                <p>
                    نتمنى لك رحلة تعليمية ناجحة ومميزة.
                </p>

            </div>


            <div class="cards">

                <div class="card">

                    <div class="card-title">
                        المرحلة
                    </div>

                    <div class="card-value">
                        ${escapeHtml(
                            student.stageId ||
                            "—"
                        )}
                    </div>

                </div>


                <div class="card">

                    <div class="card-title">
                        حالة الاشتراك
                    </div>

                    <div class="card-value status-active">
                        نشط
                    </div>

                </div>


                <div class="card">

                    <div class="card-title">
                        ينتهي في
                    </div>

                    <div class="card-value">
                        ${formatDate(
                            subscription.endDate
                        )}
                    </div>

                </div>


                <div class="card">

                    <div class="card-title">
                        كود الاشتراك
                    </div>

                    <div
                        class="card-value"
                        dir="ltr"
                    >
                        ${escapeHtml(
                            student.subscriptionCode ||
                            student.username ||
                            "—"
                        )}
                    </div>

                </div>

            </div>


            <div class="dashboard-grid">

                <!-- =====================================
                     Upcoming Lectures
                     ===================================== -->

                <div class="panel">

                    <div class="panel-header">

                        <h3>
                            🎥 المحاضرات القادمة
                        </h3>

                        <a
                            class="panel-link"
                            href="lectures.html"
                        >
                            عرض الكل
                        </a>

                    </div>

                    <div id="upcomingLectures">

                        <div class="empty">
                            ⏳ جاري التحميل...
                        </div>

                    </div>

                </div>


                <!-- =====================================
                     Available Exams
                     ===================================== -->

                <div class="panel">

                    <div class="panel-header">

                        <h3>
                            📝 الاختبارات المتاحة
                        </h3>

                        <a
                            class="panel-link"
                            href="exams.html"
                        >
                            عرض الكل
                        </a>

                    </div>

                    <div id="availableExams">

                        <div class="empty">
                            ⏳ جاري التحميل...
                        </div>

                    </div>

                </div>


                <!-- =====================================
                     Notifications
                     ===================================== -->

                <div class="panel">

                    <div class="panel-header">

                        <h3>
                            🔔 آخر التنبيهات
                        </h3>

                    </div>

                    <div id="notifications">

                        <div class="empty">
                            ⏳ جاري التحميل...
                        </div>

                    </div>

                </div>


                <!-- =====================================
                     Progress
                     ===================================== -->

                <div class="panel">

                    <div class="panel-header">

                        <h3>
                            📊 التقدم الدراسي
                        </h3>

                    </div>

                    <div class="empty">
                        سيتم احتساب تقدمك تلقائيًا
                        مع إضافة المحاضرات والاختبارات.
                    </div>

                </div>

            </div>

        `;


        // =================================================
        // 1. Lectures
        // نفس نظام lectures.html / schedule.html
        // =================================================

        try {

            const lecturesQuery =
                query(

                    collection(
                        db,
                        "lectures"
                    ),

                    where(
                        "stageId",
                        "==",
                        student.stageId
                    ),

                    where(
                        "isPublished",
                        "==",
                        true
                    )

                );


            const snapshot =
                await getDocs(
                    lecturesQuery
                );


            const lectures =
                snapshot.docs
                    .map(
                        item => ({
                            id: item.id,
                            ...item.data()
                        })
                    )
                    .sort(
                        (a, b) =>
                            getTime(
                                a.scheduledAt
                            ) -
                            getTime(
                                b.scheduledAt
                            )
                    );


            const box =
                document.getElementById(
                    "upcomingLectures"
                );


            // ---------------------------------------------
            // نعرض أهم 5 محاضرات فقط
            // ---------------------------------------------

            const upcoming =
                lectures
                    .filter(
                        lecture => {

                            const status =
                                getLectureStatus(
                                    lecture
                                );

                            return (
                                status ===
                                    "scheduled" ||
                                status ===
                                    "live"
                            );

                        }
                    )
                    .slice(0, 5);


            if (!upcoming.length) {

                box.innerHTML = `

                    <div class="empty">

                        🎥

                        <br>

                        لا توجد محاضرات قادمة حاليًا.

                    </div>

                `;

            } else {

                box.innerHTML =
                    upcoming
                        .map(
                            lecture =>
                                createLectureItem(
                                    lecture
                                )
                        )
                        .join("");

            }

        } catch (error) {

            console.error(
                "Dashboard lectures error:",
                error
            );


            document.getElementById(
                "upcomingLectures"
            ).innerHTML = `

                <div class="empty">

                    ⚠️

                    <br>

                    ${escapeHtml(
                        studentErrorMessage(
                            error
                        )
                    )}

                </div>

            `;

        }


        // =================================================
        // 2. Exams
        // =================================================

        try {

            const exams =
                await getCollection(
                    "exams"
                );


            const available =
                exams
                    .filter(
                        exam => {

                            return (
                                !exam.stageId ||
                                exam.stageId ===
                                student.stageId
                            );

                        }
                    )
                    .slice(0, 5);


            const box =
                document.getElementById(
                    "availableExams"
                );


            if (!available.length) {

                box.innerHTML = `

                    <div class="empty">

                        📝

                        <br>

                        لا توجد اختبارات متاحة حاليًا.

                    </div>

                `;

            } else {

                box.innerHTML =
                    available
                        .map(
                            exam => `

                                <div class="exam-item">

                                    <div class="exam-icon">
                                        📝
                                    </div>

                                    <div class="exam-content">

                                        <div class="item-title">

                                            ${escapeHtml(
                                                exam.title ||
                                                exam.name ||
                                                "اختبار"
                                            )}

                                        </div>

                                        <div class="item-meta">

                                            ${escapeHtml(
                                                exam.subject ||
                                                exam.subjectId ||
                                                "اختبار"
                                            )}

                                        </div>

                                    </div>

                                </div>

                            `
                        )
                        .join("");

            }

        } catch (error) {

            console.error(
                "Dashboard exams error:",
                error
            );


            document.getElementById(
                "availableExams"
            ).innerHTML = `

                <div class="empty">

                    ⚠️

                    <br>

                    ${escapeHtml(
                        studentErrorMessage(
                            error
                        )
                    )}

                </div>

            `;

        }


        // =================================================
        // 3. Notifications
        // =================================================

        try {

            const notifications =
                await getCollection(
                    "notifications"
                );


            const studentNotifications =
                notifications
                    .filter(
                        notification => {

                            if (
                                notification.userId
                            ) {

                                return (
                                    notification.userId ===
                                    student.id
                                );

                            }


                            if (
                                notification.stageId
                            ) {

                                return (
                                    notification.stageId ===
                                    student.stageId
                                );

                            }


                            return true;

                        }
                    )
                    .slice(0, 5);


            const box =
                document.getElementById(
                    "notifications"
                );


            if (
                !studentNotifications.length
            ) {

                box.innerHTML = `

                    <div class="empty">

                        🔔

                        <br>

                        لا توجد تنبيهات حاليًا.

                    </div>

                `;

            } else {

                box.innerHTML =
                    studentNotifications
                        .map(
                            notification => `

                                <div class="notification-item">

                                    <div class="item-title">

                                        ${escapeHtml(
                                            notification.title ||
                                            "تنبيه"
                                        )}

                                    </div>

                                    <div class="item-meta">

                                        ${escapeHtml(
                                            notification.message ||
                                            notification.body ||
                                            ""
                                        )}

                                    </div>

                                </div>

                            `
                        )
                        .join("");

            }

        } catch (error) {

            console.error(
                "Dashboard notifications error:",
                error
            );


            document.getElementById(
                "notifications"
            ).innerHTML = `

                <div class="empty">

                    ⚠️

                    <br>

                    ${escapeHtml(
                        studentErrorMessage(
                            error
                        )
                    )}

                </div>

            `;

        }


        // =================================================
        // Lecture Card
        // =================================================

        function createLectureItem(
            lecture
        ) {

            const status =
                getLectureStatus(
                    lecture
                );


            const title =
                lecture.title ||
                "محاضرة";


            const subject =
                lecture.subject ||
                lecture.subjectId ||
                "غير محدد";


            const teacher =
                lecture.teacherId ||
                "غير محدد";


            const statusInfo =
                getStatusInfo(
                    status
                );


            const liveUrl =
                lecture.liveUrl ||
                "";


            const recordingUrl =
                lecture.recordingUrl ||
                "";


            let action = "";


            if (
                status === "live" &&
                liveUrl
            ) {

                action = `

                    <a
                        class="item-button live-button"
                        href="${escapeHtml(
                            liveUrl
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🔴 دخول Live
                    </a>

                `;

            } else if (
                status === "ended" &&
                recordingUrl
            ) {

                action = `

                    <a
                        class="item-button recording-button"
                        href="${escapeHtml(
                            recordingUrl
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ▶️ مشاهدة التسجيل
                    </a>

                `;

            }


            return `

                <div class="lecture-item">

                    <div class="lecture-item-top">

                        <div class="lecture-item-content">

                            <div class="item-title">

                                ${escapeHtml(
                                    title
                                )}

                            </div>

                            <div class="item-meta">

                                📚
                                ${escapeHtml(
                                    subject
                                )}

                                <br>

                                👨‍🏫
                                ${escapeHtml(
                                    teacher
                                )}

                                <br>

                                🕒
                                ${escapeHtml(
                                    formatDateTime(
                                        lecture.scheduledAt
                                    )
                                )}

                            </div>

                            ${
                                action
                            }

                        </div>


                        <span
                            class="
                                lecture-status
                                ${statusInfo.className}
                            "
                        >
                            ${statusInfo.label}
                        </span>

                    </div>

                </div>

            `;

        }


        // =================================================
        // Lecture Status
        // مطابق schedule.html
        // =================================================

        function getLectureStatus(
            lecture
        ) {

            if (
                lecture.status ===
                "cancelled"
            ) {

                return "cancelled";

            }


            if (
                lecture.status ===
                "live"
            ) {

                return "live";

            }


            if (
                lecture.status ===
                "ended"
            ) {

                return "ended";

            }


            const start =
                getTime(
                    lecture.scheduledAt
                );


            const end =
                getTime(
                    lecture.endAt
                );


            const now =
                Date.now();


            if (
                end &&
                now > end
            ) {

                return "ended";

            }


            if (
                start &&
                now >= start &&
                (
                    !end ||
                    now <= end
                )
            ) {

                return "live";

            }


            return "scheduled";

        }


        // =================================================
        // Status Information
        // =================================================

        function getStatusInfo(
            status
        ) {

            const data = {

                scheduled: {

                    label:
                        "قادمة",

                    className:
                        "status-scheduled"

                },

                live: {

                    label:
                        "مباشر الآن",

                    className:
                        "status-live"

                },

                ended: {

                    label:
                        "انتهت",

                    className:
                        "status-ended"

                },

                cancelled: {

                    label:
                        "ملغاة",

                    className:
                        "status-cancelled"

                }

            };


            return (
                data[status] ||
                data.scheduled
            );

        }


        // =================================================
        // Firestore Timestamp / Date
        // مطابق للصفحات الأخرى
        // =================================================

        function getTime(
            value
        ) {

            if (!value) {

                return 0;

            }


            if (
                typeof value.toDate ===
                "function"
            ) {

                return value
                    .toDate()
                    .getTime();

            }


            const date =
                new Date(
                    value
                );


            return isNaN(
                date.getTime()
            )
                ? 0
                : date.getTime();

        }


    } catch (error) {

        console.error(
            "Student dashboard error:",
            error
        );


        const app =
            document.getElementById(
                "studentApp"
            );


        if (app) {

            app.innerHTML = `

                <div
                    style="
                        width:100%;
                        min-height:100vh;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        padding:20px;
                        text-align:center;
                        font-family:Arial,Tahoma,sans-serif;
                        color:#b42318;
                    "
                >

                    ⚠️ حدث خطأ أثناء تحميل لوحة الطالب.

                    <br><br>

                    ${escapeHtml(
                        studentErrorMessage(
                            error
                        )
                    )}

                </div>

            `;

        }

    }

</script>

</body>
</html>
