<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>الاختبارات | بوابة التمريض</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

#teacher-layout {
  display: flex;
  min-height: 100vh;
}

.teacher-sidebar {
  width: 260px;
  background: #0b1f3a;
  color: white;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.teacher-brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding-bottom: 20px;
  border-bottom: 1px solid #ffffff20;
}

.teacher-logo {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: #1976d2;
  display: grid;
  place-items: center;
}

.teacher-brand strong,
.teacher-brand span {
  display: block;
}

.teacher-brand span {
  font-size: 12px;
  color: #b9c7d8;
}

.teacher-account {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 20px 0;
}

.teacher-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: white;
  color: #0b1f3a;
  display: grid;
  place-items: center;
}

.teacher-nav {
  display: grid;
  gap: 8px;
}

.teacher-nav a {
  color: white;
  text-decoration: none;
  padding: 13px;
  border-radius: 9px;
}

.teacher-nav a.active,
.teacher-nav a:hover {
  background: #1976d2;
}

.teacher-logout {
  margin-top: auto;
  border: 0;
  background: #c62828;
  color: white;
  padding: 12px;
  border-radius: 9px;
  cursor: pointer;
}

.teacher-main {
  flex: 1;
}

.teacher-topbar {
  background: white;
  padding: 20px 30px;
}

.teacher-topbar h1 {
  margin: 0;
}

.teacher-topbar p {
  color: #718096;
}

#teacher-content {
  padding: 25px;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  border: 0;
  border-radius: 9px;
  padding: 10px 16px;
  cursor: pointer;
}

.primary {
  background: #1976d2;
  color: white;
}

.danger {
  background: #d32f2f;
  color: white;
}

.secondary {
  background: #e8edf4;
}

.exam-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 3px 15px #00000008;
}

.meta {
  line-height: 1.9;
  color: #68778c;
}

.badge {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
}

.green {
  background: #e8f5e9;
  color: #2e7d32;
}

.red {
  background: #ffebee;
  color: #c62828;
}

.actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 15px;
}

.modal {
  position: fixed;
  inset: 0;
  background: #00000080;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 999;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(850px, 100%);
  max-height: 92vh;
  overflow-y: auto;
  background: white;
  border-radius: 18px;
  padding: 25px;
}

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #d5dce6;
  border-radius: 8px;
}

.question {
  border: 1px solid #dce3ed;
  border-radius: 13px;
  padding: 15px;
  margin-bottom: 15px;
  background: #fafcff;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.option-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.option-row input[type="radio"] {
  width: auto;
}

.option-row input[type="text"] {
  flex: 1;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.empty {
  background: white;
  border-radius: 15px;
  padding: 40px;
  text-align: center;
}

@media(max-width:1000px) {
  .exam-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width:700px) {

  .teacher-sidebar {
    width: 70px;
    padding: 10px;
  }

  .teacher-brand div:not(.teacher-logo),
  .teacher-account div:not(.teacher-avatar),
  .teacher-nav span {
    display: none;
  }

  .exam-grid {
    grid-template-columns: 1fr;
  }

  #teacher-content {
    padding: 15px;
  }
}

</style>

</head>

<body>

<div id="teacher-layout"></div>

<div id="examModal" class="modal">

  <div class="modal-box">

    <h2 id="modalTitle">
      إنشاء اختبار
    </h2>

    <form id="examForm">

      <input
        type="hidden"
        id="examId"
      >

      <div class="form-group">

        <label>المحاضرة</label>

        <select
          id="lectureId"
          required
        >

          <option value="">
            اختر المحاضرة
          </option>

        </select>

      </div>

      <div class="form-group">

        <label>عنوان الاختبار</label>

        <input
          id="examTitle"
          required
          placeholder="اختبار المحاضرة الأولى"
        >

      </div>

      <div class="form-group">

        <label>مدة الاختبار بالدقائق</label>

        <input
          type="number"
          id="examDuration"
          min="1"
          value="30"
          required
        >

      </div>

      <div>

        <h3>الأسئلة</h3>

        <div id="questions"></div>

        <button
          type="button"
          id="addQuestion"
          class="btn secondary"
        >
          + إضافة سؤال
        </button>

      </div>

      <div class="modal-actions">

        <button
          type="submit"
          class="btn primary"
        >
          حفظ الاختبار
        </button>

        <button
          type="button"
          id="closeModal"
          class="btn secondary"
        >
          إلغاء
        </button>

      </div>

    </form>

  </div>

</div>


<script type="module">

import {
  protectTeacherPage,
  createTeacherLayout,
  getTeacherLectures,
  getTeacherExams,
  escapeHtml,
  getStages,
  getSubjects
} from "../src/teacher/teacher.js";

import {
  db
} from "../src/firebase/init.js";

import {
  collection,
  doc,
  addDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const teacher =
  await protectTeacherPage();

createTeacherLayout("exams");

document.querySelector("#teacher-page-title").textContent =
  "إدارة الاختبارات";

const content =
  document.querySelector("#teacher-content");

const modal =
  document.querySelector("#examModal");

const form =
  document.querySelector("#examForm");

const lectureSelect =
  document.querySelector("#lectureId");

const examTitle =
  document.querySelector("#examTitle");

const examDuration =
  document.querySelector("#examDuration");

const questionsContainer =
  document.querySelector("#questions");

const examId =
  document.querySelector("#examId");

const modalTitle =
  document.querySelector("#modalTitle");


const stages =
  await getStages();

const subjects =
  await getSubjects();

const lectures =
  await getTeacherLectures(teacher.uid);

let exams = [];

const params =
  new URLSearchParams(
    window.location.search
  );

const requestedLectureId =
  params.get("lectureId");


function loadLectureOptions() {

  lectureSelect.innerHTML =
    `<option value="">اختر المحاضرة</option>` +

    lectures.map(lecture => `

      <option value="${escapeHtml(lecture.id)}">

        ${escapeHtml(lecture.title)}

      </option>

    `).join("");
}


loadLectureOptions();


function getStageName(id) {

  return (
    stages.find(x => x.id === id)?.name
    || "-"
  );

}


function getSubjectName(id) {

  return (
    subjects.find(x => x.id === id)?.name
    || "-"
  );

}


async function loadExams() {

  exams =
    await getTeacherExams(
      teacher.uid
    );


  if (!exams.length) {

    content.innerHTML = `

      <div class="toolbar">

        <h2>الاختبارات</h2>

        <button
          id="addExam"
          class="btn primary"
        >
          + إنشاء اختبار
        </button>

      </div>

      <div class="empty">

        <h2>لا توجد اختبارات</h2>

        <p>
          أنشئ أول اختبار واربطه بإحدى محاضراتك.
        </p>

      </div>
    `;

  } else {

    content.innerHTML = `

      <div class="toolbar">

        <h2>الاختبارات</h2>

        <button
          id="addExam"
          class="btn primary"
        >
          + إنشاء اختبار
        </button>

      </div>

      <div class="exam-grid">

        ${exams.map(exam => {

          const lecture =
            lectures.find(
              x => x.id === exam.lectureId
            );

          return `

            <div class="card">

              <h3>
                ${escapeHtml(exam.title)}
              </h3>

              <div class="meta">

                🎓 المحاضرة:
                ${escapeHtml(
                  lecture?.title || "-"
                )}

                <br>

                📚 المرحلة:
                ${escapeHtml(
                  getStageName(exam.stageId)
                )}

                <br>

                🩺 المادة:
                ${escapeHtml(
                  getSubjectName(exam.subjectId)
                )}

                <br>

                ❓ عدد الأسئلة:
                ${(exam.questions || []).length}

                <br>

                ⏱️ المدة:
                ${exam.duration || 0} دقيقة

              </div>

              <br>

              <span class="badge ${
                exam.isPublished
                ? "green"
                : "red"
              }">

                ${
                  exam.isPublished
                  ? "منشور"
                  : "مسودة"
                }

              </span>

              <div class="actions">

                <button
                  class="btn secondary edit-btn"
                  data-id="${exam.id}"
                >
                  تعديل
                </button>

                <button
                  class="btn primary publish-btn"
                  data-id="${exam.id}"
                >
                  ${
                    exam.isPublished
                    ? "إلغاء النشر"
                    : "نشر"
                  }
                </button>

                <button
                  class="btn danger delete-btn"
                  data-id="${exam.id}"
                >
                  حذف
                </button>

              </div>

            </div>

          `;

        }).join("")}

      </div>
    `;
  }


  document
    .querySelector("#addExam")
    ?.addEventListener(
      "click",
      () => openAddModal()
    );


  document
    .querySelectorAll(".edit-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => openEditModal(
          button.dataset.id
        )
      );

    });


  document
    .querySelectorAll(".publish-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => togglePublish(
          button.dataset.id
        )
      );

    });


  document
    .querySelectorAll(".delete-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => deleteExam(
          button.dataset.id
        )
      );

    });

}


function addQuestion(data = null) {

  const index =
    questionsContainer.children.length;

  const questionId =
    data?.id ||
    crypto.randomUUID();

  const div =
    document.createElement("div");

  div.className = "question";

  div.dataset.id =
    questionId;

  const options =
    data?.options || ["", "", "", ""];

  const correct =
    Number.isInteger(data?.correctAnswer)
      ? data.correctAnswer
      : 0;

  div.innerHTML = `

    <div class="question-header">

      <strong>
        السؤال ${index + 1}
      </strong>

      <button
        type="button"
        class="btn danger remove-question"
      >
        حذف السؤال
      </button>

    </div>

    <div class="form-group">

      <label>نص السؤال</label>

      <textarea
        class="question-text"
        required
      >${escapeHtml(
        data?.question || ""
      )}</textarea>

    </div>

    ${options.map((option, i) => `

      <div class="option-row">

        <input
          type="radio"
          name="correct-${questionId}"
          value="${i}"
          ${i === correct ? "checked" : ""}
          title="الإجابة الصحيحة"
        >

        <input
          type="text"
          class="option-text"
          value="${escapeHtml(option)}"
          placeholder="الاختيار ${i + 1}"
          required
        >

      </div>

    `).join("")}

    <div class="form-group">

      <label>درجة السؤال</label>

      <input
        type="number"
        class="question-points"
        min="1"
        value="${data?.points || 1}"
        required
      >

    </div>
  `;


  div
    .querySelector(".remove-question")
    .addEventListener(
      "click",
      () => {

        div.remove();

        refreshQuestionNumbers();

      }
    );


  questionsContainer.appendChild(div);
}


function refreshQuestionNumbers() {

  [
    ...questionsContainer.children
  ].forEach((element, index) => {

    element
      .querySelector("strong")
      .textContent =
        `السؤال ${index + 1}`;

  });

}


document
  .querySelector("#addQuestion")
  .addEventListener(
    "click",
    () => addQuestion()
  );


function openAddModal() {

  form.reset();

  examId.value = "";

  questionsContainer.innerHTML = "";

  modalTitle.textContent =
    "إنشاء اختبار";

  if (requestedLectureId) {

    lectureSelect.value =
      requestedLectureId;

  }

  addQuestion();

  modal.classList.add("show");
}


function openEditModal(id) {

  const exam =
    exams.find(x => x.id === id);

  if (!exam) return;

  examId.value =
    exam.id;

  examTitle.value =
    exam.title || "";

  examDuration.value =
    exam.duration || 30;

  lectureSelect.value =
    exam.lectureId || "";

  questionsContainer.innerHTML = "";

  (exam.questions || [])
    .forEach(question =>
      addQuestion(question)
    );

  if (!exam.questions?.length) {
    addQuestion();
  }

  modalTitle.textContent =
    "تعديل الاختبار";

  modal.classList.add("show");
}


document
  .querySelector("#closeModal")
  .addEventListener(
    "click",
    () => modal.classList.remove("show")
  );


lectureSelect.addEventListener(
  "change",
  () => {

    const lecture =
      lectures.find(
        x => x.id === lectureSelect.value
      );

    if (!lecture) return;

  }
);


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    try {

      const selectedLectureId =
        lectureSelect.value;

      const lecture =
        lectures.find(
          x => x.id === selectedLectureId
        );

      if (!lecture) {
        alert("اختر محاضرة صحيحة.");
        return;
      }


      if (
        !teacher.stageIds?.includes(
          lecture.stageId
        )
      ) {
        alert("مرحلة هذه المحاضرة غير مسموحة.");
        return;
      }


      if (
        !teacher.subjectIds?.includes(
          lecture.subjectId
        )
      ) {
        alert("مادة هذه المحاضرة غير مسموحة.");
        return;
      }


      const questionElements =
        [
          ...questionsContainer.children
        ];


      if (!questionElements.length) {

        alert(
          "أضف سؤالًا واحدًا على الأقل."
        );

        return;
      }


      const questions =
        questionElements.map(
          element => {

            const options =
              [
                ...element
                  .querySelectorAll(
                    ".option-text"
                  )
              ]
              .map(input =>
                input.value.trim()
              );


            const correctAnswer =
              Number(
                element.querySelector(
                  'input[type="radio"]:checked'
                )?.value
              );


            const points =
              Number(
                element.querySelector(
                  ".question-points"
                ).value
              );


            return {

              id:
                element.dataset.id,

              question:
                element.querySelector(
                  ".question-text"
                ).value.trim(),

              options,

              correctAnswer,

              points

            };

          }
        );


      const totalScore =
        questions.reduce(
          (sum, question) =>
            sum + question.points,
          0
        );


      const data = {

        lectureId:
          lecture.id,

        teacherId:
          teacher.uid,

        teacherName:
          teacher.name || "",

        stageId:
          lecture.stageId,

        subjectId:
          lecture.subjectId,

        title:
          examTitle.value.trim(),

        duration:
          Number(examDuration.value),

        questions,

        totalScore

      };


      if (examId.value) {

        await updateDoc(
          doc(
            db,
            "exams",
            examId.value
          ),
          {
            ...data,
            updatedAt:
              serverTimestamp()
          }
        );

        alert("تم تعديل الاختبار.");

      } else {

        await addDoc(
          collection(db, "exams"),
          {
            ...data,
            isPublished: false,
            createdAt:
              serverTimestamp(),
            updatedAt:
              serverTimestamp()
          }
        );

        alert("تم إنشاء الاختبار.");
      }


      modal.classList.remove("show");

      await loadExams();

    } catch (error) {

      console.error(error);

      alert(
        "حدث خطأ أثناء حفظ الاختبار."
      );
    }

  }
);


async function togglePublish(id) {

  const exam =
    exams.find(x => x.id === id);

  if (!exam) return;

  try {

    await updateDoc(
      doc(db, "exams", id),
      {
        isPublished:
          exam.isPublished !== true,

        updatedAt:
          serverTimestamp()
      }
    );

    await loadExams();

  } catch (error) {

    console.error(error);

    alert("تعذر تغيير حالة الاختبار.");
  }
}


async function deleteExam(id) {

  const exam =
    exams.find(x => x.id === id);

  if (!exam) return;

  if (
    !confirm(
      `هل تريد حذف الاختبار "${exam.title}"؟`
    )
  ) {
    return;
  }

  try {

    await deleteDoc(
      doc(db, "exams", id)
    );

    await loadExams();

  } catch (error) {

    console.error(error);

    alert("تعذر حذف الاختبار.");
  }
}


await loadExams();

</script>

</body>
</html>
