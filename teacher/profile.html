<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>الملف الشخصي | بوابة التمريض</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

#teacher-layout {
  display: flex;
  min-height: 100vh;
}

.teacher-sidebar {
  width: 260px;
  background: #0b1f3a;
  color: white;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.teacher-brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding-bottom: 20px;
  border-bottom: 1px solid #ffffff20;
}

.teacher-logo {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: #1976d2;
  display: grid;
  place-items: center;
}

.teacher-brand strong,
.teacher-brand span {
  display: block;
}

.teacher-brand span {
  font-size: 12px;
  color: #b9c7d8;
}

.teacher-account {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 20px 0;
}

.teacher-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: white;
  color: #0b1f3a;
  display: grid;
  place-items: center;
}

.teacher-nav {
  display: grid;
  gap: 8px;
}

.teacher-nav a {
  color: white;
  text-decoration: none;
  padding: 13px;
  border-radius: 9px;
}

.teacher-nav a.active,
.teacher-nav a:hover {
  background: #1976d2;
}

.teacher-logout {
  margin-top: auto;
  border: 0;
  background: #c62828;
  color: white;
  padding: 12px;
  border-radius: 9px;
}

.teacher-main {
  flex: 1;
}

.teacher-topbar {
  background: white;
  padding: 20px 30px;
}

#teacher-content {
  padding: 30px;
}

.profile-card {
  background: white;
  border-radius: 18px;
  padding: 25px;
  max-width: 750px;
  box-shadow: 0 3px 15px #00000008;
}

.form-group {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d6dde7;
  border-radius: 9px;
}

input:disabled {
  background: #f0f2f5;
}

button {
  border: 0;
  background: #1976d2;
  color: white;
  padding: 12px 20px;
  border-radius: 9px;
  cursor: pointer;
}

.box {
  background: #f7f9fc;
  border-radius: 12px;
  padding: 15px;
  margin-top: 20px;
}

.tag {
  display: inline-block;
  background: #e3f2fd;
  color: #1565c0;
  padding: 7px 10px;
  border-radius: 20px;
  margin: 4px;
}

@media(max-width:700px) {

  .teacher-sidebar {
    width: 70px;
    padding: 10px;
  }

  .teacher-brand div:not(.teacher-logo),
  .teacher-account div:not(.teacher-avatar),
  .teacher-nav span {
    display: none;
  }

  #teacher-content {
    padding: 15px;
  }

}

</style>

</head>

<body>

<div id="teacher-layout"></div>

<script type="module">

import {
  protectTeacherPage,
  createTeacherLayout,
  getStages,
  getSubjects,
  updateTeacherProfile,
  escapeHtml
} from "../src/teacher/teacher.js";


const teacher =
  await protectTeacherPage();

createTeacherLayout("profile");

document.querySelector("#teacher-page-title").textContent =
  "الملف الشخصي";

const content =
  document.querySelector("#teacher-content");

const stages =
  await getStages();

const subjects =
  await getSubjects();

const teacherStages =
  stages.filter(stage =>
    teacher.stageIds?.includes(stage.id)
  );

const teacherSubjects =
  subjects.filter(subject =>
    teacher.subjectIds?.includes(subject.id)
  );


content.innerHTML = `

<div class="profile-card">

  <h2>بيانات المعلم</h2>

  <form id="profileForm">

    <div class="form-group">

      <label>الاسم</label>

      <input
        id="teacherName"
        value="${escapeHtml(
          teacher.name || ""
        )}"
        required
      >

    </div>

    <div class="form-group">

      <label>البريد الإلكتروني</label>

      <input
        id="teacherEmail"
        type="email"
        value="${escapeHtml(
          teacher.email || ""
        )}"
      >

    </div>

    <div class="form-group">

      <label>Firebase UID</label>

      <input
        value="${escapeHtml(
          teacher.uid
        )}"
        disabled
      >

    </div>

    <button type="submit">
      حفظ التعديلات
    </button>

  </form>

  <div class="box">

    <h3>المراحل المسموحة</h3>

    ${
      teacherStages.length
      ? teacherStages.map(stage => `
          <span class="tag">
            ${escapeHtml(stage.name)}
          </span>
        `).join("")
      : "<p>لا توجد مراحل.</p>"
    }

  </div>

  <div class="box">

    <h3>المواد المسموحة</h3>

    ${
      teacherSubjects.length
      ? teacherSubjects.map(subject => `
          <span class="tag">
            ${escapeHtml(subject.name)}
          </span>
        `).join("")
      : "<p>لا توجد مواد.</p>"
    }

  </div>

</div>
`;


document
  .querySelector("#profileForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      try {

        await updateTeacherProfile({

          name:
            document
              .querySelector("#teacherName")
              .value
              .trim(),

          email:
            document
              .querySelector("#teacherEmail")
              .value
              .trim()

        });

        alert(
          "تم حفظ البيانات بنجاح."
        );

      } catch (error) {

        console.error(error);

        alert(
          "حدث خطأ أثناء حفظ البيانات."
        );
      }

    }
  );

</script>

</body>
</html>
