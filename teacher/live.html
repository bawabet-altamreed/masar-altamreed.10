<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    بث المحاضرة | مسار التمريض
</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    background:
        #071923;

    color:
        white;

}


.live-page {

    min-height:
        100vh;

    display:
        flex;

    flex-direction:
        column;

}


.header {

    background:
        #0c2735;

    padding:
        15px 20px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        15px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

}


.title {

    font-size:
        18px;

    font-weight:
        bold;

}


.status {

    padding:
        7px 12px;

    border-radius:
        20px;

    background:
        #253b45;

    color:
        #b8c8cf;

    font-size:
        11px;

}


.status.connected {

    background:
        #123b2a;

    color:
        #72e3a8;

}


.status.error {

    background:
        #401d1d;

    color:
        #ff9b9b;

}


.main {

    flex:
        1;

    padding:
        18px;

}


.video-grid {

    width:
        100%;

    max-width:
        1200px;

    margin:
        auto;

    display:
        grid;

    grid-template-columns:
        1fr;

    gap:
        15px;

}


.video-box {

    position:
        relative;

    background:
        #000;

    border-radius:
        16px;

    overflow:
        hidden;

    min-height:
        560px;

}


#screenVideo {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    background:
        #000;

}


#screenVideo video {

    width:
        100%;

    height:
        100%;

    object-fit:
        contain;

}


#cameraVideo {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        #000;

}


#cameraVideo video {

    width:
        100%;

    height:
        100%;

    object-fit:
        contain;

}


/*
   عند مشاركة الشاشة:
   الكاميرا تصبح نافذة صغيرة
*/

.video-box.screen-sharing
#cameraVideo {

    width:
        210px;

    height:
        150px;

    right:
        15px;

    bottom:
        15px;

    left:
        auto;

    top:
        auto;

    z-index:
        10;

    border-radius:
        14px;

    overflow:
        hidden;

    border:
        2px solid
        rgba(255,255,255,.25);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.5);

}


/*
   Screen share becomes main
*/

.video-box.screen-sharing
#screenVideo {

    display:
        flex;

}


.video-box.screen-sharing
#cameraVideo video {

    object-fit:
        cover;

}


.placeholder {

    position:
        absolute;

    inset:
        0;

    z-index:
        20;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    color:
        #8da0aa;

    text-align:
        center;

    line-height:
        2;

    pointer-events:
        none;

}


.placeholder-icon {

    font-size:
        45px;

    margin-bottom:
        10px;

}


.controls {

    background:
        #0c2735;

    padding:
        15px;

    display:
        flex;

    justify-content:
        center;

    gap:
        10px;

    flex-wrap:
        wrap;

}


.button {

    border:
        none;

    border-radius:
        10px;

    padding:
        12px 20px;

    cursor:
        pointer;

    font-family:
        inherit;

    font-weight:
        bold;

    background:
        #087ea4;

    color:
        white;

}


.button.start {

    background:
        #16834f;

}


.button.end {

    background:
        #b42318;

}


.button.camera {

    background:
        #6750a4;

}


.button.screen {

    background:
        #0b7285;

}


.button.stop-screen {

    background:
        #a15c00;

}


.button:disabled {

    opacity:
        .5;

    cursor:
        not-allowed;

}


.message {

    max-width:
        1200px;

    margin:
        15px auto 0;

    padding:
        12px;

    border-radius:
        10px;

    background:
        #401d1d;

    color:
        #ffb1b1;

    display:
        none;

}


.message.show {

    display:
        block;

}


@media (max-width:700px) {

    .video-box {

        min-height:
            350px;

    }


    #screenVideo,
    #cameraVideo {

        min-height:
            350px;

    }


    .video-box.screen-sharing
    #cameraVideo {

        width:
            125px;

        height:
            95px;

        right:
            10px;

        bottom:
            10px;

    }


    .header {

        flex-direction:
            column;

        align-items:
            stretch;

    }


    .button {

        padding:
            11px 15px;

    }

}

</style>

</head>


<body>


<div class="live-page">


    <header class="header">

        <div
            class="title"
            id="lectureTitle"
        >
            جاري تحميل المحاضرة...
        </div>


        <div
            id="connectionStatus"
            class="status"
        >
            جاري التحميل...
        </div>

    </header>


    <main class="main">

        <div class="video-grid">

            <div
                class="video-box"
                id="videoBox"
            >


                <!-- =========================
                     Screen Share
                ========================== -->

                <div
                    id="screenVideo"
                ></div>


                <!-- =========================
                     Camera
                ========================== -->

                <div
                    id="cameraVideo"
                ></div>


                <!-- =========================
                     Placeholder
                ========================== -->

                <div
                    id="placeholder"
                    class="placeholder"
                >

                    <div
                        class="placeholder-icon"
                    >
                        🎥
                    </div>

                    <div>
                        الكاميرا لم تبدأ بعد
                    </div>

                </div>


            </div>

        </div>


        <div
            id="message"
            class="message"
        >
        </div>

    </main>


    <footer class="controls">


        <!-- =========================
             Start
        ========================== -->

        <button
            id="startButton"
            class="button start"
        >
            🔴 بدء البث
        </button>


        <!-- =========================
             Camera Switch
        ========================== -->

        <button
            id="cameraButton"
            class="button camera"
            disabled
        >
            🔄 الكاميرا الخلفية
        </button>


        <!-- =========================
             Screen Share
        ========================== -->

        <button
            id="screenButton"
            class="button screen"
            disabled
        >
            🖥️ مشاركة الشاشة
        </button>


        <!-- =========================
             Stop Screen
        ========================== -->

        <button
            id="stopScreenButton"
            class="button stop-screen"
            disabled
        >
            ⏹️ إيقاف الشاشة
        </button>


        <!-- =========================
             End
        ========================== -->

        <button
            id="endButton"
            class="button end"
            disabled
        >
            ⏹ إنهاء البث
        </button>


        <!-- =========================
             Leave
        ========================== -->

        <button
            id="leaveButton"
            class="button"
        >
            خروج
        </button>


    </footer>

</div>


<script type="module">


import {

    doc,
    getDoc,
    updateDoc,
    serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {

    db

} from "../src/firebase/init.js";


import {

    protectTeacherPage

} from "../src/teacher/teacher.js";


import {

    connectLiveKit,

    enableTeacherMedia,

    attachCameraTrack,

    attachScreenTrack,

    startScreenShare,

    stopScreenShare,

    switchTeacherCamera,

    leaveLiveKit,

    getCurrentRoom

} from "../src/livekit/client.js";


/* =====================================================
   URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const lectureId =
    params.get(
        "lectureId"
    );


/* =====================================================
   DOM
===================================================== */

const lectureTitle =
    document.getElementById(
        "lectureTitle"
    );


const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );


const videoBox =
    document.getElementById(
        "videoBox"
    );


const cameraVideo =
    document.getElementById(
        "cameraVideo"
    );


const screenVideo =
    document.getElementById(
        "screenVideo"
    );


const placeholder =
    document.getElementById(
        "placeholder"
    );


const message =
    document.getElementById(
        "message"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const cameraButton =
    document.getElementById(
        "cameraButton"
    );


const screenButton =
    document.getElementById(
        "screenButton"
    );


const stopScreenButton =
    document.getElementById(
        "stopScreenButton"
    );


const endButton =
    document.getElementById(
        "endButton"
    );


const leaveButton =
    document.getElementById(
        "leaveButton"
    );


/* =====================================================
   State
===================================================== */

let teacher =
    null;


let lecture =
    null;


let room =
    null;


let usingBackCamera =
    false;


let sharingScreen =
    false;


/* =====================================================
   Error
===================================================== */

function showError(
    text
) {

    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    connectionStatus.textContent =
        "حدث خطأ";


    connectionStatus.className =
        "status error";

}


/* =====================================================
   Clear Error
===================================================== */

function clearError() {

    message.textContent =
        "";


    message.classList.remove(
        "show"
    );

}


/* =====================================================
   Update Camera Button
===================================================== */

function updateCameraButton() {

    if (usingBackCamera) {

        cameraButton.textContent =
            "🔄 الكاميرا الأمامية";

    } else {

        cameraButton.textContent =
            "🔄 الكاميرا الخلفية";

    }

}


/* =====================================================
   Attach Camera
===================================================== */

function refreshCameraVideo() {

    if (!room) {

        return;

    }


    cameraVideo.innerHTML =
        "";


    attachCameraTrack(
        room,
        cameraVideo
    );


    placeholder.style.display =
        "none";

}


/* =====================================================
   Attach Screen
===================================================== */

function refreshScreenVideo() {

    if (!room) {

        return;

    }


    screenVideo.innerHTML =
        "";


    const element =
        attachScreenTrack(
            room,
            screenVideo
        );


    if (!element) {

        return;

    }


    videoBox.classList.add(
        "screen-sharing"
    );


    screenVideo.style.display =
        "flex";


    sharingScreen =
        true;


    screenButton.disabled =
        true;


    stopScreenButton.disabled =
        false;

}


/* =====================================================
   Stop Screen UI
===================================================== */

function resetScreenUI() {

    sharingScreen =
        false;


    videoBox.classList.remove(
        "screen-sharing"
    );


    screenVideo.innerHTML =
        "";


    screenVideo.style.display =
        "none";


    screenButton.disabled =
        false;


    stopScreenButton.disabled =
        true;

}


/* =====================================================
   Load Lecture
===================================================== */

async function loadLecture() {

    if (!lectureId) {

        throw new Error(
            "معرّف المحاضرة غير موجود."
        );

    }


    connectionStatus.textContent =
        "جاري تحميل المحاضرة...";


    teacher =
        await protectTeacherPage();


    if (!teacher) {

        throw new Error(
            "تعذر التحقق من حساب المدرس."
        );

    }


    const lectureSnap =
        await getDoc(
            doc(
                db,
                "lectures",
                lectureId
            )
        );


    if (
        !lectureSnap.exists()
    ) {

        throw new Error(
            "المحاضرة غير موجودة."
        );

    }


    lecture = {

        id:
            lectureSnap.id,

        ...lectureSnap.data()

    };


    if (
        lecture.teacherId !==
        teacher.uid
    ) {

        throw new Error(
            "هذه المحاضرة ليست تابعة لحسابك."
        );

    }


    if (
        !lecture.roomName
    ) {

        throw new Error(
            "غرفة المحاضرة غير مجهزة. ارجع إلى صفحة المحاضرات وأنشئ المحاضرة من جديد."
        );

    }


    lectureTitle.textContent =
        lecture.title ||
        "المحاضرة المباشرة";


    if (
        lecture.isLive ===
        true
    ) {

        startButton.disabled =
            false;

        endButton.disabled =
            false;

        connectionStatus.textContent =
            "🔴 المحاضرة مباشرة";

    } else {

        connectionStatus.textContent =
            "جاهز لبدء البث";

    }

}


/* =====================================================
   Start Broadcast
===================================================== */

async function startBroadcast() {

    if (!lecture) {

        showError(
            "لم يتم تحميل بيانات المحاضرة."
        );

        return;

    }


    if (!lecture.roomName) {

        showError(
            "اسم غرفة LiveKit غير موجود."
        );

        return;

    }


    clearError();


    startButton.disabled =
        true;

    endButton.disabled =
        true;

    cameraButton.disabled =
        true;

    screenButton.disabled =
        true;


    try {

        connectionStatus.textContent =
            "جاري الاتصال بـ LiveKit...";


        connectionStatus.className =
            "status";


        room =
            await connectLiveKit(
                lecture.roomName,
                {

                    onConnected() {

                        connectionStatus.textContent =
                            "🟢 تم الاتصال بـ LiveKit";

                        connectionStatus.className =
                            "status connected";

                    },


                    onDisconnected() {

                        connectionStatus.textContent =
                            "تم قطع الاتصال";

                        connectionStatus.className =
                            "status error";

                    },


                    onConnectionError(
                        error
                    ) {

                        console.error(
                            "LiveKit connection error:",
                            error
                        );

                    },


                    onLocalTrackPublished(
                        publication
                    ) {

                        if (
                            publication.source ===
                            "screen_share"
                        ) {

                            setTimeout(
                                () => {

                                    refreshScreenVideo();

                                },
                                100
                            );

                        }

                    },


                    onLocalTrackUnpublished(
                        publication
                    ) {

                        if (
                            publication.source ===
                            "screen_share"
                        ) {

                            resetScreenUI();

                        }

                    }

                }
            );


        if (!room) {

            throw new Error(
                "تعذر إنشاء اتصال LiveKit."
            );

        }


        connectionStatus.textContent =
            "🟢 متصل — جاري تشغيل الكاميرا...";


        connectionStatus.className =
            "status connected";


        await enableTeacherMedia(
            room
        );


        cameraVideo.innerHTML =
            "";


        attachCameraTrack(
            room,
            cameraVideo
        );


        const localParticipant =
            room.localParticipant;


        const cameraPublication =
            localParticipant.getTrackPublication(
                "camera"
            );


        const hasVideo =
            Boolean(
                cameraPublication &&
                cameraPublication.track
            );


        if (!hasVideo) {

            throw new Error(
                "تم الاتصال بـ LiveKit لكن لم يتم تشغيل كاميرا المدرس."
            );

        }


        placeholder.style.display =
            "none";


        await updateDoc(
            doc(
                db,
                "lectures",
                lectureId
            ),
            {

                isLive:
                    true,

                isPublished:
                    true,

                roomName:
                    lecture.roomName,

                updatedAt:
                    serverTimestamp()

            }
        );


        lecture.isLive =
            true;


        startButton.disabled =
            true;


        endButton.disabled =
            false;


        cameraButton.disabled =
            false;


        screenButton.disabled =
            false;


        stopScreenButton.disabled =
            true;


        updateCameraButton();


        connectionStatus.textContent =
            "🔴 البث مباشر الآن";


        connectionStatus.className =
            "status connected";


    } catch (error) {

        console.error(
            "Teacher LiveKit error:",
            error
        );


        await leaveLiveKit();


        room =
            null;


        startButton.disabled =
            false;


        endButton.disabled =
            true;


        cameraButton.disabled =
            true;


        screenButton.disabled =
            true;


        stopScreenButton.disabled =
            true;


        resetScreenUI();


        cameraVideo.innerHTML =
            "";


        placeholder.style.display =
            "flex";


        showError(
            error?.message ||
            "تعذر بدء البث."
        );

    }

}


/* =====================================================
   Switch Camera
===================================================== */

cameraButton.addEventListener(
    "click",
    async () => {

        if (!room) {

            return;

        }


        clearError();


        cameraButton.disabled =
            true;


        const nextFacingMode =
            usingBackCamera
                ? "user"
                : "environment";


        try {

            connectionStatus.textContent =
                "جاري تبديل الكاميرا...";


            await switchTeacherCamera(
                room,
                nextFacingMode
            );


            usingBackCamera =
                !usingBackCamera;


            refreshCameraVideo();


            updateCameraButton();


            connectionStatus.textContent =
                sharingScreen
                    ? "🔴 البث مباشر — الشاشة مشاركة"
                    : "🔴 البث مباشر الآن";


            connectionStatus.className =
                "status connected";


        } catch (error) {

            console.error(
                "Switch camera error:",
                error
            );


            showError(
                error?.message ||
                "تعذر تبديل الكاميرا."
            );

        } finally {

            cameraButton.disabled =
                false;

        }

    }
);


/* =====================================================
   Start Screen Share
===================================================== */

screenButton.addEventListener(
    "click",
    async () => {

        if (!room) {

            return;

        }


        clearError();


        screenButton.disabled =
            true;


        try {

            connectionStatus.textContent =
                "جاري بدء مشاركة الشاشة...";


            await startScreenShare(
                room
            );


            setTimeout(
                () => {

                    refreshScreenVideo();

                },
                300
            );


            connectionStatus.textContent =
                "🔴 البث مباشر — الشاشة مشاركة";


            connectionStatus.className =
                "status connected";


        } catch (error) {

            console.error(
                "Screen share error:",
                error
            );


            screenButton.disabled =
                false;


            showError(
                error?.message ||
                "تعذر بدء مشاركة الشاشة."
            );

        }

    }
);


/* =====================================================
   Stop Screen Share
===================================================== */

stopScreenButton.addEventListener(
    "click",
    async () => {

        if (!room) {

            return;

        }


        stopScreenButton.disabled =
            true;


        try {

            await stopScreenShare(
                room
            );

        } catch (error) {

            console.error(
                "Stop screen error:",
                error
            );

        }


        resetScreenUI();


        connectionStatus.textContent =
            "🔴 البث مباشر الآن";


        connectionStatus.className =
            "status connected";

    }
);


/* =====================================================
   End Broadcast
===================================================== */

endButton.addEventListener(
    "click",
    async () => {

        if (
            !confirm(
                "هل أنت متأكد من إنهاء المحاضرة المباشرة؟"
            )
        ) {

            return;

        }


        endButton.disabled =
            true;


        try {

            if (room) {

                await stopScreenShare(
                    room
                );

            }


            await updateDoc(
                doc(
                    db,
                    "lectures",
                    lectureId
                ),
                {

                    isLive:
                        false,

                    updatedAt:
                        serverTimestamp()

                }
            );


            await leaveLiveKit();


            room =
                null;


            lecture.isLive =
                false;


            sharingScreen =
                false;


            connectionStatus.textContent =
                "تم إنهاء البث";


            connectionStatus.className =
                "status";


            startButton.disabled =
                false;


            endButton.disabled =
                true;


            cameraButton.disabled =
                true;


            screenButton.disabled =
                true;


            stopScreenButton.disabled =
                true;


            cameraVideo.innerHTML =
                "";


            screenVideo.innerHTML =
                "";


            resetScreenUI();


            placeholder.style.display =
                "flex";


        } catch (error) {

            console.error(
                "End broadcast error:",
                error
            );


            showError(
                error?.message ||
                "حدث خطأ أثناء إنهاء البث."
            );


            endButton.disabled =
                false;

        }

    }
);


/* =====================================================
   Leave
===================================================== */

leaveButton.addEventListener(
    "click",
    async () => {

        await leaveLiveKit();


        window.location.href =
            "lectures.html";

    }
);


/* =====================================================
   Before Unload
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        leaveLiveKit();

    }
);


/* =====================================================
   Init
===================================================== */

try {

    await loadLecture();

} catch (error) {

    console.error(
        "Load lecture error:",
        error
    );


    startButton.disabled =
        true;


    endButton.disabled =
        true;


    cameraButton.disabled =
        true;


    screenButton.disabled =
        true;


    stopScreenButton.disabled =
        true;


    showError(
        error?.message ||
        "تعذر تحميل المحاضرة."
    );

}

</script>


</body>
</html>
