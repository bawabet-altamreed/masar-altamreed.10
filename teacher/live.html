<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        بث المحاضرة | مسار التمريض
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #0f172a;

            color: #fff;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            display: flex;

            flex-direction: column;
        }


        .header {

            padding: 18px;

            background: #111827;

            border-bottom:
                1px solid #334155;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 12px;

            flex-wrap: wrap;
        }


        .title {

            font-size: 20px;

            font-weight: bold;
        }


        .status {

            color: #94a3b8;

            font-size: 14px;
        }


        .main {

            flex: 1;

            padding: 20px;

            width: 100%;
        }


        .video-grid {

            width: 100%;

            max-width: 1100px;

            margin: auto;

            display: flex;

            flex-direction: column;

            gap: 15px;
        }


        .video-box {

            width: 100%;

            min-height: 350px;

            background: #020617;

            border:
                1px solid #334155;

            border-radius: 16px;

            overflow: hidden;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        #teacherVideo {

            width: 100%;

            height: 100%;

            min-height: 350px;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        #teacherVideo video {

            width: 100%;

            height: 100%;

            min-height: 350px;

            object-fit: cover;

            display: block;
        }


        .placeholder {

            position: absolute;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            flex-direction: column;

            text-align: center;

            color: #94a3b8;

            font-size: 18px;

            line-height: 2;
        }


        /* =================================================
           Screen Share
        ================================================= */

        .screen-share-box {

            display: none;

            width: 100%;

            background: #020617;

            border:
                1px solid #334155;

            border-radius: 16px;

            overflow: hidden;
        }


        .screen-share-box.active {

            display: block;
        }


        .screen-share-header {

            padding: 10px 15px;

            background: #1e293b;

            color: #e2e8f0;

            font-size: 14px;

            font-weight: bold;
        }


        #screenShareVideo {

            width: 100%;

            min-height: 300px;

            background: #000;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        #screenShareVideo video {

            width: 100%;

            height: auto;

            max-height: 70vh;

            object-fit: contain;

            display: block;

            background: #000;
        }


        .message {

            width: 100%;

            max-width: 1100px;

            margin:
                15px auto 0;

            padding: 12px 15px;

            background: #7f1d1d;

            color: #fecaca;

            border-radius: 10px;

            display: none;

            font-size: 14px;
        }


        .message.show {

            display: block;
        }


        .controls {

            padding: 15px;

            background: #111827;

            border-top:
                1px solid #334155;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }


        .button {

            border: 0;

            border-radius: 10px;

            padding: 12px 18px;

            font-size: 14px;

            font-weight: bold;

            color: #fff;

            background: #334155;

            cursor: pointer;
        }


        .button:disabled {

            opacity: 0.45;

            cursor: not-allowed;
        }


        .button.start {

            background: #dc2626;
        }


        .button.end {

            background: #475569;
        }


        .button.camera {

            background: #2563eb;
        }


        .button.screen {

            background: #7c3aed;
        }


        .button.stop-screen {

            background: #b91c1c;

            display: none;
        }


        @media (max-width: 600px) {

            .header {

                flex-direction: column;

                align-items: flex-start;
            }


            .title {

                font-size: 17px;
            }


            .main {

                padding: 10px;
            }


            .video-box {

                min-height: 240px;
            }


            #teacherVideo {

                min-height: 240px;
            }


            #teacherVideo video {

                min-height: 240px;
            }


            .button {

                flex:
                    1 1 calc(50% - 10px);

                min-width: 140px;
            }
        }

    </style>

</head>


<body>


    <header class="header">

        <div
            class="title"
            id="lectureTitle"
        >
            جاري تحميل المحاضرة...
        </div>


        <div
            id="connectionStatus"
            class="status"
        >
            جاري التحميل...
        </div>

    </header>



    <main class="main">

        <div class="video-grid">


            <!-- =========================
                 Camera
            ========================== -->

            <div class="video-box">

                <div
                    id="teacherVideo"
                ></div>


                <div
                    id="placeholder"
                    class="placeholder"
                >

                    🎥

                    <br>

                    الكاميرا لم تبدأ بعد

                </div>

            </div>



            <!-- =========================
                 Screen Share
            ========================== -->

            <div
                id="screenShareBox"
                class="screen-share-box"
            >

                <div
                    class="screen-share-header"
                >
                    🖥️ شاشة المدرس — PDF / الكتاب
                </div>


                <div
                    id="screenShareVideo"
                ></div>

            </div>


        </div>


        <div
            id="message"
            class="message"
        ></div>

    </main>



    <footer class="controls">


        <!-- Start -->

        <button
            id="startButton"
            class="button start"
        >
            🔴 بدء البث
        </button>


        <!-- End -->

        <button
            id="endButton"
            class="button end"
            disabled
        >
            ⏹ إنهاء البث
        </button>


        <!-- Front -->

        <button
            id="frontCameraButton"
            class="button camera"
            disabled
        >
            🤳 الأمامية
        </button>


        <!-- Back -->

        <button
            id="backCameraButton"
            class="button camera"
            disabled
        >
            🔄 الخلفية
        </button>


        <!-- Screen -->

        <button
            id="screenShareButton"
            class="button screen"
            disabled
        >
            🖥️ مشاركة الشاشة
        </button>


        <!-- Stop Screen -->

        <button
            id="stopScreenShareButton"
            class="button stop-screen"
            disabled
        >
            ⛔ إيقاف الشاشة
        </button>


        <!-- Leave -->

        <button
            id="leaveButton"
            class="button"
        >
            خروج
        </button>


    </footer>



    <script type="module">


        import {
            doc,
            getDoc,
            updateDoc,
            serverTimestamp
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        import {
            db
        } from "../src/firebase/init.js";


        import {
            protectTeacherPage
        } from "../src/teacher/teacher.js";


        import {
            connectLiveKit,
            enableTeacherMedia,
            attachLocalTracks,
            switchTeacherCamera,
            startScreenShare,
            stopScreenShare,
            attachLocalScreenShare,
            leaveLiveKit
        } from "../src/livekit/client.js";



        /* =================================================
           DOM
        ================================================= */

        const lectureTitle =
            document.getElementById(
                "lectureTitle"
            );


        const connectionStatus =
            document.getElementById(
                "connectionStatus"
            );


        const teacherVideo =
            document.getElementById(
                "teacherVideo"
            );


        const placeholder =
            document.getElementById(
                "placeholder"
            );


        const message =
            document.getElementById(
                "message"
            );


        const screenShareBox =
            document.getElementById(
                "screenShareBox"
            );


        const screenShareVideo =
            document.getElementById(
                "screenShareVideo"
            );


        const startButton =
            document.getElementById(
                "startButton"
            );


        const endButton =
            document.getElementById(
                "endButton"
            );


        const frontCameraButton =
            document.getElementById(
                "frontCameraButton"
            );


        const backCameraButton =
            document.getElementById(
                "backCameraButton"
            );


        const screenShareButton =
            document.getElementById(
                "screenShareButton"
            );


        const stopScreenShareButton =
            document.getElementById(
                "stopScreenShareButton"
            );


        const leaveButton =
            document.getElementById(
                "leaveButton"
            );



        /* =================================================
           State
        ================================================= */

        let teacher = null;

        let lecture = null;

        let lectureId = null;

        let room = null;

        let isBroadcasting = false;



        /* =================================================
           URL
        ================================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        lectureId =
            params.get(
                "lectureId"
            );



        /* =================================================
           Message
        ================================================= */

        function showMessage(text) {

            message.textContent =
                text;

            message.classList.add(
                "show"
            );
        }


        function hideMessage() {

            message.textContent =
                "";

            message.classList.remove(
                "show"
            );
        }



        /* =================================================
           Status
        ================================================= */

        function setStatus(text) {

            connectionStatus.textContent =
                text;
        }



        /* =================================================
           Enable Extra Controls
        ================================================= */

        function enableBroadcastControls() {

            frontCameraButton.disabled =
                false;

            backCameraButton.disabled =
                false;

            screenShareButton.disabled =
                false;
        }


        function disableBroadcastControls() {

            frontCameraButton.disabled =
                true;

            backCameraButton.disabled =
                true;

            screenShareButton.disabled =
                true;

            stopScreenShareButton.disabled =
                true;

            stopScreenShareButton.style.display =
                "none";

            screenShareButton.style.display =
                "inline-block";
        }



        /* =================================================
           Load Lecture
        ================================================= */

        async function loadLecture() {

            try {

                hideMessage();


                if (!lectureId) {

                    throw new Error(
                        "معرف المحاضرة غير موجود."
                    );
                }


                /*
                 * نفس الطريقة القديمة
                 */

                teacher =
                    await protectTeacherPage();


                if (!teacher) {

                    throw new Error(
                        "تعذر التحقق من حساب المدرس."
                    );
                }


                const lectureRef =
                    doc(
                        db,
                        "lectures",
                        lectureId
                    );


                const snapshot =
                    await getDoc(
                        lectureRef
                    );


                if (!snapshot.exists()) {

                    throw new Error(
                        "المحاضرة غير موجودة."
                    );
                }


                lecture = {

                    id:
                        snapshot.id,

                    ...snapshot.data()
                };


                if (
                    lecture.teacherId !==
                    teacher.uid
                ) {

                    throw new Error(
                        "لا تملك صلاحية هذه المحاضرة."
                    );
                }


                if (!lecture.roomName) {

                    throw new Error(
                        "غرفة LiveKit الخاصة بالمحاضرة غير موجودة."
                    );
                }


                lectureTitle.textContent =
                    lecture.title ||
                    "بث المحاضرة";


                setStatus(
                    "جاهز لبدء البث"
                );


            } catch (error) {

                console.error(
                    "Load lecture error:",
                    error
                );


                lectureTitle.textContent =
                    "تعذر تحميل المحاضرة";


                setStatus(
                    "حدث خطأ"
                );


                showMessage(
                    error?.message ||
                    "تعذر تحميل المحاضرة."
                );
            }
        }



        /* =================================================
           Start Broadcast
        ================================================= */

        async function startBroadcast() {

            try {

                hideMessage();


                if (!lecture) {

                    throw new Error(
                        "المحاضرة لم يتم تحميلها."
                    );
                }


                if (!lecture.roomName) {

                    throw new Error(
                        "اسم غرفة LiveKit غير موجود."
                    );
                }


                startButton.disabled =
                    true;


                setStatus(
                    "جاري الاتصال بـ LiveKit..."
                );


                /*
                 * الاتصال القديم نفسه
                 */

                room =
                    await connectLiveKit(
                        lecture.roomName,

                        {

                            onConnected:
                                () => {

                                    setStatus(
                                        "تم الاتصال بـ LiveKit"
                                    );
                                },


                            onDisconnected:
                                () => {

                                    setStatus(
                                        "تم قطع الاتصال"
                                    );
                                },


                            onConnectionError:
                                error => {

                                    console.error(
                                        "LiveKit connection error:",
                                        error
                                    );
                                }

                        }
                    );


                /*
                 * الكاميرا + المايك القديم
                 */

                await enableTeacherMedia(
                    room
                );


                /*
                 * عرض Track القديم
                 */

                teacherVideo.innerHTML =
                    "";


                attachLocalTracks(
                    room,
                    teacherVideo
                );


                placeholder.style.display =
                    "none";


                /*
                 * Firebase القديم
                 */

                await updateDoc(

                    doc(
                        db,
                        "lectures",
                        lectureId
                    ),

                    {

                        isLive:
                            true,

                        isPublished:
                            true,

                        roomName:
                            lecture.roomName,

                        updatedAt:
                            serverTimestamp()
                    }
                );


                isBroadcasting =
                    true;


                endButton.disabled =
                    false;


                enableBroadcastControls();


                setStatus(
                    "🔴 البث مباشر الآن"
                );


            } catch (error) {

                console.error(
                    "Start broadcast error:",
                    error
                );


                startButton.disabled =
                    false;


                endButton.disabled =
                    true;


                disableBroadcastControls();


                try {

                    await leaveLiveKit();

                } catch (leaveError) {

                    console.warn(
                        leaveError
                    );
                }


                room =
                    null;


                isBroadcasting =
                    false;


                setStatus(
                    "تعذر بدء البث"
                );


                showMessage(
                    error?.message ||
                    "تعذر بدء البث."
                );
            }
        }



        /* =================================================
           Switch Camera
        ================================================= */

        async function changeCamera(
            facingMode
        ) {

            if (
                !room ||
                !isBroadcasting
            ) {

                return;
            }


            try {

                hideMessage();


                frontCameraButton.disabled =
                    true;

                backCameraButton.disabled =
                    true;


                setStatus(

                    facingMode ===
                    "environment"

                        ? "جاري تشغيل الكاميرا الخلفية..."

                        : "جاري تشغيل الكاميرا الأمامية..."
                );


                /*
                 * هنا يتم تغيير نفس Track
                 * بدون إعادة اتصال LiveKit.
                 */

                await switchTeacherCamera(
                    room,
                    facingMode
                );


                /*
                 * إعادة عرض الفيديو المحلي فقط.
                 * لا نعيد الاتصال بالغرفة.
                 */

                teacherVideo.innerHTML =
                    "";


                const publication =
                    room.localParticipant
                        .getTrackPublication(
                            "camera"
                        );


                if (
                    publication &&
                    publication.track
                ) {

                    const video =
                        publication.track.attach();


                    video.autoplay =
                        true;

                    video.playsInline =
                        true;

                    video.style.width =
                        "100%";

                    video.style.height =
                        "100%";

                    video.style.objectFit =
                        "cover";


                    teacherVideo.appendChild(
                        video
                    );
                }


                setStatus(

                    facingMode ===
                    "environment"

                        ? "🔴 البث مباشر — الكاميرا الخلفية"

                        : "🔴 البث مباشر — الكاميرا الأمامية"
                );


            } catch (error) {

                console.error(
                    "Change camera error:",
                    error
                );


                showMessage(
                    error?.message ||
                    "تعذر تبديل الكاميرا."
                );


                setStatus(
                    "🔴 البث مباشر"
                );


            } finally {

                if (isBroadcasting) {

                    frontCameraButton.disabled =
                        false;

                    backCameraButton.disabled =
                        false;
                }
            }
        }



        /* =================================================
           Start Screen Share
        ================================================= */

        async function handleStartScreenShare() {

            if (
                !room ||
                !isBroadcasting
            ) {

                return;
            }


            try {

                hideMessage();


                screenShareButton.disabled =
                    true;


                setStatus(
                    "جاري بدء مشاركة الشاشة..."
                );


                /*
                 * LiveKit يبدأ getDisplayMedia
                 * ويطلب من المدرس اختيار الشاشة.
                 */

                await startScreenShare(
                    room
                );


                /*
                 * انتظر ظهور Track
                 */

                let attached =
                    false;


                for (
                    let i = 0;
                    i < 15;
                    i++
                ) {

                    screenShareVideo.innerHTML =
                        "";


                    const element =
                        attachLocalScreenShare(
                            room,
                            screenShareVideo
                        );


                    if (element) {

                        attached =
                            true;

                        break;
                    }


                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                100
                            )
                    );
                }


                if (!attached) {

                    throw new Error(
                        "تم بدء مشاركة الشاشة ولكن تعذر عرضها."
                    );
                }


                screenShareBox.classList.add(
                    "active"
                );


                screenShareButton.style.display =
                    "none";


                stopScreenShareButton.style.display =
                    "inline-block";


                stopScreenShareButton.disabled =
                    false;


                setStatus(
                    "🔴 البث مباشر — شاشة الكتاب مفعلة"
                );


            } catch (error) {

                console.error(
                    "Screen share error:",
                    error
                );


                screenShareButton.disabled =
                    false;


                screenShareBox.classList.remove(
                    "active"
                );


                screenShareVideo.innerHTML =
                    "";


                stopScreenShareButton.style.display =
                    "none";


                stopScreenShareButton.disabled =
                    true;


                showMessage(
                    error?.message ||
                    "تعذر بدء مشاركة الشاشة."
                );


                setStatus(
                    "🔴 البث مباشر"
                );
            }
        }



        /* =================================================
           Stop Screen Share
        ================================================= */

        async function handleStopScreenShare() {

            if (!room) {
                return;
            }


            await stopScreenShare(
                room
            );


            screenShareVideo.innerHTML =
                "";


            screenShareBox.classList.remove(
                "active"
            );


            stopScreenShareButton.style.display =
                "none";


            stopScreenShareButton.disabled =
                true;


            screenShareButton.style.display =
                "inline-block";


            screenShareButton.disabled =
                false;


            setStatus(
                "🔴 البث مباشر"
            );
        }



        /* =================================================
           End Broadcast
        ================================================= */

        async function endBroadcast() {

            try {

                endButton.disabled =
                    true;


                /*
                 * إيقاف مشاركة الشاشة
                 */

                if (
                    room &&
                    room.localParticipant &&
                    room.localParticipant
                        .isScreenShareEnabled
                ) {

                    await handleStopScreenShare();
                }


                /*
                 * Firebase
                 */

                if (lectureId) {

                    await updateDoc(

                        doc(
                            db,
                            "lectures",
                            lectureId
                        ),

                        {

                            isLive:
                                false,

                            updatedAt:
                                serverTimestamp()
                        }
                    );
                }


                /*
                 * LiveKit
                 */

                await leaveLiveKit();


                room =
                    null;


                isBroadcasting =
                    false;


                teacherVideo.innerHTML =
                    "";


                screenShareVideo.innerHTML =
                    "";


                screenShareBox.classList.remove(
                    "active"
                );


                placeholder.style.display =
                    "flex";


                startButton.disabled =
                    false;


                endButton.disabled =
                    true;


                disableBroadcastControls();


                setStatus(
                    "تم إنهاء البث"
                );


            } catch (error) {

                console.error(
                    "End broadcast error:",
                    error
                );


                showMessage(
                    error?.message ||
                    "تعذر إنهاء البث."
                );
            }
        }



        /* =================================================
           Leave
        ================================================= */

        async function leavePage() {

            try {

                await leaveLiveKit();

            } catch (error) {

                console.warn(
                    error
                );
            }


            window.location.href =
                "lectures.html";
        }



        /* =================================================
           Buttons
        ================================================= */

        startButton.addEventListener(
            "click",
            startBroadcast
        );


        endButton.addEventListener(
            "click",
            endBroadcast
        );


        frontCameraButton.addEventListener(
            "click",
            () => {

                changeCamera(
                    "user"
                );
            }
        );


        backCameraButton.addEventListener(
            "click",
            () => {

                changeCamera(
                    "environment"
                );
            }
        );


        screenShareButton.addEventListener(
            "click",
            handleStartScreenShare
        );


        stopScreenShareButton.addEventListener(
            "click",
            handleStopScreenShare
        );


        leaveButton.addEventListener(
            "click",
            leavePage
        );



        /* =================================================
           Before Unload
        ================================================= */

        window.addEventListener(
            "beforeunload",
            () => {

                leaveLiveKit();
            }
        );



        /* =================================================
           Start
        ================================================= */

        loadLecture();

    </script>

</body>

</html>
