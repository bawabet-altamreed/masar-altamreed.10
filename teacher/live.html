<!DOCTYPE html>

<html
    lang="ar"
    dir="rtl"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        بث المحاضرة | مسار التمريض
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                #0f172a;

            color:
                #ffffff;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            display:
                flex;

            flex-direction:
                column;
        }


        .header {

            padding:
                16px;

            background:
                #111827;

            border-bottom:
                1px solid #334155;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                12px;

            flex-wrap:
                wrap;
        }


        .title {

            font-size:
                20px;

            font-weight:
                bold;
        }


        .status {

            color:
                #94a3b8;

            font-size:
                14px;
        }


        .main {

            flex:
                1;

            padding:
                16px;
        }


        .video-grid {

            width:
                100%;

            max-width:
                1100px;

            margin:
                0 auto;
        }


        .video-box {

            position:
                relative;

            width:
                100%;

            min-height:
                320px;

            background:
                #020617;

            border:
                1px solid #334155;

            border-radius:
                16px;

            overflow:
                hidden;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;
        }


        #teacherVideo {

            width:
                100%;

            min-height:
                320px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;
        }


        #teacherVideo video {

            width:
                100%;

            min-height:
                320px;

            object-fit:
                cover;

            display:
                block;
        }


        .placeholder {

            position:
                absolute;

            inset:
                0;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            flex-direction:
                column;

            text-align:
                center;

            color:
                #94a3b8;

            font-size:
                18px;

            line-height:
                2;
        }


        /* =================================================
           PDF AREA
        ================================================= */

        .pdf-area {

            display:
                none;

            margin:
                16px auto 0;

            width:
                100%;

            max-width:
                1100px;

            background:
                #020617;

            border:
                1px solid #334155;

            border-radius:
                16px;

            overflow:
                hidden;
        }


        .pdf-area.active {

            display:
                block;
        }


        .pdf-header {

            padding:
                10px 14px;

            background:
                #1e293b;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                10px;

            flex-wrap:
                wrap;

            font-size:
                14px;

            font-weight:
                bold;
        }


        .pdf-canvas-wrapper {

            width:
                100%;

            background:
                #ffffff;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            overflow:
                auto;

            padding:
                10px;
        }


        #pdfCanvas {

            display:
                block;

            max-width:
                100%;

            height:
                auto;

            background:
                #ffffff;
        }


        .pdf-controls {

            padding:
                10px;

            background:
                #1e293b;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                8px;

            flex-wrap:
                wrap;
        }


        .pdf-page-info {

            color:
                #cbd5e1;

            font-size:
                14px;

            min-width:
                100px;

            text-align:
                center;
        }


        /* =================================================
           MESSAGE
        ================================================= */

        .message {

            width:
                100%;

            max-width:
                1100px;

            margin:
                15px auto 0;

            padding:
                12px 15px;

            border-radius:
                10px;

            display:
                none;

            background:
                #7f1d1d;

            color:
                #fecaca;

            font-size:
                14px;
        }


        .message.show {

            display:
                block;
        }


        /* =================================================
           CONTROLS
        ================================================= */

        .controls {

            padding:
                14px;

            background:
                #111827;

            border-top:
                1px solid #334155;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                8px;

            flex-wrap:
                wrap;
        }


        .button {

            border:
                0;

            border-radius:
                10px;

            padding:
                12px 16px;

            color:
                #ffffff;

            background:
                #334155;

            font-size:
                14px;

            font-weight:
                bold;

            cursor:
                pointer;
        }


        .button:disabled {

            opacity:
                0.45;

            cursor:
                not-allowed;
        }


        .start {

            background:
                #dc2626;
        }


        .end {

            background:
                #475569;
        }


        .camera {

            background:
                #2563eb;
        }


        .screen {

            background:
                #7c3aed;
        }


        .pdf {

            background:
                #0891b2;
        }


        .stop {

            background:
                #b91c1c;
        }


        @media (
            max-width: 600px
        ) {

            .title {

                font-size:
                    17px;
            }


            .main {

                padding:
                    10px;
            }


            .video-box {

                min-height:
                    240px;
            }


            #teacherVideo {

                min-height:
                    240px;
            }


            #teacherVideo video {

                min-height:
                    240px;
            }


            .button {

                flex:
                    1 1 calc(50% - 8px);

                min-width:
                    135px;
            }
        }

    </style>

</head>


<body>


    <header class="header">

        <div
            class="title"
            id="lectureTitle"
        >
            جاري تحميل المحاضرة...
        </div>


        <div
            id="connectionStatus"
            class="status"
        >
            جاري التحميل...
        </div>

    </header>



    <main class="main">


        <div class="video-grid">


            <div class="video-box">

                <div
                    id="teacherVideo"
                ></div>


                <div
                    id="placeholder"
                    class="placeholder"
                >

                    🎥

                    <br>

                    الكاميرا لم تبدأ بعد

                </div>

            </div>


            <!-- =================================================
                 PDF
            ================================================== -->

            <div
                id="pdfArea"
                class="pdf-area"
            >

                <div
                    class="pdf-header"
                >

                    <span>
                        📖 شرح الكتاب / PDF
                    </span>


                    <span
                        id="pdfFileName"
                    ></span>

                </div>


                <div
                    class="pdf-canvas-wrapper"
                >

                    <canvas
                        id="pdfCanvas"
                    ></canvas>

                </div>


                <div
                    class="pdf-controls"
                >

                    <button
                        id="pdfPreviousButton"
                        class="button"
                        disabled
                    >
                        ◀ الصفحة السابقة
                    </button>


                    <span
                        id="pdfPageInfo"
                        class="pdf-page-info"
                    >
                        0 / 0
                    </span>


                    <button
                        id="pdfNextButton"
                        class="button"
                        disabled
                    >
                        الصفحة التالية ▶
                    </button>

                </div>

            </div>

        </div>



        <div
            id="message"
            class="message"
        ></div>


    </main>



    <footer class="controls">


        <button
            id="startButton"
            class="button start"
        >
            🔴 بدء البث
        </button>


        <button
            id="endButton"
            class="button end"
            disabled
        >
            ⏹ إنهاء البث
        </button>


        <button
            id="frontCameraButton"
            class="button camera"
            disabled
        >
            🤳 الكاميرا الأمامية
        </button>


        <button
            id="backCameraButton"
            class="button camera"
            disabled
        >
            🔄 الكاميرا الخلفية
        </button>


        <button
            id="screenShareButton"
            class="button screen"
            disabled
        >
            🖥️ مشاركة الشاشة
        </button>


        <button
            id="pdfButton"
            class="button pdf"
            disabled
        >
            📖 فتح PDF للطلاب
        </button>


        <button
            id="stopShareButton"
            class="button stop"
            disabled
        >
            ⛔ إيقاف مشاركة PDF
        </button>


        <button
            id="leaveButton"
            class="button"
        >
            خروج
        </button>

    </footer>



    <!-- =====================================================
         PDF.JS
    ====================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        type="module"
    ></script>



    <script type="module">

        import {
            doc,
            getDoc,
            updateDoc,
            serverTimestamp
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        import {
            db
        } from "../src/firebase/init.js";


        import {
            protectTeacherPage
        } from "../src/teacher/teacher.js";


        import {
            connectLiveKit,
            enableTeacherMedia,
            attachLocalTracks,
            attachLocalCamera,
            switchTeacherCamera,
            startScreenShare,
            stopScreenShare,
            getLocalScreenSharePublication,
            publishPDFCanvas,
            stopPDFCanvas,
            leaveLiveKit
        } from "../src/livekit/client.js";



        /* =====================================================
           PDF.JS
        ===================================================== */

        import * as pdfjsLib
            from
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";



        /* =====================================================
           DOM
        ===================================================== */

        const lectureTitle =
            document.getElementById(
                "lectureTitle"
            );


        const connectionStatus =
            document.getElementById(
                "connectionStatus"
            );


        const teacherVideo =
            document.getElementById(
                "teacherVideo"
            );


        const placeholder =
            document.getElementById(
                "placeholder"
            );


        const message =
            document.getElementById(
                "message"
            );


        const startButton =
            document.getElementById(
                "startButton"
            );


        const endButton =
            document.getElementById(
                "endButton"
            );


        const frontCameraButton =
            document.getElementById(
                "frontCameraButton"
            );


        const backCameraButton =
            document.getElementById(
                "backCameraButton"
            );


        const screenShareButton =
            document.getElementById(
                "screenShareButton"
            );


        const pdfButton =
            document.getElementById(
                "pdfButton"
            );


        const stopShareButton =
            document.getElementById(
                "stopShareButton"
            );


        const leaveButton =
            document.getElementById(
                "leaveButton"
            );


        const pdfArea =
            document.getElementById(
                "pdfArea"
            );


        const pdfCanvas =
            document.getElementById(
                "pdfCanvas"
            );


        const pdfFileName =
            document.getElementById(
                "pdfFileName"
            );


        const pdfPageInfo =
            document.getElementById(
                "pdfPageInfo"
            );


        const pdfPreviousButton =
            document.getElementById(
                "pdfPreviousButton"
            );


        const pdfNextButton =
            document.getElementById(
                "pdfNextButton"
            );



        /* =====================================================
           State
        ===================================================== */

        let teacher = null;

        let lecture = null;

        let lectureId = null;

        let room = null;

        let isBroadcasting =
            false;


        let pdfDocument =
            null;

        let pdfPage =
            1;

        let pdfRendering =
            false;

        let pdfVideoTrack =
            null;



        /* =====================================================
           URL
        ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        lectureId =
            params.get(
                "lectureId"
            );



        /* =====================================================
           Message
        ===================================================== */

        function showMessage(
            text
        ) {

            message.textContent =
                text;

            message.classList.add(
                "show"
            );
        }


        function hideMessage() {

            message.textContent =
                "";

            message.classList.remove(
                "show"
            );
        }



        /* =====================================================
           Status
        ===================================================== */

        function setStatus(
            text
        ) {

            connectionStatus.textContent =
                text;
        }



        /* =====================================================
           Broadcast Controls
        ===================================================== */

        function enableBroadcastControls() {

            frontCameraButton.disabled =
                false;

            backCameraButton.disabled =
                false;

            screenShareButton.disabled =
                false;

            pdfButton.disabled =
                false;
        }


        function disableBroadcastControls() {

            frontCameraButton.disabled =
                true;

            backCameraButton.disabled =
                true;

            screenShareButton.disabled =
                true;

            pdfButton.disabled =
                true;

            stopShareButton.disabled =
                true;
        }



        /* =====================================================
           Load Lecture
        ===================================================== */

        async function loadLecture() {

            try {

                hideMessage();


                if (!lectureId) {

                    throw new Error(
                        "معرف المحاضرة غير موجود."
                    );
                }


                teacher =
                    await protectTeacherPage();


                if (!teacher) {

                    throw new Error(
                        "تعذر التحقق من حساب المدرس."
                    );
                }


                const lectureRef =
                    doc(
                        db,
                        "lectures",
                        lectureId
                    );


                const snapshot =
                    await getDoc(
                        lectureRef
                    );


                if (!snapshot.exists()) {

                    throw new Error(
                        "المحاضرة غير موجودة."
                    );
                }


                lecture = {

                    id:
                        snapshot.id,

                    ...snapshot.data()
                };


                if (
                    lecture.teacherId !==
                    teacher.uid
                ) {

                    throw new Error(
                        "لا تملك صلاحية هذه المحاضرة."
                    );
                }


                if (
                    !lecture.roomName
                ) {

                    throw new Error(
                        "غرفة LiveKit الخاصة بالمحاضرة غير موجودة."
                    );
                }


                lectureTitle.textContent =
                    lecture.title ||
                    "بث المحاضرة";


                setStatus(
                    "جاهز لبدء البث"
                );

            } catch (error) {

                console.error(
                    "Load lecture error:",
                    error
                );


                lectureTitle.textContent =
                    "تعذر تحميل المحاضرة";


                setStatus(
                    "حدث خطأ"
                );


                showMessage(
                    error?.message ||
                    "تعذر تحميل المحاضرة."
                );
            }
        }



        /* =====================================================
           Start Broadcast
        ===================================================== */

        async function startBroadcast() {

            try {

                hideMessage();


                if (!lecture) {

                    throw new Error(
                        "المحاضرة لم يتم تحميلها."
                    );
                }


                if (!lecture.roomName) {

                    throw new Error(
                        "اسم غرفة LiveKit غير موجود."
                    );
                }


                startButton.disabled =
                    true;


                setStatus(
                    "جاري الاتصال بـ LiveKit..."
                );


                room =
                    await connectLiveKit(
                        lecture.roomName,

                        {

                            onConnected:
                                () => {

                                    setStatus(
                                        "تم الاتصال بـ LiveKit"
                                    );
                                },


                            onDisconnected:
                                () => {

                                    setStatus(
                                        "تم قطع الاتصال"
                                    );
                                },


                            onConnectionError:
                                error => {

                                    console.error(
                                        "LiveKit connection error:",
                                        error
                                    );
                                }

                        }
                    );


                await enableTeacherMedia(
                    room
                );


                teacherVideo.innerHTML =
                    "";


                attachLocalTracks(
                    room,
                    teacherVideo
                );


                const cameraPublication =
                    room.localParticipant
                        .getTrackPublication(
                            "camera"
                        );


                if (
                    !cameraPublication ||
                    !cameraPublication.track
                ) {

                    throw new Error(
                        "تعذر تشغيل كاميرا المدرس."
                    );
                }


                placeholder.style.display =
                    "none";


                await updateDoc(

                    doc(
                        db,
                        "lectures",
                        lectureId
                    ),

                    {

                        isLive:
                            true,

                        isPublished:
                            true,

                        roomName:
                            lecture.roomName,

                        updatedAt:
                            serverTimestamp()
                    }
                );


                isBroadcasting =
                    true;


                endButton.disabled =
                    false;


                enableBroadcastControls();


                setStatus(
                    "🔴 البث مباشر الآن"
                );


            } catch (error) {

                console.error(
                    "Start broadcast error:",
                    error
                );


                startButton.disabled =
                    false;


                endButton.disabled =
                    true;


                disableBroadcastControls();


                if (room) {

                    await leaveLiveKit();

                    room =
                        null;
                }


                setStatus(
                    "تعذر بدء البث"
                );


                showMessage(
                    error?.message ||
                    "تعذر بدء البث."
                );
            }
        }



        /* =====================================================
           Switch Camera
        ===================================================== */

        async function changeCamera(
            facingMode
        ) {

            if (
                !room ||
                !isBroadcasting
            ) {

                return;
            }


            try {

                hideMessage();


                frontCameraButton.disabled =
                    true;

                backCameraButton.disabled =
                    true;


                setStatus(
                    facingMode ===
                    "environment"

                        ? "جاري تشغيل الكاميرا الخلفية..."

                        : "جاري تشغيل الكاميرا الأمامية..."
                );


                /*
                 * restartTrack()
                 * يغير الكاميرا على نفس Track.
                 */

                await switchTeacherCamera(
                    room,
                    facingMode
                );


                /*
                 * إعادة تركيب الفيديو المحلي فقط.
                 */

                teacherVideo
                    .querySelectorAll(
                        "video"
                    )
                    .forEach(
                        video => {

                            video.remove();
                        }
                    );


                attachLocalCamera(
                    room,
                    teacherVideo
                );


                setStatus(
                    facingMode ===
                    "environment"

                        ? "🔴 البث مباشر — الكاميرا الخلفية"

                        : "🔴 البث مباشر — الكاميرا الأمامية"
                );


            } catch (error) {

                console.error(
                    "Change camera error:",
                    error
                );


                showMessage(
                    error?.message ||
                    "تعذر تبديل الكاميرا."
                );


                setStatus(
                    "🔴 البث مباشر"
                );

            } finally {

                if (isBroadcasting) {

                    frontCameraButton.disabled =
                        false;

                    backCameraButton.disabled =
                        false;
                }
            }
        }



        /* =====================================================
           Normal Screen Share
        ===================================================== */

        async function handleScreenShare() {

            if (
                !room ||
                !isBroadcasting
            ) {

                return;
            }


            try {

                hideMessage();


                screenShareButton.disabled =
                    true;


                setStatus(
                    "جاري بدء مشاركة الشاشة..."
                );


                await startScreenShare(
                    room
                );


                setStatus(
                    "🔴 البث مباشر — مشاركة الشاشة"
                );


            } catch (error) {

                console.error(
                    "Screen share error:",
                    error
                );


                screenShareButton.disabled =
                    false;


                showMessage(
                    error?.message ||
                    "مشاركة الشاشة غير متاحة في هذا المتصفح. استخدم زر PDF."
                );


                setStatus(
                    "🔴 البث مباشر"
                );
            }
        }



        /* =====================================================
           PDF File Picker
        ===================================================== */

        function createPDFFilePicker() {

            const input =
                document.createElement(
                    "input"
                );


            input.type =
                "file";


            input.accept =
                "application/pdf,.pdf";


            input.style.display =
                "none";


            document.body.appendChild(
                input
            );


            input.addEventListener(
                "change",
                async () => {

                    const file =
                        input.files?.[0];


                    input.remove();


                    if (!file) {

                        return;
                    }


                    await openPDF(
                        file
                    );
                }
            );


            input.click();
        }



        /* =====================================================
           Open PDF
        ===================================================== */

        async function openPDF(
            file
        ) {

            if (
                !room ||
                !isBroadcasting
            ) {

                showMessage(
                    "ابدأ البث أولًا ثم افتح ملف PDF."
                );

                return;
            }


            try {

                hideMessage();


                pdfButton.disabled =
                    true;


                setStatus(
                    "جاري تحميل الكتاب..."
                );


                /*
                 * لو فيه PDF قديم
                 * نوقفه أولًا.
                 */

                await stopPDFShare();


                const arrayBuffer =
                    await file.arrayBuffer();


                pdfDocument =
                    await pdfjsLib.getDocument({
                        data:
                            arrayBuffer
                    }).promise;


                pdfPage =
                    1;


                pdfFileName.textContent =
                    file.name;


                pdfArea.classList.add(
                    "active"
                );


                await renderPDFPage();


                /*
                 * بعد رسم الصفحة على Canvas
                 * نحول الـCanvas إلى Video Track
                 * ونرسله إلى LiveKit.
                 */

                const result =
                    await publishPDFCanvas(
                        room,
                        pdfCanvas,
                        12
                    );


                pdfVideoTrack =
                    result.videoTrack;


                stopShareButton.disabled =
                    false;


                pdfPreviousButton.disabled =
                    false;


                pdfNextButton.disabled =
                    pdfPage >=
                    pdfDocument.numPages;


                setStatus(
                    "🔴 البث مباشر — الكتاب ظاهر للطلاب"
                );


            } catch (error) {

                console.error(
                    "PDF error:",
                    error
                );


                pdfArea.classList.remove(
                    "active"
                );


                showMessage(
                    error?.message ||
                    "تعذر تشغيل ملف PDF."
                );


                setStatus(
                    "🔴 البث مباشر"
                );

            } finally {

                pdfButton.disabled =
                    false;
            }
        }



        /* =====================================================
           Render PDF Page
        ===================================================== */

        async function renderPDFPage() {

            if (
                !pdfDocument ||
                pdfRendering
            ) {

                return;
            }


            pdfRendering =
                true;


            try {

                const page =
                    await pdfDocument
                        .getPage(
                            pdfPage
                        );


                /*
                 * جودة مناسبة للموبايل والبث.
                 */

                const viewport =
                    page.getViewport({
                        scale:
                            1.5
                    });


                pdfCanvas.width =
                    viewport.width;


                pdfCanvas.height =
                    viewport.height;


                const context =
                    pdfCanvas.getContext(
                        "2d"
                    );


                await page.render({

                    canvasContext:
                        context,

                    viewport:
                        viewport

                }).promise;


                pdfPageInfo.textContent =
                    `${pdfPage} / ${pdfDocument.numPages}`;


                pdfPreviousButton.disabled =
                    pdfPage <= 1;


                pdfNextButton.disabled =
                    pdfPage >=
                    pdfDocument.numPages;

            } finally {

                pdfRendering =
                    false;
            }
        }



        /* =====================================================
           Previous PDF Page
        ===================================================== */

        async function previousPDFPage() {

            if (
                !pdfDocument ||
                pdfPage <= 1
            ) {

                return;
            }


            pdfPage--;


            await renderPDFPage();
        }



        /* =====================================================
           Next PDF Page
        ===================================================== */

        async function nextPDFPage() {

            if (
                !pdfDocument ||
                pdfPage >=
                pdfDocument.numPages
            ) {

                return;
            }


            pdfPage++;


            await renderPDFPage();
        }



        /* =====================================================
           Stop PDF Share
        ===================================================== */

        async function stopPDFShare() {

            if (pdfVideoTrack) {

                try {

                    await stopPDFCanvas(
                        room,
                        pdfVideoTrack
                    );

                } catch (error) {

                    console.warn(
                        "PDF stop error:",
                        error
                    );
                }


                pdfVideoTrack =
                    null;
            }


            pdfArea.classList.remove(
                "active"
            );


            pdfPageInfo.textContent =
                "0 / 0";


            stopShareButton.disabled =
                true;


            if (isBroadcasting) {

                setStatus(
                    "🔴 البث مباشر"
                );
            }
        }



        /* =====================================================
           End Broadcast
        ===================================================== */

        async function endBroadcast() {

            try {

                endButton.disabled =
                    true;


                await stopPDFShare();


                if (
                    room &&
                    room.localParticipant
                ) {

                    await stopScreenShare(
                        room
                    );
                }


                if (lectureId) {

                    await updateDoc(

                        doc(
                            db,
                            "lectures",
                            lectureId
                        ),

                        {

                            isLive:
                                false,

                            updatedAt:
                                serverTimestamp()
                        }
                    );
                }


                await leaveLiveKit();


                room =
                    null;


                isBroadcasting =
                    false;


                teacherVideo.innerHTML =
                    "";


                placeholder.style.display =
                    "flex";


                startButton.disabled =
                    false;


                endButton.disabled =
                    true;


                disableBroadcastControls();


                setStatus(
                    "تم إنهاء البث"
                );


            } catch (error) {

                console.error(
                    "End broadcast error:",
                    error
                );


                showMessage(
                    error?.message ||
                    "تعذر إنهاء البث."
                );
            }
        }



        /* =====================================================
           Leave
        ===================================================== */

        async function leavePage() {

            try {

                await stopPDFShare();

                await leaveLiveKit();

            } catch (error) {

                console.warn(
                    error
                );
            }


            window.location.href =
                "lectures.html";
        }



        /* =====================================================
           Buttons
        ===================================================== */

        startButton.addEventListener(
            "click",
            startBroadcast
        );


        endButton.addEventListener(
            "click",
            endBroadcast
        );


        frontCameraButton.addEventListener(
            "click",
            () => {

                changeCamera(
                    "user"
                );
            }
        );


        backCameraButton.addEventListener(
            "click",
            () => {

                changeCamera(
                    "environment"
                );
            }
        );


        screenShareButton.addEventListener(
            "click",
            handleScreenShare
        );


        pdfButton.addEventListener(
            "click",
            createPDFFilePicker
        );


        stopShareButton.addEventListener(
            "click",
            stopPDFShare
        );


        pdfPreviousButton.addEventListener(
            "click",
            previousPDFPage
        );


        pdfNextButton.addEventListener(
            "click",
            nextPDFPage
        );


        leaveButton.addEventListener(
            "click",
            leavePage
        );



        /* =====================================================
           Before Unload
        ===================================================== */

        window.addEventListener(
            "beforeunload",
            () => {

                leaveLiveKit();
            }
        );



        /* =====================================================
           Start
        ===================================================== */

        loadLecture();

    </script>

</body>

</html>
