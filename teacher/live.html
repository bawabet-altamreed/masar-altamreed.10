<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    بث المحاضرة | مسار التمريض
</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    background:
        #071923;

    color:
        white;

}

.live-page {

    min-height:
        100vh;

    display:
        flex;

    flex-direction:
        column;

}

.header {

    background:
        #0c2735;

    padding:
        15px 20px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        15px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

}

.title {

    font-size:
        18px;

    font-weight:
        bold;

}

.status {

    padding:
        7px 12px;

    border-radius:
        20px;

    background:
        #253b45;

    color:
        #b8c8cf;

    font-size:
        11px;

}

.status.connected {

    background:
        #123b2a;

    color:
        #72e3a8;

}

.status.error {

    background:
        #401d1d;

    color:
        #ff9b9b;

}

.main {

    flex:
        1;

    padding:
        18px;

}

.video-grid {

    width:
        100%;

    max-width:
        1200px;

    margin:
        auto;

    display:
        grid;

    grid-template-columns:
        1fr;

    gap:
        15px;

}

.video-box {

    position:
        relative;

    background:
        #000;

    border-radius:
        16px;

    overflow:
        hidden;

    min-height:
        560px;

}

.video-box video {

    width:
        100%;

    height:
        100%;

    min-height:
        560px;

    object-fit:
        contain;

}

.video-layer {

    width:
        100%;

    height:
        100%;

}

.video-layer video {

    display:
        block;

}

.screen-layer {

    display:
        none;

    position:
        absolute;

    inset:
        0;

    z-index:
        5;

    background:
        #000;

}

.screen-layer.active {

    display:
        block;

}

.screen-layer video {

    width:
        100%;

    height:
        100%;

    min-height:
        560px;

    object-fit:
        contain;

}

.camera-layer {

    position:
        absolute;

    inset:
        0;

    z-index:
        2;

}

.camera-layer.hidden {

    display:
        none;

}

.placeholder {

    position:
        absolute;

    inset:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        #8da0aa;

    text-align:
        center;

    line-height:
        2;

    z-index:
        10;

    pointer-events:
        none;

}

.controls {

    background:
        #0c2735;

    padding:
        15px;

    display:
        flex;

    justify-content:
        center;

    gap:
        10px;

    flex-wrap:
        wrap;

}

.button {

    border:
        none;

    border-radius:
        10px;

    padding:
        12px 20px;

    cursor:
        pointer;

    font-family:
        inherit;

    font-weight:
        bold;

    background:
        #087ea4;

    color:
        white;

}

.button.start {

    background:
        #16834f;

}

.button.end {

    background:
        #b42318;

}

.button.screen {

    background:
        #6b46c1;

}

.button.camera {

    background:
        #087ea4;

}

.button:disabled {

    opacity:
        .5;

    cursor:
        not-allowed;

}

.message {

    max-width:
        1200px;

    margin:
        15px auto 0;

    padding:
        12px;

    border-radius:
        10px;

    background:
        #401d1d;

    color:
        #ffb1b1;

    display:
        none;

}

.message.show {

    display:
        block;

}

@media (max-width:700px) {

    .video-box {

        min-height:
            350px;

    }

    .video-box video {

        min-height:
            350px;

    }

    .screen-layer video {

        min-height:
            350px;

    }

    .header {

        flex-direction:
            column;

        align-items:
            stretch;

    }

    .controls {

        padding:
            12px;

    }

    .button {

        flex:
            1 1
            45%;

        min-width:
            140px;

    }

}

</style>

</head>

<body>


<div class="live-page">


    <header class="header">

        <div
            class="title"
            id="lectureTitle"
        >
            جاري تحميل المحاضرة...
        </div>


        <div
            id="connectionStatus"
            class="status"
        >
            جاري التحميل...
        </div>

    </header>


    <main class="main">

        <div class="video-grid">

            <div class="video-box">

                <div
                    id="cameraLayer"
                    class="camera-layer"
                >

                    <div
                        id="teacherVideo"
                        class="video-layer"
                    ></div>

                </div>


                <div
                    id="screenLayer"
                    class="screen-layer"
                >

                    <div
                        id="screenVideo"
                        class="video-layer"
                    ></div>

                </div>


                <div
                    id="placeholder"
                    class="placeholder"
                >

                    🎥

                    <br>

                    الكاميرا لم تبدأ بعد

                </div>

            </div>

        </div>


        <div
            id="message"
            class="message"
        >
        </div>

    </main>


    <footer class="controls">


        <button
            id="startButton"
            class="button start"
        >
            🔴 بدء البث
        </button>


        <button
            id="frontCameraButton"
            class="button camera"
            disabled
        >
            🤳 الكاميرا الأمامية
        </button>


        <button
            id="backCameraButton"
            class="button camera"
            disabled
        >
            🔄 الكاميرا الخلفية
        </button>


        <button
            id="screenButton"
            class="button screen"
            disabled
        >
            🖥️ مشاركة الشاشة
        </button>


        <button
            id="stopScreenButton"
            class="button screen"
            disabled
        >
            ⏹️ إيقاف مشاركة الشاشة
        </button>


        <button
            id="endButton"
            class="button end"
            disabled
        >
            ⏹ إنهاء البث
        </button>


        <button
            id="leaveButton"
            class="button"
        >
            خروج
        </button>

    </footer>

</div>


<script type="module">


import {

    doc,
    getDoc,
    updateDoc,
    serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {

    db

} from "../src/firebase/init.js";


import {

    protectTeacherPage

} from "../src/teacher/teacher.js";


import {

    connectLiveKit,

    enableTeacherMedia,

    attachLocalTracks,

    attachLocalCamera,

    attachLocalScreenShare,

    switchTeacherCamera,

    startScreenShare,

    stopScreenShare,

    getCurrentRoom,

    leaveLiveKit

} from "../src/livekit/client.js";


const params =
    new URLSearchParams(
        window.location.search
    );


const lectureId =
    params.get(
        "lectureId"
    );


const lectureTitle =
    document.getElementById(
        "lectureTitle"
    );


const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );


const teacherVideo =
    document.getElementById(
        "teacherVideo"
    );


const screenVideo =
    document.getElementById(
        "screenVideo"
    );


const cameraLayer =
    document.getElementById(
        "cameraLayer"
    );


const screenLayer =
    document.getElementById(
        "screenLayer"
    );


const placeholder =
    document.getElementById(
        "placeholder"
    );


const message =
    document.getElementById(
        "message"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const frontCameraButton =
    document.getElementById(
        "frontCameraButton"
    );


const backCameraButton =
    document.getElementById(
        "backCameraButton"
    );


const screenButton =
    document.getElementById(
        "screenButton"
    );


const stopScreenButton =
    document.getElementById(
        "stopScreenButton"
    );


const endButton =
    document.getElementById(
        "endButton"
    );


const leaveButton =
    document.getElementById(
        "leaveButton"
    );


let teacher =
    null;


let lecture =
    null;


let room =
    null;


let currentFacingMode =
    "user";


let screenSharing =
    false;


/* =====================================================
   Error
===================================================== */

function showError(
    text
) {

    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    connectionStatus.textContent =
        "حدث خطأ";


    connectionStatus.className =
        "status error";

}


/* =====================================================
   Clear Error
===================================================== */

function clearError() {

    message.textContent =
        "";


    message.classList.remove(
        "show"
    );

}


/* =====================================================
   Show Camera
===================================================== */

function showCamera() {

    screenLayer.classList.remove(
        "active"
    );


    cameraLayer.classList.remove(
        "hidden"
    );


    screenSharing =
        false;


    screenButton.disabled =
        !room;


    stopScreenButton.disabled =
        true;

}


/* =====================================================
   Show Screen
===================================================== */

function showScreen() {

    screenLayer.classList.add(
        "active"
    );


    cameraLayer.classList.remove(
        "hidden"
    );


    screenSharing =
        true;


    screenButton.disabled =
        true;


    stopScreenButton.disabled =
        false;

}


/* =====================================================
   Load Lecture
===================================================== */

async function loadLecture() {

    if (!lectureId) {

        throw new Error(
            "معرّف المحاضرة غير موجود."
        );

    }


    connectionStatus.textContent =
        "جاري تحميل المحاضرة...";


    teacher =
        await protectTeacherPage();


    if (!teacher) {

        throw new Error(
            "تعذر التحقق من حساب المدرس."
        );

    }


    const lectureSnap =
        await getDoc(
            doc(
                db,
                "lectures",
                lectureId
            )
        );


    if (
        !lectureSnap.exists()
    ) {

        throw new Error(
            "المحاضرة غير موجودة."
        );

    }


    lecture = {

        id:
            lectureSnap.id,

        ...lectureSnap.data()

    };


    if (
        lecture.teacherId !==
        teacher.uid
    ) {

        throw new Error(
            "هذه المحاضرة ليست تابعة لحسابك."
        );

    }


    if (
        !lecture.roomName
    ) {

        throw new Error(
            "غرفة المحاضرة غير مجهزة. ارجع إلى صفحة المحاضرات وأنشئ المحاضرة من جديد."
        );

    }


    lectureTitle.textContent =
        lecture.title ||
        "المحاضرة المباشرة";


    if (
        lecture.isLive ===
        true
    ) {

        startButton.disabled =
            false;

        endButton.disabled =
            false;

        connectionStatus.textContent =
            "🔴 المحاضرة مباشرة";

    } else {

        connectionStatus.textContent =
            "جاهز لبدء البث";

    }

}


/* =====================================================
   Enable Live Controls
===================================================== */

function enableLiveControls() {

    frontCameraButton.disabled =
        false;


    backCameraButton.disabled =
        false;


    screenButton.disabled =
        false;


    stopScreenButton.disabled =
        true;


    endButton.disabled =
        false;

}


/* =====================================================
   Disable Live Controls
===================================================== */

function disableLiveControls() {

    frontCameraButton.disabled =
        true;


    backCameraButton.disabled =
        true;


    screenButton.disabled =
        true;


    stopScreenButton.disabled =
        true;

}


/* =====================================================
   Start Broadcast
===================================================== */

async function startBroadcast() {

    if (!lecture) {

        showError(
            "لم يتم تحميل بيانات المحاضرة."
        );

        return;

    }


    if (!lecture.roomName) {

        showError(
            "اسم غرفة LiveKit غير موجود."
        );

        return;

    }


    clearError();


    startButton.disabled =
        true;


    endButton.disabled =
        true;


    try {

        connectionStatus.textContent =
            "جاري الاتصال بـ LiveKit...";


        connectionStatus.className =
            "status";


        room =
            await connectLiveKit(

                lecture.roomName,

                {

                    onConnected() {

                        connectionStatus.textContent =
                            "🟢 تم الاتصال بـ LiveKit";

                        connectionStatus.className =
                            "status connected";

                    },


                    onDisconnected() {

                        connectionStatus.textContent =
                            "تم قطع الاتصال";

                        connectionStatus.className =
                            "status error";

                    },


                    onConnectionError(
                        error
                    ) {

                        console.error(
                            "LiveKit connection error:",
                            error
                        );

                    }

                }

            );


        if (!room) {

            throw new Error(
                "تعذر إنشاء اتصال LiveKit."
            );

        }


        connectionStatus.textContent =
            "🟢 متصل — جاري تشغيل الكاميرا...";


        connectionStatus.className =
            "status connected";


        await enableTeacherMedia(
            room
        );


        teacherVideo.innerHTML =
            "";


        attachLocalCamera(
            room,
            teacherVideo
        );


        const localParticipant =
            room.localParticipant;


        const hasVideo =
            Array
                .from(
                    localParticipant
                        .trackPublications
                        .values()
                )
                .some(

                    publication =>

                        publication.track &&

                        publication.kind ===
                        "video"

                );


        if (!hasVideo) {

            throw new Error(
                "تم الاتصال بـ LiveKit لكن لم يتم تشغيل كاميرا المدرس."
            );

        }


        placeholder.style.display =
            "none";


        cameraLayer.classList.remove(
            "hidden"
        );


        screenLayer.classList.remove(
            "active"
        );


        currentFacingMode =
            "user";


        await updateDoc(

            doc(
                db,
                "lectures",
                lectureId
            ),

            {

                isLive:
                    true,

                isPublished:
                    true,

                roomName:
                    lecture.roomName,

                updatedAt:
                    serverTimestamp()

            }

        );


        lecture.isLive =
            true;


        enableLiveControls();


        startButton.disabled =
            true;


        endButton.disabled =
            false;


        connectionStatus.textContent =
            "🔴 البث مباشر الآن";


        connectionStatus.className =
            "status connected";


    } catch (error) {

        console.error(
            "Teacher LiveKit error:",
            error
        );


        await leaveLiveKit();


        room =
            null;


        disableLiveControls();


        startButton.disabled =
            false;


        endButton.disabled =
            true;


        placeholder.style.display =
            "flex";


        showError(
            error?.message ||
            "تعذر بدء البث."
        );

    }

}


/* =====================================================
   Front Camera
===================================================== */

frontCameraButton.addEventListener(

    "click",

    async () => {

        if (!room) {

            return;

        }


        clearError();


        frontCameraButton.disabled =
            true;


        backCameraButton.disabled =
            true;


        try {

            connectionStatus.textContent =
                "🔄 جاري تشغيل الكاميرا الأمامية...";


            const activeRoom =
                getCurrentRoom();


            await switchTeacherCamera(
                activeRoom,
                "user"
            );


            currentFacingMode =
                "user";


            attachLocalCamera(
                activeRoom,
                teacherVideo
            );


            connectionStatus.textContent =
                "🔴 البث مباشر — الكاميرا الأمامية";


            connectionStatus.className =
                "status connected";


        } catch (error) {

            console.error(
                "Front camera error:",
                error
            );


            showError(
                error?.message ||
                "تعذر تشغيل الكاميرا الأمامية."
            );

        } finally {

            frontCameraButton.disabled =
                false;


            backCameraButton.disabled =
                false;

        }

    }

);


/* =====================================================
   Back Camera
===================================================== */

backCameraButton.addEventListener(

    "click",

    async () => {

        if (!room) {

            return;

        }


        clearError();


        frontCameraButton.disabled =
            true;


        backCameraButton.disabled =
            true;


        try {

            connectionStatus.textContent =
                "🔄 جاري تشغيل الكاميرا الخلفية...";


            const activeRoom =
                getCurrentRoom();


            await switchTeacherCamera(
                activeRoom,
                "environment"
            );


            currentFacingMode =
                "environment";


            attachLocalCamera(
                activeRoom,
                teacherVideo
            );


            connectionStatus.textContent =
                "🔴 البث مباشر — الكاميرا الخلفية";


            connectionStatus.className =
                "status connected";


        } catch (error) {

            console.error(
                "Back camera error:",
                error
            );


            showError(
                error?.message ||
                "تعذر تشغيل الكاميرا الخلفية."
            );

        } finally {

            frontCameraButton.disabled =
                false;


            backCameraButton.disabled =
                false;

        }

    }

);


/* =====================================================
   Start Screen Share
===================================================== */

screenButton.addEventListener(

    "click",

    async () => {

        if (!room) {

            return;

        }


        clearError();


        screenButton.disabled =
            true;


        try {

            connectionStatus.textContent =
                "🖥️ جاري تشغيل مشاركة الشاشة...";


            const activeRoom =
                getCurrentRoom();


            await startScreenShare(
                activeRoom
            );


            screenVideo.innerHTML =
                "";


            const screenElement =
                attachLocalScreenShare(
                    activeRoom,
                    screenVideo
                );


            if (!screenElement) {

                throw new Error(
                    "تم تشغيل مشاركة الشاشة لكن تعذر عرضها على شاشة المدرس."
                );

            }


            showScreen();


            placeholder.style.display =
                "none";


            connectionStatus.textContent =
                "🖥️ مشاركة الشاشة مباشرة";


            connectionStatus.className =
                "status connected";


        } catch (error) {

            console.error(
                "Screen share error:",
                error
            );


            screenSharing =
                false;


            screenLayer.classList.remove(
                "active"
            );


            showError(
                error?.message ||
                "تعذر بدء مشاركة الشاشة."
            );


            screenButton.disabled =
                false;


            stopScreenButton.disabled =
                true;

        }

    }

);


/* =====================================================
   Stop Screen Share
===================================================== */

stopScreenButton.addEventListener(

    "click",

    async () => {

        if (!room) {

            return;

        }


        stopScreenButton.disabled =
            true;


        try {

            const activeRoom =
                getCurrentRoom();


            await stopScreenShare(
                activeRoom
            );


            screenVideo.innerHTML =
                "";


            showCamera();


            connectionStatus.textContent =
                "🔴 البث مباشر — الكاميرا";


            connectionStatus.className =
                "status connected";


        } catch (error) {

            console.error(
                "Stop screen share error:",
                error
            );


            showError(
                error?.message ||
                "تعذر إيقاف مشاركة الشاشة."
            );


            stopScreenButton.disabled =
                false;

        }

    }

);


/* =====================================================
   End Broadcast
===================================================== */

endButton.addEventListener(

    "click",

    async () => {

        if (
            !confirm(
                "هل أنت متأكد من إنهاء المحاضرة المباشرة؟"
            )
        ) {

            return;

        }


        endButton.disabled =
            true;


        try {

            await updateDoc(

                doc(
                    db,
                    "lectures",
                    lectureId
                ),

                {

                    isLive:
                        false,

                    updatedAt:
                        serverTimestamp()

                }

            );


            await stopScreenShare(
                room
            );


            await leaveLiveKit();


            room =
                null;


            lecture.isLive =
                false;


            screenSharing =
                false;


            screenVideo.innerHTML =
                "";


            teacherVideo.innerHTML =
                "";


            cameraLayer.classList.remove(
                "hidden"
            );


            screenLayer.classList.remove(
                "active"
            );


            placeholder.style.display =
                "flex";


            connectionStatus.textContent =
                "تم إنهاء البث";


            connectionStatus.className =
                "status";


            startButton.disabled =
                false;


            endButton.disabled =
                true;


            disableLiveControls();


        } catch (error) {

            console.error(
                "End broadcast error:",
                error
            );


            showError(
                error?.message ||
                "حدث خطأ أثناء إنهاء البث."
            );


            endButton.disabled =
                false;

        }

    }

);


/* =====================================================
   Leave
===================================================== */

leaveButton.addEventListener(

    "click",

    async () => {

        await leaveLiveKit();


        window.location.href =
            "lectures.html";

    }

);


/* =====================================================
   Before Unload
===================================================== */

window.addEventListener(

    "beforeunload",

    () => {

        leaveLiveKit();

    }

);


/* =====================================================
   Init
===================================================== */

try {

    await loadLecture();

} catch (error) {

    console.error(
        "Load lecture error:",
        error
    );


    startButton.disabled =
        true;


    endButton.disabled =
        true;


    disableLiveControls();


    showError(
        error?.message ||
        "تعذر تحميل المحاضرة."
    );

}

</script>

</body>

</html>
