<!DOCTYPE html>

<html
    lang="ar"
    dir="rtl"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        بث المحاضرة | مسار التمريض
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                #0f172a;

            color: #ffffff;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            display: flex;

            flex-direction: column;
        }


        .header {

            width: 100%;

            padding: 18px;

            background:
                #111827;

            border-bottom:
                1px solid #334155;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            flex-wrap: wrap;
        }


        .title {

            font-size: 20px;

            font-weight: bold;
        }


        .status {

            color:
                #94a3b8;

            font-size: 14px;
        }


        .main {

            flex: 1;

            padding: 20px;

            width: 100%;
        }


        .video-grid {

            width: 100%;

            max-width: 1100px;

            margin: 0 auto;

            display: grid;

            gap: 15px;
        }


        .video-box {

            position: relative;

            width: 100%;

            min-height: 350px;

            background:
                #020617;

            border:
                1px solid #334155;

            border-radius: 16px;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        #teacherVideo {

            width: 100%;

            height: 100%;

            min-height: 350px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        #teacherVideo video {

            width: 100%;

            height: 100%;

            min-height: 350px;

            object-fit: cover;

            display: block;
        }


        .placeholder {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            text-align: center;

            color:
                #94a3b8;

            font-size: 18px;

            line-height: 2;
        }


        /*
         * شاشة مشاركة الكتاب / PDF
         */

        .screen-share-box {

            display: none;

            width: 100%;

            max-width: 1100px;

            margin: 15px auto 0;

            background:
                #020617;

            border:
                1px solid #334155;

            border-radius: 16px;

            overflow: hidden;

            position: relative;
        }


        .screen-share-box.active {

            display: block;
        }


        .screen-share-title {

            padding: 10px 15px;

            background:
                #1e293b;

            color:
                #e2e8f0;

            font-size: 14px;

            font-weight: bold;
        }


        #screenShareVideo {

            width: 100%;

            min-height: 300px;

            background:
                #000;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        #screenShareVideo video {

            width: 100%;

            height: auto;

            max-height: 70vh;

            object-fit: contain;

            display: block;

            background:
                #000;
        }


        .message {

            width: 100%;

            max-width: 1100px;

            margin: 15px auto 0;

            padding: 12px 15px;

            border-radius: 10px;

            display: none;

            background:
                #7f1d1d;

            color:
                #fecaca;

            font-size: 14px;
        }


        .message.show {

            display: block;
        }


        .controls {

            width: 100%;

            padding: 15px;

            background:
                #111827;

            border-top:
                1px solid #334155;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }


        .button {

            border: 0;

            border-radius: 10px;

            padding: 12px 18px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            background:
                #334155;

            color:
                #ffffff;

            transition:
                0.2s ease;
        }


        .button:hover {

            opacity: 0.9;
        }


        .button:disabled {

            opacity: 0.45;

            cursor: not-allowed;
        }


        .button.start {

            background:
                #dc2626;
        }


        .button.end {

            background:
                #475569;
        }


        .button.camera {

            background:
                #2563eb;
        }


        .button.screen {

            background:
                #7c3aed;
        }


        .button.stop-screen {

            background:
                #b91c1c;

            display: none;
        }


        @media (
            max-width: 600px
        ) {

            .header {

                align-items: flex-start;

                flex-direction: column;
            }


            .title {

                font-size: 17px;
            }


            .main {

                padding: 10px;
            }


            .video-box {

                min-height: 240px;
            }


            #teacherVideo {

                min-height: 240px;
            }


            #teacherVideo video {

                min-height: 240px;
            }


            .button {

                flex: 1 1 calc(50% - 10px);

                min-width: 140px;
            }
        }

    </style>

</head>


<body>


    <header class="header">

        <div
            class="title"
            id="lectureTitle"
        >
            جاري تحميل المحاضرة...
        </div>


        <div
            id="connectionStatus"
            class="status"
        >
            جاري التحميل...
        </div>

    </header>



    <main class="main">


        <div class="video-grid">


            <div class="video-box">


                <div
                    id="teacherVideo"
                ></div>


                <div
                    id="placeholder"
                    class="placeholder"
                >

                    🎥

                    <br>

                    الكاميرا لم تبدأ بعد

                </div>

            </div>


            <!--
                شاشة مشاركة الكتاب / PDF
            -->

            <div
                id="screenShareBox"
                class="screen-share-box"
            >

                <div
                    class="screen-share-title"
                >
                    🖥️ مشاركة الشاشة — افتح الكتاب أو الـPDF على جهازك
                </div>


                <div
                    id="screenShareVideo"
                ></div>

            </div>


        </div>


        <div
            id="message"
            class="message"
        ></div>


    </main>



    <footer class="controls">


        <!-- بدء البث -->

        <button
            id="startButton"
            class="button start"
        >
            🔴 بدء البث
        </button>


        <!-- إنهاء البث -->

        <button
            id="endButton"
            class="button end"
            disabled
        >
            ⏹ إنهاء البث
        </button>


        <!-- الكاميرا الأمامية -->

        <button
            id="frontCameraButton"
            class="button camera"
            disabled
        >
            🤳 الكاميرا الأمامية
        </button>


        <!-- الكاميرا الخلفية -->

        <button
            id="backCameraButton"
            class="button camera"
            disabled
        >
            🔄 الكاميرا الخلفية
        </button>


        <!-- مشاركة الشاشة -->

        <button
            id="screenShareButton"
            class="button screen"
            disabled
        >
            🖥️ مشاركة الشاشة
        </button>


        <!-- إيقاف مشاركة الشاشة -->

        <button
            id="stopScreenShareButton"
            class="button stop-screen"
            disabled
        >
            ⛔ إيقاف مشاركة الشاشة
        </button>


        <!-- خروج -->

        <button
            id="leaveButton"
            class="button"
        >
            خروج
        </button>


    </footer>



    <script type="module">

        import {
            doc,
            getDoc,
            updateDoc,
            serverTimestamp
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        import {
            db
        } from "../src/firebase/init.js";


        import {
            protectTeacherPage
        } from "../src/teacher/teacher.js";


        import {
            connectLiveKit,
            enableTeacherMedia,
            attachLocalTracks,
            attachLocalCamera,
            attachLocalScreenShare,
            getLocalScreenSharePublication,
            switchTeacherCamera,
            startScreenShare,
            stopScreenShare,
            leaveLiveKit
        } from "../src/livekit/client.js";



        /* =====================================================
           DOM
        ===================================================== */

        const lectureTitle =
            document.getElementById(
                "lectureTitle"
            );


        const connectionStatus =
            document.getElementById(
                "connectionStatus"
            );


        const teacherVideo =
            document.getElementById(
                "teacherVideo"
            );


        const placeholder =
            document.getElementById(
                "placeholder"
            );


        const message =
            document.getElementById(
                "message"
            );


        const screenShareBox =
            document.getElementById(
                "screenShareBox"
            );


        const screenShareVideo =
            document.getElementById(
                "screenShareVideo"
            );


        const startButton =
            document.getElementById(
                "startButton"
            );


        const endButton =
            document.getElementById(
                "endButton"
            );


        const frontCameraButton =
            document.getElementById(
                "frontCameraButton"
            );


        const backCameraButton =
            document.getElementById(
                "backCameraButton"
            );


        const screenShareButton =
            document.getElementById(
                "screenShareButton"
            );


        const stopScreenShareButton =
            document.getElementById(
                "stopScreenShareButton"
            );


        const leaveButton =
            document.getElementById(
                "leaveButton"
            );



        /* =====================================================
           State
        ===================================================== */

        let teacher = null;

        let lecture = null;

        let lectureId = null;

        let room = null;

        let isBroadcasting = false;



        /* =====================================================
           URL
        ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        lectureId =
            params.get(
                "lectureId"
            );



        /* =====================================================
           Message
        ===================================================== */

        function showMessage(
            text
        ) {

            message.textContent =
                text;

            message.classList.add(
                "show"
            );
        }


        function hideMessage() {

            message.textContent =
                "";

            message.classList.remove(
                "show"
            );
        }



        /* =====================================================
           Status
        ===================================================== */

        function setStatus(
            text
        ) {

            connectionStatus.textContent =
                text;
        }



        /* =====================================================
           Enable Broadcast Controls
        ===================================================== */

        function enableBroadcastControls() {

            frontCameraButton.disabled =
                false;

            backCameraButton.disabled =
                false;

            screenShareButton.disabled =
                false;
        }



        /* =====================================================
           Disable Broadcast Controls
        ===================================================== */

        function disableBroadcastControls() {

            frontCameraButton.disabled =
                true;

            backCameraButton.disabled =
                true;

            screenShareButton.disabled =
                true;

            stopScreenShareButton.disabled =
                true;

            stopScreenShareButton.style.display =
                "none";
        }



        /* =====================================================
           Load Lecture
        ===================================================== */

        async function loadLecture() {

            try {

                hideMessage();


                if (!lectureId) {

                    throw new Error(
                        "معرف المحاضرة غير موجود."
                    );
                }


                /*
                 * مهم جدًا:
                 * نفس الطريقة القديمة.
                 */

                teacher =
                    await protectTeacherPage();


                if (!teacher) {

                    throw new Error(
                        "تعذر التحقق من حساب المدرس."
                    );
                }


                const lectureRef =
                    doc(
                        db,
                        "lectures",
                        lectureId
                    );


                const snapshot =
                    await getDoc(
                        lectureRef
                    );


                if (!snapshot.exists()) {

                    throw new Error(
                        "المحاضرة غير موجودة."
                    );
                }


                lecture = {

                    id:
                        snapshot.id,

                    ...snapshot.data()
                };


                if (
                    lecture.teacherId !==
                    teacher.uid
                ) {

                    throw new Error(
                        "لا تملك صلاحية هذه المحاضرة."
                    );
                }


                if (
                    !lecture.roomName
                ) {

                    throw new Error(
                        "غرفة LiveKit الخاصة بالمحاضرة غير موجودة."
                    );
                }


                lectureTitle.textContent =
                    lecture.title ||
                    "بث المحاضرة";


                setStatus(
                    "جاهز لبدء البث"
                );


            } catch (error) {

                console.error(
                    "Load lecture error:",
                    error
                );


                lectureTitle.textContent =
                    "تعذر تحميل المحاضرة";


                setStatus(
                    "حدث خطأ"
                );


                showMessage(
                    error?.message ||
                    "تعذر تحميل المحاضرة."
                );
            }
        }



        /* =====================================================
           Start Broadcast
        ===================================================== */

        async function startBroadcast() {

            try {

                hideMessage();


                if (!lecture) {

                    throw new Error(
                        "المحاضرة لم يتم تحميلها."
                    );
                }


                if (!lecture.roomName) {

                    throw new Error(
                        "اسم غرفة LiveKit غير موجود."
                    );
                }


                startButton.disabled =
                    true;


                setStatus(
                    "جاري الاتصال بـ LiveKit..."
                );


                /*
                 * نفس الاتصال القديم
                 */

                room =
                    await connectLiveKit(
                        lecture.roomName,

                        {

                            onConnected:
                                () => {

                                    setStatus(
                                        "تم الاتصال بـ LiveKit"
                                    );
                                },


                            onDisconnected:
                                () => {

                                    setStatus(
                                        "تم قطع الاتصال"
                                    );
                                },


                            onConnectionError:
                                error => {

                                    console.error(
                                        "LiveKit connection error:",
                                        error
                                    );
                                }

                        }
                    );


                /*
                 * نفس تشغيل الكاميرا والمايك القديم
                 */

                await enableTeacherMedia(
                    room
                );


                /*
                 * نفس إظهار الكاميرا القديم
                 */

                teacherVideo.innerHTML =
                    "";


                attachLocalTracks(
                    room,
                    teacherVideo
                );


                /*
                 * التأكد أن الكاميرا موجودة
                 */

                const cameraPublication =
                    room.localParticipant
                        .getTrackPublication(
                            "camera"
                        );


                if (
                    !cameraPublication ||
                    !cameraPublication.track
                ) {

                    /*
                     * fallback باستخدام Track.Source
                     */

                    const camera =
                        room.localParticipant
                            .getTrackPublication(
                                "camera"
                            );

                    if (
                        !camera ||
                        !camera.track
                    ) {

                        throw new Error(
                            "تعذر تشغيل كاميرا المدرس."
                        );
                    }
                }


                placeholder.style.display =
                    "none";


                /*
                 * تحديث Firestore
                 * نفس النظام القديم
                 */

                await updateDoc(

                    doc(
                        db,
                        "lectures",
                        lectureId
                    ),

                    {

                        isLive:
                            true,

                        isPublished:
                            true,

                        roomName:
                            lecture.roomName,

                        updatedAt:
                            serverTimestamp()
                    }
                );


                isBroadcasting =
                    true;


                endButton.disabled =
                    false;


                enableBroadcastControls();


                setStatus(
                    "🔴 البث مباشر الآن"
                );


            } catch (error) {

                console.error(
                    "Start broadcast error:",
                    error
                );


                startButton.disabled =
                    false;


                endButton.disabled =
                    true;


                disableBroadcastControls();


                if (room) {

                    try {

                        await leaveLiveKit();

                    } catch (leaveError) {

                        console.warn(
                            leaveError
                        );
                    }

                    room =
                        null;
                }


                setStatus(
                    "تعذر بدء البث"
                );


                showMessage(
                    error?.message ||
                    "تعذر بدء البث."
                );
            }
        }



        /* =====================================================
           Switch Camera
        ===================================================== */

        async function changeCamera(
            facingMode
        ) {

            if (
                !room ||
                !isBroadcasting
            ) {

                return;
            }


            try {

                hideMessage();


                frontCameraButton.disabled =
                    true;

                backCameraButton.disabled =
                    true;


                setStatus(
                    facingMode === "environment"
                        ? "جاري تشغيل الكاميرا الخلفية..."
                        : "جاري تشغيل الكاميرا الأمامية..."
                );


                await switchTeacherCamera(
                    room,
                    facingMode
                );


                /*
                 * إعادة عرض الكاميرا محليًا
                 */

                teacherVideo
                    .querySelectorAll(
                        "video"
                    )
                    .forEach(
                        video => {

                            video.remove();
                        }
                    );


                attachLocalCamera(
                    room,
                    teacherVideo
                );


                setStatus(
                    facingMode === "environment"
                        ? "🔴 البث مباشر — الكاميرا الخلفية"
                        : "🔴 البث مباشر — الكاميرا الأمامية"
                );


            } catch (error) {

                console.error(
                    "Change camera error:",
                    error
                );


                showMessage(
                    error?.message ||
                    "تعذر تبديل الكاميرا."
                );


                setStatus(
                    "🔴 البث مباشر"
                );

            } finally {

                if (isBroadcasting) {

                    frontCameraButton.disabled =
                        false;

                    backCameraButton.disabled =
                        false;
                }
            }
        }



        /* =====================================================
           Start Screen Share
        ===================================================== */

        async function handleStartScreenShare() {

            if (
                !room ||
                !isBroadcasting
            ) {

                return;
            }


            try {

                hideMessage();


                screenShareButton.disabled =
                    true;


                setStatus(
                    "جاري بدء مشاركة الشاشة..."
                );


                await startScreenShare(
                    room
                );


                /*
                 * الحصول على Track مشاركة الشاشة
                 */

                screenShareVideo.innerHTML =
                    "";


                let publication = null;


                /*
                 * أحيانًا publication يحتاج
                 * لحظة بسيطة بعد setScreenShareEnabled
                 */

                for (
                    let attempt = 0;
                    attempt < 10;
                    attempt++
                ) {

                    publication =
                        getLocalScreenSharePublication(
                            room
                        );


                    if (
                        publication &&
                        publication.track
                    ) {

                        break;
                    }


                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                100
                            )
                    );
                }


                if (
                    !publication ||
                    !publication.track
                ) {

                    throw new Error(
                        "تم تشغيل مشاركة الشاشة لكن تعذر عرضها محليًا."
                    );
                }


                attachLocalScreenShare(
                    room,
                    screenShareVideo
                );


                screenShareBox.classList.add(
                    "active"
                );


                screenShareButton.style.display =
                    "none";


                stopScreenShareButton.style.display =
                    "inline-block";


                stopScreenShareButton.disabled =
                    false;


                setStatus(
                    "🔴 البث مباشر — مشاركة الشاشة مفعلة"
                );


            } catch (error) {

                console.error(
                    "Screen share error:",
                    error
                );


                screenShareButton.disabled =
                    false;


                screenShareBox.classList.remove(
                    "active"
                );


                screenShareVideo.innerHTML =
                    "";


                stopScreenShareButton.style.display =
                    "none";


                stopScreenShareButton.disabled =
                    true;


                showMessage(
                    error?.message ||
                    "تعذر بدء مشاركة الشاشة."
                );


                setStatus(
                    "🔴 البث مباشر"
                );
            }
        }



        /* =====================================================
           Stop Screen Share
        ===================================================== */

        async function handleStopScreenShare() {

            if (!room) {
                return;
            }


            try {

                await stopScreenShare(
                    room
                );


            } catch (error) {

                console.warn(
                    "Stop screen share error:",
                    error
                );
            }


            screenShareVideo.innerHTML =
                "";


            screenShareBox.classList.remove(
                "active"
            );


            stopScreenShareButton.style.display =
                "none";


            stopScreenShareButton.disabled =
                true;


            screenShareButton.style.display =
                "inline-block";


            screenShareButton.disabled =
                false;


            setStatus(
                "🔴 البث مباشر"
            );
        }



        /* =====================================================
           End Broadcast
        ===================================================== */

        async function endBroadcast() {

            try {

                endButton.disabled =
                    true;


                /*
                 * إيقاف مشاركة الشاشة أولًا
                 */

                if (
                    room &&
                    room.localParticipant &&
                    room.localParticipant
                        .isScreenShareEnabled
                ) {

                    await handleStopScreenShare();
                }


                /*
                 * تحديث Firebase
                 */

                if (lectureId) {

                    await updateDoc(

                        doc(
                            db,
                            "lectures",
                            lectureId
                        ),

                        {

                            isLive:
                                false,

                            updatedAt:
                                serverTimestamp()
                        }
                    );
                }


                /*
                 * الخروج من LiveKit
                 */

                await leaveLiveKit();


                room =
                    null;


                isBroadcasting =
                    false;


                teacherVideo.innerHTML =
                    "";


                placeholder.style.display =
                    "flex";


                startButton.disabled =
                    false;


                endButton.disabled =
                    true;


                disableBroadcastControls();


                setStatus(
                    "تم إنهاء البث"
                );


            } catch (error) {

                console.error(
                    "End broadcast error:",
                    error
                );


                showMessage(
                    error?.message ||
                    "تعذر إنهاء البث."
                );
            }
        }



        /* =====================================================
           Leave
        ===================================================== */

        async function leavePage() {

            try {

                await leaveLiveKit();

            } catch (error) {

                console.warn(
                    error
                );
            }


            window.location.href =
                "lectures.html";
        }



        /* =====================================================
           Buttons
        ===================================================== */

        startButton.addEventListener(
            "click",
            startBroadcast
        );


        endButton.addEventListener(
            "click",
            endBroadcast
        );


        frontCameraButton.addEventListener(
            "click",
            () => {

                changeCamera(
                    "user"
                );
            }
        );


        backCameraButton.addEventListener(
            "click",
            () => {

                changeCamera(
                    "environment"
                );
            }
        );


        screenShareButton.addEventListener(
            "click",
            handleStartScreenShare
        );


        stopScreenShareButton.addEventListener(
            "click",
            handleStopScreenShare
        );


        leaveButton.addEventListener(
            "click",
            leavePage
        );



        /* =====================================================
           Before Unload
        ===================================================== */

        window.addEventListener(
            "beforeunload",
            () => {

                leaveLiveKit();
            }
        );



        /* =====================================================
           Start
        ===================================================== */

        loadLecture();

    </script>

</body>

</html>
