<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>المحاضرات | بوابة التمريض</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

#teacher-layout {
  display: flex;
  min-height: 100vh;
}

.teacher-sidebar {
  width: 260px;
  background: #0b1f3a;
  color: white;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.teacher-brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding-bottom: 20px;
  border-bottom: 1px solid #ffffff20;
}

.teacher-logo {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: #1976d2;
  display: grid;
  place-items: center;
  font-size: 23px;
}

.teacher-brand strong,
.teacher-brand span {
  display: block;
}

.teacher-brand span {
  font-size: 12px;
  color: #b9c7d8;
}

.teacher-account {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 20px 0;
}

.teacher-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: white;
  color: #0b1f3a;
  display: grid;
  place-items: center;
  font-weight: bold;
}

.teacher-account small {
  display: block;
  color: #aaa;
  margin-top: 4px;
}

.teacher-nav {
  display: grid;
  gap: 8px;
}

.teacher-nav a {
  color: white;
  text-decoration: none;
  padding: 13px;
  border-radius: 9px;
}

.teacher-nav a.active,
.teacher-nav a:hover {
  background: #1976d2;
}

.teacher-logout {
  margin-top: auto;
  border: 0;
  background: #c62828;
  color: white;
  padding: 12px;
  border-radius: 9px;
  cursor: pointer;
}

.teacher-main {
  flex: 1;
}

.teacher-topbar {
  background: white;
  padding: 20px 30px;
  box-shadow: 0 1px 8px #00000010;
}

.teacher-topbar h1 {
  margin: 0;
}

.teacher-topbar p {
  margin: 7px 0 0;
  color: #718096;
}

#teacher-content {
  padding: 25px;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.btn {
  border: 0;
  border-radius: 9px;
  padding: 11px 18px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}

.btn-primary {
  background: #1976d2;
  color: white;
}

.btn-danger {
  background: #d32f2f;
  color: white;
}

.btn-secondary {
  background: #e9eef5;
  color: #172033;
}

.lecture-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 3px 15px #00000008;
}

.card h3 {
  margin-top: 0;
}

.meta {
  color: #68778c;
  line-height: 1.9;
}

.badge {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
}

.green {
  background: #e8f5e9;
  color: #2e7d32;
}

.red {
  background: #ffebee;
  color: #c62828;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 15px;
}

.modal {
  position: fixed;
  inset: 0;
  background: #00000080;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 999;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(650px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 18px;
  padding: 25px;
}

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #d7dee8;
  border-radius: 9px;
  font-size: 15px;
}

.form-group textarea {
  min-height: 110px;
  resize: vertical;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.empty {
  background: white;
  padding: 40px;
  text-align: center;
  border-radius: 15px;
}

@media(max-width:1000px) {
  .lecture-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width:700px) {

  .teacher-sidebar {
    width: 70px;
    padding: 10px;
  }

  .teacher-brand div:not(.teacher-logo),
  .teacher-account div:not(.teacher-avatar),
  .teacher-nav span {
    display: none;
  }

  .teacher-nav a {
    text-align: center;
  }

  .teacher-logout {
    font-size: 0;
  }

  .teacher-logout::before {
    content: "🚪";
    font-size: 18px;
  }

  .lecture-grid {
    grid-template-columns: 1fr;
  }

  #teacher-content {
    padding: 15px;
  }
}

</style>

</head>

<body>

<div id="teacher-layout"></div>

<div id="lectureModal" class="modal">

  <div class="modal-box">

    <h2 id="modalTitle">إضافة محاضرة</h2>

    <form id="lectureForm">

      <input type="hidden" id="lectureId">

      <div class="form-group">

        <label>عنوان المحاضرة</label>

        <input
          id="lectureTitle"
          required
          placeholder="مثال: Introduction to Nursing"
        >

      </div>

      <div class="form-group">

        <label>المرحلة</label>

        <select id="stageId" required>

          <option value="">اختر المرحلة</option>

        </select>

      </div>

      <div class="form-group">

        <label>المادة</label>

        <select id="subjectId" required>

          <option value="">اختر المادة</option>

        </select>

      </div>

      <div class="form-group">

        <label>تاريخ ووقت المحاضرة</label>

        <input
          type="datetime-local"
          id="lectureDate"
          required
        >

      </div>

      <div class="form-group">

        <label>الوصف</label>

        <textarea
          id="lectureDescription"
          placeholder="وصف مختصر للمحاضرة"
        ></textarea>

      </div>

      <div class="modal-actions">

        <button
          type="submit"
          class="btn btn-primary"
        >
          حفظ المحاضرة
        </button>

        <button
          type="button"
          id="closeModal"
          class="btn btn-secondary"
        >
          إلغاء
        </button>

      </div>

    </form>

  </div>

</div>


<script type="module">

import {
  protectTeacherPage,
  createTeacherLayout,
  getTeacherLectures,
  getStages,
  getSubjects,
  getLectureExams,
  escapeHtml,
  formatDate,
  formatTime,
  currentTeacher
} from "../src/teacher/teacher.js";

import {
  db
} from "../src/firebase/init.js";

import {
  collection,
  doc,
  addDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const teacher = await protectTeacherPage();

createTeacherLayout("lectures");

document.querySelector("#teacher-page-title").textContent =
  "إدارة المحاضرات";

const content =
  document.querySelector("#teacher-content");

const modal =
  document.querySelector("#lectureModal");

const form =
  document.querySelector("#lectureForm");

const stageSelect =
  document.querySelector("#stageId");

const subjectSelect =
  document.querySelector("#subjectId");

const lectureId =
  document.querySelector("#lectureId");

const titleInput =
  document.querySelector("#lectureTitle");

const dateInput =
  document.querySelector("#lectureDate");

const descriptionInput =
  document.querySelector("#lectureDescription");

const modalTitle =
  document.querySelector("#modalTitle");


const stages = await getStages();
const subjects = await getSubjects();

const allowedStages =
  stages.filter(stage =>
    teacher.stageIds?.includes(stage.id)
  );

const allowedSubjects =
  subjects.filter(subject =>
    teacher.subjectIds?.includes(subject.id)
  );


stageSelect.innerHTML =
  `<option value="">اختر المرحلة</option>` +
  allowedStages.map(stage => `
    <option value="${escapeHtml(stage.id)}">
      ${escapeHtml(stage.name)}
    </option>
  `).join("");


subjectSelect.innerHTML =
  `<option value="">اختر المادة</option>` +
  allowedSubjects.map(subject => `
    <option value="${escapeHtml(subject.id)}">
      ${escapeHtml(subject.name)}
    </option>
  `).join("");


let lectures = [];

async function loadLectures() {

  lectures = await getTeacherLectures(teacher.uid);

  if (!lectures.length) {

    content.innerHTML = `

      <div class="toolbar">

        <h2>المحاضرات</h2>

        <button
          class="btn btn-primary"
          id="addLecture"
        >
          + إضافة محاضرة
        </button>

      </div>

      <div class="empty">

        <h2>لا توجد محاضرات</h2>

        <p>
          ابدأ بإنشاء أول محاضرة.
        </p>

      </div>
    `;

  } else {

    content.innerHTML = `

      <div class="toolbar">

        <h2>المحاضرات</h2>

        <button
          class="btn btn-primary"
          id="addLecture"
        >
          + إضافة محاضرة
        </button>

      </div>

      <div class="lecture-grid">

        ${lectures.map(lecture => {

          const stage =
            stages.find(x =>
              x.id === lecture.stageId
            );

          const subject =
            subjects.find(x =>
              x.id === lecture.subjectId
            );

          return `

            <div class="card">

              <h3>
                ${escapeHtml(lecture.title)}
              </h3>

              <div class="meta">

                📚 المرحلة:
                ${escapeHtml(stage?.name || "-")}
                <br>

                🩺 المادة:
                ${escapeHtml(subject?.name || "-")}
                <br>

                📅 التاريخ:
                ${formatDate(lecture.date)}
                <br>

                🕐 الوقت:
                ${formatTime(lecture.date)}

              </div>

              <br>

              <span class="badge ${
                lecture.isPublished
                ? "green"
                : "red"
              }">

                ${
                  lecture.isPublished
                  ? "منشورة للطلاب"
                  : "مسودة"
                }

              </span>

              ${
                lecture.isLive
                ? `
                  <span class="badge green">
                    🔴 البث مباشر الآن
                  </span>
                `
                : ""
              }

              <div class="actions">

                <button
                  class="btn btn-secondary edit-btn"
                  data-id="${lecture.id}"
                >
                  تعديل
                </button>

                <button
                  class="btn ${
                    lecture.isPublished
                    ? "btn-secondary"
                    : "btn-primary"
                  } publish-btn"
                  data-id="${lecture.id}"
                >
                  ${
                    lecture.isPublished
                    ? "إخفاء"
                    : "نشر"
                  }
                </button>

                ${
                  lecture.isLive
                  ? `
                    <button
                      class="btn btn-danger end-live-btn"
                      data-id="${lecture.id}"
                    >
                      ⛔ إنهاء البث
                    </button>
                  `
                  : `
                    <button
                      class="btn btn-primary start-live-btn"
                      data-id="${lecture.id}"
                    >
                      🔴 بدء البث
                    </button>
                  `
                }

                ${
                  lecture.isLive
                  ? `
                    <button
                      class="btn btn-secondary enter-live-btn"
                      data-id="${lecture.id}"
                    >
                      🎥 دخول البث
                    </button>
                  `
                  : ""
                }

                <button
                  class="btn btn-primary exam-btn"
                  data-id="${lecture.id}"
                >
                  📝 الاختبار
                </button>

                <button
                  class="btn btn-primary open-teacher-app"
                  data-lecture-id="${lecture.id}"
                >
                  📱 فتح في تطبيق المدرس
                </button>

                <button
                  class="btn btn-danger delete-btn"
                  data-id="${lecture.id}"
                >
                  حذف
                </button>

              </div>

            </div>
          `;

        }).join("")}

      </div>
    `;
  }


  document
    .querySelector("#addLecture")
    ?.addEventListener(
      "click",
      openAddModal
    );


  document
    .querySelectorAll(".edit-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => openEditModal(button.dataset.id)
      );

    });


  document
    .querySelectorAll(".publish-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => togglePublish(button.dataset.id)
      );

    });


  document
    .querySelectorAll(".start-live-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => startLive(button.dataset.id)
      );

    });


  document
    .querySelectorAll(".end-live-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => endLive(button.dataset.id)
      );

    });


  document
    .querySelectorAll(".enter-live-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => enterLive(button.dataset.id)
      );

    });


  document
    .querySelectorAll(".delete-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => deleteLecture(button.dataset.id)
      );

    });


  document
    .querySelectorAll(".exam-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          window.location.href =
            `exams.html?lectureId=${encodeURIComponent(button.dataset.id)}`;

        }
      );

    });

}


function openAddModal() {

  form.reset();

  lectureId.value = "";

  modalTitle.textContent =
    "إضافة محاضرة";

  modal.classList.add("show");
}


function openEditModal(id) {

  const lecture =
    lectures.find(x => x.id === id);

  if (!lecture) return;

  lectureId.value =
    lecture.id;

  titleInput.value =
    lecture.title || "";

  stageSelect.value =
    lecture.stageId || "";

  subjectSelect.value =
    lecture.subjectId || "";

  descriptionInput.value =
    lecture.description || "";

  if (lecture.date?.toDate) {

    const date =
      lecture.date.toDate();

    const local =
      new Date(
        date.getTime()
        - date.getTimezoneOffset() * 60000
      )
      .toISOString()
      .slice(0, 16);

    dateInput.value = local;
  }

  modalTitle.textContent =
    "تعديل المحاضرة";

  modal.classList.add("show");
}


document
  .querySelector("#closeModal")
  .addEventListener(
    "click",
    () => modal.classList.remove("show")
  );


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    try {

      const selectedStage =
        stageSelect.value;

      const selectedSubject =
        subjectSelect.value;

      if (
        !teacher.stageIds?.includes(selectedStage)
      ) {
        alert("هذه المرحلة غير مسموحة لهذا المعلم.");
        return;
      }

      if (
        !teacher.subjectIds?.includes(selectedSubject)
      ) {
        alert("هذه المادة غير مسموحة لهذا المعلم.");
        return;
      }


      const dateValue =
        dateInput.value;

      if (!dateValue) {
        alert("اختر موعد المحاضرة.");
        return;
      }


      const data = {

        title:
          titleInput.value.trim(),

        teacherId:
          teacher.uid,

        teacherName:
          teacher.name || "",

        stageId:
          selectedStage,

        subjectId:
          selectedSubject,

        description:
          descriptionInput.value.trim(),

        date:
          new Date(dateValue)

      };


      if (lectureId.value) {

        await updateDoc(
          doc(
            db,
            "lectures",
            lectureId.value
          ),
          {
            ...data,
            updatedAt: serverTimestamp()
          }
        );

        alert("تم تعديل المحاضرة بنجاح.");

      } else {

        const lectureRef =
          await addDoc(
            collection(db, "lectures"),
            {
              ...data,

              isPublished:
                false,

              isLive:
                false,

              roomName:
                "",

              recordingUrl:
                "",

              recordingStatus:
                "pending",

              createdAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp()
            }
          );


        const roomName =
          `masar-lecture-${lectureRef.id}`;


        await updateDoc(
          lectureRef,
          {
            roomName:
              roomName,

            updatedAt:
              serverTimestamp()
          }
        );


        alert("تم إنشاء المحاضرة والغرفة بنجاح.");
      }

      modal.classList.remove("show");

      await loadLectures();

    } catch (error) {

      console.error(error);

      alert(
        "حدث خطأ أثناء حفظ المحاضرة."
      );
    }

  }
);


async function togglePublish(id) {

  try {

    const lecture =
      lectures.find(x => x.id === id);

    if (!lecture) return;

    await updateDoc(
      doc(db, "lectures", id),
      {
        isPublished:
          lecture.isPublished !== true,

        updatedAt:
          serverTimestamp()
      }
    );

    await loadLectures();

  } catch (error) {

    console.error(error);

    alert("تعذر تغيير حالة النشر.");
  }
}


// =====================================================
// Start Live Broadcast
// =====================================================

async function startLive(id) {

  try {

    const lecture =
      lectures.find(x => x.id === id);

    if (!lecture) {
      alert("المحاضرة غير موجودة.");
      return;
    }


    if (!lecture.isPublished) {

      alert(
        "يجب نشر المحاضرة للطلاب أولًا قبل بدء البث."
      );

      return;
    }


    let roomName =
      lecture.roomName;


    if (!roomName) {

      roomName =
        `masar-lecture-${id}`;


      await updateDoc(
        doc(db, "lectures", id),
        {
          roomName:
            roomName,

          updatedAt:
            serverTimestamp()
        }
      );

    }


    await updateDoc(
      doc(db, "lectures", id),
      {
        isLive:
          true,

        roomName:
          roomName,

        updatedAt:
          serverTimestamp()
      }
    );


    window.location.href =
      `live.html?lectureId=${encodeURIComponent(id)}`;

  } catch (error) {

    console.error(
      "Start live error:",
      error
    );

    alert(
      "تعذر بدء البث."
    );

  }

}


// =====================================================
// End Live Broadcast
// =====================================================

async function endLive(id) {

  const lecture =
    lectures.find(x => x.id === id);

  if (!lecture) return;


  const confirmed =
    confirm(
      `هل تريد إنهاء بث المحاضرة "${lecture.title}"؟`
    );


  if (!confirmed) {
    return;
  }


  try {

    await updateDoc(
      doc(db, "lectures", id),
      {
        isLive:
          false,

        updatedAt:
          serverTimestamp()
      }
    );


    await loadLectures();

  } catch (error) {

    console.error(
      "End live error:",
      error
    );

    alert(
      "تعذر إنهاء البث."
    );

  }

}


// =====================================================
// Enter Live Broadcast
// =====================================================

function enterLive(id) {

  window.location.href =
    `live.html?lectureId=${encodeURIComponent(id)}`;

}


// =====================================================
// Open Lecture In Teacher App
// =====================================================

document.addEventListener(
  "click",
  (event) => {

    const button =
      event.target.closest(
        ".open-teacher-app"
      );

    if (!button) {
      return;
    }


    const lectureId =
      button.dataset.lectureId;


    if (!lectureId) {
      return;
    }


    const appUrl =
      `masaraltamreed://lecture?lectureId=${encodeURIComponent(
        lectureId
      )}`;


    window.location.href =
      appUrl;
  }
);


async function deleteLecture(id) {

  const lecture =
    lectures.find(x => x.id === id);

  if (!lecture) return;

  const confirmed =
    confirm(
      `هل تريد حذف المحاضرة "${lecture.title}"؟`
    );

  if (!confirmed) return;

  try {

    const exams =
      await getLectureExams(id);

    if (exams.length) {

      alert(
        "لا يمكن حذف المحاضرة لأنها مرتبطة باختبار. احذف الاختبار أولًا."
      );

      return;
    }

    await deleteDoc(
      doc(db, "lectures", id)
    );

    await loadLectures();

  } catch (error) {

    console.error(error);

    alert("حدث خطأ أثناء حذف المحاضرة.");
  }
}


await loadLectures();

</script>

</body>
</html>
