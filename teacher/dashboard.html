<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
لوحة تحكم المعلم | بوابة التمريض
</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    background: #f1f5f9;

    color: #0f172a;

}


.teacher-header {

    height: 75px;

    background: white;

    border-bottom: 1px solid #e2e8f0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 25px;

}


.header-right {

    display: flex;

    align-items: center;

    gap: 15px;

}


.menu-button {

    display: none;

    border: 0;

    background: transparent;

    font-size: 25px;

}


.brand {

    display: flex;

    align-items: center;

    gap: 12px;

}


.brand-icon {

    width: 48px;
    height: 48px;

    border-radius: 14px;

    background: #0f766e;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 25px;

}


.brand h2 {

    font-size: 18px;

}


.brand span {

    color: #64748b;

    font-size: 12px;

}


.teacher-mini-profile {

    display: flex;

    align-items: center;

    gap: 10px;

}


.teacher-avatar {

    width: 42px;
    height: 42px;

    border-radius: 50%;

    background: #ccfbf1;

    color: #0f766e;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: bold;

}


.teacher-mini-info span {

    display: block;

    font-size: 12px;

    color: #64748b;

}


.teacher-system {

    display: flex;

    min-height: calc(100vh - 75px);

}


.teacher-sidebar {

    width: 250px;

    background: #0f172a;

    color: white;

}


.sidebar-profile {

    padding: 30px 20px;

    text-align: center;

    border-bottom: 1px solid #1e293b;

}


.large-avatar {

    width: 70px;
    height: 70px;

    margin: auto auto 12px;

    border-radius: 50%;

    background: #0f766e;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 25px;

}


.sidebar-profile span {

    display: block;

    margin-top: 5px;

    color: #94a3b8;

    font-size: 13px;

}


.teacher-nav {

    padding: 15px;

}


.teacher-nav a,
.logout-button {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 13px;

    border-radius: 10px;

    margin-bottom: 7px;

    color: #cbd5e1;

    text-decoration: none;

    border: 0;

    background: transparent;

    cursor: pointer;

    font-size: 15px;

}


.teacher-nav a:hover,
.teacher-nav a.active {

    background: #1e293b;

    color: white;

}


.logout-button:hover {

    background: #7f1d1d;

    color: white;

}


.nav-divider {

    height: 1px;

    background: #1e293b;

    margin: 20px 0;

}


.teacher-main {

    flex: 1;

    padding: 30px;

}


.page-title {

    margin-bottom: 25px;

}


.page-title h1 {

    font-size: 28px;

}


.page-title p {

    margin-top: 8px;

    color: #64748b;

}


.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;

}


.stat-card {

    background: white;

    padding: 25px;

    border-radius: 18px;

    border: 1px solid #e2e8f0;

}


.stat-icon {

    font-size: 28px;

    margin-bottom: 15px;

}


.stat-card span {

    color: #64748b;

    font-size: 14px;

}


.stat-card strong {

    display: block;

    font-size: 32px;

    margin-top: 5px;

}


.quick-actions {

    margin-top: 25px;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;

}


.quick-card {

    background: white;

    border-radius: 18px;

    padding: 25px;

    border: 1px solid #e2e8f0;

    text-decoration: none;

    color: #0f172a;

}


.quick-card:hover {

    border-color: #0f766e;

}


.quick-card h3 {

    margin-bottom: 8px;

}


.quick-card p {

    color: #64748b;

}


@media(max-width: 800px) {

    .menu-button {
        display: block;
    }

    .teacher-sidebar {

        position: fixed;

        right: -270px;

        top: 75px;

        bottom: 0;

        z-index: 10;

        transition: .3s;

    }

    .teacher-sidebar.open {
        right: 0;
    }

    .teacher-main {
        width: 100%;
        padding: 20px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .quick-actions {
        grid-template-columns: 1fr;
    }

    .teacher-mini-info {
        display: none;
    }

}

</style>

</head>


<body>


<div id="teacherLayout">

    <div
        id="teacherContent"
        style="display:none"
    ></div>

</div>


<script type="module">

import {
    protectTeacherPage,
    createTeacherLayout,
    getTeacherLectures,
    getTeacherExams
} from "../src/teacher/teacher.js";


protectTeacherPage(async (teacher) => {

    const layout =
        document.getElementById(
            "teacherLayout"
        );

    const lectures =
        await getTeacherLectures(
            teacher.uid
        );

    const exams =
        await getTeacherExams(
            teacher.uid
        );


    layout.innerHTML = `

        <header class="teacher-header">

            <div class="header-right">

                <button
                    class="menu-button"
                    id="menuButton"
                >
                    ☰
                </button>

                <div class="brand">

                    <div class="brand-icon">
                        🩺
                    </div>

                    <div>
                        <h2>بوابة التمريض</h2>
                        <span>لوحة تحكم المعلم</span>
                    </div>

                </div>

            </div>

            <div class="teacher-mini-profile">

                <div class="teacher-avatar">
                    ${teacher.name?.charAt(0) || "م"}
                </div>

                <div class="teacher-mini-info">

                    <strong>
                        ${teacher.name || "المعلم"}
                    </strong>

                    <span>
                        معلم
                    </span>

                </div>

            </div>

        </header>


        <div class="teacher-system">

            <aside
                class="teacher-sidebar"
                id="teacherSidebar"
            >

                <div class="sidebar-profile">

                    <div class="large-avatar">
                        ${teacher.name?.charAt(0) || "م"}
                    </div>

                    <strong>
                        ${teacher.name || "المعلم"}
                    </strong>

                    <span>
                        مدرس / معلم
                    </span>

                </div>


                <nav class="teacher-nav">

                    <a
                        href="./dashboard.html"
                        class="active"
                    >
                        🏠 الرئيسية
                    </a>

                    <a href="./lectures.html">
                        🎥 المحاضرات
                    </a>

                    <a href="./exams.html">
                        📝 الاختبارات
                    </a>

                    <a href="./profile.html">
                        👤 حسابي
                    </a>

                    <div class="nav-divider"></div>

                    <button
                        id="logoutTeacher"
                        class="logout-button"
                    >
                        🚪 تسجيل الخروج
                    </button>

                </nav>

            </aside>


            <main class="teacher-main">

                <div class="page-title">

                    <h1>
                        أهلاً بك 👋
                        ${teacher.name || "معلم"}
                    </h1>

                    <p>
                        دي لوحة التحكم الخاصة بيك في بوابة التمريض.
                    </p>

                </div>


                <section class="stats">

                    <div class="stat-card">

                        <div class="stat-icon">
                            🎥
                        </div>

                        <span>
                            المحاضرات
                        </span>

                        <strong>
                            ${lectures.length}
                        </strong>

                    </div>


                    <div class="stat-card">

                        <div class="stat-icon">
                            📝
                        </div>

                        <span>
                            الاختبارات
                        </span>

                        <strong>
                            ${exams.length}
                        </strong>

                    </div>


                    <div class="stat-card">

                        <div class="stat-icon">
                            🩺
                        </div>

                        <span>
                            الحالة
                        </span>

                        <strong style="font-size:22px">
                            ${teacher.isActive === false
                                ? "غير مفعل"
                                : "نشط"}
                        </strong>

                    </div>

                </section>


                <section class="quick-actions">

                    <a
                        href="./lectures.html"
                        class="quick-card"
                    >

                        <h3>
                            🎥 إدارة المحاضرات
                        </h3>

                        <p>
                            إنشاء وإدارة المحاضرات المباشرة والتسجيلات.
                        </p>

                    </a>


                    <a
                        href="./exams.html"
                        class="quick-card"
                    >

                        <h3>
                            📝 إدارة الاختبارات
                        </h3>

                        <p>
                            إنشاء الاختبارات ومتابعة نتائج الطلاب.
                        </p>

                    </a>

                </section>

            </main>

        </div>

    `;


    document
        .getElementById("menuButton")
        ?.addEventListener(
            "click",
            () => {

                document
                    .getElementById("teacherSidebar")
                    .classList.toggle("open");

            }
        );


    document
        .getElementById("logoutTeacher")
        ?.addEventListener(
            "click",
            async () => {

                const {
                    logoutTeacher
                } = await import(
                    "../src/teacher/teacher.js"
                );

                logoutTeacher();

            }
        );

});

</script>

</body>

</html>
