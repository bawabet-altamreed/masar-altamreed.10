<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>لوحة المعلم | بوابة التمريض</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

#teacher-layout {
  display: flex;
  min-height: 100vh;
}

.teacher-sidebar {
  width: 260px;
  background: #0b1f3a;
  color: white;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.teacher-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 20px;
  border-bottom: 1px solid #ffffff20;
}

.teacher-logo {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: #1e88e5;
  display: grid;
  place-items: center;
  font-size: 24px;
}

.teacher-brand strong,
.teacher-brand span {
  display: block;
}

.teacher-brand span {
  color: #b9c7d8;
  font-size: 12px;
  margin-top: 4px;
}

.teacher-account {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 20px 0;
}

.teacher-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #fff;
  color: #0b1f3a;
  display: grid;
  place-items: center;
  font-weight: bold;
}

.teacher-account strong,
.teacher-account small {
  display: block;
}

.teacher-account small {
  color: #aebbd0;
  margin-top: 4px;
}

.teacher-nav {
  display: grid;
  gap: 8px;
}

.teacher-nav a {
  color: #dce6f2;
  text-decoration: none;
  padding: 13px;
  border-radius: 10px;
}

.teacher-nav a:hover,
.teacher-nav a.active {
  background: #1e88e5;
  color: white;
}

.teacher-logout {
  margin-top: auto;
  border: 0;
  padding: 13px;
  border-radius: 10px;
  background: #d32f2f;
  color: white;
  cursor: pointer;
}

.teacher-main {
  flex: 1;
}

.teacher-topbar {
  background: white;
  padding: 20px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 1px 8px #00000010;
}

.teacher-topbar h1 {
  margin: 0 0 6px;
}

.teacher-topbar p {
  margin: 0;
  color: #718096;
}

.teacher-top-user {
  font-weight: bold;
}

#teacher-content {
  padding: 30px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

.stat {
  background: white;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 3px 15px #00000008;
}

.stat span {
  display: block;
  color: #718096;
  margin-bottom: 10px;
}

.stat strong {
  font-size: 30px;
}

.section {
  background: white;
  border-radius: 16px;
  margin-top: 25px;
  padding: 22px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.btn {
  border: 0;
  padding: 11px 18px;
  border-radius: 9px;
  cursor: pointer;
  background: #1976d2;
  color: white;
  text-decoration: none;
}

.list-item {
  border-bottom: 1px solid #eee;
  padding: 15px 0;
}

.list-item:last-child {
  border-bottom: 0;
}

.badge {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
}

.badge-green {
  background: #e8f5e9;
  color: #2e7d32;
}

.badge-red {
  background: #ffebee;
  color: #c62828;
}

@media(max-width:800px) {

  .teacher-sidebar {
    width: 75px;
    padding: 10px;
  }

  .teacher-brand div:not(.teacher-logo),
  .teacher-account div:not(.teacher-avatar),
  .teacher-nav span {
    display: none;
  }

  .teacher-nav a {
    text-align: center;
  }

  .teacher-logout {
    font-size: 0;
  }

  .teacher-logout::before {
    content: "🚪";
    font-size: 18px;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  #teacher-content {
    padding: 15px;
  }

}

</style>

</head>

<body>

<div id="teacher-layout"></div>

<script type="module">

import {
  protectTeacherPage,
  createTeacherLayout,
  getTeacherLectures,
  getTeacherExams,
  getRecentLectures,
  getRecentExams,
  escapeHtml,
  formatDate
} from "../src/teacher/teacher.js";

const teacher = await protectTeacherPage();

createTeacherLayout("dashboard");

document.querySelector("#teacher-page-title").textContent =
  "لوحة التحكم";

const content =
  document.querySelector("#teacher-content");

const lectures =
  await getTeacherLectures(teacher.uid);

const exams =
  await getTeacherExams(teacher.uid);

const publishedLectures =
  lectures.filter(x => x.isPublished === true).length;

const publishedExams =
  exams.filter(x => x.isPublished === true).length;

content.innerHTML = `

<div class="stats">

  <div class="stat">
    <span>إجمالي المحاضرات</span>
    <strong>${lectures.length}</strong>
  </div>

  <div class="stat">
    <span>المحاضرات المنشورة</span>
    <strong>${publishedLectures}</strong>
  </div>

  <div class="stat">
    <span>إجمالي الاختبارات</span>
    <strong>${exams.length}</strong>
  </div>

  <div class="stat">
    <span>الاختبارات المنشورة</span>
    <strong>${publishedExams}</strong>
  </div>

</div>

<div class="section">

  <div class="section-header">

    <h2>آخر المحاضرات</h2>

    <a class="btn" href="lectures.html">
      إدارة المحاضرات
    </a>

  </div>

  <div>

    ${
      lectures.length
      ? lectures.slice(0, 5).map(lecture => `

        <div class="list-item">

          <strong>
            ${escapeHtml(lecture.title)}
          </strong>

          <br>

          <small>
            ${formatDate(lecture.date)}
          </small>

          <span class="badge ${
            lecture.isPublished
            ? "badge-green"
            : "badge-red"
          }">

            ${
              lecture.isPublished
              ? "منشورة"
              : "مسودة"
            }

          </span>

        </div>

      `).join("")
      : "<p>لا توجد محاضرات حتى الآن.</p>"
    }

  </div>

</div>

<div class="section">

  <div class="section-header">

    <h2>آخر الاختبارات</h2>

    <a class="btn" href="exams.html">
      إدارة الاختبارات
    </a>

  </div>

  <div>

    ${
      exams.length
      ? exams.slice(0, 5).map(exam => `

        <div class="list-item">

          <strong>
            ${escapeHtml(exam.title)}
          </strong>

          <br>

          <small>
            عدد الأسئلة:
            ${(exam.questions || []).length}
          </small>

          <span class="badge ${
            exam.isPublished
            ? "badge-green"
            : "badge-red"
          }">

            ${
              exam.isPublished
              ? "منشور"
              : "مسودة"
            }

          </span>

        </div>

      `).join("")
      : "<p>لا توجد اختبارات حتى الآن.</p>"
    }

  </div>

</div>
`;

</script>

</body>
</html>
