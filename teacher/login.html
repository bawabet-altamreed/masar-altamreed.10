<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>دخول المعلم | بوابة التمريض</title>

<style>

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(
    135deg,
    #071b34,
    #1976d2
  );
}

.login-card {
  width: min(420px, 92%);
  background: white;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 15px 50px #0005;
}

.logo {
  width: 65px;
  height: 65px;
  border-radius: 18px;
  background: #1976d2;
  color: white;
  display: grid;
  place-items: center;
  font-size: 30px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #718096;
  margin-bottom: 25px;
}

.form-group {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d7dee8;
  border-radius: 9px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 9px;
  background: #1976d2;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.error {
  display: none;
  margin-top: 15px;
  background: #ffebee;
  color: #c62828;
  padding: 12px;
  border-radius: 9px;
}

</style>

</head>

<body>

<div class="login-card">

  <div class="logo">
    🩺
  </div>

  <h1>
    دخول المعلم
  </h1>

  <div class="subtitle">
    بوابة التمريض
  </div>

  <form id="loginForm">

    <div class="form-group">

      <label>
        البريد الإلكتروني
      </label>

      <input
        id="email"
        type="email"
        required
        autocomplete="username"
      >

    </div>

    <div class="form-group">

      <label>
        كلمة المرور
      </label>

      <input
        id="password"
        type="password"
        required
        autocomplete="current-password"
      >

    </div>

    <button type="submit">
      تسجيل الدخول
    </button>

  </form>

  <div
    id="error"
    class="error"
  ></div>

</div>


<script type="module">

import {
  auth
} from "../src/firebase/init.js";

import {
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const form =
  document.querySelector("#loginForm");

const errorBox =
  document.querySelector("#error");


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    errorBox.style.display = "none";

    const email =
      document
        .querySelector("#email")
        .value
        .trim();

    const password =
      document
        .querySelector("#password")
        .value;


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      window.location.href =
        "dashboard.html";

    } catch (error) {

      console.error(error);

      errorBox.textContent =
        "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

      errorBox.style.display = "block";
    }

  }
);

</script>

</body>

</html>
