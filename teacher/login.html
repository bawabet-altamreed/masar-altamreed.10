<!DOCTYPE html>

<html
    lang="ar"
    dir="rtl"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        دخول المعلمين | بوابة التمريض
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #0f766e
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

        }

        .login-card {

            width: 100%;
            max-width: 430px;

            background: white;

            border-radius: 25px;

            padding: 35px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,.25);

        }

        .logo {

            width: 80px;
            height: 80px;

            margin: auto;

            border-radius: 22px;

            background: #0f766e;

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 38px;

        }

        h1 {

            text-align: center;

            margin-top: 20px;

            color: #0f172a;

        }

        .subtitle {

            text-align: center;

            color: #64748b;

            margin: 10px 0 30px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #334155;

        }

        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 12px;

            margin-bottom: 18px;

            font-size: 16px;

            outline: none;

        }

        input:focus {

            border-color: #0f766e;

        }

        button {

            width: 100%;

            border: 0;

            padding: 15px;

            border-radius: 12px;

            background: #0f766e;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }

        button:disabled {

            opacity: .6;

        }

        .error {

            display: none;

            background: #fee2e2;

            color: #991b1b;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 15px;

        }

    </style>

</head>


<body>


    <div class="login-card">

        <div class="logo">
            🩺
        </div>

        <h1>
            دخول المعلمين
        </h1>

        <p class="subtitle">
            بوابة التمريض
        </p>


        <div
            id="error"
            class="error"
        ></div>


        <form id="loginForm">

            <label>
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                required
                autocomplete="email"
            >


            <label>
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
            >


            <button
                type="submit"
                id="loginButton"
            >
                تسجيل الدخول
            </button>

        </form>

    </div>


    <script type="module">

        import {
            auth,
            db
        } from "../src/firebase/firebase-config.js";

        import {
            signInWithEmailAndPassword,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        const form =
            document.getElementById("loginForm");

        const button =
            document.getElementById("loginButton");

        const errorBox =
            document.getElementById("error");


        function showError(message) {

            errorBox.textContent = message;

            errorBox.style.display = "block";

        }


        onAuthStateChanged(auth, async (user) => {

            if (!user) {
                return;
            }

            try {

                const snap =
                    await getDoc(
                        doc(db, "users", user.uid)
                    );

                if (
                    snap.exists() &&
                    snap.data().role === "teacher"
                ) {

                    window.location.href =
                        "./dashboard.html";

                }

            } catch (error) {

                console.error(error);

            }

        });


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                errorBox.style.display = "none";

                button.disabled = true;

                button.textContent =
                    "جاري تسجيل الدخول...";


                const email =
                    document.getElementById("email")
                        .value
                        .trim();

                const password =
                    document.getElementById("password")
                        .value;


                try {

                    const credential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const snap =
                        await getDoc(
                            doc(
                                db,
                                "users",
                                credential.user.uid
                            )
                        );


                    if (!snap.exists()) {

                        throw new Error(
                            "بيانات المعلم غير موجودة"
                        );

                    }


                    const data =
                        snap.data();


                    if (data.role !== "teacher") {

                        throw new Error(
                            "هذا الحساب ليس حساب معلم"
                        );

                    }


                    if (data.isActive === false) {

                        throw new Error(
                            "حساب المعلم غير مفعل"
                        );

                    }


                    window.location.href =
                        "./dashboard.html";


                } catch (error) {

                    console.error(error);

                    let message =
                        "البريد الإلكتروني أو كلمة المرور غير صحيحة";

                    if (
                        error.message &&
                        !error.code
                    ) {
                        message = error.message;
                    }

                    showError(message);

                    button.disabled = false;

                    button.textContent =
                        "تسجيل الدخول";
                }

            }
        );

    </script>

</body>

</html>
