name: Build Teacher APK

on:
  workflow_dispatch:
  push:
    paths:
      - "teacher-android/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: teacher-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teacher-debug-apk
          path: teacher-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
