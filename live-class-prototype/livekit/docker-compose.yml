services:

  redis:
    image: redis:7-alpine
    container_name: nursing-live-redis
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: nursing-live-livekit
    restart: unless-stopped

    command: --dev

    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

    environment:
      LIVEKIT_KEYS: "devkey: secret"

    depends_on:
      - redis

  egress:
    image: livekit/egress:latest
    container_name: nursing-live-egress
    restart: unless-stopped

    cap_add:
      - SYS_ADMIN

    environment:

      EGRESS_CONFIG_BODY: |
        log_level: info

        api_key: devkey
        api_secret: secret

        ws_url: ws://livekit:7880

        insecure: true

        redis:
          address: redis:6379

        s3:
          access_key: ${S3_ACCESS_KEY}
          secret: ${S3_SECRET_KEY}
          region: ${S3_REGION}
          bucket: ${S3_BUCKET}
          endpoint: ${S3_ENDPOINT}
          force_path_style: true

    depends_on:
      - livekit
      - redis

