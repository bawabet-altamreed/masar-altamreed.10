services:

  redis:
    image: redis:7-alpine

    container_name:
      live-class-redis

    restart: unless-stopped

    ports:
      - "6379:6379"


  livekit:
    image:
      livekit/livekit-server:latest

    container_name:
      live-class-livekit

    restart: unless-stopped

    depends_on:
      - redis

    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

    command:
      - "--config"
      - "/etc/livekit.yaml"


  egress:
    image:
      livekit/egress:latest

    container_name:
      live-class-egress

    restart: unless-stopped

    depends_on:
      - livekit
      - redis

    cap_add:
      - SYS_ADMIN

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - ../recordings:/out

    environment:
      EGRESS_CONFIG_FILE:
        /etc/egress.yaml

    ports:
      - "8081:8081"
