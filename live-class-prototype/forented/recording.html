<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Recordings
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            🎬 التسجيلات
        </h1>

        <p>
            التسجيلات التي انتهى رفعها.
        </p>

        <button
            id="refresh"
        >
            تحديث
        </button>

    </div>


    <div
        id="recordings"
    ></div>

</div>


<script>

const API =
    "http://localhost:3000";


async function loadRecordings() {

    const container =
        document.getElementById(
            "recordings"
        );


    container.innerHTML =
        `
            <div class="card">
                جاري تحميل التسجيلات...
            </div>
        `;


    try {

        const response =
            await fetch(
                API +
                "/api/recordings"
            );


        const data =
            await response.json();


        if (
            !data.recordings.length
        ) {

            container.innerHTML =
                `
                    <div class="card">
                        لا توجد تسجيلات حتى الآن.
                    </div>
                `;

            return;

        }


        container.innerHTML =
            data.recordings
                .map(
                    recording => `

                        <div class="card">

                            <h3>
                                ${recording.filename}
                            </h3>

                            <video
                                controls
                                preload="metadata"
                                src="${API}${recording.url}"
                            ></video>

                            <p>
                                الحجم:
                                ${formatBytes(
                                    recording.size
                                )}
                            </p>

                        </div>

                    `
                )
                .join("");


    } catch (error) {

        container.innerHTML =
            `
                <div class="card">
                    حدث خطأ:
                    ${error.message}
                </div>
            `;

    }

}


function formatBytes(
    bytes
) {

    if (
        !bytes
    ) {

        return "0 B";

    }


    const units =
        [
            "B",
            "KB",
            "MB",
            "GB"
        ];


    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        bytes /
        Math.pow(
            1024,
            index
        )
    ).toFixed(2)
    + " "
    + units[index];

}


document
    .getElementById(
        "refresh"
    )
    .onclick =
    loadRecordings;


loadRecordings();

</script>

</body>

</html>
