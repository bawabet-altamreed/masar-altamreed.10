<!DOCTYPE html>

<html
    lang="ar"
    dir="rtl"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Live Class Prototype
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

    <main class="container">

        <div class="card">

            <h1>
                إنشاء محاضرة مباشرة
            </h1>

            <p class="muted">
                Prototype - Teacher
            </p>


            <label>
                اسم المدرس
            </label>

            <input
                id="teacherName"
                type="text"
                placeholder="Dr.Nurhan"
                value="Dr.Nurhan"
            >


            <label>
                عنوان المحاضرة
            </label>

            <input
                id="lectureTitle"
                type="text"
                placeholder="مثال: المحاضرة الأولى"
            >


            <button
                id="createRoomButton"
            >
                🎥 إنشاء المحاضرة
            </button>


            <div
                id="status"
                class="status"
            ></div>

        </div>

    </main>


    <script>

        const API_URL =
            "http://localhost:3000";


        const button =
            document.getElementById(
                "createRoomButton"
            );


        const status =
            document.getElementById(
                "status"
            );


        button.addEventListener(
            "click",
            async () => {

                const teacherName =
                    document
                        .getElementById(
                            "teacherName"
                        )
                        .value
                        .trim();


                const title =
                    document
                        .getElementById(
                            "lectureTitle"
                        )
                        .value
                        .trim();


                if (!title) {

                    status.textContent =
                        "اكتب عنوان المحاضرة أولًا.";

                    return;

                }


                button.disabled = true;

                status.textContent =
                    "جاري إنشاء الغرفة...";


                try {

                    const response =
                        await fetch(
                            `${API_URL}/api/create-room`,
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        teacherName,

                                        title

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.error ||
                            "فشل إنشاء الغرفة"
                        );

                    }


                    /*
                     * نحفظ بيانات الغرفة
                     * للانتقال إليها.
                     */

                    sessionStorage.setItem(
                        "liveClass",
                        JSON.stringify(
                            data
                        )
                    );


                    status.textContent =
                        "تم إنشاء المحاضرة. جاري الدخول...";


                    window.location.href =
                        `room.html?room=${encodeURIComponent(
                            data.room.name
                        )}&role=teacher`;

                } catch (error) {

                    console.error(error);

                    status.textContent =
                        "❌ " +
                        error.message;

                    button.disabled = false;

                }

            }
        );

    </script>

</body>

</html>
