<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Live Class Prototype
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            🎥 Live Class Prototype
        </h1>

        <p>
            اختبار غرفة محاضرة مباشرة باستخدام LiveKit.
        </p>

    </div>


    <div class="grid">

        <div class="card">

            <h2>
                👨‍🏫 المدرس
            </h2>

            <label>
                اسم المدرس
            </label>

            <input
                id="teacherName"
                value="Dr.Nurhan"
            >

            <label>
                عنوان المحاضرة
            </label>

            <input
                id="title"
                value="محاضرة تجريبية"
            >

            <button
                id="createRoom"
            >
                إنشاء المحاضرة
            </button>

            <div
                id="teacherStatus"
                class="status"
            >
                جاهز
            </div>

        </div>


        <div class="card">

            <h2>
                👨‍🎓 الطالب
            </h2>

            <label>
                اسم الطالب
            </label>

            <input
                id="studentName"
                value="Student 1"
            >

            <label>
                Room Name
            </label>

            <input
                id="roomName"
                placeholder="class-..."
            >

            <button
                id="joinRoom"
            >
                دخول المحاضرة
            </button>

            <div
                id="studentStatus"
                class="status"
            >
                اكتب Room Name
            </div>

        </div>

    </div>


    <div class="card">

        <h3>
            التسجيلات
        </h3>

        <a
            href="recordings.html"
        >
            فتح صفحة التسجيلات
        </a>

    </div>

</div>


<script>

const API =
    "http://localhost:3000";


document
    .getElementById("createRoom")
    .addEventListener(
        "click",
        async () => {

            const teacherName =
                document
                    .getElementById(
                        "teacherName"
                    )
                    .value;

            const title =
                document
                    .getElementById(
                        "title"
                    )
                    .value;


            const status =
                document
                    .getElementById(
                        "teacherStatus"
                    );


            status.textContent =
                "جاري إنشاء الغرفة...";


            try {

                const response =
                    await fetch(
                        API +
                        "/api/create-room",
                        {

                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    teacherName,

                                    title

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        data.error
                    );

                }


                document
                    .getElementById(
                        "roomName"
                    )
                    .value =
                    data.room.name;


                status.innerHTML = `
                    تم إنشاء المحاضرة.
                    <br>
                    Room:
                    <strong>
                        ${data.room.name}
                    </strong>
                    <br>
                    التسجيل:
                    ${data.recording.status}
                    <br><br>
                    <a href="room.html?room=${encodeURIComponent(
                        data.room.name
                    )}&token=${encodeURIComponent(
                        data.token
                    )}&role=teacher">
                        فتح غرفة المدرس
                    </a>
                `;


            } catch (error) {

                status.textContent =
                    "خطأ: " +
                    error.message;

            }

        }
    );


document
    .getElementById("joinRoom")
    .addEventListener(
        "click",
        async () => {

            const roomName =
                document
                    .getElementById(
                        "roomName"
                    )
                    .value
                    .trim();


            const participantName =
                document
                    .getElementById(
                        "studentName"
                    )
                    .value
                    .trim();


            const status =
                document
                    .getElementById(
                        "studentStatus"
                    );


            if (!roomName) {

                status.textContent =
                    "اكتب Room Name أولًا.";

                return;

            }


            status.textContent =
                "جاري تجهيز الدخول...";


            try {

                const response =
                    await fetch(
                        API +
                        "/api/join-room",
                        {

                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    roomName,

                                    participantName

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        data.error
                    );

                }


                window.location.href =
                    "room.html?" +
                    "room=" +
                    encodeURIComponent(
                        roomName
                    ) +
                    "&token=" +
                    encodeURIComponent(
                        data.token
                    ) +
                    "&role=student";

            } catch (error) {

                status.textContent =
                    "خطأ: " +
                    error.message;

            }

        }
    );

</script>

</body>

</html>
