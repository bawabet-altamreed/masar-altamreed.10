<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Live Room
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            🎥 Live Room
        </h1>

        <div id="roomInfo">
            جاري التحميل...
        </div>

        <div class="status">

            حالة الاتصال:

            <strong id="connection">
                ...
            </strong>

        </div>

    </div>


    <div class="card">

        <h2>
            الفيديو
        </h2>

        <div
            id="videos"
            class="participants"
        ></div>

    </div>


    <div class="card">

        <button id="toggleMic">
            🎤 المايك
        </button>

        <button id="toggleCamera">
            📷 الكاميرا
        </button>

        <button
            id="leaveRoom"
            class="danger"
        >
            🚪 مغادرة
        </button>

        <button
            id="endRoom"
            class="danger"
            style="display:none;"
        >
            ⛔ إنهاء المحاضرة
        </button>

    </div>

</div>


<script type="module">

import {
    Room,
    RoomEvent,
    Track
} from
    "https://cdn.jsdelivr.net/npm/livekit-client@2.22.1/+esm";


const API =
    "http://localhost:3000";


const params =
    new URLSearchParams(
        window.location.search
    );


const roomName =
    params.get("room");


const token =
    params.get("token");


const role =
    params.get("role") ||
    "student";


const livekitUrl =
    "ws://localhost:7880";


const videos =
    document.getElementById(
        "videos"
    );


const connection =
    document.getElementById(
        "connection"
    );


const roomInfo =
    document.getElementById(
        "roomInfo"
    );


const room =
    new Room({

        adaptiveStream:
            true,

        dynacast:
            true

    });


if (
    !roomName ||
    !token
) {

    roomInfo.textContent =
        "بيانات الغرفة غير موجودة.";

    throw new Error(
        "Missing room/token"
    );

}


roomInfo.innerHTML = `
    <strong>
        ${roomName}
    </strong>
    <br>
    الدور:
    ${role === "teacher"
        ? "المدرس"
        : "الطالب"}
`;


/* =========================================================
   Track Rendering
========================================================= */

function addTrack(
    track,
    participant
) {

    if (
        track.kind !==
        Track.Kind.Video
    ) {

        return;

    }


    const element =
        track.attach();


    element.autoplay =
        true;

    element.playsInline =
        true;

    element.style.width =
        "100%";


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "participant";


    const title =
        document.createElement(
            "div"
        );


    title.textContent =
        participant.name ||
        participant.identity;


    wrapper.appendChild(
        title
    );


    wrapper.appendChild(
        element
    );


    videos.appendChild(
        wrapper
    );

}


function removeTrack(
    track
) {

    track.detach()
        .forEach(
            element =>
                element.remove()
        );

}


/* =========================================================
   Existing Participants
========================================================= */

function attachParticipant(
    participant
) {

    participant
        .trackPublications
        .forEach(
            publication => {

                if (
                    publication.isSubscribed &&
                    publication.track
                ) {

                    addTrack(
                        publication.track,
                        participant
                    );

                }

            }
        );

}


/* =========================================================
   Events
========================================================= */

room.on(
    RoomEvent.TrackSubscribed,
    (
        track,
        publication,
        participant
    ) => {

        addTrack(
            track,
            participant
        );

    }
);


room.on(
    RoomEvent.TrackUnsubscribed,
    (
        track
    ) => {

        removeTrack(
            track
        );

    }
);


room.on(
    RoomEvent.ParticipantConnected,
    participant => {

        attachParticipant(
            participant
        );

    }
);


room.on(
    RoomEvent.ParticipantDisconnected,
    participant => {

        console.log(
            "Participant left:",
            participant.identity
        );

    }
);


room.on(
    RoomEvent.Connected,
    () => {

        connection.textContent =
            "متصل";

    }
);


room.on(
    RoomEvent.Disconnected,
    () => {

        connection.textContent =
            "انقطع الاتصال";

    }
);


/* =========================================================
   Connect
========================================================= */

await room.connect(
    livekitUrl,
    token
);


/* =========================================================
   Publish Camera + Mic
========================================================= */

await room.localParticipant
    .setMicrophoneEnabled(
        true
    );


await room.localParticipant
    .setCameraEnabled(
        true
    );


attachParticipant(
    room.localParticipant
);


/* =========================================================
   Buttons
========================================================= */

document
    .getElementById(
        "toggleMic"
    )
    .onclick =
    async () => {

        const enabled =
            !room
                .localParticipant
                .isMicrophoneEnabled;


        await room.localParticipant
            .setMicrophoneEnabled(
                enabled
            );

    };


document
    .getElementById(
        "toggleCamera"
    )
    .onclick =
    async () => {

        const enabled =
            !room
                .localParticipant
                .isCameraEnabled;


        await room.localParticipant
            .setCameraEnabled(
                enabled
            );

    };


document
    .getElementById(
        "leaveRoom"
    )
    .onclick =
    async () => {

        await room.disconnect();

        window.location.href =
            "index.html";

    };


/* =========================================================
   Teacher Controls
========================================================= */

if (
    role === "teacher"
) {

    const endButton =
        document.getElementById(
            "endRoom"
        );


    endButton.style.display =
        "block";


    endButton.onclick =
        async () => {

            if (
                !confirm(
                    "إنهاء المحاضرة؟"
                )
            ) {

                return;

            }


            await fetch(
                API +
                "/api/end-room",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            roomName

                        })

                }
            );


            window.location.href =
                "recordings.html";

        };

}

</script>

</body>

</html>
