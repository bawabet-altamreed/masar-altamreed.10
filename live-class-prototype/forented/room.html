<!DOCTYPE html>

<html
    lang="ar"
    dir="rtl"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Live Room
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

    <header class="room-header">

        <strong>
            🎥 المحاضرة المباشرة
        </strong>

        <span id="roomName">
            —
        </span>

    </header>


    <main class="room">

        <section
            id="videoGrid"
            class="video-grid"
        >

            <div class="loading">
                جاري الاتصال...
            </div>

        </section>


        <section class="controls">

            <button
                id="micButton"
            >
                🎙️ المايك
            </button>


            <button
                id="cameraButton"
            >
                📹 الكاميرا
            </button>


            <button
                id="leaveButton"
                class="danger"
            >
                🚪 مغادرة
            </button>

        </section>

    </main>


    <script type="module">

        import {
            Room,
            RoomEvent,
            Track
        } from
        "https://cdn.jsdelivr.net/npm/livekit-client@2.15.0/+esm";


        const API_URL =
            "http://localhost:3000";


        const params =
            new URLSearchParams(
                window.location.search
            );


        const roomName =
            params.get("room");


        const role =
            params.get("role") ||
            "student";


        const roomLabel =
            document.getElementById(
                "roomName"
            );


        const videoGrid =
            document.getElementById(
                "videoGrid"
            );


        roomLabel.textContent =
            roomName || "—";


        if (!roomName) {

            videoGrid.innerHTML =
                "❌ لم يتم تحديد الغرفة.";

            throw new Error(
                "roomName missing"
            );

        }


        /*
         * الحصول على Token
         */

        let token;


        if (
            role === "teacher"
        ) {

            const saved =
                sessionStorage.getItem(
                    "liveClass"
                );


            if (!saved) {

                throw new Error(
                    "Teacher session missing"
                );

            }


            const data =
                JSON.parse(
                    saved
                );


            token =
                data.token;

        } else {

            const name =
                prompt(
                    "اكتب اسمك"
                ) ||
                "Student";


            const response =
                await fetch(
                    `${API_URL}/api/join-room`,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                roomName,

                                participantName:
                                    name

                            })

                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    data.error
                );

            }


            token =
                data.token;

        }


        /*
         * الاتصال بـ LiveKit
         */

        const saved =
            sessionStorage.getItem(
                "liveClass"
            );


        let livekitUrl;


        if (role === "teacher") {

            livekitUrl =
                JSON.parse(
                    saved
                ).livekitUrl;

        } else {

            const response =
                await fetch(
                    `${API_URL}/api/join-room`,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                roomName,

                                participantName:
                                    "Student"

                            })

                    }
                );


            const data =
                await response.json();


            livekitUrl =
                data.livekitUrl;

        }


        const room =
            new Room({

                adaptiveStream: true,

                dynacast: true

            });


        /*
         * إضافة Participant
         */

        function addParticipant(
            participant
        ) {

            const container =
                document.createElement(
                    "div"
                );

            container.className =
                "participant";

            container.dataset.identity =
                participant.identity;


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "participant-name";

            title.textContent =
                participant.name ||
                participant.identity;


            container.appendChild(
                title
            );


            videoGrid.appendChild(
                container
            );


            participant
                .trackPublications
                .forEach(
                    publication => {

                        attachTrack(
                            publication,
                            container
                        );

                    }
                );

        }


        function attachTrack(
            publication,
            container
        ) {

            if (
                !publication.track
            ) {

                return;

            }


            const track =
                publication.track;


            const element =
                track.attach();


            element.classList.add(
                "media"
            );


            container.appendChild(
                element
            );

        }


        /*
         * Participant joined
         */

        room.on(
            RoomEvent.ParticipantConnected,
            participant => {

                addParticipant(
                    participant
                );

            }
        );


        /*
         * Track subscribed
         */

        room.on(
            RoomEvent.TrackSubscribed,
            (
                track,
                publication,
                participant
            ) => {

                let container =
                    document.querySelector(
                        `[data-identity="${CSS.escape(
                            participant.identity
                        )}"]`
                    );


                if (!container) {

                    addParticipant(
                        participant
                    );

                    container =
                        document.querySelector(
                            `[data-identity="${CSS.escape(
                                participant.identity
                            )}"]`
                        );

                }


                attachTrack(
                    publication,
                    container
                );

            }
        );


        /*
         * Participant left
         */

        room.on(
            RoomEvent.ParticipantDisconnected,
            participant => {

                const element =
                    document.querySelector(
                        `[data-identity="${CSS.escape(
                            participant.identity
                        )}"]`
                    );


                if (element) {

                    element.remove();

                }

            }
        );


        /*
         * الاتصال
         */

        await room.connect(
            livekitUrl,
            token
        );


        /*
         * نشر كاميرا وميكروفون المدرس
         */

        if (
            role === "teacher"
        ) {

            await room.localParticipant
                .enableCameraAndMicrophone();

        }


        /*
         * إضافة المشاركين الموجودين
         */

        room.remoteParticipants
            .forEach(
                participant => {

                    addParticipant(
                        participant
                    );

                }
            );


        /*
         * أزرار التحكم
         */

        document
            .getElementById(
                "micButton"
            )
            .onclick =
            async () => {

                const enabled =
                    room
                        .localParticipant
                        .isMicrophoneEnabled;


                await room
                    .localParticipant
                    .setMicrophoneEnabled(
                        !enabled
                    );

            };


        document
            .getElementById(
                "cameraButton"
            )
            .onclick =
            async () => {

                const enabled =
                    room
                        .localParticipant
                        .isCameraEnabled;


                await room
                    .localParticipant
                    .setCameraEnabled(
                        !enabled
                    );

            };


        document
            .getElementById(
                "leaveButton"
            )
            .onclick =
            async () => {

                await room.disconnect();

                window.location.href =
                    "./index.html";

            };

    </script>

</body>

</html>
