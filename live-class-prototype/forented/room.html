<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    غرفة المحاضرة
</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #101820;

    color: white;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

}

.header {

    height: 65px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    background: #17232d;

}

.room {

    padding: 15px;

}

.video-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                280px,
                1fr
            )
        );

    gap: 15px;

}

.video-box {

    position: relative;

    min-height: 250px;

    background: #202c36;

    border-radius: 15px;

    overflow: hidden;

}

video {

    width: 100%;

    height: 100%;

    object-fit: cover;

}

.label {

    position: absolute;

    bottom: 10px;

    right: 10px;

    background:
        rgba(0,0,0,.6);

    padding:
        7px 10px;

    border-radius: 7px;

}

.controls {

    position: fixed;

    bottom: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 10px;

}

.controls button {

    border: 0;

    border-radius: 50%;

    width: 52px;

    height: 52px;

    cursor: pointer;

}

.leave {

    background: #d93025;

    color: white;

}

</style>

</head>

<body>

<div class="header">

    <strong>
        🎥 المحاضرة المباشرة
    </strong>

    <span id="participants">
        0 مشارك
    </span>

</div>


<div class="room">

    <div
        id="videoGrid"
        class="video-grid"
    ></div>

</div>


<div class="controls">

    <button id="mic">
        🎤
    </button>

    <button id="camera">
        📷
    </button>

    <button id="leave" class="leave">
        📞
    </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<script>

const {
    Room,
    RoomEvent,
    Track
} = LivekitClient;


const params =
    new URLSearchParams(
        location.search
    );


const name =
    params.get("name");

const roomName =
    params.get("room");

const role =
    params.get("role");


const videoGrid =
    document.getElementById(
        "videoGrid"
    );


const participants =
    document.getElementById(
        "participants"
    );


let room;


async function getToken() {

    const response =
        await fetch(
            "http://localhost:3000/api/token",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        roomName,

                        identity:
                            name,

                        role

                    })

            }
        );


    if (!response.ok) {

        throw new Error(
            "فشل الحصول على Token"
        );

    }


    return response.json();

}


async function start() {

    try {

        const data =
            await getToken();


        room =
            new Room();


        room.on(
            RoomEvent.TrackSubscribed,
            (
                track,
                publication,
                participant
            ) => {

                attachTrack(
                    track,
                    participant
                );

            }
        );


        room.on(
            RoomEvent.TrackUnsubscribed,
            track => {

                track.detach();

            }
        );


        room.on(
            RoomEvent.ParticipantConnected,
            updateCount
        );


        room.on(
            RoomEvent.ParticipantDisconnected,
            updateCount
        );


        await room.connect(
            data.url,
            data.token
        );


        if (role === "teacher") {

            await room.localParticipant
                .setCameraEnabled(true);

            await room.localParticipant
                .setMicrophoneEnabled(true);

        }


        updateCount();


    } catch (error) {

        console.error(
            error
        );

        alert(
            error.message
        );

    }

}


function attachTrack(
    track,
    participant
) {

    const element =
        track.attach();


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "video-box";


    box.appendChild(
        element
    );


    const label =
        document.createElement(
            "div"
        );


    label.className =
        "label";


    label.textContent =
        participant.name ||
        participant.identity;


    box.appendChild(
        label
    );


    videoGrid.appendChild(
        box
    );

}


function updateCount() {

    if (!room) return;


    const count =
        room
        .remoteParticipants
        .size + 1;


    participants.textContent =
        `${count} مشارك`;

}


document
    .getElementById("mic")
    .onclick =
    async () => {

        if (!room) return;

        const enabled =
            room.localParticipant
            .isMicrophoneEnabled;

        await room.localParticipant
            .setMicrophoneEnabled(
                !enabled
            );

    };


document
    .getElementById("camera")
    .onclick =
    async () => {

        if (!room) return;

        const enabled =
            room.localParticipant
            .isCameraEnabled;

        await room.localParticipant
            .setCameraEnabled(
                !enabled
            );

    };


document
    .getElementById("leave")
    .onclick =
    async () => {

        if (room) {

            await room.disconnect();

        }

        location.href =
            "index.html";

    };


start();

</script>

</body>

</html>
