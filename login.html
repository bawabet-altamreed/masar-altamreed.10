<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تسجيل الدخول - مسار التمريض</title>

    <link
        rel="stylesheet"
        href="src/styles/main.css"
    >

</head>

<body>

    <main id="login-app">

        <section class="login-container">

            <div class="login-card">

                <h1>
                    مسار التمريض
                </h1>

                <p>
                    تسجيل الدخول
                </p>

                <form id="login-form">

                    <div class="form-group">

                        <label for="email">
                            البريد الإلكتروني
                        </label>

                        <input
                            id="email"
                            type="email"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="password">
                            كلمة المرور
                        </label>

                        <input
                            id="password"
                            type="password"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        id="login-button"
                    >
                        تسجيل الدخول
                    </button>

                </form>

                <div id="login-message"></div>

            </div>

        </section>

    </main>

    <script
        type="module"
        src="src/core/login.js"
    ></script>

</body>
</html>
