<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | مسار التمريض</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            min-height: 100vh;
            background: #f3f8fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e4edf3;
            border-radius: 22px;
            padding: 38px 30px;
            box-shadow: 0 15px 45px rgba(20, 60, 80, 0.08);
        }

        .logo {
            width: 75px;
            height: 75px;
            border-radius: 20px;
            background: #087ea4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto 20px;
        }

        h1 {
            text-align: center;
            color: #12304a;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #34495e;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid #d7e3eb;
            border-radius: 11px;
            padding: 0 15px;
            font-size: 15px;
            outline: none;
            direction: ltr;
            text-align: left;
            transition: 0.2s;
        }

        input:focus {
            border-color: #087ea4;
            box-shadow: 0 0 0 3px rgba(8, 126, 164, 0.08);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 15px;
            padding-left: 50px;
        }

        .toggle-password {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 19px;
        }

        .login-button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 11px;
            background: #087ea4;
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #066985;
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            line-height: 1.7;
        }

        .message.error {
            display: block;
            background: #fff1f1;
            color: #b42318;
            border: 1px solid #ffd5d5;
        }

        .message.success {
            display: block;
            background: #effaf3;
            color: #147a3e;
            border: 1px solid #ccebd8;
        }

        .support {
            margin-top: 24px;
            padding: 16px;
            background: #f6fafc;
            border-radius: 12px;
            text-align: center;
            color: #637585;
            font-size: 13px;
            line-height: 1.8;
        }

        .whatsapp {
            color: #087ea4;
            font-weight: 800;
            direction: ltr;
            display: inline-block;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #087ea4;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .copyright {
            text-align: center;
            color: #8a98a5;
            font-size: 12px;
            margin-top: 18px;
        }

        .firebase-status {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    background: #f5f8fa;
    color: #526575;
    font-size: 13px;
    line-height: 2;
    text-align: center;
}

.firebase-success {
    color: #147a3e;
}

.firebase-success strong {
    display: block;
    margin-top: 8px;
}

.firebase-error {
    color: #b42318;
    word-break: break-word;
}
        
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">🩺</div>

        <h1>مسار التمريض</h1>

        <p class="subtitle">
            سجل الدخول للمتابعة
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="subscriptionCode">
                    🔑 كود الاشتراك
                </label>

                <input
                    type="text"
                    id="subscriptionCode"
                    name="subscriptionCode"
                    placeholder="أدخل كود الاشتراك"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">

                <label for="password">
                    🔒 كلمة المرور
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="إظهار كلمة المرور"
                    >
                        👁️
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                تسجيل الدخول
            </button>

            <div
                id="message"
                class="message"
                role="alert"
            ></div>

            <div id="firebaseStatus" class="firebase-status">
    🟡 جاري الاتصال بـ Firebase...
</div>
            
        </form>

        <div class="support">

            إذا لم يكن لديك كود اشتراك،
            <br>

            تواصل مع إدارة مسار التمريض.

            <br>

            <span class="whatsapp">
                واتساب: 01222736904
            </span>

        </div>

        <a href="index.html" class="back">
            ← العودة إلى الصفحة الرئيسية
        </a>

    </div>

    <div class="copyright">
        © 2026 مسار التمريض | Masar Al-Tamreed
    </div>

</div>

    <script type="module">

    // =====================================================
    // Firebase
    // =====================================================

    import {
        auth,
        db
    } from "./src/firebase/init.js";

    import {
        signInWithEmailAndPassword,
        signOut
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        doc,
        getDoc
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =====================================================
    // Elements
    // =====================================================

    const loginForm =
        document.getElementById("loginForm");

    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    const codeInput =
        document.getElementById("subscriptionCode");

    const loginButton =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");

    const firebaseStatus =
        document.getElementById("firebaseStatus");


    // =====================================================
    // Password Toggle
    // =====================================================

    togglePassword.addEventListener(
        "click",
        () => {

            const isPassword =
                passwordInput.type === "password";

            passwordInput.type =
                isPassword
                    ? "text"
                    : "password";

            togglePassword.textContent =
                isPassword
                    ? "🙈"
                    : "👁️";

        }
    );


    // =====================================================
    // Firebase Status
    // =====================================================

    firebaseStatus.innerHTML = `
        🟢 Firebase متصل
        <strong>جاهز لتسجيل الدخول</strong>
    `;

    firebaseStatus.classList.add(
        "firebase-success"
    );


    // =====================================================
    // Message
    // =====================================================

    function showMessage(
        text,
        type = "error"
    ) {

        message.textContent =
            text;

        message.className =
            `message ${type}`;

    }


    function clearMessage() {

        message.textContent = "";

        message.className =
            "message";

    }


    // =====================================================
    // Convert Subscription Code
    // =====================================================

    function createInternalEmail(code) {

        return `${code.toLowerCase()}@students.masar-altamreed.com`;

    }


    // =====================================================
    // Login
    // =====================================================

    loginForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            clearMessage();


            const code =
                codeInput.value
                    .trim()
                    .toUpperCase();


            const password =
                passwordInput.value;


            if (!code) {

                showMessage(
                    "من فضلك أدخل كود الاشتراك."
                );

                return;

            }


            if (!password) {

                showMessage(
                    "من فضلك أدخل كلمة المرور."
                );

                return;

            }


            loginButton.disabled =
                true;

            loginButton.textContent =
                "جاري تسجيل الدخول...";


            try {

                // =================================================
                // 1. Create Firebase Authentication Email
                // =================================================

                const internalEmail =
                    createInternalEmail(code);


                // =================================================
                // 2. Firebase Authentication
                // =================================================

                const credential =
                    await signInWithEmailAndPassword(
                        auth,
                        internalEmail,
                        password
                    );


                const user =
                    credential.user;


                // =================================================
                // 3. Read users/{uid}
                // =================================================

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const userSnapshot =
                    await getDoc(
                        userRef
                    );


                if (!userSnapshot.exists()) {

                    await signOut(auth);

                    throw new Error(
                        "USER_DOCUMENT_NOT_FOUND"
                    );

                }


                const userData =
                    userSnapshot.data();


                // =================================================
                // 4. Verify Role
                // =================================================

                if (
                    userData.role !==
                    "student"
                ) {

                    await signOut(auth);

                    throw new Error(
                        "NOT_STUDENT_ACCOUNT"
                    );

                }


                // =================================================
                // 5. Verify Account Status
                // =================================================

                if (
                    userData.isActive !== true
                ) {

                    await signOut(auth);

                    throw new Error(
                        "ACCOUNT_SUSPENDED"
                    );

                }


                // =================================================
                // 6. Read subscriptions/{CODE}
                // =================================================

                const subscriptionRef =
                    doc(
                        db,
                        "subscriptions",
                        code
                    );


                const subscriptionSnapshot =
                    await getDoc(
                        subscriptionRef
                    );


                if (
                    !subscriptionSnapshot.exists()
                ) {

                    await signOut(auth);

                    throw new Error(
                        "SUBSCRIPTION_NOT_FOUND"
                    );

                }


                const subscriptionData =
                    subscriptionSnapshot.data();


                // =================================================
                // 7. Verify Subscription Owner
                // =================================================

                if (
                    subscriptionData.userId !==
                    user.uid
                ) {

                    await signOut(auth);

                    throw new Error(
                        "SUBSCRIPTION_OWNER_MISMATCH"
                    );

                }


                // =================================================
                // 8. Verify Subscription Status
                // =================================================

                if (
                    subscriptionData.status !==
                    "active"
                ) {

                    await signOut(auth);

                    if (
                        subscriptionData.status ===
                        "suspended"
                    ) {

                        throw new Error(
                            "SUBSCRIPTION_SUSPENDED"
                        );

                    }

                    throw new Error(
                        "SUBSCRIPTION_NOT_ACTIVE"
                    );

                }


                // =================================================
                // 9. Verify Subscription Dates
                // =================================================

                const now =
                    new Date();


                const startDate =
                    subscriptionData.startDate?.toDate
                        ? subscriptionData.startDate.toDate()
                        : null;


                const endDate =
                    subscriptionData.endDate?.toDate
                        ? subscriptionData.endDate.toDate()
                        : null;


                if (
                    startDate &&
                    now < startDate
                ) {

                    await signOut(auth);

                    throw new Error(
                        "SUBSCRIPTION_NOT_STARTED"
                    );

                }


                if (
                    endDate &&
                    now > endDate
                ) {

                    await signOut(auth);

                    throw new Error(
                        "SUBSCRIPTION_EXPIRED"
                    );

                }


                // =================================================
                // 10. Login Success
                // =================================================

                showMessage(
                    "تم تسجيل الدخول بنجاح، جاري فتح لوحة الطالب...",
                    "success"
                );


                setTimeout(
                    () => {

                        window.location.href =
                            "student/dashboard.html";

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "Student login error:",
                    error
                );


                let errorMessage =
                    "حدث خطأ أثناء تسجيل الدخول.";


                // =================================================
                // Firebase Authentication Errors
                // =================================================

                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    errorMessage =
                        "كود الاشتراك أو كلمة المرور غير صحيحة.";

                }

                else if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    errorMessage =
                        "كود الاشتراك غير موجود.";

                }

                else if (
                    error.code ===
                    "auth/wrong-password"
                ) {

                    errorMessage =
                        "كلمة المرور غير صحيحة.";

                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    errorMessage =
                        "تم إجراء محاولات كثيرة. حاول مرة أخرى بعد قليل.";

                }

                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    errorMessage =
                        "تأكد من اتصال الإنترنت وحاول مرة أخرى.";

                }

                // =================================================
                // Firestore / Account Errors
                // =================================================

                else if (
                    error.message ===
                    "USER_DOCUMENT_NOT_FOUND"
                ) {

                    errorMessage =
                        "الحساب موجود في Firebase Authentication لكن بيانات الطالب غير موجودة في users.";

                }

                else if (
                    error.message ===
                    "NOT_STUDENT_ACCOUNT"
                ) {

                    errorMessage =
                        "هذا الحساب ليس حساب طالب.";

                }

                else if (
                    error.message ===
                    "ACCOUNT_SUSPENDED"
                ) {

                    errorMessage =
                        "تم إيقاف حساب الطالب. تواصل مع الإدارة.";

                }

                else if (
                    error.message ===
                    "SUBSCRIPTION_NOT_FOUND"
                ) {

                    errorMessage =
                        "لم يتم العثور على اشتراك بهذا الكود.";

                }

                else if (
                    error.message ===
                    "SUBSCRIPTION_OWNER_MISMATCH"
                ) {

                    errorMessage =
                        "بيانات الاشتراك غير مرتبطة بهذا الحساب.";

                }

                else if (
                    error.message ===
                    "SUBSCRIPTION_SUSPENDED"
                ) {

                    errorMessage =
                        "الاشتراك موقوف حاليًا. تواصل مع الإدارة.";

                }

                else if (
                    error.message ===
                    "SUBSCRIPTION_NOT_ACTIVE"
                ) {

                    errorMessage =
                        "الاشتراك غير فعال حاليًا.";

                }

                else if (
                    error.message ===
                    "SUBSCRIPTION_EXPIRED"
                ) {

                    errorMessage =
                        "انتهى الاشتراك. تواصل مع الإدارة لتجديد الاشتراك.";

                }

                else if (
                    error.message ===
                    "SUBSCRIPTION_NOT_STARTED"
                ) {

                    errorMessage =
                        "الاشتراك لم يبدأ بعد.";

                }

                else if (
                    error.code ===
                    "permission-denied"
                ) {

                    errorMessage =
                        "تم رفض قراءة بيانات الطالب بواسطة Firestore Security Rules.";

                }

                else if (
                    error.message
                ) {

                    errorMessage =
                        error.message;

                }


                showMessage(
                    errorMessage,
                    "error"
                );


            } finally {

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "تسجيل الدخول";

            }

        }
    );

</script>                        
                
    


</body>
</html>
